<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học viện Tư vấn – Thanh Hoá Solar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#0b4f8a;--sky2:#1e74c4;--sky-soft:#e8f1fb;
  --sun:#f5b301;--sun-deep:#d98a00;--sun-soft:#fff6db;
  --leaf:#16935f;--leaf-soft:#e3f6ee;
  --red:#d14343;--red-soft:#fdeceb;
  --ink:#17232f;--muted:#5d6b79;--bg:#f3f6fa;--card:#fff;--line:#e1e7ef;
  --radius:14px;--shadow:0 2px 12px rgba(15,40,70,.07);
}
*{box-sizing:border-box}
html{font-size:16.5px}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.62}
a{color:var(--sky2)}
code{background:var(--sky-soft);padding:1px 6px;border-radius:6px;font-size:.88em}
.hidden{display:none!important}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 18px;height:60px;background:linear-gradient(90deg,var(--sky),var(--sky2));color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none;color:#fff;line-height:1.15}
.brand small{display:block;font-weight:500;opacity:.85;font-size:.72rem;letter-spacing:.02em}
.top-progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.85rem;white-space:nowrap}
.pbar{width:150px;height:9px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--sun);width:0;transition:width .6s}
.menu-btn{display:none;background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer;padding:0 4px}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:292px minmax(0,1fr)}
aside{background:#fff;border-right:1px solid var(--line);padding:14px 12px 40px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
main{padding:28px clamp(14px,4vw,52px) 90px;max-width:940px;width:100%;min-width:0}
.backdrop{display:none}
@media(max-width:920px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;left:0;top:60px;width:292px;z-index:45;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow)}
  aside.open{transform:none}
  .backdrop.show{display:block;position:fixed;inset:60px 0 0 0;background:rgba(10,20,35,.35);z-index:44}
  .menu-btn{display:block}
  .pbar{width:70px}
  .top-progress .ptxt{display:none}
}


/* ---------- Sidebar ---------- */
.nav-sec{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 10px 6px;font-weight:700}
.nav-link{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:.92rem}
.nav-link:hover{background:var(--sky-soft)}
.nav-link.active{background:var(--sky-soft);color:var(--sky);font-weight:700}
.nav-link .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:.7rem;padding:1px 8px;font-weight:700}
.chap-head{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.9rem;line-height:1.3}
.chap-head:hover{background:var(--sky-soft)}
.chap-head.active{background:var(--sky-soft);color:var(--sky)}
.chap-num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sky-soft);color:var(--sky);font-weight:800;font-size:.82rem;flex:none}
.chap.done .chap-num{background:var(--leaf);color:#fff}
.chap.locked .chap-head{color:var(--muted)}
.chap.optional .chap-head{opacity:.6}
.tag-ctv{font-size:.62rem;background:var(--sun-soft);color:#8a5a00;padding:1px 6px;border-radius:99px;margin-left:auto;font-weight:700;flex:none}
.lock{margin-left:auto;font-size:.8rem;flex:none}
.tag-ctv+.lock{margin-left:4px}
.lesson-list{margin:2px 0 8px 36px;padding:0;list-style:none}
.lesson-list a{display:flex;gap:7px;padding:5px 8px;border-radius:8px;font-size:.84rem;color:var(--muted);text-decoration:none;line-height:1.35}
.lesson-list a:hover{background:var(--bg)}
.lesson-list a.active{color:var(--sky);font-weight:700;background:var(--sky-soft)}

/* ---------- Typography & blocks ---------- */
h1{font-size:1.85rem;line-height:1.25;margin:.15em 0 .35em;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:0 0 .6em;display:flex;gap:10px;align-items:center;line-height:1.3}
h3{font-size:1.05rem;margin:1.1em 0 .4em}
.crumbs{font-size:.84rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:.78rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin:18px 0}
.card>:last-child{margin-bottom:0}
.goal{border-left:5px solid var(--sky2)}
.story{background:var(--sun-soft);border-color:#f3dfa3;border-left:5px solid var(--sun)}
.insight{background:var(--leaf-soft);border-color:#bfe6d3;border-left:5px solid var(--leaf)}
.warn{background:var(--red-soft);border-color:#f4c7c4;border-left:5px solid var(--red)}
.note{background:var(--sky-soft);border-color:#c8ddf3}
.lead{font-size:1.06rem;color:#2b3a49}
ul.clean{padding-left:1.15em;margin:.4em 0}
ul.clean li{margin:.25em 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.mini{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.mini h4{margin:0 0 6px;font-size:.98rem}
.mini p{margin:0;font-size:.92rem;color:#334453}
.persona{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:#fff;border:2px solid var(--sun);flex:none}
.persona b{display:block}
.persona small{color:var(--muted)}
.quote-box{background:#fff;border:1px solid #efd99a;border-radius:12px;padding:12px 16px}
.quote-box b{display:block;margin-bottom:4px}
.big-num{font-size:1.9rem;font-weight:800;color:var(--sky);line-height:1.1}
.muted{color:var(--muted)}
small.src{display:block;color:var(--muted);font-size:.78rem;margin-top:8px}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--bg);font-weight:700;font-size:.85rem}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:800;background:var(--sun-soft)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:11px;padding:10px 18px;font:inherit;font-weight:700;font-size:.93rem;cursor:pointer;transition:transform .08s,box-shadow .15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--sun);color:#3a2700;box-shadow:0 2px 0 var(--sun-deep)}
.btn.primary:hover{background:#ffc21a}
.btn.blue{background:var(--sky2);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--sky2);color:var(--sky2)}
.btn.green{background:var(--leaf);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* reveal */
.reveal{display:none;margin-top:12px;padding:14px 16px;background:#fff;border-radius:12px;border:1px dashed var(--sky2)}
.reveal.show{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* details worked example */
details.worked{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 16px;margin:12px 0}
details.worked summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--sky)}
details.worked[open]{padding-bottom:12px}

/* flip cards */
.flipcard{perspective:900px;cursor:pointer;min-height:150px}
.flip-inner{position:relative;width:100%;height:100%;min-height:150px;transition:transform .5s;transform-style:preserve-3d}
.flipcard.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center}
.flip-front{background:#fff;border:1px solid var(--line);align-items:center;text-align:center}
.flip-front .ic{font-size:2rem}
.flip-front b{margin-top:4px}
.flip-front small{color:var(--muted);font-size:.75rem;margin-top:4px}
.flip-back{background:var(--sky);color:#fff;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}

/* scenario */
.scenario{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.sc-q{font-weight:700;margin-bottom:10px;background:var(--sun-soft);padding:10px 14px;border-radius:12px 12px 12px 2px;display:inline-block}
.sc-opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:10px;padding:10px 14px;margin:8px 0;font:inherit;cursor:pointer}
.sc-opt:hover{border-color:var(--sky2)}
.sc-opt.good{border-color:var(--leaf);background:var(--leaf-soft)}
.sc-opt.bad{border-color:var(--red);background:var(--red-soft)}
.sc-opt.mid{border-color:var(--sun);background:var(--sun-soft)}
.sc-fb{margin-top:8px;font-size:.93rem}

/* quiz */
.quiz .q{padding:14px 0;border-bottom:1px dashed var(--line)}
.quiz .q:last-of-type{border-bottom:0}
.q-t{margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:10px;padding:9px 14px;margin:6px 0;font:inherit;font-size:.94rem;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--sky2)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--leaf);background:var(--leaf-soft);font-weight:600}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.explain{margin-top:6px;font-size:.9rem;padding:10px 12px;border-radius:10px;background:var(--sky-soft)}
.quiz-sum{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--sun-soft);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* lesson nav */
.lesson-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}

/* tools */
.tool{border:2px solid var(--sky2);background:#fbfdff}
.tool-head{font-weight:800;color:var(--sky);font-size:1.05rem;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.tool-head .pill{margin-left:auto;font-weight:600}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:12px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font:inherit;font-size:.88rem;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:#fff;color:var(--sky);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.field{margin:10px 0}
.field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.range-row{display:flex;gap:12px;align-items:center}
.range-row input[type=range]{flex:1}
input[type=range]{accent-color:var(--sun-deep);height:6px}
input[type=number],input[type=text],select,textarea{font:inherit;padding:8px 10px;border:1px solid #c9d4e0;border-radius:9px;background:#fff;color:var(--ink)}
input[type=number]{width:110px}
textarea{width:100%;min-height:90px;resize:vertical}
.tier-row{display:grid;grid-template-columns:118px 1fr 160px;gap:10px;align-items:center;font-size:.85rem;margin:5px 0}
.tier-row .lbl{color:#344556;font-weight:600;line-height:1.2}
.tier-row .lbl small{display:block;font-weight:500;color:var(--muted);font-size:.74rem}
.track{height:20px;background:#eef2f7;border-radius:6px;overflow:hidden;display:flex}
.track i{display:block;height:100%;transition:width .35s}
.track i.cut{background:repeating-linear-gradient(45deg,#f6c2c0 0 6px,#fff 6px 10px);border-left:1px dashed var(--red)}
.tier-row .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tier-row .amt small{display:block;color:var(--red);font-weight:700}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:.76rem;line-height:1.3}
.stat b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat.hl{background:var(--sun-soft);border-color:#f0d58a}
.stat.ok{background:var(--leaf-soft);border-color:#bfe6d3}
.chart-box{overflow-x:auto;margin-top:12px}
.chart-box svg{display:block;min-width:520px;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.check-list label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:.93rem}
.check-list label:hover{background:var(--bg)}
.check-list input{margin-top:5px;accent-color:var(--leaf);width:17px;height:17px;flex:none}
.meter{height:16px;background:#eef2f7;border-radius:99px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--sun-deep));transition:width .4s}

/* bill mock */
.bill{background:#fff;border:1px solid #cfd8e3;border-radius:10px;font-size:.88rem;max-width:620px;box-shadow:0 6px 20px rgba(10,40,80,.08);overflow:hidden}
.bill-top{background:#eef4fa;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--sky2)}
.bill-top b{color:var(--sky);font-size:1rem}
.bill-row{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;border-bottom:1px solid #edf1f5}
.bill-row .k{color:var(--muted);min-width:150px}
.bill-row .v{font-weight:600;flex:1}
.hs{flex:none;width:26px;height:26px;border-radius:50%;border:0;background:var(--sun);color:#3a2700;font-weight:800;cursor:pointer;font-size:.8rem;animation:pulse 2s infinite}
.hs.seen{background:var(--leaf);color:#fff;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,179,1,.6)}70%{box-shadow:0 0 0 9px rgba(245,179,1,0)}100%{box-shadow:0 0 0 0 rgba(245,179,1,0)}}
.hs-panel{margin-top:12px;min-height:70px}
.watermark{font-size:.72rem;color:var(--red);font-weight:700;letter-spacing:.05em}

/* order game */
.order-pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.order-pool button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.order-pool button:hover{border-color:var(--sky2)}
.order-pool button:disabled{opacity:.25;cursor:default}
.order-ans{counter-reset:s;padding:0;margin:8px 0;list-style:none}
.order-ans li{counter-increment:s;display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--leaf-soft);border-radius:10px;margin:6px 0;animation:fade .3s;font-weight:600;font-size:.92rem}
.order-ans li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:.78rem;flex:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* sort game */
.case{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.case p{margin:0;flex:1;min-width:220px;font-size:.93rem}
.case .fb{flex-basis:100%;font-size:.88rem;padding:8px 10px;border-radius:8px;margin-top:4px}
.case.ok{border-color:var(--leaf)}
.case.ok .fb{background:var(--leaf-soft)}
.case.no{border-color:var(--red)}
.case.no .fb{background:var(--red-soft)}

/* rewrite rows */
.rw{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff}
.rw .bad-t{color:#9b2c2c;font-weight:600}
.rw .bad-t::before{content:"✗ ";}
.rw .good-t{color:#0f6e46;font-weight:600}
.rw .good-t::before{content:"✓ ";}

/* timeline */
.tl{position:relative;margin:10px 0 0 6px;padding-left:22px;border-left:3px solid var(--sun)}
.tl-item{position:relative;margin:0 0 14px}
.tl-item::before{content:"";position:absolute;left:-30px;top:4px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--sun-deep)}
.tl-item b{color:var(--sky)}

/* video */
.video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-ph{border:2px dashed #b9cbe0;border-radius:12px;padding:20px;text-align:center;background:repeating-linear-gradient(135deg,#f7fafd 0 12px,#f1f6fb 12px 24px)}
.video-ph .play{width:54px;height:54px;border-radius:50%;background:var(--sky2);color:#fff;display:grid;place-items:center;margin:0 auto 8px;font-size:1.3rem}
.video-ph p{margin:4px 0;color:#344556;font-size:.92rem}
.video-ph small{color:var(--muted);font-size:.78rem}

/* home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;background:linear-gradient(135deg,#fff,#f2f8ff);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow)}
.hero h1{font-size:1.6rem}
@media(max-width:700px){.hero{grid-template-columns:1fr}.hero svg{max-width:340px}}
.hero svg{width:100%;height:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:18px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--sky2)}
.kpi small{color:var(--muted);font-size:.8rem;display:block}
.kpi b{font-size:1.5rem}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.week{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.week h4{margin:0 0 6px;color:var(--sky);font-size:.95rem}
.week a{display:block;font-size:.86rem;text-decoration:none;color:var(--ink);padding:3px 0}
.week a.lk{color:var(--muted)}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.bdg{display:flex;flex-direction:column;align-items:center;width:100px;text-align:center;font-size:.74rem;color:var(--muted);line-height:1.25}
.bdg .ico{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:#eef2f7;filter:grayscale(1);opacity:.5;margin-bottom:5px}
.bdg.on .ico{background:radial-gradient(circle at 30% 30%,#fff3c4,var(--sun));filter:none;opacity:1;box-shadow:0 3px 10px rgba(217,138,0,.35)}
.bdg.on{color:var(--ink);font-weight:600}
.chap-cards{display:grid;gap:10px}
.lesson-card{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-decoration:none;color:var(--ink)}
.lesson-card:hover{border-color:var(--sky2)}
.lesson-card .st{font-size:1.2rem}
.lesson-card small{color:var(--muted);display:block}

/* onboarding */
.onb{max-width:640px;margin:20px auto}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
@media(max-width:560px){.role-pick{grid-template-columns:1fr}}
.role{border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff}
.role.on{border-color:var(--sun-deep);background:var(--sun-soft)}
.role b{display:block}
.role small{color:var(--muted)}

/* flashcard review */
.fc{max-width:560px;margin:10px auto;perspective:1200px;cursor:pointer}
.fc .flip-inner{min-height:260px}
.fc .flip-face{font-size:1.1rem;text-align:center;align-items:center;padding:26px;border-radius:18px}
.fc .flip-front{background:#fff;border:2px solid var(--sky2)}
.fc .flip-back{background:linear-gradient(135deg,var(--sky),var(--sky2));font-size:1rem;text-align:left;align-items:flex-start}
.fc-meta{text-align:center;color:var(--muted);font-size:.85rem}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.footer-note{margin-top:40px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

/* svg anim */
.sun-rot{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.flow{stroke-dasharray:6 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.cycle-spin{animation:spin 24s linear infinite;transform-box:view-box;transform-origin:300px 175px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* storyboard clips */
.sb{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sb-stage{background:#f4f7fb;aspect-ratio:16/9}
.sb-svg{display:block;width:100%;height:100%}
.sb-svg *{transform-box:fill-box;transform-origin:center}
.sb-cap{padding:12px 16px 2px;min-height:86px}
.sb-cap b{color:var(--sky)}
.sb-cap p{margin:4px 0 0;font-size:.93rem;color:#344556}
.sb-ctl{display:flex;align-items:center;gap:8px;padding:8px 14px 14px;flex-wrap:wrap}
.sb-ctl>button:not(.btn){border:1px solid var(--line);background:#fff;border-radius:9px;width:40px;height:36px;cursor:pointer}
.sb-ctl .btn{padding:7px 14px}
.sb-dots{display:flex;gap:5px;margin-left:auto;align-items:center}
.sb-dots i{width:9px;height:9px;border-radius:50%;background:#d5dee8;cursor:pointer;transition:all .3s}
.sb-dots i.on{background:var(--sun-deep);width:22px;border-radius:5px}
.yt-link{display:inline-block;margin-top:10px;font-weight:600;font-size:.9rem}
.a-drop{animation:aDrop .6s both}@keyframes aDrop{from{opacity:0;transform:translateY(-16px)}}
.a-pop{animation:aPop .5s both}@keyframes aPop{from{opacity:0;transform:scale(.6)}}
.a-grow{animation:aGrow .7s both;transform-origin:bottom}@keyframes aGrow{from{transform:scaleY(0)}}
.a-grow-x{animation:aGrowX .8s both;transform-origin:left}@keyframes aGrowX{from{transform:scaleX(0)}}
.a-float{animation:aFloat 2.4s ease-in-out infinite}@keyframes aFloat{50%{transform:translateY(-8px)}}
.a-pulse{animation:aPulse 1.8s ease-in-out infinite}@keyframes aPulse{50%{opacity:.5}}
/* games */
.cg-score{font-weight:700;margin-top:8px}
.case .btn-row .btn{padding:7px 12px;font-size:.85rem}
.svg-hs.seen circle{fill:#16935f}
.compass{position:relative;width:170px;height:170px;margin:14px auto;border-radius:50%;background:radial-gradient(circle,#fff 55%,#eef2f7 56%);border:2px solid var(--line)}
.compass span{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem}
.compass button{position:absolute;left:50%;top:50%;width:40px;height:30px;margin:-15px 0 0 -20px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.compass button.on{background:var(--sun);border-color:var(--sun-deep)}
.ql{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;background:#fff;font-size:.92rem}
.ql input{margin-right:8px;accent-color:var(--red)}
.ql.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.ql.no{border-color:var(--red);background:var(--red-soft)}
.ql .fb{font-size:.85rem;margin-top:4px;color:#344556}
.chat{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:.93rem;animation:fade .3s}
.msg.them{background:var(--sun-soft);align-self:flex-start;border-bottom-left-radius:3px}
.msg.me{background:var(--sky-soft);align-self:flex-end;border-bottom-right-radius:3px}
.hunt .hz{cursor:pointer}
.lt input,.lt select{padding:5px 6px;font-size:.85rem}
.cert{background:#fff;border:10px solid var(--sky);outline:3px solid var(--sun);outline-offset:-20px;border-radius:6px;padding:48px 30px;text-align:center;max-width:720px;margin:20px auto;box-shadow:var(--shadow)}
.tool-group{margin-top:28px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}

@media(max-width:560px){
  html{font-size:15.5px}
  .card{padding:16px 15px}
  h1{font-size:1.5rem}
  .tier-row{grid-template-columns:minmax(0,1fr) 112px;gap:4px 8px;font-size:.8rem;margin:8px 0}
  .tier-row .lbl{grid-column:1/-1}
  .tier-row .lbl small{display:inline;margin-left:6px}
  .bill-row .k{min-width:96px}
  .brand small{display:none}
  .tool-head,h2{flex-wrap:wrap}
  .lesson-foot .btn{flex:1;justify-content:center}
}
/* ===================== GIAO DIỆN GAMING ===================== */
body.game{--sky:#22d3ee;--sky2:#22d3ee;--sky-soft:rgba(34,211,238,.10);--sun:#facc15;--sun-deep:#f59e0b;--sun-soft:rgba(250,204,21,.08);--leaf:#a3e635;--leaf-soft:rgba(163,230,53,.10);--red:#fb7185;--red-soft:rgba(244,63,94,.10);--ink:#e6edf7;--muted:#8b9bb4;--bg:#070b16;--card:#0f1629;--line:#1f2b47;--shadow:0 10px 30px rgba(0,0,0,.45);--neon2:#e879f9;
  background:radial-gradient(1100px 600px at 85% -10%,rgba(232,121,249,.16),transparent 60%),radial-gradient(900px 520px at -10% 5%,rgba(34,211,238,.14),transparent 60%),#070b16;background-attachment:fixed;color:var(--ink)}
body.game::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(34,211,238,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.045) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,#000,transparent 85%)}

/* thanh trên & menu */

body.game .track,body.game .meter{background:#1a2440}

.dov-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}

/* ===================== PHẦN 2: THÀNH PHẦN KỸ THUẬT ===================== */
/* chú giải thuật ngữ */
.gl{border-bottom:2px dotted var(--sky2);cursor:help;font-weight:600;color:inherit;outline:none;border-radius:2px}
.gl:hover,.gl:focus{background:var(--sky-soft)}
#gltip{position:fixed;z-index:120;max-width:calc(100vw - 20px);background:#17232f;color:#fff;padding:10px 13px;border-radius:11px;font-size:.86rem;line-height:1.5;box-shadow:0 10px 30px rgba(10,20,40,.3);opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .15s,transform .15s}
#gltip.show{opacity:1;transform:none}
#gltip b{display:block;color:#ffd666;margin-bottom:3px}
/* khung công thức */
.fx{background:#fff;border:1px solid var(--line);border-left:5px solid var(--sun);border-radius:12px;padding:12px 16px;font-size:1.08rem;font-family:'Cambria Math','Times New Roman',serif;overflow-x:auto;white-space:nowrap;margin:6px 0 12px}
.fx sub{font-size:.7em}
.fx-vars{display:grid;gap:8px}
.fx-var{display:grid;grid-template-columns:86px minmax(0,1fr) minmax(0,1.1fr);gap:6px 12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.fx-sym{font-family:'Cambria Math','Times New Roman',serif;font-size:1.05rem;font-weight:700;color:var(--sky)}
.fx-sym sub{font-size:.7em}
.fx-def b{display:block;font-size:.88rem;line-height:1.3}
.fx-def small{display:block;color:var(--muted);font-size:.74rem;line-height:1.3}
.fx-in{display:flex;align-items:center;gap:8px}
.fx-in input{flex:1;min-width:0}
.fx-in output{min-width:76px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem}
.fx-steps{margin-top:12px;background:var(--sky-soft);border-radius:12px;padding:10px 14px}
.fx-st-h{font-weight:800;color:var(--sky);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em}
.fx-steps ol{margin:6px 0 0;padding-left:1.3em}
.fx-steps li{margin:4px 0;font-size:.92rem}
.fx-steps li span{color:#344556}
.fx-steps li b{display:block;font-family:'Cambria Math','Times New Roman',serif;font-size:1rem;overflow-x:auto;white-space:nowrap}
.fx-chk{margin-top:8px;padding:8px 12px;border-radius:10px;font-weight:600;font-size:.92rem}
.fx-chk.ok{background:var(--leaf-soft);color:#0f6e46}
.fx-chk.no{background:var(--red-soft);color:#9b2c2c}
@media(max-width:560px){.fx-var{grid-template-columns:62px minmax(0,1fr)}.fx-in{grid-column:1/-1}.fx{font-size:.98rem}}
/* thanh trượt trên sơ đồ */
.p2svg{display:block;width:100%;height:auto;border-radius:12px}
.p2svg .bg{fill:#f8fbff}.p2svg .ax{stroke:#9aa7b4}.p2svg .gr{stroke:#e6ecf3}
.p2svg text{fill:#5d6b79;font-family:inherit}
.p2svg .tk{fill:#17232f}.p2svg .ti{fill:#1e74c4}.p2svg .tp{fill:#d98a00}.p2svg .tg{fill:#16935f}.p2svg .tr{fill:#d14343}
.p2svg .box{fill:#fff;stroke:#c9d6e3}.p2svg .wire{stroke:#9aa7b4}
.st-sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 18px;margin-top:8px}
.st-sl label{font-size:.88rem}

<script>
/* =====================================================================
   CẤU HÌNH – có thể chỉnh trực tiếp
   ===================================================================== */
// Dán mã video YouTube (phần sau "v=") vào đây để hiện clip trong bài.
const VIDEOS = {
  'c0-khach-hang': '',   // Clip: khách hàng thật kể về trải nghiệm lắp đặt
  'c1-app-cskh':   '',   // Clip: hướng dẫn xem lịch sử tiêu thụ trên app CSKH điện lực
  'c3-atlas':      '',   // Clip: hướng dẫn Global Solar Atlas
  'c4-lap-dat':    '',   // Clip: quy trình lắp đặt thực tế
  'c6-khao-sat':   ''    // Clip: khảo sát mái nhà
};

// Biểu giá điện sinh hoạt bậc thang (đ/kWh, chưa VAT) – ước tính theo biểu giá áp dụng từ 05/2025.
// Có thể sửa trong trang "Cài đặt số liệu" của khoá học.
const DEFAULT_SETTINGS = { tiers:[1984,2050,2380,2998,3350,3460], vat:8, updated:'05/2025' };
const TIER_LIMITS = [50,50,100,100,100,Infinity];
const TIER_NAMES  = ['Bậc 1','Bậc 2','Bậc 3','Bậc 4','Bậc 5','Bậc 6'];
const TIER_RANGES = ['0–50 kWh','51–100 kWh','101–200 kWh','201–300 kWh','301–400 kWh','từ 401 kWh'];
const TIER_COLORS = ['#2fa36b','#7cbf3a','#d4b106','#f08c00','#e8590c','#d6336c'];

// Sản lượng giả định cho 1 kWp tại Thanh Hoá (kWh/tháng) – CHỈ ĐỂ MINH HOẠ. Chương 3 sẽ dạy cách tra số liệu thật.
const PV_MONTH = [65,60,75,100,130,125,135,125,115,105,90,75];

/* =====================================================================
   TRẠNG THÁI & TIỆN ÍCH
   ===================================================================== */
const LS_KEY='ths_academy_v1', DAY=86400000, INTERVALS=[0,1,3,7,14,30];
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fresh=()=>({name:'',role:'',done:{},quiz:{},cards:{},field:{},settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),last:null});
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(LS_KEY));if(s)return Object.assign(fresh(),s)}catch(e){}return fresh()})();
const save=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}};
const fmt=n=>Math.round(n).toLocaleString('vi-VN');
const money=n=>fmt(n)+'đ';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function toast(msg){const t=$('#toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- Tính tiền điện ---------- */
function calcBill(kwh){
  const p=S.settings.tiers;let rest=Math.max(0,kwh),sub=0;const rows=[];
  for(let i=0;i<6;i++){const q=Math.min(rest,TIER_LIMITS[i]);rows.push({i,q,price:p[i],amt:q*p[i]});sub+=q*p[i];rest-=q}
  const vat=sub*S.settings.vat/100;return{rows,sub,vat,total:sub+vat,kwh};
}
function kwhFromMoney(total){let lo=0,hi=20000;for(let k=0;k<60;k++){const m=(lo+hi)/2;if(calcBill(m).total<total)lo=m;else hi=m}return Math.round(lo)}
function tierOf(k){let acc=0;for(let i=0;i<6;i++){acc+=TIER_LIMITS[i];if(k<=acc)return i}return 5}
function marginal(k){return S.settings.tiers[tierOf(Math.max(1,k))]*(1+S.settings.vat/100)}

/* ---------- Thành phần giao diện dùng chung ---------- */
const persona=(ic,name,sub)=>`<div class="persona"><span class="avatar">${ic}</span><div><b>${name}</b><small>${sub}</small></div></div>`;

  const id=VIDEOS[key];
  if(id) return `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="${esc(title)}" allowfullscreen loading="lazy"></iframe></div>`;
  return `<div class="video-ph"><div class="play">▶</div><b>Chỗ dành cho clip: ${title}</b><p>${hint}</p><small>Cách chèn: mở file HTML bằng trình soạn thảo, tìm <code>VIDEOS</code> và dán mã video YouTube vào mục <code>${key}</code>.</small></div>`;
}
function scenario(q,opts){
  return `<div class="scenario"><div class="sc-q">💬 ${q}</div>${opts.map(o=>`<button class="sc-opt" data-k="${o.k}" data-fb="${esc(o.fb)}">${o.t}</button>`).join('')}<div class="sc-fb"></div></div>`;

<rect width="640" height="340" rx="14" fill="#f4f9ff"/>

function svgCycle(){
  const nodes=[['👀','Biết đến'],['🤝','Tin tưởng'],['✍️','Ký hợp đồng'],['🔧','Lắp đặt chuẩn'],['😊','Hài lòng 25 năm'],['📣','Giới thiệu']];
  const cx=300,cy=175,R=125;
  let g='';nodes.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/6,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
    g+=`<g><circle cx="${x}" cy="${y}" r="38" fill="${i===5?'#f5b301':'#fff'}" stroke="#1e74c4" stroke-width="2.5"/><text x="${x}" y="${y-4}" text-anchor="middle" font-size="20">${n[0]}</text><text x="${x}" y="${y+16}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#17232f">${n[1]}</text></g>`});
  return `<svg viewBox="0 0 600 350" role="img" aria-label="Vòng đời khách hàng" style="width:100%;height:auto;max-width:560px;display:block;margin:auto">
  <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#f5b301" stroke-width="3" stroke-dasharray="10 8" class="cycle-spin"/>
  <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="15" font-weight="800" fill="#0b4f8a">1 khách hài lòng</text>
  <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="13" fill="#0b4f8a">→ khách mới tiếp theo</text>${g}</svg>`;
}

function svgStairs(){
  const p=S.settings.tiers,max=Math.max(...p);let g='';
  p.forEach((v,i)=>{const h=40+150*(v-1800)/(max-1800),x=20+i*95,y=220-h;
    g+=`<rect x="${x}" y="${y}" width="88" height="${h}" rx="6" fill="${TIER_COLORS[i]}"/><text x="${x+44}" y="${y-22}" text-anchor="middle" font-size="13" font-weight="800" fill="#17232f">${fmt(v)}đ</text><text x="${x+44}" y="${y-7}" text-anchor="middle" font-size="10.5" fill="#5d6b79">${TIER_RANGES[i]}</text><text x="${x+44}" y="${y+20}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${TIER_NAMES[i]}</text>`});
  return `<svg viewBox="0 0 600 235" role="img" aria-label="Cầu thang giá điện" style="width:100%;height:auto">${g}<line x1="10" y1="221" x2="590" y2="221" stroke="#c9d4e0"/></svg>`;
}

/* =====================================================================
   CÔNG CỤ TƯƠNG TÁC
   ===================================================================== */
function tierRowsHtml(before,after){
  return before.rows.map((r,i)=>{
    const L=i<5?TIER_LIMITS[i]:Math.max(r.q,100), qa=after?after.rows[i].q:r.q, cut=r.q-qa;
    const cutAmt=cut*r.price*(1+S.settings.vat/100);
    return `<div class="tier-row"><div class="lbl">${TIER_NAMES[i]} · ${fmt(r.price)}đ<small>${TIER_RANGES[i]}</small></div>
    <div class="track"><i style="width:${qa/L*100}%;background:${TIER_COLORS[i]}"></i>${cut>0?`<i class="cut" style="width:${cut/L*100}%"></i>`:''}</div>
    <div class="amt">${fmt(qa)} kWh${cut>0?`<small>−${fmt(cut)} kWh · −${money(cutAmt)}</small>`:`<small style="color:var(--muted);font-weight:500">${money(after?after.rows[i].amt:r.amt)}</small>`}</div></div>`}).join('');
}

function billTool(el,{kwh=500}={}){
  el.innerHTML=`<div class="tool-head">🧮 Máy tính hoá đơn bậc thang <span class="pill">Giá sinh hoạt · VAT ${S.settings.vat}%</span></div>
  <div class="seg"><button data-m="kwh" class="on">Tôi biết số kWh</button><button data-m="vnd">Khách chỉ nhớ số tiền</button></div>
  <div class="field m-kwh"><label>Điện năng tiêu thụ (kWh/tháng)</label><div class="range-row"><input type="range" min="0" max="1200" step="10" value="${kwh}" class="r"><input type="number" class="n" min="0" max="5000" value="${kwh}"></div></div>
  <div class="field m-vnd hidden"><label>Số tiền trên hoá đơn (đồng, đã gồm VAT)</label><div class="range-row"><input type="range" min="0" max="5000000" step="50000" value="1500000" class="mr"><input type="number" class="money" step="10000" value="1500000" style="width:140px"></div><div style="margin-top:6px">→ Quy ra khoảng <b class="conv"></b></div></div>
  <div class="tiers"></div><div class="sum-grid"></div>`;
  const r=$('.r',el),n=$('.n',el),m=$('.money',el),mr=$('.mr',el);
  function draw(k){
    const b=calcBill(k);$('.tiers',el).innerHTML=tierRowsHtml(b);
    $('.sum-grid',el).innerHTML=`<div class="stat"><small>Tiền điện chưa thuế</small><b>${money(b.sub)}</b></div><div class="stat"><small>Thuế GTGT ${S.settings.vat}%</small><b>${money(b.vat)}</b></div><div class="stat hl"><small>Tổng thanh toán</small><b>${money(b.total)}</b></div><div class="stat"><small>Giá trung bình mỗi kWh</small><b>${k?money(b.total/k):'–'}</b></div><div class="stat ok"><small>Giá của số điện cuối cùng (đã VAT)</small><b>${k?money(marginal(k)):'–'}</b></div>`;
  }
  r.oninput=()=>{n.value=r.value;draw(+r.value)};
  n.oninput=()=>{r.value=n.value;draw(+n.value||0)};
  const fromMoney=v=>{const k=kwhFromMoney(v);$('.conv',el).textContent=fmt(k)+' kWh/tháng';draw(k)};
  m.oninput=()=>{mr.value=m.value;fromMoney(+m.value||0)};
  mr.oninput=()=>{m.value=mr.value;fromMoney(+mr.value)};
  $$('.seg button',el).forEach(b=>b.onclick=()=>{$$('.seg button',el).forEach(x=>x.classList.toggle('on',x===b));const v=b.dataset.m==='vnd';$('.m-kwh',el).classList.toggle('hidden',v);$('.m-vnd',el).classList.toggle('hidden',!v);v?fromMoney(+m.value||0):draw(+n.value||0)});
  draw(kwh);
}

function cutTool(el,{use=500,solar=200}={}){
  el.innerHTML=`<div class="tool-head">✂️ Mô phỏng “điện mặt trời cắt bậc” <span class="pill">Giá sinh hoạt</span></div>
  <div class="field"><label>Điện nhà khách dùng mỗi tháng (kWh)</label><div class="range-row"><input type="range" min="100" max="1500" step="10" value="${use}" class="u"><b class="uv" style="min-width:80px"></b></div></div>
  <div class="field"><label>☀️ Điện mặt trời <u>tự dùng</u> mỗi tháng (kWh)</label><div class="range-row"><input type="range" min="0" max="${use}" step="10" value="${solar}" class="s"><b class="sv" style="min-width:80px"></b></div></div>
  <div class="tiers"></div><div class="legend"><span><i style="background:#f08c00"></i>Vẫn phải mua của điện lực</span><span><i style="background:repeating-linear-gradient(45deg,#f6c2c0 0 4px,#fff 4px 7px);border:1px dashed #d14343"></i>Phần bị điện mặt trời “cắt”</span></div>
  <div class="sum-grid"></div>
  <h3 style="margin-top:20px">📉 Mỗi kWh mặt trời đáng giá bao nhiêu? (theo từng nấc 50 kWh)</h3>
  <div class="chart-box dim"></div>`;
  const u=$('.u',el),s=$('.s',el);
  function draw(){
    const U=+u.value;s.max=U;if(+s.value>U)s.value=U;const So=+s.value;
    $('.uv',el).textContent=fmt(U)+' kWh';$('.sv',el).textContent=fmt(So)+' kWh';
    const b=calcBill(U),a=calcBill(U-So),save=b.total-a.total;
    $('.tiers',el).innerHTML=tierRowsHtml(b,a);
    $('.sum-grid',el).innerHTML=`<div class="stat"><small>Hoá đơn hiện tại</small><b>${money(b.total)}</b></div><div class="stat"><small>Hoá đơn sau khi có điện mặt trời</small><b>${money(a.total)}</b></div><div class="stat ok"><small>Tiết kiệm mỗi tháng</small><b>${money(save)}</b></div><div class="stat hl"><small>Giá trị trung bình mỗi kWh mặt trời</small><b>${So?money(save/So):'–'}</b></div>`;
    // biểu đồ lợi ích giảm dần
    const step=50,chunks=[];for(let k=0;k+step<=U&&chunks.length<30;k+=step){chunks.push({k,v:(calcBill(U-k).total-calcBill(U-k-step).total)/step})}
    const W=620,H=210,pad=44,bw=(W-pad-10)/Math.max(chunks.length,1),maxV=Math.max(...chunks.map(c=>c.v),1);
    let bars=chunks.map((c,i)=>{const h=(H-50)*c.v/maxV,x=pad+i*bw,y=H-28-h,on=c.k<So;
      return `<rect x="${x+2}" y="${y}" width="${bw-4}" height="${h}" rx="3" fill="${on?'#f5b301':'#d5dee8'}"/>${i%2===0||chunks.length<12?`<text x="${x+bw/2}" y="${H-12}" font-size="9.5" text-anchor="middle" fill="#5d6b79">${c.k+step}</text>`:''}`}).join('');
    $('.dim',el).innerHTML=`<svg viewBox="0 0 ${W} ${H}">${bars}<text x="4" y="16" font-size="10" fill="#5d6b79">đ/kWh</text><text x="4" y="30" font-size="10" fill="#5d6b79">${fmt(maxV)}</text><text x="${W-6}" y="${H-1}" font-size="10" text-anchor="end" fill="#5d6b79">kWh mặt trời thứ… →</text><line x1="${pad}" y1="${H-28}" x2="${W-6}" y2="${H-28}" stroke="#c9d4e0"/></svg><div class="legend"><span><i style="background:#f5b301"></i>Phần đang được điện mặt trời thay thế</span><span><i style="background:#d5dee8"></i>Phần còn lại</span></div>`;
  }
  u.oninput=draw;s.oninput=draw;draw();
}

let SB_TIMERS=[];
const SB={};let sbSeq=0;
function storyboard(slides){const id='sb'+(++sbSeq);SB[id]=slides;
  return `<div class="sb" data-sb="${id}"><div class="sb-stage"></div><div class="sb-cap"></div><div class="sb-ctl"><button class="sb-prev" aria-label="Cảnh trước">⏮</button><button class="sb-play btn blue">▶ Phát clip</button><button class="sb-next" aria-label="Cảnh sau">⏭</button><div class="sb-dots"></div><span class="sb-count"></span></div></div>`}
function initSB(root){
  $$('.sb',root).forEach(el=>{const slides=SB[el.dataset.sb];if(!slides)return;let i=0,t=null;
    const stage=$('.sb-stage',el),cap=$('.sb-cap',el),play=$('.sb-play',el);
    const show=k=>{i=(k+slides.length)%slides.length;const s=slides[i];stage.innerHTML=typeof s.svg==='function'?s.svg():s.svg;
      cap.innerHTML=`<b>Cảnh ${i+1}/${slides.length}: ${s.t}</b><p>${s.d}</p>`;
      $('.sb-dots',el).innerHTML=slides.map((x,j)=>`<i class="${j===i?'on':''}" data-j="${j}"></i>`).join('');
      $$('.sb-dots i',el).forEach(d=>d.onclick=()=>{stop();show(+d.dataset.j)})};
    const stop=()=>{clearInterval(t);t=null;play.textContent='▶ Phát clip'};
    play.onclick=()=>{if(t){stop();return}play.textContent='⏸ Tạm dừng';if(i===slides.length-1)show(0);t=setInterval(()=>{if(i===slides.length-1){stop();return}show(i+1)},6500);SB_TIMERS.push(t)};
    $('.sb-prev',el).onclick=()=>{stop();show(i-1)};$('.sb-next',el).onclick=()=>{stop();show(i+1)};
    show(0);
  });
}
function media(key,slides,ytq){
  const id=VIDEOS[key];
  let h=id?`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}" allowfullscreen loading="lazy"></iframe></div>`:storyboard(slides);
  if(ytq)h+=`<a class="yt-link" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ytq)}" target="_blank" rel="noopener">🔎 Xem thêm video thực tế trên YouTube: “${ytq}”</a>`;
  if(!id)h+=`<small class="src">Clip hoạt hình do Thanh Hoá Solar tự dựng. Khi có video công trình thật, dán mã YouTube vào mục <code>${key}</code> trong <code>VIDEOS</code> ở đầu file để thay thế.</small>`;
  return h;
}

function choiceGame(cases,opts){return `<div class="cg" data-n="${cases.length}">${cases.map(c=>`<div class="case cg-case" data-a="${c.a}" data-al="${esc(opts[c.a])}" data-fb="${esc(c.fb)}"><p>${c.t}</p><div class="btn-row">${opts.map((o,i)=>`<button class="btn ghost cg-btn" data-v="${i}">${o}</button>`).join('')}</div></div>`).join('')}<div class="cg-score"></div></div>`}
const tfGame=items=>choiceGame(items.map(x=>({t:x[0],a:x[1]?0:1,fb:x[2]})),['✅ Đúng','❌ Sai']);

function kwTool(el){
  el.innerHTML=`<div class="tool-head">🚰 Vòi nước và cái xô: kW × giờ = kWh</div>
  <div class="grid2"><div><div class="field"><label>Công suất thiết bị (kW) = độ mạnh của vòi</label><div class="range-row"><input type="range" class="p" min="0.05" max="3" step="0.05" value="1.2"><b class="pv" style="min-width:64px"></b></div></div>
  <div class="field"><label>Thời gian chạy (giờ) = thời gian mở vòi</label><div class="range-row"><input type="range" class="h" min="0.25" max="12" step="0.25" value="8"><b class="hv" style="min-width:64px"></b></div></div>
  <div class="sum-grid"></div></div><div class="vis"></div></div>`;
  const p=$('.p',el),h=$('.h',el);
  const draw=()=>{const P=+p.value,H=+h.value,E=P*H;$('.pv',el).textContent=P.toFixed(2)+' kW';$('.hv',el).textContent=H+' giờ';
    const fill=Math.min(E/30,1),sw=2+P*6;
    $('.vis',el).innerHTML=`<svg viewBox="0 0 220 230" style="width:100%;max-width:260px;display:block;margin:auto"><rect x="20" y="20" width="90" height="16" rx="4" fill="#6b7785"/><rect x="100" y="20" width="16" height="34" rx="4" fill="#6b7785"/><line class="flow" x1="108" y1="54" x2="108" y2="${200-150*fill}" stroke="#1e74c4" stroke-width="${sw}"/><path d="M50 80 L60 210 L156 210 L166 80 Z" fill="#fff" stroke="#56687a" stroke-width="3"/><clipPath id="bk"><path d="M50 80 L60 210 L156 210 L166 80 Z"/></clipPath><rect clip-path="url(#bk)" x="40" y="${210-130*fill}" width="140" height="${130*fill}" fill="#9cc3ee" style="transition:all .4s"/><text x="108" y="150" text-anchor="middle" font-size="18" font-weight="800" fill="#0b4f8a">${E.toFixed(1)} kWh</text></svg>`;
    $('.sum-grid',el).innerHTML=`<div class="stat hl"><small>Điện năng tiêu thụ</small><b>${E.toFixed(2)} kWh</b></div><div class="stat"><small>Một tháng (30 ngày)</small><b>${fmt(E*30)} kWh</b></div><div class="stat ok"><small>Tiền/tháng nếu rơi vào bậc 6 (đã VAT)</small><b>${money(E*30*marginal(500))}</b></div>`};
  p.oninput=h.oninput=draw;draw();
}

function calcPayback(o){
  const vat=1+S.settings.vat/100,cost=(o.kwp*o.cpk+o.bat*o.cbat)*1e6;let cum=0,py=null,y1=0,yrs=[];
  for(let y=1;y<=25;y++){const deg=Math.pow(1-o.deg/100,y-1),esc=Math.pow(1+o.esc/100,y-1);let a=0;
    for(let m=0;m<12;m++){const prod=PV_MONTH[m]*o.kwp*deg,self=Math.min(prod*o.s/100,o.C);
      let sav=o.mode==='sh'?calcBill(o.C).total-calcBill(o.C-self).total:self*o.price*vat;sav*=esc;
      if(o.sell){sav+=Math.min(prod-self,prod*0.5)*o.sellp}a+=sav}
    if(y===1)y1=a;if(y===11)a-=o.inv*1e6;const prev=cum;cum+=a;if(py===null&&cum>=cost)py=y-1+(cost-prev)/a;yrs.push(cum)}
  const bank=y=>cost*(Math.pow(1+o.rate/100,y)-1);
  return{cost,py,y1,yrs,net:cum-cost,bank25:bank(25),bank};
}

      $('.rs',el).onclick=()=>{i=0;trust=50;log=[];draw()};return}
    const d=DLG[i];
    el.innerHTML=`<div class="tool-head">💬 Mô phỏng tư vấn: ông Hùng, Hậu Lộc <span class="pill">Lượt ${i+1}/${DLG.length}</span></div>${m}
    <div class="chat"><div class="msg them">👴 ${d.o}</div></div><div class="opts">${d.a.map((a,j)=>`<button class="sc-opt dl" data-j="${j}">${a[1]}</button>`).join('')}</div>`;
    $$('.dl',el).forEach(b=>b.onclick=()=>{const a=d.a[+b.dataset.j];trust=Math.max(0,Math.min(100,trust+a[0]*4));log.push({p:a[0]});
      $('.chat',el).insertAdjacentHTML('beforeend',`<div class="msg me">🧑 ${a[1]}</div><div class="msg them">👴 ${a[2]}</div>`);
      $('.opts',el).innerHTML=`<div class="sc-fb" style="margin:8px 0">${a[0]===2?'✅ Câu trả lời tốt nhất!':a[0]===0?'⚠️ Chưa đủ thuyết phục.':'❌ Làm mất niềm tin.'}</div><button class="btn blue nx">Tiếp →</button>`;
      $('.nx',el).onclick=()=>{i++;draw()}});
  };draw();
}

const certCh=part=>part===2?COURSE.filter(c=>c.part===2&&c.ready):track().filter(c=>c.ready&&!c.part);
function pageCert(){
  const head=`<div class="crumbs"><a href="#home">Trang chủ</a> › Chứng nhận</div><h1>🏆 Chứng nhận hoàn thành</h1>`;
  const blk=part=>{const ch=certCh(part),all=ch.flatMap(c=>c.lessons),left=all.filter(l=>!S.done[l.id]);if(!ch.length)return '';
    const name=part===2?'Phần 2 · Kỹ thuật chuyên sâu':`Phần 1 · Lộ trình ${S.role==='ctv'?'Cộng tác viên':'Tư vấn viên'}`;
    if(left.length)return `<div class="card note"><h2>${part===2?'🔬':'🎓'} ${name}</h2><p class="lead">Bạn đã hoàn thành <b>${all.length-left.length}/${all.length}</b> bài. Hoàn thành các bài còn lại để nhận chứng nhận:</p><ul class="clean">${left.slice(0,12).map(l=>`<li><a href="#lesson-${l.id}">${LESSONS[l.id].c.num}.${LESSONS[l.id].i+1} ${l.title}</a></li>`).join('')}${left.length>12?`<li>… và ${left.length-12} bài khác</li>`:''}</ul></div>`;
    return `<h2 style="margin-top:26px">${part===2?'🔬':'🎓'} ${name}</h2><div class="cert">${certHtml(part)}</div><div class="btn-row" style="justify-content:center"><button class="btn primary" data-certp="${part}">🖨️ In / Lưu PDF chứng nhận</button></div>`};
  return head+blk(1)+blk(2)+footer();
}
function certStats(part=1){const ch=certCh(part),all=ch.flatMap(c=>c.lessons);let sc=0,tot=0;all.forEach(l=>{const q=S.quiz[l.id];if(q&&q.score!=null){sc+=q.score;tot+=l.quiz.length}});
  return{ch,date:new Date(Math.max(...all.map(l=>S.done[l.id]||0))).toLocaleDateString('vi-VN'),pct:tot?Math.round(sc/tot*100):0}}
function certHtml(part=1){const s=certStats(part);return `<div style="font-size:2.6rem">${part===2?'🔬':'☀️'}</div><div style="letter-spacing:.2em;color:#5d6b79;font-size:.8rem;font-weight:700">THANH HOÁ SOLAR · HỌC VIỆN TƯ VẤN</div><h1 style="font-size:1.9rem;margin:14px 0 4px;color:#0b4f8a">CHỨNG NHẬN HOÀN THÀNH</h1><p style="margin:0">Chứng nhận</p><div style="font-size:2rem;font-weight:800;margin:6px 0;color:#d98a00">${esc(S.name)}</div><p>đã hoàn thành ${part===2?'<b>Phần 2 · Kỹ thuật chuyên sâu Điện mặt trời áp mái</b>':`lộ trình <b>${S.role==='ctv'?'Cộng tác viên':'Tư vấn viên Điện mặt trời áp mái'}</b>`}<br>gồm ${s.ch.length} chương · điểm câu hỏi nhanh trung bình <b>${s.pct}%</b></p><p style="margin-top:22px;font-size:.9rem;color:#5d6b79">Ngày hoàn thành: ${s.date}</p>`}

const GL_MAP={};let GL_RE='';
(function(){const keys=[];GLOSS.forEach((g,i)=>g[0].forEach(k=>{const add=x=>{GL_MAP[x.toLowerCase()]=i;keys.push(x)};add(k);if(/^\p{Ll}/u.test(k))add(k[0].toUpperCase()+k.slice(1))}));
  keys.sort((a,b)=>b.length-a.length);GL_RE='(^|[^\\p{L}\\p{N}_])('+keys.map(k=>k.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')).join('|')+')(?![\\p{L}\\p{N}_])'})();
/* Bọc thủ công: gl('Voc') hoặc gl('Voc','điện áp hở mạch') */
const gl=(k,txt)=>`<span class="gl" tabindex="0" data-gl="${GL_MAP[k.toLowerCase()]}">${txt||k}</span>`;
/* Tự bọc lần xuất hiện đầu tiên của mỗi thuật ngữ trong từng thẻ nội dung */
const GL_SKIP='svg,button,a,.gl,.tool,h1,h2,h3,code,textarea,select,input,.fx,.sb,.seq,summary,.opt,.flip-front,.no-gl';
function autoGloss(root){if(!root)return;
  [...root.children].forEach(sec=>{const used=new Set();
    const w=document.createTreeWalker(sec,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest(GL_SKIP)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
    nodes.forEach(node=>{const txt=node.nodeValue,re=new RegExp(GL_RE,'gu');let m,last=0,frag=null;
      while((m=re.exec(txt))){const i=GL_MAP[m[2].toLowerCase()];if(i==null||used.has(i))continue;used.add(i);
        frag=frag||document.createDocumentFragment();const st=m.index+m[1].length;
        frag.appendChild(document.createTextNode(txt.slice(last,st)));
        const s=document.createElement('span');s.className='gl';s.tabIndex=0;s.dataset.gl=i;s.textContent=m[2];frag.appendChild(s);last=st+m[2].length}
      if(frag){frag.appendChild(document.createTextNode(txt.slice(last)));node.parentNode.replaceChild(frag,node)}});
  });
}
let glTip=null;
function glShow(el){const g=GLOSS[+el.dataset.gl];if(!g)return;
  if(!glTip){glTip=document.createElement('div');glTip.id='gltip';glTip.setAttribute('role','tooltip');document.body.appendChild(glTip)}
  glTip.innerHTML=`<b>${g[1]}</b><div>${g[2]}</div>`;glTip._for=el;
  const r=el.getBoundingClientRect(),tw=Math.min(320,innerWidth-20);glTip.style.width=tw+'px';
  glTip.style.left=Math.max(10,Math.min(r.left+r.width/2-tw/2,innerWidth-tw-10))+'px';
  const h=glTip.offsetHeight;let y=r.bottom+8;if(y+h>innerHeight-10)y=r.top-h-8;glTip.style.top=Math.max(10,y)+'px';glTip.classList.add('show')}
function glHide(){if(glTip){glTip.classList.remove('show');glTip._for=null}}
document.addEventListener('mouseover',e=>{const g=e.target.closest&&e.target.closest('.gl');if(g)glShow(g)});
document.addEventListener('mouseout',e=>{const g=e.target.closest&&e.target.closest('.gl');if(g&&!g.contains(e.relatedTarget)&&document.activeElement!==g)glHide()});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('gl'))glShow(e.target)});
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('gl'))glHide()});
document.addEventListener('click',e=>{const g=e.target.closest&&e.target.closest('.gl');if(g)glShow(g);else glHide()},true);
window.addEventListener('scroll',glHide,{passive:true});

/* ---------- 2. Khung giải công thức từng bước ----------
   formulaTool(el,{title, fx:'html công thức', vars:[{k,sym,name,ref,unit,min,max,step,val,dp}],
     presets:[{n,v:{k:giá trị}}], solve:v=>({steps:[[lời,biểu thức]], out:[{l,v,c}], checks:[[đạt?,lời]], note})}) */
function formulaTool(el,F){const v={};F.vars.forEach(x=>v[x.k]=x.val);
  el.innerHTML=`<div class="tool-head">🧮 ${F.title}${F.pill?`<span class="pill">${F.pill}</span>`:''}</div>
  ${F.intro?`<p class="muted" style="margin:0 0 8px;font-size:.9rem">${F.intro}</p>`:''}
  ${F.presets?`<div class="seg fx-pre">${F.presets.map((p,i)=>`<button data-p="${i}">${p.n}</button>`).join('')}</div>`:''}
  <div class="fx">${F.fx}</div>
  <div class="fx-vars">${F.vars.map(x=>`<div class="fx-var" data-k="${x.k}"><div class="fx-sym">${x.sym}</div><div class="fx-def"><b>${x.name}</b>${x.ref?`<small>${x.ref}</small>`:''}</div><div class="fx-in"><input type="range" min="${x.min}" max="${x.max}" step="${x.step}" value="${x.val}" aria-label="${esc(x.name)}"><output></output></div></div>`).join('')}</div>
  <div class="fx-steps"></div><div class="fx-res"></div>`;
  const show=(x,val)=>nf(val,x.dp!=null?x.dp:(String(x.step).split('.')[1]||'').length)+(x.unit?' '+x.unit:'');
  const draw=()=>{F.vars.forEach(x=>{const r=$(`.fx-var[data-k="${x.k}"]`,el);$('output',r).textContent=show(x,v[x.k]);$('input',r).value=v[x.k]});
    const r=F.solve(v);
    $('.fx-steps',el).innerHTML=`<div class="fx-st-h">Giải từng bước</div><ol>${r.steps.map(s=>`<li><span>${s[0]}</span><b>${s[1]}</b></li>`).join('')}</ol>`;
    $('.fx-res',el).innerHTML=`<div class="sum-grid">${r.out.map(o=>`<div class="stat ${o.c||''}"><small>${o.l}</small><b>${o.v}</b></div>`).join('')}</div>${(r.checks||[]).map(c=>`<div class="fx-chk ${c[0]?'ok':'no'}">${c[0]?'✅':'⛔'} ${c[1]}</div>`).join('')}${r.note?`<p class="muted" style="font-size:.86rem;margin:8px 0 0">${r.note}</p>`:''}`};
  $$('.fx-var input',el).forEach(i=>i.oninput=()=>{v[i.closest('.fx-var').dataset.k]=+i.value;$$('.fx-pre button',el).forEach(b=>b.classList.remove('on'));draw()});
  $$('.fx-pre button',el).forEach(b=>b.onclick=()=>{Object.assign(v,F.presets[+b.dataset.p].v);$$('.fx-pre button',el).forEach(x=>x.classList.toggle('on',x===b));draw()});
  draw();
}

/* ---------- 3. Thanh trượt thông số trên sơ đồ ----------
   sliderTool(el,{title, modes:{k,opts:[[giá trị,nhãn]],val}, presets:[{n,v}], sliders:[{k,label,min,max,step,val,unit}],
     render:v=>({svg,html})}) */
function sliderTool(el,C){const v={};C.sliders.forEach(s=>v[s.k]=s.val);const MG=C.modes?(Array.isArray(C.modes)?C.modes:[C.modes]):[];MG.forEach(g=>v[g.k]=g.val);
  el.innerHTML=`<div class="tool-head">${C.title}${C.pill?`<span class="pill">${C.pill}</span>`:''}</div>
  ${C.intro?`<p class="muted" style="margin:0 0 8px;font-size:.9rem">${C.intro}</p>`:''}
  ${MG.map((g,gi)=>`${g.label?`<div class="st-ml">${g.label}</div>`:''}<div class="seg st-mode" data-gi="${gi}">${g.opts.map(o=>`<button data-m="${o[0]}">${o[1]}</button>`).join('')}</div>`).join('')}
  ${C.presets?`<div class="seg st-pre">${C.presets.map((p,i)=>`<button data-p="${i}">${p.n}</button>`).join('')}</div>`:''}
  <div class="st-vis p2scroll"></div><div class="p2scroll-hint">↔ Vuốt ngang để xem hết hình</div>
  <div class="st-sl">${C.sliders.map(s=>`<div class="field" data-k="${s.k}"><label>${s.label}: <output></output></label><input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.val}" aria-label="${esc(s.label)}"></div>`).join('')}</div>
  <div class="st-out"></div>`;
  const draw=()=>{C.sliders.forEach(s=>{const f=$(`.field[data-k="${s.k}"]`,el);$('output',f).textContent=nf(v[s.k],(String(s.step).split('.')[1]||'').length)+(s.unit?' '+s.unit:'');$('input',f).value=v[s.k]});
    $$('.st-mode',el).forEach(sg=>{const g=MG[+sg.dataset.gi];$$('button',sg).forEach(b=>b.classList.toggle('on',b.dataset.m===String(v[g.k])))});
    const r=C.render(v);$('.st-vis',el).innerHTML=r.svg;$('.st-out',el).innerHTML=r.html};
  $$('.st-sl input',el).forEach(i=>i.oninput=()=>{v[i.closest('.field').dataset.k]=+i.value;$$('.st-pre button',el).forEach(b=>b.classList.remove('on'));draw()});
  $$('.st-mode button',el).forEach(b=>b.onclick=()=>{v[MG[+b.parentNode.dataset.gi].k]=b.dataset.m;$$('.st-pre button',el).forEach(x=>x.classList.remove('on'));draw()});
  $$('.st-pre button',el).forEach(b=>b.onclick=()=>{Object.assign(v,C.presets[+b.dataset.p].v);$$('.st-pre button',el).forEach(x=>x.classList.toggle('on',x===b));draw()});
  draw();
}

/* ---------- 4. Câu hỏi sắp xếp trình tự ----------
   seqGame(key,[[bước, vì sao]],{hint,done,why:{chỉ số bước:'gợi ý khi chọn sai'}}) – trả về HTML; route() gọi initSeq */
const SEQ={};
function seqGame(key,steps,o={}){SEQ[key]={steps,o};return `<div class="seq" data-seq="${key}"><p class="muted" style="margin-top:0">${o.hint||'Bấm lần lượt các bước theo đúng thứ tự. Mỗi bước đúng sẽ hiện lý do.'}</p><div class="order-pool"></div><ol class="order-ans"></ol><div class="seq-msg"></div></div>`}
function initSeq(root){$$('.seq',root).forEach(el=>{const D=SEQ[el.dataset.seq];if(!D)return;let idx=0,err=0;
  const pool=$('.order-pool',el),ans=$('.order-ans',el),msg=$('.seq-msg',el);
  const start=()=>{idx=0;err=0;ans.innerHTML='';msg.innerHTML='';
    pool.innerHTML=shuffle(D.steps.map((s,i)=>i)).map(i=>`<button data-i="${i}">${D.steps[i][0]}</button>`).join('');
    $$('button',pool).forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
      if(i===idx){ans.insertAdjacentHTML('beforeend',`<li><div>${D.steps[i][0]}${D.steps[i][1]?`<small>${D.steps[i][1]}</small>`:''}</div></li>`);b.disabled=true;idx++;
        if(idx===D.steps.length){msg.innerHTML=`<div class="card ${err?'note':'insight'}" style="margin:10px 0 0">${err?`✅ Xong, với ${err} lần chọn sai. Đọc lại lý do từng bước ở trên nhé.`:'🎉 Chính xác tuyệt đối!'} ${D.o.done||''}<div class="btn-row" style="margin-top:8px"><button class="btn ghost seq-re">↻ Xếp lại</button></div></div>`;$('.seq-re',msg).onclick=start}}
      else{err++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast((D.o.why&&D.o.why[i])||'Chưa đến lượt bước này. Việc gì phải làm trước?')}})};
  start()})}

/* =====================================================================
   CHƯƠNG 10 – CÔNG CỤ: tấm pin mẫu, đường I-V, PR, kWp từ hoá đơn, bám tải
   ===================================================================== */
/* Tấm pin mẫu dùng xuyên suốt Phần 2 (thông số minh hoạ, gần với tấm TOPCon 590 Wp phổ biến) */
const MOD={P:590,Voc:52.0,Isc:14.30,Vmp:43.6,Imp:13.53,bV:-0.25,aI:0.045,gP:-0.29,noct:45,A:2.58};
/* Mô hình đường I-V rút gọn (4 điểm: Isc, Voc, Vmp, Imp) theo bức xạ G (W/m²) và nhiệt độ cell T (°C) */
function ivModel(G,T,M=MOD){const dT=T-25,lg=G>0?2.2*Math.log(G/1000):0,k=G/1000;
  const Isc=M.Isc*k*(1+M.aI/100*dT),Imp=M.Imp*k,Voc=M.Voc*(1+M.bV/100*dT)+lg,Vmp=M.Vmp*(1+M.gP/100*dT)+lg;
  const C2=(Vmp/Voc-1)/Math.log(1-Imp/Isc),C1=(1-Imp/Isc)*Math.exp(-Vmp/(C2*Voc));
  const I=V=>Math.max(0,Isc*(1-C1*(Math.exp(V/(C2*Voc))-1)));
  const pts=[];let best={P:0};for(let j=0;j<=160;j++){const V=Voc*j/160,i=I(V),P=V*i;pts.push([V,i,P]);if(P>best.P)best={V,I:i,P}}
  return{Isc,Voc,pts,mpp:best}}
function ivTool(el){
  const W=520,H=300,x0=48,x1=470,y0=262,y1=22,vx=V=>x0+(x1-x0)*V/60,iy=I=>y0-(y0-y1)*I/16,py=P=>y0-(y0-y1)*P/650;
  const path=(pts,f)=>'M'+pts.map(p=>vx(p[0]).toFixed(1)+' '+f(p).toFixed(1)).join(' L');
  const ref=ivModel(1000,25);
  sliderTool(el,{title:'📈 Đường cong I-V và P-V của tấm 590 Wp',pill:'Kéo nắng và nhiệt độ',
    intro:'Đường xanh: dòng điện theo điện áp (I-V). Đường cam: công suất (P-V). Đường mờ là điều kiện chuẩn STC để so sánh. Chấm tròn là điểm công suất cực đại mà MPPT của inverter luôn tìm.',
    presets:[{n:'STC (chuẩn)',v:{G:1000,T:25}},{n:'NMOT',v:{G:800,T:43}},{n:'Trưa hè, mái tôn',v:{G:950,T:68}},{n:'Sáng đông',v:{G:450,T:12}},{n:'Trời âm u',v:{G:150,T:18}}],
    sliders:[{k:'G',label:'☀️ Bức xạ (W/m²)',min:100,max:1200,step:50,val:1000},{k:'T',label:'🌡️ Nhiệt độ cell (°C)',min:0,max:80,step:1,val:25}],
    render:v=>{const m=ivModel(v.G,v.T),pct=m.mpp.P/ref.mpp.P*100;
      let s=`<svg viewBox="0 0 ${W} ${H}" class="p2svg" role="img" aria-label="Đường cong I-V và P-V"><rect class="bg" width="${W}" height="${H}" rx="12"/>`;
      for(let V=0;V<=60;V+=10)s+=`<line class="gr" x1="${vx(V)}" y1="${y1}" x2="${vx(V)}" y2="${y0}"/><text x="${vx(V)}" y="${y0+18}" font-size="14" text-anchor="middle">${V}</text>`;
      for(let I=0;I<=16;I+=4)s+=`<line class="gr" x1="${x0}" y1="${iy(I)}" x2="${x1}" y2="${iy(I)}"/><text class="ti" x="${x0-8}" y="${iy(I)+4}" font-size="14" text-anchor="end">${I}</text><text class="tp" x="${x1+6}" y="${iy(I)+4}" font-size="14">${Math.round(I/16*650)}</text>`;
      s+=`<line class="ax" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}"/><line class="ax" x1="${x0}" y1="${y1}" x2="${x0}" y2="${y0}"/>`;
      s+=`<text x="${(x0+x1)/2}" y="${H-4}" font-size="14" text-anchor="middle">Điện áp V (vôn)</text><text class="ti" x="${x0}" y="14" font-size="14">I (A)</text><text class="tp" x="${x1}" y="14" font-size="14" text-anchor="end">P (W)</text>`;
      s+=`<path d="${path(ref.pts,p=>iy(p[1]))}" fill="none" stroke="#1e74c4" stroke-width="1.5" stroke-dasharray="4 4" opacity=".35"/><path d="${path(ref.pts,p=>py(p[2]))}" fill="none" stroke="#f08c00" stroke-width="1.5" stroke-dasharray="4 4" opacity=".35"/>`;
      s+=`<path d="${path(m.pts,p=>iy(p[1]))}" fill="none" stroke="#1e74c4" stroke-width="3"/><path d="${path(m.pts,p=>py(p[2]))}" fill="none" stroke="#f08c00" stroke-width="3"/>`;
      const mx=vx(m.mpp.V),my=py(m.mpp.P);
      s+=`<line x1="${mx}" y1="${my}" x2="${mx}" y2="${y0}" stroke="#d98a00" stroke-dasharray="3 3"/><circle cx="${mx}" cy="${my}" r="7" fill="#f5b301" stroke="#fff" stroke-width="2"/><circle cx="${mx}" cy="${iy(m.mpp.I)}" r="5" fill="#1e74c4" stroke="#fff" stroke-width="2"/>`;
      s+=`<text class="tk" x="${Math.min(mx+10,x1-110)}" y="${my-10}" font-size="15" font-weight="700">MPP ${Math.round(m.mpp.P)} W</text></svg>`;
      const msg=v.T<=15?`❄️ <b>Trời lạnh:</b> Voc lên ${nf(m.Voc,1)} V, cao hơn STC. Đây là lúc điện áp chuỗi cao nhất trong năm, phải kiểm tra giới hạn điện áp của inverter (công cụ bên dưới).`
        :v.T>=55?`🔥 <b>Tấm nóng ${v.T}°C:</b> công suất giảm khoảng ${nf(Math.abs(MOD.gP)*(v.T-25),0)}% so với cùng mức nắng ở 25°C. Đây là lý do trưa hè app giám sát hiếm khi báo đủ 590 W/tấm.`
        :v.G<=300?`☁️ <b>Nắng yếu:</b> dòng điện giảm gần tỉ lệ với bức xạ, còn điện áp giảm ít. Ngày âm u mùa đông ở Thanh Hoá, cả dàn chỉ phát một phần nhỏ công suất.`
        :`Điện áp gần như không đổi khi nắng thay đổi, nhưng <b>dòng điện thì tỉ lệ thuận với nắng</b>. Nhiệt độ thì ngược lại: chủ yếu làm thay đổi <b>điện áp</b>.`;
      return{svg:s,html:`<div class="sum-grid"><div class="stat hl"><small>Công suất cực đại</small><b>${Math.round(m.mpp.P)} W</b><small>${nf(pct,0)}% so với STC</small></div><div class="stat"><small>Vmp / Imp</small><b>${nf(m.mpp.V,1)} V · ${nf(m.mpp.I,2)} A</b></div><div class="stat"><small>Voc (hở mạch)</small><b>${nf(m.Voc,1)} V</b></div><div class="stat"><small>Isc (ngắn mạch)</small><b>${nf(m.Isc,2)} A</b></div></div><div class="card note" style="margin:10px 0 0">${msg}</div>`}}});
}
/* Công thức Voc lúc lạnh nhất và kiểm tra giới hạn điện áp inverter */
function vocColdTool(el){formulaTool(el,{title:'Điện áp chuỗi lúc lạnh nhất',pill:'Kiểm tra trước khi chốt số tấm',
  intro:'Inverter mẫu (thông số minh hoạ): 1 pha 5 kW, điện áp DC tối đa 600 V. Vượt mức này dù chỉ vài vôn, inverter có thể hỏng và mất bảo hành.',
  fx:'V<sub>oc,max</sub> = N × V<sub>oc,STC</sub> × [1 + β × (T<sub>min</sub> − 25)] ≤ V<sub>DC,max</sub>',
  presets:[{n:'10 tấm, 5°C',v:{N:10,T:5}},{n:'Bẫy: 11 tấm, tính ở 25°C',v:{N:11,T:25}},{n:'11 tấm, 5°C',v:{N:11,T:5}},{n:'Vùng núi, 0°C',v:{N:10,T:0}}],
  vars:[{k:'N',sym:'N',name:'Số tấm nối tiếp trong chuỗi',min:1,max:16,step:1,val:10,unit:'tấm'},
   {k:'V',sym:'V<sub>oc,STC</sub>',name:'Voc của 1 tấm ở STC',ref:'Lấy trên datasheet',min:30,max:60,step:0.1,val:52,unit:'V'},
   {k:'b',sym:'β',name:'Hệ số nhiệt của Voc',ref:'Datasheet, thường −0,24 đến −0,30 %/°C',min:-0.4,max:-0.2,step:0.01,val:-0.25,unit:'%/°C'},
   {k:'T',sym:'T<sub>min</sub>',name:'Nhiệt độ thấp nhất lúc có nắng sớm',ref:'Đồng bằng Thanh Hoá: giả định 5°C; vùng núi thấp hơn',min:-5,max:25,step:1,val:5,unit:'°C'},
   {k:'L',sym:'V<sub>DC,max</sub>',name:'Điện áp DC tối đa của inverter',ref:'Datasheet inverter',min:500,max:1100,step:50,val:600,unit:'V'}],
  solve:v=>{const dT=v.T-25,f=1+v.b/100*dT,V1=v.V*f,Vs=V1*v.N,ok=Vs<=v.L,nmax=Math.floor(v.L/V1);
    return{steps:[['Chênh nhiệt độ so với 25°C','ΔT = '+v.T+' − 25 = '+dT+' °C'],['Hệ số hiệu chỉnh','1 + ('+nf(v.b,2)+'%) × ('+dT+') = '+nf(f,4)],['Voc 1 tấm lúc lạnh','V<sub>oc</sub> = '+nf(v.V,1)+' × '+nf(f,4)+' = '+nf(V1,2)+' V'],['Voc cả chuỗi','V<sub>oc,max</sub> = '+v.N+' × '+nf(V1,2)+' = '+nf(Vs,1)+' V'],['So với giới hạn inverter',nf(Vs,1)+(ok?' ≤ ':' > ')+v.L+' V']],
      out:[{l:'Voc 1 tấm lúc lạnh',v:nf(V1,1)+' V'},{l:'Voc cả chuỗi',v:nf(Vs,1)+' V',c:ok?'ok':'hl'},{l:'Số tấm tối đa mỗi chuỗi',v:nmax+' tấm'}],
      checks:[[ok,ok?`Đạt: còn dư ${nf(v.L-Vs,1)} V so với giới hạn.`:`Vượt giới hạn ${nf(Vs-v.L,1)} V. Giảm xuống tối đa ${nmax} tấm/chuỗi.`]],
      note:dT>=0?'⚠️ Tính ở 25°C trở lên là sai: sáng mùa đông trời lạnh và nắng sớm, điện áp tấm cao hơn số trên datasheet.':''}}})}

/* PR: các nguồn tổn hao → sản lượng */
function prTool(el){
  const L=[['th','🌡️ Nhiệt độ',9,'Nhiệt'],['bu','🧹 Bụi bẩn',4,'Bụi'],['bo','🌳 Bóng che',2,'Bóng'],['da','🔌 Dây DC/AC',2,'Dây'],['in','🔄 Inverter',3,'Inverter'],['kh','⚖️ Lệch tấm, khác',2,'Khác']];
  sliderTool(el,{title:'💧 Từ 100% xuống PR: các khoản tổn hao',pill:'Số liệu giả định',
    intro:'Mỗi thanh trượt là một khoản tổn hao (%). PR là phần còn lại sau khi trừ lần lượt từng khoản. Sản lượng tính cho hệ 5 kWp với giờ nắng đỉnh giả định của khoá học.',
    presets:[{n:'Hệ chuẩn',v:{th:9,bu:4,bo:2,da:2,in:3,kh:2}},{n:'Mái tôn nóng, ít vệ sinh',v:{th:11,bu:7,bo:2,da:2,in:3,kh:2}},{n:'Bị cây che chiều',v:{th:8,bu:3,bo:12,da:2,in:3,kh:3}}],
    sliders:L.map(x=>({k:x[0],label:x[1]+' (%)',min:0,max:15,step:0.5,val:x[2]})).concat([{k:'psh',label:'☀️ Giờ nắng đỉnh (giờ/ngày)',min:3,max:5,step:0.1,val:4.1}]),
    render:v=>{let cur=100;const bars=[['100%',100,0]];L.forEach(x=>{const lost=cur*v[x[0]]/100;bars.push([x[3],cur,lost]);cur-=lost});
      const pr=cur/100,W=520,H=250,bw=(W-60)/(bars.length+1),y=p=>210-p*1.7;
      let s=`<svg viewBox="0 0 ${W} ${H}" class="p2svg" role="img" aria-label="Biểu đồ tổn hao"><rect class="bg" width="${W}" height="${H}" rx="12"/>`;
      bars.forEach((b,i)=>{const x=40+i*bw;if(i===0)s+=`<rect x="${x}" y="${y(100)}" width="${bw-8}" height="${100*1.7}" fill="#9cc3ee"/>`;
        else s+=`<rect x="${x}" y="${y(b[1])}" width="${bw-8}" height="${Math.max(1,b[2]*1.7)}" fill="#f08c00"/><text class="tr" x="${x+(bw-8)/2}" y="${y(b[1])-5}" font-size="14" text-anchor="middle">−${nf(b[2],1)}</text>`;
        s+=`<text x="${x+(bw-8)/2}" y="232" font-size="14" text-anchor="middle">${b[0]}</text>`});
      const xp=40+bars.length*bw;s+=`<rect x="${xp}" y="${y(cur)}" width="${bw-8}" height="${cur*1.7}" fill="#16935f"/><text class="tg" x="${xp+(bw-8)/2}" y="${y(cur)-6}" font-size="16" font-weight="800" text-anchor="middle">PR ${nf(pr,2)}</text><text x="${xp+(bw-8)/2}" y="232" font-size="14" text-anchor="middle">Còn lại</text></svg>`;
      const day=5*v.psh*pr,yr=day*365;
      return{svg:s,html:`<div class="sum-grid"><div class="stat hl"><small>PR (hiệu suất hệ thống)</small><b>${nf(pr,2)}</b></div><div class="stat"><small>Hệ 5 kWp · mỗi ngày</small><b>${nf(day,1)} kWh</b></div><div class="stat"><small>Mỗi năm</small><b>${fmt(yr)} kWh</b></div><div class="stat"><small>Mỗi kWp mỗi năm</small><b>${fmt(yr/5)} kWh</b></div></div>
       ${pr<0.72?`<div class="fx-chk no">⛔ PR dưới 0,72: hệ đang mất quá nhiều. Xem lại bóng che, nhiệt (khe thoáng sau tấm) và lịch vệ sinh trước khi hứa sản lượng.</div>`:`<div class="fx-chk ok">✅ PR ${nf(pr,2)} nằm trong khoảng thường gặp của hệ áp mái (0,75–0,85).</div>`}`}}});
}
/* Tính công suất hệ từ hoá đơn */
const INV_SIZES=[2,3,3.6,4,5,6,8,10,12,15,20,25,30,40,50];
function sizeTool(el,extra){formulaTool(el,{title:'Tính công suất hệ từ hoá đơn',pill:'Giải từng bước',
  intro:'Nhập điện tiêu thụ trung bình tháng (tổng 12 tháng chia 12). Giờ nắng đỉnh và PR là giả định của khoá học cho Thanh Hoá; khi tư vấn thật, tra số cho đúng địa chỉ (Chương 3).',
  fx:'kWp = (E<sub>ngày</sub> × k<sub>bù</sub>) / (PSH × PR)   ·   P<sub>inverter</sub> ≈ kWp / (DC/AC)',
  presets:extra||[{n:'Anh Hùng: bám lưới nhỏ',v:{E:625,k:30,dcac:1.15}},{n:'Anh Hùng: hybrid có pin',v:{E:625,k:70,dcac:1.15}},{n:'Quán cơm dùng ngày',v:{E:900,k:75,dcac:1.2}}],
  vars:[{k:'E',sym:'E<sub>tháng</sub>',name:'Điện tiêu thụ trung bình tháng',ref:'Tổng kWh 12 tháng ÷ 12, lấy từ hoá đơn hoặc app điện lực',min:100,max:3000,step:5,val:625,unit:'kWh'},
   {k:'k',sym:'k<sub>bù</sub>',name:'Tỷ lệ muốn bù bằng điện mặt trời',ref:'Không vượt tỷ lệ dùng ban ngày, trừ khi có pin lưu trữ',min:10,max:100,step:5,val:70,unit:'%'},
   {k:'psh',sym:'PSH',name:'Giờ nắng đỉnh trung bình năm',ref:'Giả định khoá học cho Thanh Hoá: 4,1',min:3,max:5,step:0.1,val:4.1,unit:'h'},
   {k:'pr',sym:'PR',name:'Hiệu suất hệ thống',ref:'Thường 0,75–0,85',min:0.7,max:0.85,step:0.01,val:0.8},
   {k:'dcac',sym:'DC/AC',name:'Tỷ số tấm pin / inverter',ref:'Thường 1,0–1,3',min:1,max:1.4,step:0.05,val:1.15},
   {k:'pm',sym:'P<sub>tấm</sub>',name:'Công suất 1 tấm',min:400,max:720,step:5,val:590,unit:'Wp'}],
  solve:v=>{const Ed=v.E*12/365,Eb=Ed*v.k/100,kwp=Eb/(v.psh*v.pr),n=Math.max(1,Math.ceil(kwp*1000/v.pm)),real=n*v.pm/1000,inv=real/v.dcac;
    const cand=INV_SIZES.filter(s=>real/s>=0.95&&real/s<=1.35);const pick=(cand.length?cand:INV_SIZES).reduce((a,b)=>Math.abs(b-inv)<Math.abs(a-inv)?b:a);
    const area=v.pm/1000/0.225,roof=n*area*1.2,kg=n*area*13,yr=real*v.psh*v.pr*365;
    return{steps:[['Điện trung bình mỗi ngày','E<sub>ngày</sub> = '+fmt(v.E)+' × 12 / 365 = '+nf(Ed,1)+' kWh'],['Phần muốn bù bằng điện mặt trời',nf(Ed,1)+' × '+v.k+'% = '+nf(Eb,1)+' kWh/ngày'],['Công suất tấm pin cần','kWp = '+nf(Eb,1)+' / ('+nf(v.psh,1)+' × '+nf(v.pr,2)+') = '+nf(kwp,2)+' kWp'],['Số tấm (làm tròn lên)',nf(kwp*1000,0)+' / '+v.pm+' = '+nf(kwp*1000/v.pm,2)+' → '+n+' tấm = '+nf(real,2)+' kWp'],['Công suất inverter',nf(real,2)+' / '+nf(v.dcac,2)+' = '+nf(inv,2)+' kW → chọn cỡ có bán: '+nf(pick,pick%1?1:0)+' kW'],['Diện tích mái và tải trọng','≈ '+n+' × '+nf(area,2)+' m² × 1,2 = '+nf(roof,0)+' m² · ≈ '+fmt(kg)+' kg (tấm + khung)']],
      out:[{l:'Công suất tấm pin',v:nf(real,2)+' kWp',c:'hl'},{l:'Số tấm',v:n+' × '+v.pm+' Wp'},{l:'Inverter đề xuất',v:nf(pick,pick%1?1:0)+' kW'},{l:'Sản lượng ước tính',v:fmt(yr/12)+' kWh/tháng'}],
      checks:[[real/pick<=1.35&&real/pick>=0.95,`Tỷ số DC/AC thực tế: ${nf(real/pick,2)} ${real/pick>1.35?'(quá cao, cắt đỉnh nhiều)':real/pick<0.95?'(inverter quá to so với dàn tấm)':'(hợp lý)'}`],[v.k<=80,v.k<=80?'Tỷ lệ bù hợp lý nếu phần điện dùng ban ngày (hoặc có pin) tương ứng.':'Tỷ lệ bù trên 80%: chỉ hợp lý khi có pin lưu trữ đủ lớn. Phần dư bán lên lưới bị giới hạn tối đa 50% sản lượng và giá thấp (Chương 4).']],
      note:'Diện tích tính theo tấm hiệu suất khoảng 22,5%, cộng 20% lối đi và khoảng cách. Tải trọng giả định 13 kg/m² (tấm + khung); kiểm tra xà gồ khi khảo sát (Chương 6).'}}})}
/* Bám tải: điện chạy thế nào, CT đặt sai thì sao */
function zeroTool(el){
  sliderTool(el,{title:'⚖️ Mô phỏng hệ bám tải (zero export)',pill:'Kéo tải và nắng',
    intro:'Chọn chế độ, rồi kéo lượng điện nhà đang dùng và lượng điện tấm pin có thể phát. Mũi tên vàng là điện mặt trời, xanh dương là điện lưới.',
    modes:{k:'m',val:'zero',opts:[['zero','Bám tải, CT đúng'],['free','Không giới hạn'],['rev','CT lắp ngược chiều'],['inv','CT kẹp nhầm dây inverter']]},
    sliders:[{k:'load',label:'🏠 Nhà đang dùng (kW)',min:0,max:6,step:0.1,val:1.5},{k:'pv',label:'☀️ Tấm pin có thể phát (kW)',min:0,max:5,step:0.1,val:4}],
    render:v=>{let inv,msg,warn=false;
      if(v.m==='free'){inv=v.pv;msg='Không bật bám tải: inverter phát hết khả năng, phần thừa chạy ngược lên lưới. Chỉ được làm khi đã có thủ tục bán điện dư (Chương 4, Chương 7).'}
      else if(v.m==='zero'){inv=Math.min(v.pv,v.load);msg=v.pv>v.load?'CT đo thấy nhà sắp đẩy điện ra lưới, đồng hồ báo inverter giảm công suất xuống đúng bằng tải. Phần nắng còn lại bị bỏ (không phát).':'Tải lớn hơn nắng: inverter phát hết khả năng, phần thiếu lấy thêm từ lưới. Không có điện chạy ngược.'}
      else if(v.m==='rev'){inv=v.pv;warn=true;msg='⚠️ CT ngược chiều: khi nhà đẩy điện ra lưới, đồng hồ lại hiểu là đang lấy điện vào, nên ra lệnh inverter phát tối đa. Kết quả: vẫn phát ngược lên lưới dù đã “cài bám tải”.'}
      else{inv=Math.min(v.pv,0.05);warn=true;msg='⚠️ CT kẹp vào dây ra của inverter: đồng hồ chỉ thấy điện của inverter và coi tất cả là “đang đẩy ra lưới”, nên ép inverter về gần 0. Giữa trưa nắng mà app báo gần 0 W: kiểm tra vị trí CT đầu tiên.'}
      const grid=v.load-inv,imp=Math.max(0,grid),exp=Math.max(0,-grid),cut=Math.max(0,v.pv-inv);
      const W=520,H=270,ln=(d,on,c,w)=>on?FLOW(d,c,Math.max(2.5,Math.min(9,w*1.6))):`<path d="${d}" class="wire" stroke-width="2.5" fill="none"/>`;
      let s=`<svg viewBox="0 0 ${W} ${H}" class="p2svg" role="img" aria-label="Sơ đồ hệ bám tải"><rect class="bg" width="${W}" height="${H}" rx="12"/>`;
      s+=`${[0,1,2].map(i=>`<rect x="${14+i*31}" y="34" width="28" height="44" fill="#174a80" stroke="#9cc3ee"/>`).join('')}<text x="58" y="98" font-size="14" text-anchor="middle">Tấm pin</text>`;
      s+=ln('M108 56 L160 56',inv>0.01,'#f5b301',inv)+`<rect x="160" y="26" width="100" height="60" rx="9" fill="#56687a"/><text x="210" y="51" font-size="15" text-anchor="middle" style="fill:#fff">Inverter</text><text x="210" y="74" font-size="15" text-anchor="middle" style="fill:#ffd666" font-weight="700">${nf(inv,1)} kW</text>`;
      s+=ln('M260 56 L300 56 L300 124',inv>0.01,'#f5b301',inv)+`<circle cx="300" cy="134" r="7" style="fill:#56687a"/><text x="250" y="139" font-size="13" text-anchor="end">Điểm nối</text>`;
      s+=ln('M300 144 L300 180',v.load>0.01,'#16935f',v.load)+`<rect x="232" y="180" width="136" height="50" rx="9" class="box"/><text class="tk" x="300" y="201" font-size="14" text-anchor="middle">🏠 Tải trong nhà</text><text class="tg" x="300" y="221" font-size="15" font-weight="700" text-anchor="middle">${nf(v.load,1)} kW</text>`;
      s+=imp>0.01?ln('M490 134 L310 134',true,'#1e74c4',imp):exp>0.01?ln('M310 134 L490 134',true,'#f5b301',exp):`<path d="M310 134 L490 134" class="wire" stroke-width="2.5"/>`;
      const ctx=v.m==='inv'?282:392,cty=v.m==='inv'?56:134;
      s+=`<rect x="${ctx-12}" y="${cty-15}" width="24" height="30" rx="12" fill="none" stroke="#d14343" stroke-width="3.5"/><text class="tr" x="${ctx}" y="${cty-21}" font-size="14" font-weight="800" text-anchor="middle">CT${v.m==='rev'?' ⇦ ngược':''}</text>`;
      s+=`<path d="${v.m==='inv'?`M${ctx} ${cty+15} L${ctx} 106 L76 106 L76 214`:`M${ctx} ${cty+15} L${ctx} 252 L76 252 L76 244`}" stroke="#7a5af8" stroke-width="1.8" stroke-dasharray="4 3" fill="none"/>`;
      s+=`<rect x="16" y="214" width="120" height="30" rx="7" fill="#7a5af8"/><text x="76" y="234" font-size="13.5" text-anchor="middle" style="fill:#fff">Đồng hồ TM</text>`;
      s+=`<path d="M120 214 L120 128 L190 128 L190 86" stroke="#7a5af8" stroke-width="1.8" stroke-dasharray="2 3" fill="none"/><text x="126" y="160" font-size="13" style="fill:#7a5af8">RS485</text>`;
      s+=`<rect x="414" y="114" width="60" height="40" rx="7" class="box"/><text class="tk" x="444" y="139" font-size="12.5" text-anchor="middle">Công tơ</text><rect x="490" y="40" width="9" height="215" fill="#6b7785"/><text x="494" y="30" font-size="14" text-anchor="middle">Lưới</text>`;
      if(cut>0.01)s+=`<text class="tr" x="58" y="20" font-size="14" font-weight="700" text-anchor="middle">bỏ phí ${nf(cut,1)} kW</text>`;
      s+=`</svg>`;
      return{svg:s,html:`<div class="sum-grid"><div class="stat hl"><small>Inverter phát</small><b>${nf(inv,1)} kW</b></div><div class="stat"><small>Lấy từ lưới</small><b>${nf(imp,1)} kW</b></div><div class="stat ${exp>0.01?'':'ok'}"><small>Đẩy ngược ra lưới</small><b>${nf(exp,1)} kW</b></div><div class="stat"><small>Nắng bị bỏ phí</small><b>${nf(cut,1)} kW</b></div></div><div class="card ${warn?'warn':'note'}" style="margin:10px 0 0">${msg}</div>`}}});
}

/* Mô phỏng một ngày 24 giờ cho 4 loại hệ */
const YLD={he:4.4,tb:3.3,dong:2.1};
function daySim(sys,prof,kwp,batK,mua){const L=HOURLY[prof].v,cap=(sys==='hyb'||sys==='off')?batK*0.9:0,Y=YLD[mua];let soc=cap*0.5,day=null;
  for(let d=0;d<2;d++){const H=[];let T={load:0,pv:0,direct:0,dis:0,chg:0,imp:0,exp:0,cut:0,unmet:0};
    for(let h=0;h<24;h++){const pv=kwp*Y*PVW[h],load=L[h],direct=Math.min(pv,load);let sur=pv-direct,def=load-direct,chg=0,dis=0;
      if(cap){chg=Math.min(sur,(cap-soc)/0.95);soc+=chg*0.95;sur-=chg;dis=Math.min(def,soc);soc-=dis;def-=dis}
      const imp=(sys==='off')?0:def,unmet=(sys==='off')?def:0,exp=sys==='on'?sur:0,cut=sys==='on'?0:sur;
      H.push({pv,load,direct,dis,imp,unmet});T.load+=load;T.pv+=pv;T.direct+=direct;T.dis+=dis;T.chg+=chg;T.imp+=imp;T.exp+=exp;T.cut+=cut;T.unmet+=unmet}
    day={H,T}}
  return day}

const GANTT=[['ks','📐 Khảo sát, thiết kế','#1e74c4'],['ms','🚚 Mua sắm, vận chuyển','#7a5af8'],['ck','🔩 Thi công cơ khí','#f08c00'],['di','🔌 Thi công điện','#d98a00'],['dn','🧪 Đấu nối, thử nghiệm','#16935f'],['nt','📋 Nghiệm thu, bàn giao','#0b4f8a']];
function ganttTool(el){

    intro:'Mua sắm bắt đầu song song từ ngày thứ 3 của thiết kế; cơ khí chờ cả thiết kế xong và vật tư về; điện bắt đầu khi cơ khí xong một nửa; thử nghiệm chờ cơ khí và điện xong.',
