{id:'c12',num:12,part:2,icon:'🧭',title:'Giải pháp thiết kế: khả thi và chọn kiến trúc hệ',ctv:false,ready:true,
 desc:'Đánh giá một dự án có nên làm hay không theo 4 mặt kỹ thuật, tài chính, pháp lý, cộng đồng; so sánh 4 kiến trúc hệ qua mô phỏng 24 giờ; dựng giải pháp mẫu cho từng nhóm khách và giải bài tập hoá đơn 3,5 triệu.',
 badge:{ic:'🧭',name:'Kiến trúc sư giải pháp'},
 lessons:[
 {id:'c12l1',title:'Đánh giá khả thi trước khi thiết kế',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Thu đủ 7 thông tin đầu vào trước khi bắt tay thiết kế</li><li>Đánh giá dự án theo 4 mặt: kỹ thuật, tài chính, pháp lý, môi trường và cộng đồng</li><li>Biết khi nào phải <b>dừng lại</b> thay vì cố bán</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Một xưởng gỗ thuê nhà xưởng ở khu công nghiệp Lễ Môn muốn lắp 80 kWp trên mái. Mọi thứ đều đẹp: mái tôn mới, hướng Nam, tải ban ngày lớn. Chỉ có một chi tiết nhỏ trong lúc trò chuyện: <i>“Hợp đồng thuê xưởng của anh còn 3 năm nữa.”</i> Bạn có nhận ra vấn đề không?</p></section>
  <section class="card"><h2>📝 7 thông tin đầu vào</h2><div class="tbl-wrap"><table class="tbl"><tr><th>Thông tin</th><th>Vì sao cần</th></tr>
   <tr><td>Mục tiêu chính</td><td>Giảm tiền điện, có điện khi mất lưới, hay cả hai: quyết định có pin hay không</td></tr>
   <tr><td>Loại khách</td><td>Nhà ở, nhà nghỉ, văn phòng, nhà xưởng: quyết định biểu giá và nhịp dùng điện</td></tr>
   <tr><td>Điện tiêu thụ 12 tháng</td><td>Cơ sở để tính công suất (Chương 10)</td></tr>
   <tr><td>Tình trạng lưới</td><td>Ổn định hay hay mất điện, có quá áp cuối nguồn không</td></tr>
   <tr><td>Giờ dùng điện chính</td><td>Ngày, đêm hay cả ngày: quyết định tỷ lệ bù và pin</td></tr>
   <tr><td>Mái</td><td>Diện tích, hướng, độ nghiêng, loại mái, tuổi mái, kết cấu</td></tr>
   <tr><td>Bán điện dư</td><td>Có muốn, có được phép, có làm thủ tục không: quyết định có bám tải hay không</td></tr></table></div></section>
  <section class="card"><h2>🔭 Bốn mặt của một dự án</h2><div class="grid2">
   <div class="mini"><h4>⚙️ Kỹ thuật</h4><p>Bức xạ tại chỗ (tra số liệu nhiều năm, phần mềm mô phỏng), bóng che, hướng, kết cấu mái, điểm đấu nối, chất lượng lưới.</p></div>
   <div class="mini"><h4>💰 Tài chính</h4><p>Vốn đầu tư, chi phí vận hành, bảo dưỡng, thay inverter; dòng tiền, thời gian hoàn vốn; rủi ro giá điện và chính sách thay đổi.</p></div>
   <div class="mini"><h4>📜 Pháp lý</h4><p>Quyền sử dụng mái, hợp đồng thuê, thủ tục với điện lực theo quy định hiện hành, PCCC (Chương 7). Dự án lớn trên mặt đất còn cần đánh giá môi trường, đất đai: không thuộc phạm vi áp mái nhà dân.</p></div>
   <div class="mini"><h4>🏘️ Môi trường, cộng đồng</h4><p>Chói sáng sang nhà bên, ý kiến ban quản lý toà nhà, phương án thu gom tấm hỏng sau này, lợi ích giảm phát thải để kể với khách.</p></div></div></section>
  ${toolCard('','t-feas')}
  <section class="card"><h2>🎮 Đi tiếp hay dừng lại?</h2>${choiceGame([
   {t:'Xưởng gỗ thuê ở Lễ Môn: hợp đồng thuê còn 3 năm, thời gian hoàn vốn ước tính 5 năm.',a:1,fb:'Hoàn vốn dài hơn thời gian được dùng mái. Phải thương lượng gia hạn thuê, thoả thuận với chủ xưởng về việc chuyển giao hệ, hoặc làm hệ nhỏ có thể tháo đi.'},
   {t:'Nhà ở Hoằng Hoá, mái tôn mới 2 năm, hướng Nam, gia đình có người ở nhà ban ngày.',a:0,fb:'Mọi điều kiện đều xanh.'},
   {t:'Chuồng gà lợp fibro xi măng 15 năm tuổi, chủ trại muốn lắp lên mái chuồng cho tiện.',a:1,fb:'Mái fibro giòn, nguy hiểm khi đi lại, không chịu được tải. Đề xuất lắp trên mái nhà kho tôn hoặc khung trên mặt đất.'},
   {t:'Căn hộ tầng 5 chung cư, khách muốn lắp trên mái chung của toà nhà.',a:1,fb:'Mái là tài sản chung: cần ý kiến ban quản lý và cư dân trước khi tính chuyện kỹ thuật.'},
   {t:'Quán cà phê ở Sầm Sơn, mái bê tông, có bồn nước che một góc lúc 3 giờ chiều.',a:0,fb:'Bóng che nhỏ, cuối ngày: bố trí tránh góc đó là xong.'}],['🟢 Đi tiếp','🔴 Dừng, xử lý trước'])}</section>
  <section class="card insight"><h2>💡 Dám nói “chưa nên lắp”</h2><p style="margin:0">Từ chối đúng lúc là cách nhanh nhất để được tin tưởng. Với xưởng gỗ ở Lễ Môn: “Hệ này hoàn vốn khoảng 5 năm mà anh chỉ còn thuê 3 năm. Anh thử bàn với chủ xưởng gia hạn hợp đồng hoặc thoả thuận để lại hệ cho họ; xong việc đó em làm đề xuất ngay.”</p></section>
  `,init:el=>feasTool($('#t-feas',el)),
  quiz:[{q:'Thông tin nào quyết định có nên đưa pin lưu trữ vào giải pháp?',o:['Màu mái','Mục tiêu (có cần điện khi mất lưới) và giờ dùng điện chính','Số tầng nhà','Tên hãng tấm pin'],a:1,e:'Pin đáng tiền khi cần dự phòng hoặc dùng điện chủ yếu buổi tối.'},
   {q:'Hợp đồng thuê mái còn 3 năm, hoàn vốn 5 năm. Nên làm gì?',o:['Cứ lắp, tính sau','Dừng lại, thương lượng gia hạn thuê hoặc thoả thuận chuyển giao hệ trước','Giảm giá để hoàn vốn nhanh hơn','Không cần quan tâm'],a:1,e:'Quyền sử dụng mái lâu dài là điều kiện pháp lý và tài chính quan trọng.'},
   {q:'Đánh giá tác động môi trường, thủ tục đất đai chủ yếu áp dụng cho?',o:['Mọi hệ áp mái nhà dân','Dự án lớn trên mặt đất, trang trại điện mặt trời','Chỉ hệ hybrid','Không bao giờ cần'],a:1,e:'Hệ áp mái nhà dân tập trung vào quyền dùng mái, đấu nối, PCCC.'}]},
 {id:'c12l2',title:'Bốn kiến trúc hệ và điện chạy suốt 24 giờ',min:20,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>So sánh hòa lưới, bám tải, hybrid có pin và độc lập theo dòng điện từng giờ</li><li>Hiểu “tự cấp” và “tỷ lệ dùng điện mặt trời” khác nhau thế nào</li><li>Biết cách ghép thêm hybrid vào hệ hòa lưới có sẵn</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Anh Hưng ở Thiệu Hoá đã có hệ hòa lưới 5 kWp lắp từ 2020. Nay khu nhà anh hay mất điện vào mùa hè, anh hỏi: <i>“Có phải tháo hết inverter cũ để lắp hybrid không em?”</i></p></section>
  <section class="card"><h2>📊 Bảng so sánh tổng quát</h2><div class="tbl-wrap"><table class="tbl"><tr><th>Kiến trúc</th><th>Chi phí</th><th>Pin</th><th>Có điện khi mất lưới</th><th>Phát lên lưới</th><th>Hợp với</th></tr>
   <tr><td>Hòa lưới</td><td>Thấp</td><td>–</td><td>Không</td><td>Có (cần thủ tục)</td><td>Lưới ổn định, dùng ngày nhiều</td></tr>
   <tr><td>Hòa lưới bám tải</td><td>Thấp–vừa</td><td>–</td><td>Không</td><td>Không</td><td>Không được hoặc không muốn bán điện, tải ngày lớn</td></tr>
   <tr><td>Hybrid có pin (bám tải)</td><td>Cao</td><td>Có</td><td>Có, tải ưu tiên</td><td>Tuỳ cài đặt</td><td>Hay mất điện, dùng tối nhiều</td></tr>
   <tr><td>Độc lập</td><td>Rất cao</td><td>Bắt buộc</td><td>Có (không có lưới)</td><td>Không</td><td>Không có lưới điện</td></tr></table></div></section>
  ${toolCard('','t-day')}
  <section class="card"><h2>🔗 Ghép thêm hybrid vào hệ cũ (ghép phía AC)</h2><p>Không cần tháo hệ cũ. Có thể <b>giữ inverter hòa lưới cũ</b> và lắp thêm một inverter hybrid kèm pin, nối hai inverter ở phía AC: ban ngày inverter cũ vẫn phát, phần dư được hybrid sạc vào pin; khi mất lưới, hybrid tạo “lưới riêng” cho tải ưu tiên.</p>
   <div class="card warn" style="margin-bottom:0">⚠️ Cách ghép này phải đúng hướng dẫn của hãng hybrid (có chức năng ghép AC, đồng hồ đo đúng chỗ, giới hạn công suất inverter cũ so với hybrid). Đấu sai, khi mất lưới inverter cũ có thể sạc quá mức vào pin hoặc làm hybrid báo lỗi. Đây là việc của kỹ sư, tư vấn viên chỉ cần biết là <b>có giải pháp</b>.</div></section>
  <section class="card"><h2>🎮 Thử với công cụ rồi trả lời</h2>${tfGame([
   ['Gia đình đi làm, hệ hòa lưới 4 kWp không pin: phần lớn điện mặt trời phát ra lúc nhà vắng.',true,'Kéo công cụ: chọn “Hòa lưới”, “Gia đình đi làm”, thấy phần lớn đường cam nằm trên các cột.'],
   ['Với hybrid, pin càng to thì càng tiết kiệm, không có giới hạn.',false,'Pin quá to so với phần dư ban ngày sẽ không bao giờ sạc đầy, nhất là mùa đông: tốn tiền vô ích.'],
   ['Hệ độc lập phải thiết kế theo ngày mùa đông, không phải ngày trung bình.',true,'Chọn “Độc lập”, mùa “Đông”: thấy ngay phần thiếu điện màu đỏ.'],
   ['Quán cơm dùng điện ban ngày nhiều thì hòa lưới bám tải đã dùng được gần hết điện mặt trời.',true,'Tải ban ngày lớn “ăn” hết điện mặt trời, ít phải cắt bỏ.']])}</section>
  <section class="card"><h2>💬 Trả lời anh Hưng</h2><button class="btn ghost" data-reveal="r1221">👀 Xem câu trả lời mẫu</button>
  <div class="reveal" id="r1221">“Dạ không cần tháo anh ạ. Mình giữ inverter cũ, lắp thêm inverter hybrid và pin, ghép ở phía điện xoay chiều. Ban ngày dư điện thì sạc vào pin, tối và lúc mất điện thì pin cấp cho các thiết bị anh chọn. Em sẽ nhờ kỹ sư kiểm tra inverter cũ có ghép được với dòng hybrid nào, rồi báo anh phương án và chi phí.”</div></section>
  `,init:el=>dayFlowTool($('#t-day',el)),
  quiz:[{q:'“Tự cấp 60%” nghĩa là?',o:['Tấm pin phát 60% công suất','60% điện nhà dùng được cấp từ tấm pin và pin lưu trữ','Pin đầy 60%','Bán 60% lên lưới'],a:1,e:'Tự cấp tính theo phía tải: phần điện nhà dùng không phải mua từ lưới.'},
   {q:'Hệ hòa lưới cũ muốn thêm dự phòng mất điện. Giải pháp?',o:['Tháo hết, lắp mới','Lắp thêm inverter hybrid và pin, ghép phía AC theo hướng dẫn hãng','Chỉ thêm pin vào inverter cũ','Không làm được'],a:1,e:'Inverter hòa lưới thường không nối pin trực tiếp được; ghép AC với hybrid là cách phổ biến.'},
   {q:'Hệ độc lập nên thiết kế theo?',o:['Ngày hè nắng đẹp nhất','Ngày trung bình năm','Ngày mùa đông, thêm dự phòng','Ngẫu nhiên'],a:2,e:'Thiếu điện là mất điện, nên phải tính cho lúc khó khăn nhất.'}]},
 {id:'c12l3',title:'Giải pháp mẫu theo nhóm khách và bài tập hoá đơn 3,5 triệu',min:20,
  html:()=>{const k=kwhFromMoney(3.5e6),d=k*12/365,r=(b)=>{const kwp=d*b/(4.1*0.8),n=Math.ceil(kwp*1000/590);return [n,n*0.59]};const A=r(0.5),B=r(0.8);return `
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Nắm khung giải pháp cho 4 nhóm khách hay gặp</li><li>Ghép đúng nhu cầu với kiến trúc hệ</li><li>Tự giải bài tập: hoá đơn 3,5 triệu/tháng, mái tôn 200 m²</li></ul></section>
  <section class="card"><h2>🗂️ Bốn khung giải pháp</h2><div class="grid2">
   <div class="mini"><h4>🏠 Hộ gia đình 500–1.500 kWh/tháng</h4><p>Hòa lưới (hoặc bám tải) 4–8 kWp nếu có người ở nhà ban ngày; hybrid 4–6 kWp + pin 10 kWh nếu dùng tối nhiều. Inverter 1 pha.</p></div>
   <div class="mini"><h4>🏭 Nhà xưởng, doanh nghiệp 10.000–50.000 kWh/tháng</h4><p>Hòa lưới bám tải 30–150 kWp, inverter 3 pha, chống phát ngược nếu không bán điện. Tải ngày lớn nên hoàn vốn thường nhanh nhất.</p></div>
   <div class="mini"><h4>🌾 Trang trại, chòi canh không có lưới</h4><p>Độc lập 2–10 kWp + pin 5–20 kWh, cho đèn, bơm, camera, tủ lạnh nhỏ. Thiết kế theo ngày mùa đông, cân nhắc máy phát dự phòng.</p></div>
   <div class="mini"><h4>🏨 Biệt thự, nhà hàng, phòng khám cần dự phòng</h4><p>Hybrid 5–15 kWp + pin 10–30 kWh, tách tủ tải ưu tiên. Giá trị chính là “không bao giờ tắt đèn”.</p></div></div>
   <small class="src">Khoảng công suất mang tính tham khảo. Chi phí, sản lượng, hoàn vốn luôn tính lại bằng số liệu thật của khách và bảng giá hiện hành (Chương 8).</small></section>
  <section class="card">${choiceGame([
   {t:'Nhà hàng hải sản ở Sầm Sơn, điện lưới chập chờn mùa hè, có 3 tủ đông hàng.',a:2,fb:'Hybrid có pin, tủ đông nối cổng dự phòng.'},
   {t:'Xưởng cơ khí 3 pha ở Bỉm Sơn, chạy 2 ca ban ngày, không muốn làm thủ tục bán điện.',a:1,fb:'Hòa lưới bám tải, inverter 3 pha.'},
   {t:'Gia đình ở Hậu Lộc, có ông bà ở nhà cả ngày, lưới ổn định.',a:0,fb:'Hòa lưới (thêm bám tải nếu chưa làm thủ tục bán điện dư).'},
   {t:'Trạm bơm tưới ở bãi bồi ven sông Mã, không có đường dây điện.',a:3,fb:'Độc lập; máy bơm chạy ban ngày nên có thể giảm pin bằng cách bơm theo nắng.'}],['Hòa lưới','Bám tải','Hybrid','Độc lập'])}</section>
  <section class="card story"><h2>📖 Bài tập</h2>${persona('🧑‍💼','Khách ở phường Quảng Thắng, TP Thanh Hoá','Tiền điện khoảng 3,5 triệu/tháng · mái tôn 200 m²')}<p style="margin:0">Theo biểu giá sinh hoạt, 3,5 triệu tương đương khoảng <b>${fmt(k)} kWh/tháng</b> (≈ ${nf(d,1)} kWh/ngày). Đề bài chưa cho biết giờ dùng điện: hãy thử hai giả thiết bằng công cụ bên dưới, rồi xem lời giải.</p></section>
  ${toolCard('','t-size12')}
  <section class="card"><h2>✅ Lời giải gợi ý</h2><button class="btn ghost" data-reveal="r1231">👀 Xem lời giải</button>
   <div class="reveal" id="r1231"><div class="grid2"><div class="mini"><h4>Giả thiết 1: hộ gia đình, dùng ngày khoảng 50%</h4><p>Bù 50% → khoảng <b>${A[0]} tấm 590 Wp ≈ ${nf(A[1],1)} kWp</b>, hòa lưới hoặc bám tải, inverter cỡ ${A[1]>6?'6':'5'} kW 1 pha. Nếu tối dùng nhiều điều hoà: chuyển sang hybrid và thêm pin.</p></div>
    <div class="mini"><h4>Giả thiết 2: kinh doanh ban ngày, dùng ngày khoảng 80%</h4><p>Bù 80% → khoảng <b>${B[0]} tấm ≈ ${nf(B[1],1)} kWp</b>, bám tải, inverter khoảng ${nf(B[1]/1.2,0)} kW (1 pha hoặc 3 pha theo công tơ).</p></div></div>
    <p style="margin:10px 0 0"><b>Mái 200 m²</b> dư sức: mỗi tấm cần khoảng 3,1 m² kể cả lối đi, ${B[0]} tấm chỉ khoảng ${nf(B[0]*3.1,0)} m². Không lắp hết mái chỉ vì “còn chỗ”: phần dư bán được tối đa 50% sản lượng và giá thấp. Bước tiếp theo: xin hoá đơn 12 tháng để thay giả thiết bằng số thật.</p></div></section>
  `},init:el=>sizeTool($('#t-size12',el),[{n:'Giả thiết 1: dùng ngày 50%',v:{E:kwhFromMoney(3.5e6),k:50,dcac:1.15}},{n:'Giả thiết 2: dùng ngày 80%',v:{E:kwhFromMoney(3.5e6),k:80,dcac:1.2}}]),
  quiz:[{q:'Xưởng 3 pha, chạy ban ngày, không muốn bán điện. Kiến trúc phù hợp?',o:['Độc lập','Hòa lưới bám tải, inverter 3 pha','Hybrid 1 pha','Không lắp được'],a:1,e:'Tải ngày lớn, không bán điện: bám tải là đủ, không cần pin.'},
   {q:'Mái còn rộng, có nên lắp phủ kín mái để “tận dụng”?',o:['Có, càng to càng lời','Không: chọn theo nhu cầu; phần dư bán bị giới hạn và giá thấp','Chỉ khi mái tôn','Chỉ khi mái bê tông'],a:1,e:'Công suất theo nhu cầu dùng, không theo diện tích mái.'},
   {q:'Đề bài chỉ cho số tiền điện, chưa biết giờ dùng điện. Người tư vấn nên?',o:['Đoán đại','Thử các giả thiết, rồi xin hoá đơn 12 tháng và hỏi thói quen để chốt','Chọn hệ lớn nhất','Từ chối khách'],a:1,e:'Giả thiết giúp nói chuyện với khách, nhưng chốt thiết kế phải bằng số thật.'}]}
 ],
 cards:[['7 thông tin đầu vào trước khi thiết kế?','Mục tiêu · loại khách · kWh 12 tháng · tình trạng lưới · giờ dùng điện · mái · có bán điện không.'],
  ['4 mặt đánh giá khả thi?','Kỹ thuật · tài chính · pháp lý · môi trường và cộng đồng.'],
  ['Khi nào phải dừng lại?','Còn điểm đỏ: mái yếu/fibro, không có quyền dùng mái đủ lâu, mái chung chưa được đồng ý, hoàn vốn dài hơn thời gian sử dụng.'],
  ['Tự cấp khác tỷ lệ dùng điện mặt trời?','Tự cấp: % điện nhà dùng không phải mua lưới. Tỷ lệ dùng: % điện tấm pin phát ra được dùng (trực tiếp hoặc qua pin).'],
  ['Thêm dự phòng cho hệ hòa lưới cũ?','Giữ inverter cũ, lắp thêm hybrid + pin, ghép phía AC theo hướng dẫn hãng.'],
  ['4 khung giải pháp theo nhóm khách?','Hộ gia đình: hòa lưới/hybrid 4–8 kWp · xưởng: bám tải 3 pha · không có lưới: độc lập · cần dự phòng: hybrid + tủ tải ưu tiên.']],
 field:{title:'Giải pháp cho khách thật',tasks:['Chấm “đèn giao thông khả thi” cho 2 khách đang tư vấn; ghi lại điểm vàng, đỏ và cách xử lý','Dùng mô phỏng 24 giờ với kiểu dùng điện gần giống một khách thật; so sánh 3 kiến trúc và chọn một','Hỏi kỹ sư đối tác: dòng hybrid nào ghép được với inverter hòa lưới đang có trên thị trường Thanh Hoá']}

{id:'c13',num:13,part:2,icon:'📐',title:'Tính toán thiết kế: bố trí, tủ điện, dây, pin, hồ sơ',ctv:false,ready:true,
 desc:'Bố trí tấm trên mặt mái và chia chuỗi cho hệ 100 kWp, chọn thiết bị bảo vệ và tiết diện dây, tính pin lưu trữ, bóc khối lượng vật tư và hoàn thiện bộ hồ sơ thiết kế.',
 badge:{ic:'📐',name:'Kỹ sư thiết kế'},
 lessons:[
 {id:'c13l1',title:'Bố trí tấm pin trên mái và chia chuỗi',min:20,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Tính được mái chứa tối đa bao nhiêu tấm, theo hướng đặt dọc hoặc ngang</li><li>Biết các khoảng cách bắt buộc: mép mái, lối đi bảo trì, khe giữa tấm</li><li>Chia chuỗi cho một hệ 100 kWp với inverter 3 pha</li></ul></section>
  <section class="card story"><h2>📖 Đề bài</h2><p style="margin:0">Thiết kế hệ hòa lưới khoảng <b>100 kWp</b> trên mái tôn nhà xưởng ở khu công nghiệp Hoàng Long, mặt mái khảo sát <b>20 m × 50 m</b>, dùng inverter 3 pha 100–110 kW (thông số minh hoạ: điện áp DC tối đa 1.100 V, MPPT 200–1.000 V).</p></section>
  <section class="card"><h2>📏 Năm nguyên tắc bố trí</h2><ol class="clean">
   <li><b>Cách mép mái</b> khoảng 0,5–1,5 m: giảm lực gió hút ở mép, chừa chỗ đi lại, tránh máng nước.</li>
   <li><b>Lối đi bảo trì</b> khoảng 0,6 m sau mỗi 2–4 hàng, để vệ sinh và thay tấm mà không giẫm lên tấm.</li>
   <li><b>Ray bắt vuông góc qua xà gồ</b>: bước xà gồ quyết định đặt tấm dọc hay ngang.</li>
   <li><b>Tránh bóng che</b> của ống thông gió, quạt hút mái, tường chắn mái, giếng trời; một tấm bị che kéo cả chuỗi xuống.</li>
   <li><b>Gom chuỗi theo mặt mái</b>: tấm cùng hướng, cùng độ nghiêng, gần nhau thì vào cùng chuỗi, cùng MPPT.</li></ol></section>
  ${toolCard('','t-roof')}
  <section class="card"><h2>🔗 Chia chuỗi cho hệ 100 kWp</h2><p>Mái 20 × 50 m chứa được nhiều hơn 100 kWp (kéo bộ số “Xưởng 50 × 20 m” để xem), nên chỉ dùng khoảng <b>170 tấm 590 Wp ≈ 100,3 kWp</b>, ưu tiên vùng mái ít bóng che nhất.</p>
   <div class="tbl-wrap"><table class="tbl"><tr><th>Kiểm tra</th><th>Phép tính (tấm mẫu 590 Wp)</th><th>Kết quả</th></tr>
    <tr><td>Số tấm tối đa mỗi chuỗi</td><td>1.100 ÷ 54,6 V (Voc lúc 5°C)</td><td>20 tấm</td></tr>
    <tr><td>Số tấm tối thiểu mỗi chuỗi</td><td>200 ÷ 38,0 V (Vmp lúc cell 70°C)</td><td>6 tấm</td></tr>
    <tr><td>Chọn</td><td>17 tấm/chuỗi: Voc lạnh ≈ 928 V, Vmp nóng ≈ 645 V</td><td>10 chuỗi × 17 = 170 tấm</td></tr>
    <tr><td>Dòng mỗi MPPT</td><td>2 chuỗi × 14,3 A = 28,6 A (inverter cho phép 2 chuỗi/MPPT)</td><td>5 MPPT</td></tr>
    <tr><td>Tỷ số DC/AC</td><td>100,3 kWp ÷ 100 kW</td><td>≈ 1,0</td></tr></table></div>
   <p class="muted" style="font-size:.88rem;margin-bottom:0">Với inverter 110 kW thì DC/AC chỉ ≈ 0,91, inverter hơi thừa. Nếu mái và nhu cầu cho phép, có thể nâng lên khoảng 120 kWp; nếu không, chọn inverter 100 kW cho kinh tế hơn.</p></section>
  <section class="card"><h2>🎮 Đúng hay sai?</h2>${tfGame([
   ['Mái còn trống thì nên lắp sát mép mái cho được nhiều tấm.',false,'Mép mái chịu gió hút mạnh nhất và là lối đi an toàn. Luôn chừa khoảng cách.'],
   ['Hai mái hướng Đông và Tây có thể vào chung một chuỗi nếu đủ số tấm.',false,'Khác hướng thì nắng khác nhau, phải tách chuỗi và vào MPPT khác nhau.'],
   ['Ray phải bắt vuông góc qua xà gồ, không bắt dọc theo một xà gồ.',true,'Ray tựa lên nhiều xà gồ thì tải trọng chia đều, chắc chắn hơn.'],
   ['Lối đi bảo trì giúp vệ sinh, thay tấm mà không phải giẫm lên tấm.',true,'Giẫm lên tấm gây nứt vi mô cell.']])}</section>
  `,init:el=>roofLayoutTool($('#t-roof',el)),
  quiz:[{q:'Inverter 1.100 V, Voc lúc lạnh 54,6 V/tấm. Tối đa mấy tấm mỗi chuỗi?',o:['18','20','21','22'],a:1,e:'1.100 ÷ 54,6 ≈ 20,1 → 20 tấm.'},
   {q:'Vì sao chừa khoảng cách tới mép mái?',o:['Cho đẹp','Mép mái chịu gió hút mạnh, cần lối đi an toàn và tránh máng nước','Để tiết kiệm tấm','Không cần'],a:1,e:'Cả an toàn kết cấu lẫn an toàn người.'},
   {q:'Đặt tấm dọc hay ngang phụ thuộc chủ yếu vào?',o:['Màu tấm','Bước xà gồ và hướng ray','Hãng inverter','Giá điện'],a:1,e:'Ray phải bắt qua xà gồ; từ đó suy ra hướng đặt tấm.'}]},
 {id:'c13l2',title:'Tủ điện, thiết bị bảo vệ và tiết diện dây',min:20,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Đọc sơ đồ khối tủ điện hệ hòa lưới và hệ hybrid</li><li>Chọn cầu chì chuỗi, cầu dao DC, aptomat AC theo dòng điện</li><li>Kiểm tra sụt áp để chọn tiết diện dây DC và AC</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Một đội thợ lấy aptomat AC loại thường lắp làm cầu dao phía DC “vì cùng là aptomat 32 A”. Ba tháng sau, khi ngắt để vệ sinh tấm giữa trưa, cầu dao phát hồ quang và cháy xém tủ. Dòng một chiều không có lúc “về 0” như dòng xoay chiều, nên hồ quang DC rất khó dập.</p></section>
  <section class="card"><h2>🗄️ Tủ điện hệ hòa lưới <span class="pill">Bấm vào các số</span></h2>${cabinetSvg('hl')}${hsPanel('tuhl')}</section>
  <section class="card"><h2>🗄️ Tủ điện hệ hybrid <span class="pill">Bấm vào các số</span></h2>${cabinetSvg('hy')}${hsPanel('tuhy')}</section>
  ${toolCard('','t-prot')}
  ${toolCard('','t-cab')}
  <section class="card note"><h2>🧵 Chọn loại dây</h2><div class="grid2">
   <div class="mini"><h4>Phía DC</h4><p>Cáp chuyên dụng cho điện mặt trời (lõi đồng mạ thiếc, vỏ chịu tia UV, chịu nhiệt), thường 4 mm² hoặc 6 mm²; dây đỏ cho cực dương, đen cho cực âm; đi trong ống hoặc máng có nắp.</p></div>
   <div class="mini"><h4>Phía AC</h4><p>Cáp đồng bọc cách điện phù hợp cách lắp (đi nổi, đi ngầm có giáp…), tiết diện theo dòng ra inverter và sụt áp. Dây tiếp địa màu vàng xanh.</p></div></div></section>
  `,init:el=>{protectTool($('#t-prot',el));cableTool($('#t-cab',el))},
  quiz:[{q:'Vì sao không dùng aptomat AC làm cầu dao phía DC?',o:['Vì khác màu','Hồ quang DC khó dập, cần thiết bị thiết kế cho DC và đúng cấp điện áp','Vì đắt hơn','Không sao cả'],a:1,e:'Dòng DC không đi qua điểm 0 nên hồ quang kéo dài, dễ cháy.'},
   {q:'Khi nào cần cầu chì cho từng chuỗi?',o:['Luôn luôn','Khi có từ 3 chuỗi song song trở lên vào một đầu vào','Không bao giờ','Chỉ khi trời mưa'],a:1,e:'Khi đó dòng ngược dồn từ các chuỗi khác có thể vượt khả năng chịu của tấm.'},
   {q:'Dây DC 30 m, 13,5 A, 4 mm², chuỗi 436 V. Sụt áp khoảng?',o:['0,2%','0,8%','5%','10%'],a:1,e:'2 × 30 × 13,5 × 0,0175 / 4 ≈ 3,5 V; 3,5 / 436 ≈ 0,8%.'}]},
 {id:'c13l3',title:'Tính dung lượng pin lưu trữ',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Tính dung lượng pin theo Ah và kWh</li><li>Hiểu vai trò của điện áp hệ, độ xả sâu, hiệu suất</li><li>Ước thời gian sạc đầy và kiểm tra có sạc kịp trong ngày không</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Khách đọc trên mạng “pin 100 Ah” và “pin 5 kWh” rồi hỏi: <i>“Cái nào to hơn hả em?”</i> Câu trả lời: chưa so được, vì thiếu điện áp. 100 Ah ở 12 V chỉ 1,2 kWh; 100 Ah ở 51,2 V là 5,1 kWh.</p></section>
  <section class="card"><h2>🔢 Ah và kWh</h2><div class="fx">kWh = Ah × V / 1.000</div><div class="grid3"><div class="mini"><h4>12 V × 100 Ah</h4><p>= 1,2 kWh (ắc quy chì xe máy, hệ nhỏ)</p></div><div class="mini"><h4>24 V × 200 Ah</h4><p>= 4,8 kWh</p></div><div class="mini"><h4>51,2 V × 100 Ah</h4><p>= 5,12 kWh (mô-đun lithium phổ biến)</p></div></div>
   <p class="muted" style="font-size:.88rem;margin-bottom:0">Khi tư vấn, luôn nói bằng <b>kWh</b>: khách so được với số điện trên hoá đơn.</p></section>
  ${toolCard('','t-bs')}
  <section class="card"><h2>🔌 Ghép pin: nối tiếp và song song</h2><div class="grid2"><div class="mini"><h4>Nối tiếp</h4><p>Cộng điện áp (4 bình 12 V → 48 V), dung lượng Ah giữ nguyên. Các bình phải cùng loại, cùng tuổi.</p></div><div class="mini"><h4>Song song</h4><p>Cộng Ah, điện áp giữ nguyên. Pin lithium mô-đun thường ghép song song qua thanh cái và cáp cùng chiều dài, theo hướng dẫn hãng; BMS các mô-đun phải liên kết với nhau.</p></div></div></section>
  <section class="card warn"><h2>⚠️ Ba điều hay bị quên</h2><ul class="clean" style="margin:0"><li><b>Dòng sạc/xả tối đa</b> của pin phải đủ cho công suất inverter (pin 48 V cấp 5 kW cần khoảng 100 A).</li><li><b>Nhiệt độ</b>: pin lithium đặt nơi thoáng mát, tránh nắng; nóng làm pin già nhanh.</li><li><b>Mùa đông</b>: tấm pin phát ít, pin lớn có thể không bao giờ sạc đầy. Kiểm tra bằng mô phỏng 24 giờ (Chương 12).</li></ul></section>
  `,init:el=>batSizeTool($('#t-bs',el)),
  quiz:[{q:'Pin 51,2 V, 100 Ah tương đương bao nhiêu kWh?',o:['0,5 kWh','5,12 kWh','51,2 kWh','100 kWh'],a:1,e:'51,2 × 100 / 1.000 = 5,12 kWh.'},
   {q:'Cần lưu 5 kWh, hệ 48 V, DoD 0,9, hiệu suất 0,9. Dung lượng tối thiểu?',o:['≈ 104 Ah','≈ 129 Ah','≈ 250 Ah','≈ 48 Ah'],a:1,e:'5.000 ÷ (48 × 0,9 × 0,9) ≈ 129 Ah, nên chọn thêm 10–20%.'},
   {q:'Ắc quy 12 V 100 Ah, sạc 10 A. Thời gian sạc đầy từ cạn khoảng?',o:['10 giờ','12 giờ','1 giờ','100 giờ'],a:1,e:'1,2 × 100 ÷ 10 = 12 giờ.'}]},
 {id:'c13l4',title:'Bóc khối lượng, mô phỏng sản lượng và bộ hồ sơ thiết kế',min:20,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Biết bộ hồ sơ thiết kế gồm những bản vẽ và tài liệu nào</li><li>Bóc khối lượng vật tư phần mái để lập dự toán</li><li>Hiểu phần mềm mô phỏng sản lượng cho ra những gì</li></ul></section>
  <section class="card story"><h2>📖 Bài tập</h2><p style="margin:0">Thiết kế hệ hòa lưới bám tải cho một văn phòng ở TP Thanh Hoá, mặt mái <b>27 m × 12 m</b>: bố trí, bóc khối lượng và mô phỏng sản lượng. Dùng công cụ bố trí mái (Bài 13.1, bộ số “Văn phòng”) rồi công cụ bóc khối lượng dưới đây.</p></section>
  <section class="card"><h2>📁 Bộ hồ sơ thiết kế</h2><div class="grid2"><div class="mini"><h4>Bản vẽ</h4><p>① Mặt bằng bố trí tấm tổng thể · ② Mặt bằng bố trí tấm chi tiết, đánh số chuỗi · ③ Vị trí và chi tiết lắp inverter, tủ điện · ④ Chi tiết lắp ray, kẹp, chân trên mái điển hình · ⑤ Sơ đồ đấu nối chuỗi và sơ đồ một sợi · ⑥ Chống sét, tiếp địa.</p></div>
   <div class="mini"><h4>Tài liệu kèm</h4><p>Thuyết minh kỹ thuật (tiêu chuẩn áp dụng, công suất, phương án đi dây, tính toán), bảng khối lượng, dự toán, báo cáo mô phỏng sản lượng, datasheet thiết bị.</p></div></div></section>
  <section class="card"><h2>🖥️ Vẽ bố trí trên phần mềm CAD: quy ước tối thiểu</h2><ul class="clean"><li>Tách lớp riêng cho từng loại đối tượng: kiến trúc (tường, mái, cột), tấm pin, ray, kẹp biên, kẹp giữa, máng cáp và lối đi, cáp DC, cáp AC, số thứ tự tấm.</li><li>Tấm, ray, kẹp vẽ thành khối dùng lại để đếm số lượng tự động.</li><li><b>Không co giãn (scale) mặt bằng</b> sau khi đã vẽ: mọi kích thước giữ đúng 1:1 theo đơn vị đo, nếu không bố trí và khối lượng sẽ sai.</li></ul></section>
  ${toolCard('','t-boq')}
  <section class="card"><h2>📈 Phần mềm mô phỏng sản lượng</h2><p>Các phần mềm chuyên dụng (ví dụ PVsyst) hoặc công cụ miễn phí trên mạng (ví dụ PVGIS, Global Solar Atlas ở Chương 3) dùng dữ liệu bức xạ nhiều năm tại đúng toạ độ, mô hình tấm và inverter thật, bóng che và tổn hao để cho ra:</p>
   <div class="grid3"><div class="mini"><h4>Sản lượng từng tháng</h4><p>Đưa vào đề xuất, thay cho số giả định.</p></div><div class="mini"><h4>PR và sản lượng riêng</h4><p>kWh/kWp/năm, so sánh được giữa các phương án.</p></div><div class="mini"><h4>Sơ đồ tổn hao</h4><p>Biết mất bao nhiêu do nhiệt, bóng che, dây… để tối ưu thiết kế.</p></div></div></section>
  <section class="card"><h2>🧩 Trình tự lập hồ sơ thiết kế</h2>${seqGame('c13doc',[
   ['Nhận phiếu khảo sát, ảnh, kích thước mái, hoá đơn','Đầu vào từ tư vấn viên và đội khảo sát.'],
   ['Vẽ mặt bằng mái đúng tỷ lệ, đánh dấu vật cản','Lớp kiến trúc, không co giãn.'],
   ['Bố trí tấm, chia chuỗi, chọn inverter','Bài 13.1 và Chương 11.'],
   ['Chạy mô phỏng sản lượng, chỉnh bố trí nếu tổn hao lớn','Lặp lại đến khi đạt.'],
   ['Vẽ sơ đồ một sợi, chọn thiết bị bảo vệ, tiết diện dây','Bài 13.2.'],
   ['Bóc khối lượng, lập dự toán','Đếm theo khối trên bản vẽ.'],
   ['Viết thuyết minh, xuất bộ hồ sơ để duyệt và thi công','Danh mục bản vẽ đầy đủ.']],{done:''})}</section>
  `,init:el=>boqTool($('#t-boq',el)),
  quiz:[{q:'Vì sao không được co giãn (scale) mặt bằng sau khi vẽ?',o:['Vì phần mềm cấm','Vì kích thước sai thì bố trí và khối lượng đều sai','Vì file nặng','Không sao'],a:1,e:'Mọi phép đếm và đo dựa trên kích thước thật 1:1.'},
   {q:'Một hàng 10 tấm đặt dọc dùng bao nhiêu kẹp giữa?',o:['10','18','20','4'],a:1,e:'2 ray × (10 − 1) khe = 18 kẹp giữa; thêm 4 kẹp biên.'},
   {q:'Kết quả nào của phần mềm mô phỏng nên đưa vào đề xuất cho khách?',o:['Màu tấm','Sản lượng từng tháng tại đúng địa chỉ','Tên kỹ sư','Số lớp CAD'],a:1,e:'Thay số giả định bằng số mô phỏng cho từng tháng, có cả mùa đông.'}]}
 ],
 cards:[['5 nguyên tắc bố trí tấm trên mái?','Cách mép mái · lối đi bảo trì · ray vuông góc xà gồ · tránh bóng che · gom chuỗi theo mặt mái.'],
  ['Số tấm tối đa/tối thiểu mỗi chuỗi?','Tối đa = V DC max ÷ Voc lúc lạnh (làm tròn xuống); tối thiểu = V MPPT min ÷ Vmp lúc nóng (làm tròn lên).'],
  ['Hệ số chọn cầu chì chuỗi?','≥ 1,56 × Isc (1,25 × 1,25), loại gPV; cần khi có từ 3 chuỗi song song.'],
  ['Công thức sụt áp dây DC/AC 1 pha?','ΔU% = 2 × L × I × ρ / (S × U) × 100, ρ đồng ≈ 0,0175.'],
  ['Đổi Ah sang kWh?','kWh = Ah × V / 1.000.'],
  ['Dung lượng pin cần?','Ah = E (Wh) × số ngày / (V × DoD × η), cộng 10–20% dự phòng.'],
  ['Bộ bản vẽ thiết kế gồm?','Mặt bằng tổng thể · bố trí chi tiết · inverter, tủ · chi tiết lắp ray · đấu nối chuỗi, sơ đồ một sợi · chống sét, tiếp địa.']],
 field:{title:'Thiết kế thử một công trình',tasks:['Đo (hoặc lấy bản vẽ) một mái thật; dùng công cụ bố trí để tính số tấm tối đa và so với phương án đối tác đã làm','Bóc khối lượng phần mái cho công trình đó bằng công cụ; đối chiếu với bảng khối lượng thật','Xin đối tác một bộ hồ sơ thiết kế mẫu; đánh dấu đủ 6 loại bản vẽ đã học']}
},

{id:'c14',num:14,part:2,icon:'🏗️',title:'Thi công: chuẩn bị, an toàn, lắp đặt, đóng điện',ctv:false,ready:true,
 desc:'Chuẩn bị công trường và lập tiến độ, an toàn lao động và PCCC khi làm trên mái, lắp ray, đấu MC4 và đi dây chuỗi đúng cách, lắp tủ điện, cài đặt, đo kiểm và đóng điện lần đầu.',
 badge:{ic:'🏗️',name:'Chỉ huy công trường'},
 lessons:[
 {id:'c14l1',title:'Chuẩn bị công trường và quản lý tiến độ',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Liệt kê 6 việc chuẩn bị trước khi thi công</li><li>Biết các đội và vai trò trên công trường</li><li>Lập và đọc biểu đồ tiến độ, nhận ra việc “giữ chân” tiến độ</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Đội thi công đến một xưởng ở Quảng Xương lúc 7 giờ sáng với 170 tấm pin. Xe tải không vào được cổng vì đường hẹp, không có chỗ tập kết, chủ xưởng không bố trí được điện để khoan cắt. Mất trọn một ngày công của 8 người chỉ vì thiếu bước khảo sát trước thi công.</p></section>
  <section class="card"><h2>🧰 Sáu việc chuẩn bị</h2><div class="grid2">
   <div class="mini"><h4>① Khảo sát hiện trạng thi công</h4><p>Đường xe vào, chỗ tập kết và kho, chỗ gia công cắt ray, nguồn điện tạm, phương tiện đưa vật tư lên mái (tời, cẩu, giàn giáo).</p></div>
   <div class="mini"><h4>② Bộ bản vẽ thi công</h4><p>Bố trí tấm, đấu nối chuỗi, sơ đồ một sợi, chi tiết lắp ray, tiếp địa (Chương 13). Ai lên mái cũng phải có bản in.</p></div>
   <div class="mini"><h4>③ Nhân lực</h4><p>Chỉ huy trưởng, đội cơ khí (ray, tấm), đội điện (dây, tủ, inverter), người phụ trách an toàn và kiểm tra chất lượng.</p></div>
   <div class="mini"><h4>④ Tiến độ</h4><p>Chia việc theo hạng mục, đặt mốc: thiết kế xong, vật tư về, xong cơ khí, xong điện, nghiệm thu.</p></div>
   <div class="mini"><h4>⑤ An toàn</h4><p>Kế hoạch làm việc trên cao, dụng cụ bảo hộ, phương án PCCC, sơ cứu (Bài 14.2).</p></div>
   <div class="mini"><h4>⑥ Biện pháp thi công</h4><p>Trình tự lắp, cách đưa tấm lên mái, chỗ đi lại trên mái, cách chống dột tại điểm bắt vít.</p></div></div></section>
  ${toolCard('','t-gantt')}
  <section class="card note"><h2>📊 Theo dõi tiến độ hằng ngày</h2><ul class="clean" style="margin:0"><li>Họp nhanh đầu ngày: việc hôm nay, ai làm, rủi ro (mưa, gió, vật tư).</li><li>Cuối ngày chụp ảnh, ghi % hoàn thành từng hạng mục, báo chủ đầu tư.</li><li>Kiểm tra chất lượng ngay từng phần (ray thẳng, lực siết, đầu nối), không dồn đến cuối mới kiểm.</li><li>Hệ gia đình 5–10 kWp: đội 3–4 người thường lắp xong trong 1–2 ngày nếu chuẩn bị tốt.</li></ul></section>
  `,init:el=>ganttTool($('#t-gantt',el)),
  quiz:[{q:'Việc nào thuộc khảo sát hiện trạng thi công?',o:['Chọn màu tấm','Đường xe vào, chỗ tập kết, nguồn điện tạm, phương tiện đưa vật tư lên mái','Tính hoàn vốn','Chọn hãng inverter'],a:1,e:'Khảo sát thi công khác khảo sát tư vấn: tập trung vào hậu cần công trường.'},
   {q:'Công trình lớn hay chậm tiến độ nhất ở khâu nào?',o:['Vẽ bản vẽ','Vật tư về trễ','Họp đầu ngày','Bàn giao'],a:1,e:'Đặt hàng sớm ngay khi chốt thiết kế, theo dõi lịch giao hàng.'},
   {q:'Vì sao nên kiểm tra chất lượng ngay từng phần?',o:['Cho nhanh','Sửa lỗi ngay khi còn dễ, không phải tháo lại tấm khi đã lắp xong','Để tốn thêm công','Không cần'],a:1,e:'Lỗi ray, lực siết phát hiện sau khi lắp tấm thì phải tháo cả hàng.'}]},
 {id:'c14l2',title:'An toàn lao động và PCCC trên mái',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Nhận diện 6 mối nguy khi thi công điện mặt trời áp mái</li><li>Nắm quy trình cô lập điện trước khi làm việc trên hệ đang chạy</li><li>Chuẩn bị phương án PCCC tại công trường</li></ul></section>
  <section class="card warn"><h2>☠️ Sự thật cần nhớ</h2><p style="margin:0">Tấm pin <b>không có công tắc</b>. Hễ còn ánh sáng là còn điện áp, kể cả khi đã ngắt hết cầu dao. Một chuỗi 10 tấm cho khoảng 500 V một chiều: đủ gây tai nạn chết người và hồ quang cháy.</p></section>
  <section class="card"><h2>⚠️ Sáu mối nguy và cách phòng</h2><div class="tbl-wrap"><table class="tbl"><tr><th>Mối nguy</th><th>Biện pháp</th></tr>
   <tr><td>Ngã từ trên cao</td><td>Dây đai toàn thân móc vào điểm neo chắc, lan can hoặc lưới tạm ở mép mái, thang buộc chắc và nhô qua mép mái</td></tr>
   <tr><td>Thủng mái, trượt chân</td><td>Không giẫm lên fibro xi măng, tôn mỏng, giếng trời; đi trên xà gồ hoặc ván lót; không làm khi mái ướt</td></tr>
   <tr><td>Điện giật DC</td><td>Coi mọi dây DC là có điện; găng cách điện; đo trước khi chạm; che tấm bằng bạt khi đấu nối nếu cần</td></tr>
   <tr><td>Hồ quang khi tháo đầu nối</td><td>Không rút MC4 khi chuỗi đang có dòng; ngắt AC rồi DC trước, chờ inverter tắt hẳn</td></tr>
   <tr><td>Nắng nóng, kiệt sức</td><td>Làm sớm, nghỉ trưa, đủ nước, mũ có quai; mái tôn trưa hè nóng trên 60°C</td></tr>
   <tr><td>Vật rơi, gió giật</td><td>Rào khu vực bên dưới; buộc tấm khi chưa kẹp; ngừng nâng tấm khi gió mạnh, có dông sét</td></tr></table></div></section>
  <section class="card"><h2>🔒 Cô lập điện trước khi làm việc trên hệ đang chạy</h2>${seqGame('c14loto',[
   ['Báo chủ nhà, khoanh vùng làm việc','Mọi người biết hệ sắp dừng, không ai tự bật lại.'],
   ['Ngắt aptomat AC phía lưới','Inverter ngừng phát, dòng DC về gần 0.'],
   ['Ngắt cầu dao DC (và cầu dao pin nếu là hybrid)','Ngắt khi không còn dòng tải, tránh hồ quang.'],
   ['Khoá cầu dao, treo biển “Cấm đóng điện – Có người làm việc”','Không ai vô tình đóng lại.'],
   ['Chờ vài phút cho tụ trong inverter xả hết','Theo thời gian ghi trên nhãn inverter.'],
   ['Đo kiểm tra không còn điện ở điểm sẽ làm việc','Nhớ: phía tấm pin vẫn còn điện áp nếu trời sáng.']],{done:'Khi làm xong, tháo khoá và đóng điện lại theo thứ tự ngược (theo hướng dẫn hãng).'})}</section>
  <section class="card note"><h2>🧯 PCCC tại công trường</h2><ul class="clean" style="margin:0"><li>Có bình chữa cháy dùng được cho thiết bị điện (khí CO₂ hoặc bột) gần tủ điện và trên mái khi thi công.</li><li>Không cắt, hàn gần vật dễ cháy; thu dọn vỏ bao bì, xốp, nilon ngay trong ngày.</li><li>Giữ lối đi trên mái và lối tiếp cận tủ điện thông thoáng cho lực lượng chữa cháy.</li><li>Dán nhãn cảnh báo “Hệ điện mặt trời – điện DC” tại tủ điện, công tơ, theo yêu cầu PCCC (Chương 7).</li></ul></section>
  <section class="card"><h2>🎮 Đúng hay sai?</h2>${tfGame([
   ['Ngắt hết cầu dao thì dây DC trên mái không còn điện.',false,'Tấm pin vẫn tạo điện áp khi có ánh sáng. Chỉ phần từ cầu dao về inverter là được cô lập.'],
   ['Rút đầu MC4 khi inverter đang phát điện có thể gây hồ quang.',true,'Phải dừng inverter (ngắt AC, rồi DC) trước khi tháo đầu nối.'],
   ['Mái fibro xi măng đủ chắc để đứng nếu bước nhẹ.',false,'Fibro giòn, gãy bất ngờ; tuyệt đối không giẫm.'],
   ['Dông sét đang đến thì nên tranh thủ lắp nhanh cho xong.',false,'Dừng ngay, xuống khỏi mái, che chắn vật tư.']])}</section>
  `,init:()=>{},
  quiz:[{q:'Khi dừng hệ để bảo trì, thứ tự ngắt đúng là?',o:['DC trước, AC sau','AC trước, DC sau','Ngắt cùng lúc','Không cần ngắt'],a:1,e:'Ngắt AC để inverter ngừng phát, rồi mới ngắt DC khi không còn dòng tải.'},
   {q:'Vì sao treo biển và khoá cầu dao?',o:['Cho đẹp','Để không ai vô tình đóng điện khi đang có người làm việc','Theo thói quen','Để chống trộm'],a:1,e:'Một phần cốt lõi của quy trình cô lập điện.'},
   {q:'Bình chữa cháy nào dùng được cho tủ điện?',o:['Bình nước','Bình khí CO₂ hoặc bột','Xô cát ướt','Không cần'],a:1,e:'Không dùng nước cho thiết bị điện đang có điện.'}]},
 {id:'c14l3',title:'Lắp cơ khí, đấu MC4 và đi dây chuỗi',min:18,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Nắm các điểm kiểm tra khi lắp ray, kẹp, chống dột</li><li>Đấu đầu nối MC4 đúng 6 bước</li><li>Chọn kiểu đi dây chuỗi để vòng dây nhỏ nhất</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Một hệ 8 kWp ở Hà Trung cháy một đầu nối sau 14 tháng. Nguyên nhân: đầu MC4 bấm bằng kìm thường, lõi đồng tiếp xúc lỏng, lại là hai hãng khác nhau cắm vào nhau. Điểm tiếp xúc nóng dần mỗi ngày nắng cho đến khi chảy nhựa.</p></section>
  <section class="card"><h2>🔩 Lắp ray và tấm: điểm kiểm tra</h2><div class="grid2">
   <div class="mini"><h4>Bắt ray</h4><p>Chân bắt vào xà gồ (không chỉ vào tôn), vít có gioăng cao su, bơm keo chống dột tại lỗ khoan; ray thẳng, cùng cao độ.</p></div>
   <div class="mini"><h4>Nối ray</h4><p>Chừa khe giãn nở nhiệt tại mối nối theo hướng dẫn hãng; không bắt ray liền một mạch quá dài.</p></div>
   <div class="mini"><h4>Kẹp tấm</h4><p>Kẹp đúng vùng hãng cho phép trên khung tấm, siết đúng lực (dùng cờ lê lực), không giẫm lên tấm khi lắp.</p></div>
   <div class="mini"><h4>Đi dây trên mái</h4><p>Cáp buộc vào ray bằng dây rút chịu UV, không để cáp nằm trên tôn, không treo lủng lẳng; đi trong máng hoặc ống có nắp khi xuống tủ. Có thể lắp sẵn ống nước để vệ sinh tấm.</p></div></div></section>
  <section class="card"><h2>🔌 Đấu đầu nối MC4: sắp xếp 6 bước</h2>${seqGame('c14mc4',[
   ['Tuốt vỏ dây khoảng 10–15 mm bằng kìm tuốt chuyên dụng','Không làm đứt sợi đồng; dài quá hở lõi, ngắn quá tiếp xúc kém.'],
   ['Bấm chân cos bằng kìm bấm MC4, đúng nấc 4 mm² hoặc 6 mm²','Kìm thường làm chân cos méo, tiếp xúc lỏng.'],
   ['Đẩy chân cos vào thân đầu nối đến khi nghe “cạch”','Chân cos đã khoá. Bấm hỏng thì cắt bỏ làm lại, không cố sửa.'],
   ['Lắp gioăng cao su, siết chặt đai ốc bằng cờ lê MC4','Thiếu gioăng là nước vào, đầu nối nhanh hỏng.'],
   ['Giật nhẹ dây để kiểm tra chân cos không tuột','Kiểm tra từng đầu.'],
   ['Cắm đực vào cái đến khi khoá, đo kiểm cực tính','Chỉ cắm hai đầu cùng hãng, cùng loại.']],{done:'Đầu nối lỏng là nguyên nhân cháy hay gặp nhất trên mái. Đây là bước đáng làm chậm mà chắc.'})}</section>
  ${toolCard('','t-wire')}
  <section class="card warn"><h2>⚠️ Ba lỗi đấu nối cấm mắc</h2><ul class="clean" style="margin:0"><li>Cắm đầu MC4 của hai hãng khác nhau vào nhau dù “vừa khít”.</li><li>Để đầu nối nằm trong vũng nước trên mái hoặc ngâm trong máng xối.</li><li>Đấu ngược cực: luôn đo cực tính từng chuỗi trước khi cắm vào inverter.</li></ul></section>
  `,init:el=>wiringTool($('#t-wire',el)),
  quiz:[{q:'Bước nào quyết định độ chắc của tiếp xúc trong MC4?',o:['Chọn màu dây','Bấm chân cos bằng kìm MC4 đúng nấc','Dán băng keo','Lau sạch vỏ'],a:1,e:'Chân cos ép đúng là điểm tiếp xúc điện chính.'},
   {q:'Vì sao không cắm MC4 của hai hãng khác nhau?',o:['Khác màu','Dung sai khác nhau, tiếp xúc kém, nóng dần và có thể cháy; mất bảo hành','Vì đắt','Không sao'],a:1,e:'Chỉ ghép đầu nối cùng hãng, cùng loại.'},
   {q:'Kiểu đi dây nào cho vòng dây lớn nhất?',o:['Nối đan xen','Nối thẳng có dây hồi đi sát','Nối vòng, dây hồi đi đường khác','Cả ba như nhau'],a:2,e:'Hai dây cách xa nhau tạo vòng lớn, dễ cảm ứng xung sét.'}]},
 {id:'c14l4',title:'Tủ điện, cài đặt, đo kiểm và đóng điện lần đầu',min:20,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Nắm yêu cầu khi lắp tủ điện và đấu dây</li><li>Đọc kết quả đo nguội để phát hiện lỗi trước khi đóng điện</li><li>Làm đúng trình tự đóng điện lần đầu và cài đặt inverter</li></ul></section>
  <section class="card"><h2>🗄️ Lắp tủ điện</h2><ul class="clean"><li>Gần inverter, tránh nắng trực tiếp, nơi ẩm thấp hoặc dễ ngập; tủ đạt IP54 trở lên nếu ngoài trời.</li><li>Dây đánh số, đầu cos ép chắc, dùng cầu đấu; gọn gàng, có sơ đồ dán trong cửa tủ.</li><li>Dây DC chuyên dụng chịu UV, đúng màu cực; dây AC đúng tiết diện thiết kế; tiếp địa cho cả khung tấm, vỏ inverter, tủ: điện trở nối đất đạt yêu cầu thiết kế (thường dưới 4 Ω nếu có thể).</li></ul></section>
  <section class="card"><h2>🧪 Đo nguội (trước khi đóng điện)</h2><div class="grid3"><div class="mini"><h4>Cực tính và Voc từng chuỗi</h4><p>So với kỳ vọng ở nhiệt độ tấm lúc đo; các chuỗi giống nhau không nên lệch quá vài vôn.</p></div><div class="mini"><h4>Dòng ngắn mạch hoặc dòng làm việc</h4><p>Dùng thiết bị đo chuyên dụng hoặc ampe kìm DC khi nắng ổn định.</p></div><div class="mini"><h4>Điện trở cách điện</h4><p>Giữa dây dương/âm và đất; đạt mức tối thiểu theo tiêu chuẩn (thường từ 1 MΩ trở lên).</p></div></div></section>
  ${toolCard('','t-voc2')}
  <section class="card"><h2>⚡ Trình tự đóng điện lần đầu</h2>${seqGame('c14com',[
   ['Hoàn tất đo nguội, ghi biên bản','Mọi chuỗi đạt cực tính, Voc, cách điện.'],
   ['Kiểm tra tủ: siết đầu dây, không còn dụng cụ, đóng nắp','Chụp ảnh lưu hồ sơ.'],
   ['Đóng cầu dao DC từ dàn pin về inverter','Theo trình tự trong tài liệu của khoá; một số hãng yêu cầu đóng AC trước, luôn đọc hướng dẫn của hãng.'],
   ['Kiểm tra inverter lên nguồn, không báo lỗi','Màn hình hoặc đèn trạng thái.'],
   ['Đóng aptomat AC phía lưới','Inverter dò lưới và tự hòa lưới sau khoảng 30 giây đến 2 phút.'],
   ['Cài đặt chuẩn lưới, giới hạn phát, giờ, Wi-Fi, app, đồng hồ bám tải','Chuẩn lưới 230/400 V, 50 Hz; giới hạn phát 0 W nếu bám tải.'],
   ['Đo nóng: điện áp, dòng AC, công suất; theo dõi vài giờ','So với dự kiến theo nắng thực tế.']],{done:'Khi dừng hệ thì làm ngược lại: ngắt AC trước, DC sau.'})}</section>
  <section class="card note"><h2>📋 Biên bản nghiệm thu ghi gì?</h2><p style="margin:0">Tên công trình, chủ đầu tư, đơn vị thi công và giám sát; căn cứ nghiệm thu (bản vẽ, tiêu chuẩn, biện pháp thi công); các số đo: Voc, dòng từng chuỗi, điện trở cách điện, điện trở nối đất, điện áp và công suất AC; đối chiếu vị trí, số lượng thiết bị với bản vẽ; ảnh chụp và chữ ký các bên. Mẫu in có ở Chương 15.</p></section>
  `,init:el=>vocCheckTool($('#t-voc2',el)),
  quiz:[{q:'Đo Voc một chuỗi 10 tấm thấp hơn kỳ vọng khoảng 50 V (bằng Voc 1 tấm). Nghi ngờ gì?',o:['Bình thường','Thiếu một tấm, đấu tắt hoặc đếm nhầm','Trời quá nắng','Đồng hồ hết pin'],a:1,e:'Lệch đúng bằng một tấm là dấu hiệu rõ.'},
   {q:'Đo được điện áp âm ở một chuỗi. Làm gì?',o:['Cứ đóng điện','Không đóng cầu dao, đảo lại cực đấu nối','Thay inverter','Báo khách'],a:1,e:'Đấu ngược cực có thể làm hỏng inverter.'},
   {q:'Sau khi đóng AC, inverter thường mất bao lâu để hòa lưới?',o:['Ngay lập tức','Khoảng 30 giây đến 2 phút để kiểm tra lưới','1 ngày','Không bao giờ'],a:1,e:'Inverter kiểm tra điện áp, tần số lưới ổn định rồi mới phát.'}]}
 ],
 cards:[['6 việc chuẩn bị thi công?','Khảo sát hiện trạng thi công · bộ bản vẽ · nhân lực · tiến độ · an toàn · biện pháp thi công.'],
  ['Sự thật về điện DC của tấm pin?','Không có công tắc: còn ánh sáng là còn điện áp, kể cả khi đã ngắt cầu dao.'],
  ['Trình tự cô lập điện?','Báo, khoanh vùng → ngắt AC → ngắt DC → khoá, treo biển → chờ tụ xả → đo kiểm không còn điện.'],
  ['6 bước đấu MC4?','Tuốt 10–15 mm · bấm cos bằng kìm MC4 · đẩy vào nghe “cạch” · gioăng + siết đai ốc · giật thử · cắm cùng hãng, đo cực tính.'],
  ['Vì sao cần vòng dây chuỗi nhỏ?','Vòng lớn cảm ứng xung điện áp lớn khi có sét gần; đi dây dương âm sát nhau hoặc nối đan xen.'],
  ['Đo nguội gồm những gì?','Cực tính, Voc từng chuỗi, dòng chuỗi, điện trở cách điện (≥ 1 MΩ), tiếp địa.'],
  ['Đóng điện lần đầu (theo khoá học)?','Đo nguội xong → DC → kiểm tra inverter → AC → cài đặt → đo nóng. Dừng: AC trước, DC sau. Luôn theo hướng dẫn hãng.']],
 field:{title:'Theo đội thi công',tasks:['Theo đội thi công một ngày: chụp ảnh 6 việc chuẩn bị và ghi lại việc nào làm tốt, việc nào thiếu','Tự tay đấu 5 cặp MC4 dưới sự hướng dẫn của thợ, nhờ thợ kiểm tra và chấm','Ghi số đo nguội (Voc, cách điện) của một công trình và tự đánh giá bằng công cụ Bài 14.4']}

/* ================================================================ PHẦN 2 · CHƯƠNG 15 */
{id:'c15',num:15,part:2,icon:'🛠️',title:'Vận hành, bảo dưỡng, đo kiểm và bàn giao',ctv:false,ready:true,
 desc:'Vận hành đúng trình tự và đọc số liệu app để chấm điểm hệ thống, lập lịch bảo dưỡng, đo kiểm chuỗi và tấm, đánh giá chất lượng điện, tra lỗi thường gặp, bàn giao công trình và làm bài tập tổng kết Phần 2.',
 badge:{ic:'🛠️',name:'Bác sĩ hệ thống'},
 lessons:[
 {id:'c15l1',title:'Vận hành hằng ngày và chấm điểm hệ thống từ app',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Khởi động và dừng hệ đúng trình tự</li><li>Biết các thông số vận hành bình thường cần theo dõi</li><li>Tính PR thực tế từ số liệu app để phát hiện hệ chạy kém</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Chị Lan ở Nông Cống nhắn: <i>“Tháng này nhà chị chỉ được 500 số, tháng trước 620 số, hệ có vấn đề không em?”</i> Chỉ so hai con số thì chưa kết luận được: có thể tháng này mưa nhiều. Cần một thước đo không phụ thuộc thời tiết.</p></section>
  <section class="card"><h2>🔁 Trình tự khởi động và dừng</h2><div class="grid2"><div class="mini"><h4>▶️ Khởi động (theo tài liệu của khoá)</h4><p>Kiểm tra tổng quát (không vật che, dây chắc, tủ khô ráo) → đóng cầu dao DC → inverter lên nguồn, không báo lỗi → đóng aptomat AC → inverter dò lưới, hòa lưới sau khoảng 30–90 giây, trạng thái “đang phát”.</p></div><div class="mini"><h4>⏹️ Dừng (khi bảo trì, sự cố)</h4><p>Ngắt aptomat AC trước → inverter ngừng phát → ngắt cầu dao DC. Không bao giờ ngắt DC khi inverter đang phát công suất lớn.</p></div></div>
   <p class="muted" style="font-size:.88rem;margin-bottom:0">Một số hãng yêu cầu thứ tự khởi động khác; tài liệu hướng dẫn của inverter đang lắp luôn được ưu tiên.</p></section>
  <section class="card"><h2>📟 Thông số vận hành cần theo dõi</h2><div class="tbl-wrap"><table class="tbl"><tr><th>Thông số</th><th>Bình thường</th><th>Dùng để</th></tr>
   <tr><td>Điện áp DC từng MPPT</td><td>Trong dải MPPT, các chuỗi giống nhau gần bằng nhau</td><td>Phát hiện chuỗi thiếu tấm, đầu nối lỗi</td></tr>
   <tr><td>Dòng DC từng chuỗi</td><td>Tỉ lệ với nắng, các chuỗi giống nhau gần bằng nhau</td><td>Phát hiện bóng che, bụi, tấm suy giảm</td></tr>
   <tr><td>Công suất AC</td><td>Trưa nắng gần 75–85% công suất tấm</td><td>Đánh giá nhanh</td></tr>
   <tr><td>Điện áp, tần số lưới</td><td>Quanh 230 V, 50 Hz, trong dải cài đặt</td><td>Giải thích các lần inverter tự ngắt</td></tr>
   <tr><td>Sản lượng ngày, tháng</td><td>Theo mùa, so cùng kỳ</td><td>Tính PR, phát hiện suy giảm</td></tr>
   <tr><td>Cảnh báo, lỗi</td><td>Không có</td><td>Xử lý kịp thời (Bài 15.4)</td></tr></table></div></section>
  ${toolCard('','t-prm')}
  <section class="card insight"><h2>💡 Trả lời chị Lan</h2><p style="margin:0">“Dạ em xem bức xạ tháng này ở Thanh Hoá thấp hơn tháng trước khoảng bao nhiêu rồi tính PR. Nếu PR vẫn quanh 0,8 thì hệ khoẻ, chỉ là trời ít nắng. Nếu PR tụt xuống 0,65, em cho kỹ thuật đến kiểm tra chuỗi và vệ sinh tấm ngay.”</p></section>
  `,init:el=>prMonTool($('#t-prm',el)),
  quiz:[{q:'Khi dừng hệ để bảo trì, ngắt gì trước?',o:['Cầu dao DC','Aptomat AC','Cùng lúc','Rút MC4'],a:1,e:'Ngắt AC để inverter ngừng phát, rồi mới ngắt DC.'},
   {q:'Hệ 5,9 kWp, tháng có bức xạ 130 kWh/m², app báo 620 kWh. PR khoảng?',o:['0,62','0,81','1,05','0,5'],a:1,e:'620 ÷ (5,9 × 130) ≈ 0,81.'},
   {q:'Vì sao dùng PR thay vì chỉ so sản lượng hai tháng?',o:['Cho phức tạp','PR loại bỏ ảnh hưởng của nắng nhiều hay ít, chỉ còn chất lượng hệ','PR luôn bằng 1','Không có lý do'],a:1,e:'Sản lượng giảm có thể do trời; PR giảm mới là dấu hiệu hệ có vấn đề.'}]},
 {id:'c15l2',title:'Lịch bảo dưỡng và vệ sinh tấm pin',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Lập lịch bảo dưỡng cho từng hạng mục</li><li>Vệ sinh tấm pin đúng cách, an toàn</li><li>Tính chu kỳ vệ sinh kinh tế nhất cho từng công trình</li></ul></section>
  <section class="card"><h2>🗓️ Lịch bảo dưỡng đề xuất</h2><div class="tbl-wrap"><table class="tbl"><tr><th>Hạng mục</th><th>Tần suất</th><th>Nội dung</th></tr>
   <tr><td>Theo dõi app</td><td>Hằng ngày/tuần</td><td>Công suất, sản lượng, cảnh báo; so sánh các chuỗi</td></tr>
   <tr><td>Vệ sinh tấm pin</td><td>3–6 tháng/lần, hoặc theo mức bụi</td><td>Nước sạch, dụng cụ mềm; kiểm tra kính, khung, đầu nối</td></tr>
   <tr><td>Inverter</td><td>6 tháng – 1 năm</td><td>Màn hình, lỗi đã ghi, tiếng ồn, mùi lạ, khe tản nhiệt, cập nhật phần mềm</td></tr>
   <tr><td>Tủ điện, cáp, đầu nối</td><td>6 tháng đầu, sau đó hằng năm</td><td>Siết lại đầu dây, kiểm tra vết cháy, gỉ, chuột cắn, vỏ cáp nứt</td></tr>
   <tr><td>Tiếp địa, chống sét</td><td>Hằng năm, trước mùa mưa bão</td><td>Đo điện trở nối đất, kiểm tra thiết bị chống sét lan truyền</td></tr>
   <tr><td>Ray, kẹp, chống dột</td><td>Hằng năm, sau bão</td><td>Lực siết, gỉ, điểm dột tại vít</td></tr></table></div></section>
  <section class="card"><h2>🧽 Vệ sinh tấm đúng cách</h2><div class="grid2"><div class="mini"><h4>✅ Nên</h4><p>Làm sáng sớm hoặc chiều mát (tránh nước lạnh dội lên kính nóng); nước sạch, chổi mềm, khăn mềm, dung dịch trung tính; đi trên lối đi, đeo dây an toàn; dừng hệ nếu phải chạm vào đầu nối.</p></div><div class="mini"><h4>❌ Không</h4><p>Giẫm lên tấm; dùng bàn chải sắt, chất tẩy mạnh; xịt nước áp lực cao vào hộp nối và đầu nối; vệ sinh giữa trưa nắng gắt.</p></div></div></section>
  ${toolCard('','t-clean')}
  <section class="card"><h2>📝 Ghi chép sau mỗi lần bảo dưỡng</h2><p style="margin:0">Ghi ngày, người làm, việc đã làm, số đo (nếu có), ảnh trước và sau, đề xuất sửa chữa; gửi cho khách qua Zalo. Lịch sử bảo dưỡng là bằng chứng khi cần bảo hành, và là lý do để khách giới thiệu bạn cho người khác.</p></section>
  `,init:el=>cleanTool($('#t-clean',el)),
  quiz:[{q:'Thời điểm nào vệ sinh tấm pin tốt nhất?',o:['12 giờ trưa','Sáng sớm hoặc chiều mát','Lúc mưa','Nửa đêm'],a:1,e:'Tránh sốc nhiệt cho kính và an toàn cho người.'},
   {q:'Vì sao siết lại đầu dây sau 6 tháng đầu?',o:['Cho đẹp','Đầu dây có thể lỏng do giãn nở nhiệt, rung; đầu lỏng gây nóng và cháy','Theo thói quen','Không cần'],a:1,e:'Kiểm tra sớm giúp tránh sự cố về sau.'},
   {q:'Công trình gần công trường xây dựng, bụi nhiều. Chu kỳ vệ sinh nên?',o:['Dài hơn bình thường','Ngắn hơn, có thể 2–3 tháng/lần','Không cần vệ sinh','1 lần mỗi 5 năm'],a:1,e:'Bụi nhiều thì mất điện nhanh, vệ sinh dày hơn vẫn có lời.'}]},
 {id:'c15l3',title:'Đo kiểm chuỗi và tấm pin',min:18,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Biết 5 dụng cụ đo kiểm và dùng để làm gì</li><li>Đo Voc, dòng chuỗi, điện trở cách điện và đọc đúng kết quả</li><li>Khoanh vùng tấm lỗi từ bảng đo</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Hệ 24 kWp của một nhà nghỉ ở Sầm Sơn có PR tụt từ 0,80 xuống 0,72 sau mùa mưa bão. App cho thấy 4 chuỗi không đều nhau. Kỹ thuật viên mang dụng cụ lên mái: bắt đầu từ đâu?</p></section>
  <section class="card"><h2>🧰 Năm dụng cụ</h2><div class="tbl-wrap"><table class="tbl"><tr><th>Dụng cụ</th><th>Dùng để</th></tr>
   <tr><td>Đồng hồ vạn năng đo DC</td><td>Đo Voc, cực tính từng chuỗi, từng tấm</td></tr>
   <tr><td>Ampe kìm DC</td><td>Đo dòng từng chuỗi khi hệ đang chạy, không cần cắt dây</td></tr>
   <tr><td>Máy vẽ đường cong I-V</td><td>Đo đặc tuyến chuỗi hoặc tấm, phát hiện suy giảm, lỗi điốt (dùng ở hệ lớn hoặc khi tranh chấp bảo hành)</td></tr>
   <tr><td>Camera nhiệt</td><td>Tìm điểm nóng, cell nứt, đầu nối nóng; soi khi trời nắng, hệ đang chạy</td></tr>
   <tr><td>Máy đo điện trở cách điện</td><td>Đo cách điện giữa dây và đất ở điện áp thử 500 V hoặc 1.000 V</td></tr></table></div></section>
  <section class="card"><h2>📏 Ngưỡng đánh giá tham khảo</h2><div class="grid3"><div class="mini"><h4>Voc</h4><p>Các chuỗi giống nhau lệch không quá 3–5 V; so với kỳ vọng ở nhiệt độ lúc đo (Bài 14.4).</p></div><div class="mini"><h4>Dòng chuỗi</h4><p>Đo khi nắng ổn định (từ khoảng 800 W/m²); các chuỗi giống nhau lệch không quá 10%.</p></div><div class="mini"><h4>Cách điện</h4><p>Từ 1 MΩ trở lên theo tiêu chuẩn kiểm tra hệ điện mặt trời; hệ mới thường cao hơn rất nhiều.</p></div></div></section>
  ${toolCard('','t-stt')}
  <section class="card warn"><h2>⚠️ An toàn khi đo</h2><p style="margin:0">Đo dòng ngắn mạch chỉ bằng thiết bị chuyên dụng hoặc theo quy trình của đơn vị; không tự chập hai đầu chuỗi bằng dây. Đo cách điện thì cô lập chuỗi khỏi inverter trước. Luôn đeo găng cách điện và nhớ rằng tấm vẫn có điện khi trời sáng.</p></section>
  `,init:el=>stringTestTool($('#t-stt',el)),
  quiz:[{q:'Muốn tìm điểm nóng trên tấm, dùng dụng cụ nào?',o:['Thước dây','Camera nhiệt','Ampe kìm AC','Búa'],a:1,e:'Camera nhiệt thấy ngay cell nóng bất thường.'},
   {q:'Các chuỗi giống nhau, một chuỗi có dòng thấp hơn 15%. Nghi ngờ gì trước?',o:['Inverter hỏng','Bóng che, bụi hoặc tấm suy giảm ở chuỗi đó','Lưới quá áp','Không sao'],a:1,e:'Dòng tỉ lệ với ánh sáng tới tấm.'},
   {q:'Điện trở cách điện tối thiểu thường yêu cầu?',o:['0,01 MΩ','Từ 1 MΩ trở lên','1 Ω','Không cần đo'],a:1,e:'Dưới mức này có nguy cơ rò điện, inverter báo lỗi cách điện.'}]},
 {id:'c15l4',title:'Chất lượng điện năng và tra lỗi thường gặp',min:18,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Biết các chỉ số chất lượng điện: điện áp, tần số, sóng hài, hệ số công suất, lệch pha</li><li>Tra nhanh lỗi theo nhóm: tấm, DC, inverter, AC, giám sát</li><li>Giải thích được lỗi “inverter ngắt khi máy bơm chạy”</li></ul></section>
  <section class="card"><h2>📊 Các chỉ số chất lượng điện (tham khảo)</h2><div class="tbl-wrap"><table class="tbl"><tr><th>Chỉ số</th><th>Mức tham khảo</th><th>Ý nghĩa</th></tr>
   <tr><td>Tần số</td><td>Quanh 50 Hz, dao động nhỏ</td><td>Lệch nhiều là lưới hoặc máy phát không ổn định</td></tr>
   <tr><td>Điện áp</td><td>Trong dải cho phép quanh 230/400 V</td><td>Cuối nguồn hay quá áp buổi trưa khi nhiều hệ cùng phát</td></tr>
   <tr><td>Lệch áp 3 pha</td><td>Càng nhỏ càng tốt (thường vài %)</td><td>Tải dồn một pha, hoặc inverter 1 pha trên nhà 3 pha</td></tr>
   <tr><td>Méo sóng hài điện áp, dòng điện</td><td>Thấp (vài %)</td><td>Cao làm nóng dây, nhảy aptomat, hỏng thiết bị nhạy</td></tr>
   <tr><td>Hệ số công suất</td><td>Gần 1</td><td>Khách sản xuất có thể bị tính tiền công suất phản kháng</td></tr></table></div>
   <small class="src">Giới hạn chính xác theo quy định và tiêu chuẩn hiện hành của ngành điện; số trong bảng chỉ để định hướng. Đo bằng máy phân tích chất lượng điện, khuyến nghị đo khi nghiệm thu, định kỳ 6 tháng với hệ lớn và khi có sự cố.</small></section>
  ${toolCard('','t-fault')}
  <section class="card">${scenario('Trang trại báo: “Cứ bật máy bơm 3 kW là inverter báo lỗi rồi ngắt vài phút.” Bạn nghĩ đến gì đầu tiên?',[
   {k:'bad',t:'A. Inverter hỏng, đổi máy mới.',fb:'❌ Vội vàng. Inverter đang làm đúng việc bảo vệ.'},

/* index */
const LESSONS={};COURSE.forEach(c=>(c.lessons||[]).forEach((l,i)=>LESSONS[l.id]={l,c,i}));
const allCards=()=>COURSE.flatMap(c=>(c.cards||[]).map((x,i)=>({id:c.id+'k'+i,cid:c.id,f:x[0],b:x[1]})));
const inTrack=c=>S.role!=='ctv'||c.ctv;
const track=()=>COURSE.filter(inTrack);
const chapStarted=c=>(c.lessons||[]).some(l=>S.done[l.id]);
const chapDone=c=>c.ready&&c.lessons.every(l=>S.done[l.id]);
function progress(){let tot=0,d=0;track().forEach(c=>{if(c.ready){tot+=c.lessons.length;d+=c.lessons.filter(l=>S.done[l.id]).length}else tot+=c.planned||4});return{tot,d,pct:tot?Math.round(d/tot*100):0}}
function nextLesson(){for(const c of track()){if(!c.ready)continue;for(const l of c.lessons)if(!S.done[l.id])return l}return null}
function dueCards(){const now=Date.now();return allCards().filter(k=>{const c=COURSE.find(x=>x.id===k.cid);if(!chapStarted(c))return false;const st=S.cards[k.id];return !st||st.due<=now})}
function fieldPending(){return COURSE.filter(c=>c.ready&&chapStarted(c)&&c.field.tasks.some((t,i)=>!(S.field[c.id]&&S.field[c.id].t&&S.field[c.id].t[i]))).length}

/* =====================================================================
   GIAO DIỆN & CẤP ĐỘ (XP)
   ===================================================================== */
const LVN=['Tân binh','Học việc','Thợ săn nắng','Kỹ sư mái nhà','Chiến binh kWh','Cao thủ tư vấn','Huyền thoại Thanh Hoá Solar'],XP_PER=600;
function xpTotal(){let x=0;Object.keys(S.done).forEach(id=>{if(LESSONS[id])x+=100});
  Object.entries(S.quiz).forEach(([id,q])=>{const L=LESSONS[id];if(L)Object.entries(q.ans||{}).forEach(([qi,a])=>{if(L.l.quiz[qi]&&L.l.quiz[qi].a===a)x+=20})});
  Object.values(S.field).forEach(f=>Object.values(f.t||{}).forEach(v=>{if(v)x+=50}));COURSE.forEach(c=>{if(chapDone(c))x+=300});return x}
function levelInfo(){const X=xpTotal(),lv=Math.min(LVN.length,Math.floor(X/XP_PER)+1);return{X,lv,cur:lv===LVN.length?XP_PER:X%XP_PER}}
function renderHud(){const h=$('#hud');if(!h)return;const L=levelInfo();
  h.title=`Cấp ${L.lv}: ${LVN[L.lv-1]} · ${fmt(L.X)} XP\nMỗi bài +100 · câu đúng +20 · việc ngoài đời +50 · xong chương +300`;
  h.innerHTML=`<div class="lv">${L.lv}</div><div class="xpbox"><div class="xpt"><span>${LVN[L.lv-1]}</span><b>${fmt(L.X)} XP</b></div><div class="xpbar"><i style="width:${L.cur/XP_PER*100}%"></i></div></div>`;
  if(S.lastLv&&L.lv>S.lastLv&&S.theme==='game')setTimeout(()=>toast(`⬆️ Lên cấp ${L.lv}: ${LVN[L.lv-1]}!`),1700);
  if(S.lastLv!==L.lv){S.lastLv=L.lv;save()}}
function applyTheme(){document.body.classList.toggle('game',S.theme==='game');const b=$('#themeBtn');if(b){b.textContent=S.theme==='game'?'☀️':'🎮';b.title=S.theme==='game'?'Chuyển sang giao diện Sáng':'Chuyển sang giao diện Gaming'}}
function setTheme(t){S.theme=t;save();applyTheme();renderHud()}

function renderSidebar(cur){
  const due=dueCards().length,fp=fieldPending();
  const nl=(r,ic,t,extra='')=>`<a class="nav-link ${cur.page===r?'active':''}" href="#${r==='settings'?'cai-dat':r}">${ic} ${t}${extra}</a>`;
  let h=`<div class="nav-sec">Tổng quan</div>${nl('home','🏠','Trang chủ')}${nl('review','🃏','Ôn thẻ ghi nhớ',due?`<span class="badge">${due}</span>`:'')}${nl('field','📋','Bài tập ngoài đời',fp?`<span class="badge">${fp}</span>`:'')}${nl('tools','🧰','Hộp công cụ')}${nl('cert','🏆','Chứng nhận')}${nl('settings','⚙️','Cài đặt số liệu')}
  <div class="nav-sec">Phần 1 · Lộ trình ${S.role==='ctv'?'Cộng tác viên':'Tư vấn viên'}</div>`;
  let p2h=0;COURSE.forEach(c=>{if(c.part===2&&!p2h){p2h=1;h+=`<div class="nav-sec p2">Phần 2 · Kỹ thuật chuyên sâu</div>`}
    const active=cur.chap===c.id;
    h+=`<div class="chap ${chapDone(c)?'done':''} ${c.ready?'':'locked'} ${inTrack(c)?'':'optional'}"><a class="chap-head ${active&&cur.page==='chap'?'active':''}" href="#chap-${c.id}"><span class="chap-num">${chapDone(c)?'✓':c.num}</span><span>${c.title}</span>${c.ctv?'<span class="tag-ctv">CTV</span>':''}${c.ready?'':'<span class="lock">🔒</span>'}</a>`;
    if(c.ready)h+=`<ul class="lesson-list">${c.lessons.map((l,i)=>`<li><a href="#lesson-${l.id}" class="${cur.lesson===l.id?'active':''}">${S.done[l.id]?'✅':'○'} ${c.num}.${i+1} ${l.title}</a></li>`).join('')}</ul>`;
    h+='</div>';
  });
  $('#sidebar').innerHTML=h;
}

function bindLesson(id){
  const {l,c}=LESSONS[id];if(l.init)l.init($('#lbody'));if(c.part===2)autoGloss($('#lbody'));
  const qz=$('.quiz');const st=S.quiz[id]=S.quiz[id]||{ans:{}};
  const paint=()=>{l.quiz.forEach((q,qi)=>{const box=$(`.q[data-q="${qi}"]`,qz),a=st.ans[qi];const ex=$('.explain',box);
    $$('.opt',box).forEach(b=>{b.className='opt';b.disabled=a!=null;if(a!=null){if(+b.dataset.o===q.a)b.classList.add('correct');else if(+b.dataset.o===a)b.classList.add('wrong')}});
    if(a!=null){ex.classList.remove('hidden');ex.innerHTML=(a===q.a?'✅ <b>Chính xác!</b> ':'❌ <b>Chưa đúng.</b> ')+q.e}else ex.classList.add('hidden')});
    const n=Object.keys(st.ans).length;
    if(n===l.quiz.length){st.score=l.quiz.filter((q,qi)=>st.ans[qi]===q.a).length;$('.qsum',qz).innerHTML=`<div class="quiz-sum"><span>Kết quả: ${st.score}/${l.quiz.length} ${st.score===l.quiz.length?'🎉 Tuyệt vời!':'– đọc kỹ giải thích ở trên nhé'}</span><button class="btn ghost" id="qReset">↻ Làm lại</button></div>`;$('#qReset').onclick=()=>{st.ans={};st.score=null;save();paint()}}else $('.qsum',qz).innerHTML='';
  };
  $$('.opt',qz).forEach(b=>b.onclick=()=>{const qi=+b.closest('.q').dataset.q;if(st.ans[qi]!=null)return;st.ans[qi]=+b.dataset.o;save();paint()});
  paint();
  $('#doneBtn').onclick=()=>{
    if(Object.keys(st.ans).length<l.quiz.length){toast('Hãy trả lời hết câu hỏi nhanh trước nhé 🙂');qz.scrollIntoView({behavior:'smooth'});return}
    if(S.done[id])return;const wasDone=chapDone(c);S.done[id]=Date.now();save();
    if(!wasDone&&chapDone(c))toast(`🏅 Chúc mừng! Bạn nhận huy hiệu “${c.badge.name}”`);else toast('✅ Đã hoàn thành bài học!');
    const nx=nextLesson();setTimeout(()=>{location.hash=nx?'#lesson-'+nx.id:'#chap-'+c.id},900);
  };
}

function route(){
  const _h=location.hash.replace(/^#\/?/,'')||'home',_m=_h.match(/^(lesson|chap)[-\/](.+)$/);let page=_m?_m[1]:_h.split('/')[0];const arg=_m?_m[2]:undefined;if(page==='cai-dat')page='settings';
  const main=$('#main');SB_TIMERS.forEach(clearInterval);SB_TIMERS=[];
  if(!S.name){main.innerHTML=pageOnboard();bindOnboard();$('#sidebar').innerHTML='';updateTop();return}
  let cur={page};
  if(page==='lesson'&&LESSONS[arg]){cur.lesson=arg;cur.chap=LESSONS[arg].c.id;main.innerHTML=pageLesson(arg);bindLesson(arg)}
  else if(page==='chap'){cur.chap=arg;main.innerHTML=pageChap(arg)}
  else if(page==='review'){main.innerHTML=pageReview();bindReview()}
  else if(page==='field'){main.innerHTML=pageField();bindField()}
  else if(page==='tools'){main.innerHTML=pageTools();bindTools()}
  else if(page==='settings'){main.innerHTML=pageSettings();bindSettings()}
  else if(page==='cert'){main.innerHTML=pageCert();bindCert()}
  else{cur.page='home';main.innerHTML=pageHome()}
  initSB(main);initSeq(main);renderSidebar(cur);updateTop();window.scrollTo(0,0);closeMenu();
}

document.addEventListener('click',e=>{
  const hz=e.target.closest('[data-g][data-h]');
  if(hz&&HS[hz.dataset.g]){const g=hz.dataset.g,h=HS[g][hz.dataset.h],p=document.querySelector(`[data-hsp="${g}"]`);hz.classList.add('seen');const n=new Set($$(`[data-g="${g}"].seen`).map(x=>x.dataset.h)).size,tot=Object.keys(HS[g]).length;if(p)p.innerHTML=`<b>${hz.dataset.h}. ${h[0]}</b><div style="margin-top:4px">${h[1]}</div><div class="muted" style="margin-top:6px;font-size:.85rem">Đã xem ${n}/${tot} ${n===tot?'🎉':''}</div>`;return}
  const cb=e.target.closest('.cg-btn');
  if(cb){const c=cb.closest('.cg-case');if(c.dataset.done)return;c.dataset.done=1;const ok=+cb.dataset.v===+c.dataset.a;c.classList.add(ok?'ok':'no');$$('.cg-btn',c).forEach(b=>b.disabled=true);c.insertAdjacentHTML('beforeend',`<div class="fb">${ok?'✅ Đúng!':'❌ Chưa đúng. Đáp án: <b>'+c.dataset.al+'</b>.'} ${c.dataset.fb}</div>`);const g=c.closest('.cg'),n=+g.dataset.n,d=$$('.cg-case[data-done]',g).length,r=$$('.cg-case.ok',g).length;if(d===n)$('.cg-score',g).textContent=`Kết quả: ${r}/${n} ${r===n?'🎉':''}`;return}
  const rv=e.target.closest('[data-reveal]');
  if(rv){const el=document.getElementById(rv.dataset.reveal);if(!rv.dataset.label)rv.dataset.label=rv.innerHTML;el.classList.toggle('show');rv.innerHTML=el.classList.contains('show')?'🙈 Ẩn':rv.dataset.label;return}
  const fc=e.target.closest('.flipcard');if(fc){fc.classList.toggle('flipped');return}
  const so=e.target.closest('.sc-opt');
  if(so){const sc=so.closest('.scenario');$$('.sc-opt',sc).forEach(x=>x.classList.remove('good','bad','mid'));so.classList.add(so.dataset.k);$('.sc-fb',sc).textContent=so.dataset.fb;return}
  const cp=e.target.closest('[data-copy]');
  if(cp){const txt=document.getElementById(cp.dataset.copy).innerText;
    const ok=()=>toast('📋 Đã sao chép');
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,()=>fallbackCopy(txt,ok));else fallbackCopy(txt,ok)}
});
function fallbackCopy(t,cb){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');cb()}catch(e){toast('Không sao chép được, hãy bôi đen và sao chép thủ công')}a.remove()}
window.addEventListener('hashchange',route);
$('#themeBtn').onclick=()=>setTheme(S.theme==='game'?'light':'game');
applyTheme();route();
</script>
</body>
</html>
