/* Đo nguội: so Voc đo được với Voc kỳ vọng */
function vocCheckTool(el){formulaTool(el,{title:'Kiểm tra Voc chuỗi khi đo nguội',pill:'Đọc kết quả đo',
  intro:'Trước khi đóng điện, đo điện áp hở mạch từng chuỗi và so với giá trị kỳ vọng ở nhiệt độ tấm lúc đo. Độ lệch cho biết lỗi gì.',
  fx:'V<sub>oc,kỳ vọng</sub> = N × V<sub>oc,STC</sub> × [1 + β × (T<sub>cell</sub> − 25)]   ·   số tấm “mất” = (V<sub>kỳ vọng</sub> − V<sub>đo</sub>) / V<sub>oc,1 tấm</sub>',
  presets:[{n:'Chuỗi bình thường',v:{N:10,T:45,Vm:492}},{n:'Thiếu 1 tấm',v:{N:10,T:45,Vm:444}},{n:'Một điốt bypass chập',v:{N:10,T:45,Vm:478}},{n:'Đấu ngược cực',v:{N:10,T:45,Vm:-493}}],
  vars:[{k:'N',sym:'N',name:'Số tấm theo bản vẽ',min:2,max:24,step:1,val:10,unit:'tấm'},
   {k:'V',sym:'V<sub>oc,STC</sub>',name:'Voc 1 tấm (datasheet)',min:30,max:60,step:0.1,val:52,unit:'V'},
   {k:'b',sym:'β',name:'Hệ số nhiệt Voc',min:-0.4,max:-0.2,step:0.01,val:-0.25,unit:'%/°C'},
   {k:'T',sym:'T<sub>cell</sub>',name:'Nhiệt độ tấm lúc đo',ref:'Đo mặt sau tấm bằng nhiệt kế hồng ngoại',min:10,max:70,step:1,val:45,unit:'°C'},
   {k:'Vm',sym:'V<sub>đo</sub>',name:'Điện áp đo được',ref:'Đồng hồ đo DC tại tủ, cầu dao DC đang mở',min:-600,max:1100,step:1,val:492,unit:'V'}],
  solve:v=>{const f=1+v.b/100*(v.T-25),V1=v.V*f,ex=v.N*V1,dev=(v.Vm-ex)/ex*100,miss=(ex-v.Vm)/V1;
    let verdict,ok=false;if(v.Vm<0){verdict='Điện áp âm: <b>đấu ngược cực</b> dây chuỗi. Không đóng cầu dao, đảo lại đầu nối.'}else if(Math.abs(dev)<=3){verdict='Lệch trong khoảng ±3%: chuỗi bình thường.';ok=true}else if(Math.abs(miss-1)<0.25||Math.abs(miss-2)<0.25){verdict=`Thấp hơn khoảng ${Math.round(miss)} tấm: <b>thiếu tấm, đấu tắt qua một tấm, hoặc đếm nhầm</b>. Đối chiếu bản vẽ và đếm lại.`}else if(miss>0.2&&miss<0.5){verdict='Thấp hơn khoảng 1/3 tấm: nghi <b>một điốt bypass bị chập</b> hoặc một nhóm cell hỏng. Soi camera nhiệt, đo từng tấm.'}else if(dev>3){verdict='Cao hơn kỳ vọng: kiểm tra lại nhiệt độ tấm, số tấm thực tế (có thể thừa tấm) và đồng hồ đo.'}else verdict='Lệch bất thường: kiểm tra đầu nối MC4 lỏng, dây đứt, tấm bị che lúc đo.';
    return{steps:[['Hệ số nhiệt','1 + ('+nf(v.b,2)+'%) × ('+v.T+' − 25) = '+nf(f,4)],['Voc 1 tấm lúc đo',nf(v.V,1)+' × '+nf(f,4)+' = '+nf(V1,2)+' V'],['Voc kỳ vọng cả chuỗi',v.N+' × '+nf(V1,2)+' = '+nf(ex,1)+' V'],['Độ lệch','('+v.Vm+' − '+nf(ex,1)+') / '+nf(ex,1)+' = '+nf(dev,1)+' %'],['Quy ra số tấm',nf(miss,2)+' tấm']],
      out:[{l:'Kỳ vọng',v:nf(ex,0)+' V'},{l:'Đo được',v:v.Vm+' V'},{l:'Độ lệch',v:nf(dev,1)+' %',c:ok?'ok':'hl'}],checks:[[ok,verdict]]}}})}

      note:'Chỉ so sánh PR khi số bức xạ đáng tin. Không có số bức xạ thì so sản lượng riêng với cùng tháng năm trước hoặc với một hệ gần đó.'}}})}

function stringTestTool(el){const D=[[493,12.1],[492,11.9],[489,10.2],[445,12.0]];

   <tr><td><b>4. Kê đơn</b></td><td>Thuốc gì, liều bao nhiêu</td><td>Loại hệ gì, bao nhiêu kWp, tiết kiệm bao nhiêu</td></tr>
   <tr><td><b>5. Tái khám</b></td><td>Hẹn tái khám</td><td>Chăm sóc sau lắp, bảo trì định kỳ</td></tr></table></div>
  </section>

  <section class="card"><h2>📝 10 câu hỏi “khám” <span class="pill">Bấm vào từng câu để xem vì sao hỏi</span></h2>
   ${[['⚡ Điện năng',[['Tiền điện mỗi tháng nhà mình khoảng bao nhiêu? Tháng cao nhất, thấp nhất?','Biết quy mô và mức chênh giữa các mùa.'],['Anh/chị gửi em ảnh hoá đơn 3–6 tháng gần đây được không?','Có số liệu thật thay vì ước chừng. Chương 1 dạy cách đọc.'],['Điện nhà mình là điện sinh hoạt hay kinh doanh? Điện 1 pha hay 3 pha?','Quyết định biểu giá và loại inverter.']]],
      ['🕘 Thói quen',[['Ban ngày nhà mình có ai ở nhà không? Thường dùng những thiết bị gì?','Ước tính tỉ lệ dùng điện ban ngày, yếu tố quyết định hiệu quả.'],['Điều hoà, bình nóng lạnh, máy bơm hay dùng vào giờ nào?','Tải lớn dùng lúc nào thì quyết định có cần lưu trữ hay không.'],['Khu mình có hay mất điện không, mỗi lần bao lâu?','Nếu hay mất điện thì hệ có lưu trữ (hybrid) là lý do mua rất mạnh.']]],
      ['🏠 Ngôi nhà',[['Mái nhà làm năm nào? Có định sửa, nâng tầng trong vài năm tới không?','Tránh lắp rồi phải tháo. Mái sắp thay thì nên thay trước.'],['Quanh mái có cây, nhà cao tầng, bồn nước che bóng không?','Bóng che làm giảm sản lượng rõ rệt.']]],
      ['💰 Mong muốn',[['Anh/chị mong nhất điều gì: giảm tiền điện, có điện khi mất điện, hay cả hai?','Chọn đúng loại hệ theo mong muốn thật của khách.'],['Anh/chị dự tính đầu tư khoảng bao nhiêu, có quan tâm trả góp không? Trong nhà ai sẽ cùng quyết định?','Biết ngân sách, và mời đúng người quyết định cùng nghe tư vấn.']]]]
     .map((g,gi)=>`<h3>${g[0]}</h3>`+g[1].map((q,qi)=>`<details class="worked"><summary>${q[0]}</summary><div>👉 <b>Vì sao hỏi:</b> ${q[1]}</div></details>`).join('')).join('')}
   <div class="card insight" style="margin-bottom:0"><b>💡 Mẹo:</b> hỏi 10 câu này trong khoảng 10 phút và ghi vào phiếu. Khách sẽ thấy bạn chuyên nghiệp ngay từ cách hỏi, trước cả khi bạn nói về sản phẩm.</div>
  </section>

  <section class="card"><h2>🧩 Trò chơi: xếp đúng quy trình tư vấn 7 bước</h2>
   <p class="muted" style="margin-top:0">Bấm lần lượt các bước theo đúng thứ tự.</p>
   <div class="order-pool" id="opool"></div>
   <ol class="order-ans" id="oans"></ol>
   <div id="omsg"></div>
  </section>
  `,
  init:el=>{
   const STEPS=['Làm quen và lắng nghe','Xin ảnh hoá đơn 3–6 tháng','Hỏi 10 câu “khám”','Khảo sát mái nhà','Lập đề xuất có số','Trình bày và giải đáp băn khoăn','Hẹn bước tiếp theo rõ ràng'];
   let idx=0;const pool=$('#opool',el),ans=$('#oans',el);
   pool.innerHTML=shuffle(STEPS).map(s=>`<button>${s}</button>`).join('');
   $$('button',pool).forEach(b=>b.onclick=()=>{
     if(b.textContent===STEPS[idx]){ans.insertAdjacentHTML('beforeend',`<li>${b.textContent}</li>`);b.disabled=true;idx++;
       if(idx===STEPS.length){$('#omsg',el).innerHTML='<div class="card insight" style="margin:10px 0 0">🎉 Chính xác! Đây là quy trình chuẩn. Mọi buổi tư vấn của Thanh Hoá Solar đều đi đủ 7 bước này.</div>'}}
     else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast('Chưa đúng. Gợi ý: bước tiếp theo là “'+STEPS[idx].split(' ').slice(0,2).join(' ')+'…”')}
   });
  },
  quiz:[
   {q:'Sai lầm lớn nhất của Minh là gì?',o:['Báo giá quá cao','Đề xuất trước khi tìm hiểu nhu cầu và tình trạng nhà','Không mang theo catalogue','Nói chuyện quá lâu'],a:1,e:'Minh “kê đơn” mà không “khám”. Đề xuất đúng phải dựa trên hoá đơn, thói quen dùng điện và tình trạng mái.'},
   {q:'Câu hỏi “Khu mình có hay mất điện không?” giúp quyết định điều gì?',o:['Hướng đặt tấm pin','Có nên dùng hệ có lưu trữ (hybrid) không','Giá tấm pin','Số pha điện'],a:1,e:'Nếu hay mất điện, hệ có lưu trữ giúp nhà vẫn có điện. Đây thường là lý do mua mạnh hơn cả chuyện tiền điện.'},
   {q:'Vì sao nên hỏi “Trong nhà ai sẽ cùng quyết định?”',o:['Để biết ai trả tiền','Để mời đúng người cùng nghe tư vấn, tránh câu “để chú bàn với cô đã” kéo dài','Để lấy số điện thoại','Không cần hỏi câu này'],a:1,e:'Khoản chi 50–100 triệu thường cả gia đình cùng quyết. Có mặt người quyết định ngay buổi tư vấn giúp rút ngắn thời gian chốt.'}
  ]},

 {id:'c0l3',title:'Mọi lời hứa đều có số – và dám từ chối',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Biến câu nói mơ hồ thành câu có số, có điều kiện</li><li>Nhận ra khách <b>chưa nên</b> lắp và biết cách nói lời từ chối khéo</li></ul></section>

  <section class="card story"><h2>📖 Tình huống</h2>
   <p>Một nhà trong xóm được một đơn vị hứa <i>“hoàn vốn 3 năm, bền cả đời”</i>. Năm thứ 3 inverter hỏng, đơn vị lắp đặt không nghe máy. Giờ cả xóm cứ nghe đến “điện mặt trời” là lắc đầu.</p>
   <p><b>Bài học:</b> ở vùng quê, <b>một lời hứa sai làm hỏng cả một khu thị trường</b>. Ngược lại, một lời nói thật được kiểm chứng sẽ mở ra cả khu.</p>
  </section>

  <section class="card"><h2>🔢 Công thức “câu có số”</h2>
   <div class="grid3"><div class="mini" style="border-top:4px solid var(--sky2)"><h4>① Con số</h4><p>Bao nhiêu tiền, bao nhiêu năm, bao nhiêu kWh</p></div><div class="mini" style="border-top:4px solid var(--sun)"><h4>② Điều kiện</h4><p>Mùa nào, với cách dùng điện nào</p></div><div class="mini" style="border-top:4px solid var(--leaf)"><h4>③ Bước tiếp theo</h4><p>Em sẽ gửi bảng tính, hẹn khảo sát…</p></div></div>
   <h3>✍️ Luyện viết lại <span class="pill">Tự nghĩ trước, rồi bấm xem gợi ý</span></h3>
   ${[['“Lắp vào là tiết kiệm nhiều lắm anh ạ.”','“Với hoá đơn khoảng 1,5 triệu của nhà anh, hệ khoảng 4 kWp giúp giảm khoảng 700–800 nghìn/tháng mùa hè, mùa đông khoảng 400 nghìn. Em sẽ gửi anh bảng tính chi tiết từng tháng.”'],
      ['“Bền lắm, dùng cả đời luôn.”','“Tấm pin bảo hành hiệu suất 25–30 năm. Inverter bảo hành 5–10 năm, và nhiều khả năng phải thay một lần vào khoảng năm thứ 10–12. Em ghi rõ chi phí dự kiến vào bảng tính để anh chủ động.”'],
      ['“Hoàn vốn nhanh lắm chị ơi.”','“Với cách dùng điện hiện tại của nhà mình, thời gian hoàn vốn khoảng 5–7 năm. Nếu chị dùng thêm điều hoà ban ngày thì còn nhanh hơn.”'],
      ['“Không bao giờ dột đâu ạ.”','“Bên em dùng kẹp chuyên dụng cho mái tôn, không khoan xuyên mái. Nếu dột do thi công trong 2 năm đầu, bên em xử lý miễn phí, có ghi trong hợp đồng.”']]
     .map((r,i)=>`<div class="rw"><div class="bad-t">${r[0]}</div><button class="btn ghost" style="margin-top:8px;padding:6px 12px;font-size:.85rem" data-reveal="rw${i}">Xem cách nói có số</button><div class="reveal" id="rw${i}"><div class="good-t">${r[1]}</div></div></div>`).join('')}
   <small class="src">Các con số trong ví dụ mang tính minh hoạ. Khi tư vấn thật, luôn tính bằng số liệu của chính khách hàng.</small>
  </section>

  <section class="card"><h2>✋ Dám từ chối: 5 dấu hiệu khách <u>chưa nên</u> lắp</h2>
   <ul class="clean"><li>Hoá đơn quá thấp (khoảng dưới 500 nghìn/tháng), thời gian hoàn vốn quá dài</li><li>Mái yếu, mục, hoặc sắp thay/sửa trong 1–2 năm</li><li>Bị che bóng nặng (nhà cao tầng, cây lớn) phần lớn thời gian có nắng</li><li>Sắp chuyển nhà, phá dỡ, cho thuê lại trong 2–3 năm</li><li>Khách kỳ vọng sai (“hết tiền điện”) và không chịu nghe giải thích</li></ul>
   <div class="card insight" style="margin-bottom:0"><b>Cách nói khéo:</b> “Dạ, em nói thật là với mức dùng điện hiện tại thì nhà mình lắp chưa thật sự lợi. Khi nào nhà mình lắp thêm điều hoà hay mở kinh doanh, anh/chị gọi em tính lại nhé. Còn nếu có người quen dùng điện nhiều, anh/chị giới thiệu giúp em.”<br>→ Người được từ chối khéo thường trở thành <b>người giới thiệu đáng tin nhất</b>.</div>
  </section>

  <section class="card"><h2>🎮 Thử thách: nên tư vấn lắp hay khuyên chưa nên?</h2><div id="sortg"></div><div id="sortscore" style="margin-top:8px;font-weight:700"></div></section>
  `,
  init:el=>{
   const C=[['👴 Ông Sơn, hai ông bà già ở nhà, hoá đơn 350 nghìn/tháng.','no','Dùng quá ít điện, hoàn vốn rất lâu. Nói thật và nhờ ông giới thiệu người khác.'],
     ['🍲 Quán cơm bà Nga, hoá đơn 4 triệu/tháng, nấu nướng và điều hoà chạy cả ngày.','yes','Rất hợp: dùng nhiều điện đúng lúc có nắng.'],
     ['🏚️ Nhà anh Dũng, mái tôn 18 năm đã gỉ, định thay mái sang năm.','no','Nên thay mái trước. Có thể tư vấn kết hợp: thay mái và lắp điện mặt trời cùng lúc.'],
     ['🏖️ Homestay Hải Tiến, mùa hè 6 triệu/tháng, mùa đông 1,5 triệu.','yes','Rất hợp: nhu cầu cao nhất đúng vào mùa nắng nhất.'],
     ['🏢 Nhà chị Mai, mái bị toà nhà 5 tầng bên cạnh che bóng từ 12 giờ trưa.','no','Mất hơn nửa thời gian nắng tốt. Cần khảo sát kỹ; nhiều khả năng không đáng đầu tư.']];
   let right=0,done=0;
   $('#sortg',el).innerHTML=C.map((c,i)=>`<div class="case" data-i="${i}"><p>${c[0]}</p><div class="btn-row"><button class="btn ghost" data-v="yes">✅ Nên lắp</button><button class="btn ghost" data-v="no">✋ Chưa nên</button></div></div>`).join('');
   $$('.case',el).forEach(cs=>$$('button',cs).forEach(b=>b.onclick=()=>{
     const c=C[+cs.dataset.i],ok=b.dataset.v===c[1];cs.classList.add(ok?'ok':'no');$$('button',cs).forEach(x=>x.disabled=true);
     cs.insertAdjacentHTML('beforeend',`<div class="fb">${ok?'✅ Đúng!':'❌ Chưa đúng.'} ${c[2]}</div>`);done++;if(ok)right++;
     if(done===C.length)$('#sortscore',el).textContent=`Kết quả: ${right}/${C.length} tình huống đúng ${right===C.length?'🎉':''}`;
   }));
  },
  quiz:[
   {q:'Câu nào là “câu có số” tốt nhất?',o:['“Tiết kiệm nhiều lắm ạ.”','“Mùa hè giảm khoảng 800 nghìn/tháng, mùa đông khoảng 400 nghìn; em gửi bảng tính chi tiết.”','“Hoàn vốn cực nhanh.”','“Ai lắp cũng khen.”'],a:1,e:'Câu B có đủ 3 phần: con số, điều kiện (mùa) và bước tiếp theo (gửi bảng tính).'},
   {q:'Gặp khách hoá đơn rất thấp, bạn nên làm gì?',o:['Cố thuyết phục lắp hệ nhỏ nhất','Nói thật là chưa đáng đầu tư, và nhờ giới thiệu người quen dùng nhiều điện','Bỏ đi không nói gì','Báo giá thấp để chốt bằng được'],a:1,e:'Nói thật xây uy tín. Khách được tư vấn thật lòng thường trở thành người giới thiệu.'},
   {q:'Vì sao lời hứa quá đà đặc biệt nguy hiểm ở thị trường Thanh Hoá?',o:['Vì khách ở đây khó tính','Vì thông tin lan rất nhanh trong thôn xóm; một khách thất vọng ảnh hưởng tới rất nhiều khách khác','Vì luật cấm','Vì đối thủ sẽ kiện'],a:1,e:'Ở vùng quê, truyền miệng là kênh mạnh nhất, theo cả hai chiều tốt và xấu.'}
  ]},

 {id:'c0l4',title:'Một khách thành mười khách – và làm theo quy trình',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu vòng đời khách hàng và vì sao chăm sóc sau lắp đặt là marketing tốt nhất</li><li>Nắm lịch chăm sóc khách 12 tháng đầu</li><li>Có lời giới thiệu 30 giây của riêng mình</li></ul></section>

  <section class="card story"><h2>📖 Tình huống</h2>
   ${persona('👩','Chị Hoa – nhà nghỉ 12 phòng, Sầm Sơn','Khách hàng của Thanh Hoá Solar')}
   <p>3 tháng sau khi lắp, chị Hoa giới thiệu thêm <b>2 nhà nghỉ cùng phố</b>. Không phải vì được trả hoa hồng, mà vì:</p>
   <ul class="clean"><li>Tuần đầu, tư vấn viên gọi hỏi thăm và hướng dẫn chị xem app sản lượng</li><li>Mỗi tháng nhận một tin nhắn Zalo so sánh hoá đơn trước và sau</li><li>Trước mùa du lịch, đội đến vệ sinh tấm pin miễn phí</li></ul>
  </section>

  <section class="card"><h2>🔄 Vòng đời khách hàng</h2>${svgCycle()}
   <div class="tbl-wrap"><table class="tbl" style="margin-top:14px"><tr><th></th><th>Khách đến từ quảng cáo</th><th>Khách được giới thiệu</th></tr>
   <tr><td>Chi phí để có khách</td><td>Cao (tiền quảng cáo)</td><td>Thấp (quà cảm ơn)</td></tr>
   <tr><td>Mức độ tin ban đầu</td><td>Thấp, phải chứng minh từ đầu</td><td>Cao, đã có người bảo đảm</td></tr>
   <tr><td>Thời gian để chốt</td><td>Thường dài</td><td>Thường ngắn</td></tr></table></div>
   <small class="src">So sánh mang tính định tính, phổ biến trong bán hàng dịch vụ địa phương.</small>
  </section>

  <section class="card"><h2>📅 Lịch chăm sóc 12 tháng đầu</h2>
   <div class="tl">
    <div class="tl-item"><b>Ngày bàn giao</b>: hướng dẫn app giám sát, đặt biển “Nhà này dùng điện mặt trời – Thanh Hoá Solar”, chụp ảnh kỷ niệm (xin phép đăng).</div>
    <div class="tl-item"><b>Tuần 1</b>: gọi hỏi thăm, giải đáp thắc mắc.</div>
    <div class="tl-item"><b>Tháng 1</b>: gửi so sánh hoá đơn trước/sau qua Zalo.</div>
    <div class="tl-item"><b>Tháng 3</b>: kiểm tra, vệ sinh tấm pin; xin đánh giá và hỏi khéo về người quen có nhu cầu.</div>
    <div class="tl-item"><b>Tháng 6</b>: báo cáo sản lượng nửa năm.</div>
    <div class="tl-item"><b>Tháng 12</b>: bảo trì định kỳ năm, quà tri ân; mời tham gia nhóm Zalo khách hàng.</div>
   </div>
  </section>

  <section class="card"><h2>📋 Tư duy quy trình</h2>
   <p class="lead">Cùng một câu hỏi của khách, <b>3 thành viên và 20 cộng tác viên phải trả lời giống nhau</b>. Vì vậy Thanh Hoá Solar dùng chung một bộ công cụ:</p>
   <div class="grid2"><div class="mini"><h4>📝 Phiếu khám 10 câu</h4><p>Ai hỏi cũng đủ ý, không sót.</p></div><div class="mini"><h4>🧮 Bảng tính từ hoá đơn</h4><p>Cùng công thức, cùng số liệu gốc.</p></div><div class="mini"><h4>📄 Mẫu đề xuất 1 trang</h4><p>Khách nhận được bản trình bày giống nhau, chuyên nghiệp.</p></div><div class="mini"><h4>💬 Kịch bản xử lý băn khoăn</h4><p>Học ở Chương 8.</p></div></div>
  </section>

  <section class="card tool"><div class="tool-head">🎤 Tạo lời giới thiệu 30 giây của bạn</div>
   <div class="grid2"><div class="field"><label>Tên bạn</label><input type="text" id="pt-name" style="width:100%"></div>
   <div class="field"><label>Vai trò</label><select id="pt-role" style="width:100%"><option>tư vấn viên</option><option>cộng tác viên</option></select></div>
   <div class="field"><label>Khu vực phụ trách</label><input type="text" id="pt-area" value="Quảng Xương và Sầm Sơn" style="width:100%"></div>
   <div class="field"><label>Điểm khác biệt muốn nhấn mạnh</label><select id="pt-diff" style="width:100%"><option>Bên em không báo giá khi chưa xem hoá đơn và khảo sát mái</option><option>Bên em chăm sóc, vệ sinh tấm pin định kỳ, gọi là có mặt</option><option>Bên em có hỗ trợ trả góp qua ngân hàng</option></select></div></div>
   <div class="card note" id="pt-out" style="font-size:1.02rem;line-height:1.7;margin:10px 0"></div>
   <div class="btn-row"><button class="btn blue" data-copy="pt-out">📋 Sao chép</button><button class="btn ghost" id="pt-timer">⏱️ Bấm giờ đọc thử</button><span id="pt-time" class="muted"></span></div>
  </section>
  `,
  init:el=>{
   const n=$('#pt-name',el);n.value=S.name||'';
   const out=()=>{$('#pt-out',el).textContent=`Chào anh/chị, em là ${n.value||'[tên]'}, ${$('#pt-role',el).value} của Thanh Hoá Solar, phụ trách khu vực ${$('#pt-area',el).value||'[khu vực]'}. Bên em giúp các gia đình và hộ kinh doanh giảm tiền điện bằng điện mặt trời áp mái. ${$('#pt-diff',el).value}. Anh/chị chỉ cần gửi ảnh hoá đơn 3 tháng gần nhất, trong 24 giờ em gửi lại bảng tính cụ thể: nên lắp bao nhiêu, mùa hè và mùa đông tiết kiệm bao nhiêu, bao lâu thì hoàn vốn. Anh/chị có muốn em tính thử cho nhà mình không ạ?`};
   $$('input,select',el).forEach(x=>x.oninput=out);out();
   let t0=null,iv=null;$('#pt-timer',el).onclick=e=>{if(!t0){t0=Date.now();e.target.textContent='⏹️ Dừng';iv=setInterval(()=>{$('#pt-time',el).textContent=((Date.now()-t0)/1000).toFixed(0)+' giây'},200)}else{clearInterval(iv);const s=(Date.now()-t0)/1000;t0=null;e.target.textContent='⏱️ Bấm giờ đọc thử';$('#pt-time',el).innerHTML=`<b>${s.toFixed(0)} giây</b> – ${s<=35?'✅ Tốt!':'⚠️ Hơi dài, thử rút gọn hoặc nói gọn hơn.'}`}};
  },
  quiz:[
   {q:'Theo bài học, vì sao chị Hoa giới thiệu thêm khách?',o:['Vì được trả hoa hồng cao','Vì được chăm sóc chu đáo sau lắp đặt','Vì giá rẻ nhất thị trường','Vì là người quen'],a:1,e:'Chăm sóc sau lắp đặt (hỏi thăm, báo cáo, vệ sinh pin) tạo ra sự hài lòng và giới thiệu tự nhiên.'},
   {q:'Tháng thứ mấy là thời điểm tốt để vệ sinh pin và khéo hỏi về người quen có nhu cầu?',o:['Ngày bàn giao','Tháng 1','Tháng 3','Năm thứ 5'],a:2,e:'Sau khoảng 3 tháng, khách đã thấy rõ hiệu quả trên hoá đơn. Đây là lúc dễ xin đánh giá và giới thiệu nhất.'},
   {q:'Vì sao cả nhóm và cộng tác viên cần dùng chung phiếu khám, bảng tính, mẫu đề xuất?',o:['Để tiết kiệm giấy','Để mọi khách đều nhận tư vấn đúng và giống nhau, giữ uy tín thương hiệu','Vì luật yêu cầu','Không cần thiết'],a:1,e:'Quy trình chung giúp chất lượng ổn định khi đội ngũ mở rộng, và là nền tảng để đào tạo cộng tác viên.'}
  ]}
 ],
 cards:[
  ['Khách hàng thực sự mua những gì?','4 thứ: ① tiền điện giảm có con số ② sự yên tâm 25 năm ③ không phiền phức (dột, cháy, thủ tục) ④ niềm tin vào người tư vấn.'],
  ['Tư vấn theo “tư duy bác sĩ” là gì?','Khám trước (hỏi 10 câu, xem hoá đơn, khảo sát mái), kê đơn sau (đề xuất loại hệ, công suất, tiết kiệm).'],
  ['Quy trình tư vấn 7 bước?','① Làm quen, lắng nghe ② Xin hoá đơn 3–6 tháng ③ Hỏi 10 câu khám ④ Khảo sát mái ⑤ Lập đề xuất có số ⑥ Trình bày, giải đáp ⑦ Hẹn bước tiếp theo.'],
  ['Công thức “câu có số”?','Con số + Điều kiện (mùa, cách dùng) + Bước tiếp theo (gửi bảng tính, hẹn khảo sát).'],
  ['5 dấu hiệu khách chưa nên lắp?','Hoá đơn quá thấp · Mái yếu/sắp thay · Bóng che nặng · Sắp chuyển nhà/phá dỡ · Kỳ vọng sai, không chịu nghe.'],
  ['Lịch chăm sóc 12 tháng đầu?','Bàn giao (app, biển) → Tuần 1 hỏi thăm → Tháng 1 so sánh hoá đơn → Tháng 3 vệ sinh, xin giới thiệu → Tháng 6 báo cáo → Tháng 12 bảo trì, tri ân.'],
  ['Khách chê đắt hơn 11 triệu, nói thế nào?','Chia theo vòng đời: 11 triệu ÷ 300 tháng ≈ 37 nghìn/tháng cho sự yên tâm 25 năm.']
 ],
 field:{title:'Thực hành tư duy',tasks:['Ghi âm lời giới thiệu 30 giây, gửi nhóm Zalo để 2 thành viên còn lại góp ý','Hỏi 3 người quen: “Nếu lắp điện mặt trời, anh/chị lo nhất điều gì?”, ghi lại nguyên văn','Đóng vai với đồng đội: một người làm khách, một người hỏi đủ 10 câu khám trong tối đa 12 phút']}

{id:'c1',num:1,icon:'🧾',title:'Đọc hoá đơn và biểu giá điện',ctv:true,ready:true,
 desc:'Hoá đơn tiền điện là “phiếu xét nghiệm” của khách. Đọc đúng hoá đơn là bước đầu của mọi đề xuất chính xác.',
 badge:{ic:'🔎',name:'Thám tử hoá đơn'},
 lessons:[
 {id:'c1l1',title:'Giải phẫu một hoá đơn tiền điện',min:10,
  html:()=>{const b=calcBill(500);return `
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Biết 7 thông tin quan trọng trên hoá đơn và ý nghĩa của từng thông tin</li><li>Biết xin hoá đơn khéo qua Zalo</li></ul></section>

  <section class="card story"><h2>📖 Tình huống</h2>
   ${persona('👨','Anh Tuấn – Quảng Xương','Gửi ảnh hoá đơn tháng 6 qua Zalo')}
   <p><i>“Em xem giúp anh, nhà anh nên lắp bao nhiêu thì vừa?”</i> Trước khi trả lời, bạn cần đọc được hoá đơn này.</p>
  </section>

  <section class="card"><h2>🔍 Bấm vào các nút <span style="background:var(--sun);border-radius:50%;padding:0 8px">số</span> để khám phá hoá đơn</h2>
   <div class="bill">
    <div class="bill-top"><div><b>HOÁ ĐƠN TIỀN ĐIỆN</b><div class="muted" style="font-size:.8rem">Kỳ: Tháng 6/2026 (01/06 – 30/06)</div></div><div class="watermark">MẪU MINH HOẠ – KHÔNG PHẢI MẪU CHÍNH THỨC</div></div>
    <div class="bill-row"><button class="hs" data-h="1">1</button><span class="k">Khách hàng / Mã KH</span><span class="v">Nguyễn Văn Tuấn · PA0XXXXXXXXX</span></div>
    <div class="bill-row"><button class="hs" data-h="2">2</button><span class="k">Mục đích sử dụng</span><span class="v">Sinh hoạt · Công tơ 1 pha</span></div>
    <div class="bill-row"><button class="hs" data-h="3">3</button><span class="k">Chỉ số mới / cũ</span><span class="v">12.840 / 12.340</span></div>
    <div class="bill-row"><button class="hs" data-h="4">4</button><span class="k">Điện năng tiêu thụ</span><span class="v" style="color:var(--sky);font-size:1.05rem">500 kWh</span></div>
    <div class="bill-row"><button class="hs" data-h="5">5</button><span class="k">Chi tiết theo bậc</span><span class="v" style="font-weight:500;font-size:.82rem">${b.rows.filter(r=>r.q).map(r=>`${TIER_NAMES[r.i]}: ${r.q} × ${fmt(r.price)} = ${fmt(r.amt)}`).join('<br>')}</span></div>
    <div class="bill-row"><button class="hs" data-h="6">6</button><span class="k">Thuế GTGT (${S.settings.vat}%)</span><span class="v">${money(b.vat)}</span></div>
    <div class="bill-row" style="background:var(--sun-soft)"><button class="hs" data-h="7">7</button><span class="k">Tổng thanh toán</span><span class="v" style="font-size:1.1rem">${money(b.total)}</span></div>
   </div>
   <div class="hs-panel card note" id="hsp"><b>👆 Bấm một nút số để xem giải thích.</b> <span class="muted" id="hsc">Đã xem 0/7</span></div>
  </section>

  <section class="card"><h2>✅ 3 việc cần làm khi nhận ảnh hoá đơn</h2>
   <ol class="clean"><li><b>Ghi lại số kWh tiêu thụ</b> (mục 4), không chỉ số tiền.</li><li><b>Ghi lại mục đích sử dụng</b> (mục 2): sinh hoạt hay kinh doanh, 1 pha hay 3 pha.</li><li><b>Xin thêm hoá đơn các tháng khác</b>, ít nhất 1 tháng hè và 1 tháng đông. Một tháng thì chưa đủ để đánh giá.</li></ol>
   <div class="card insight" style="margin-bottom:0">💡 <b>Mẹo:</b> Thanh Hoá thuộc Tổng công ty Điện lực miền Bắc (EVNNPC). Hướng dẫn khách mở app chăm sóc khách hàng của điện lực để xem <b>lịch sử tiêu thụ 12 tháng</b>. Nhanh hơn nhiều so với tìm hoá đơn giấy.</div>
  </section>

  <section class="card"><h2>💬 Mẫu tin nhắn xin hoá đơn qua Zalo</h2>
   <div class="card note" id="zmsg" style="margin:0 0 10px">Dạ chào anh/chị, em là ${S.name||'[tên]'} bên Thanh Hoá Solar ạ. Để tính chính xác cho nhà mình, anh/chị chụp giúp em ảnh hoá đơn tiền điện 3 tháng gần nhất (nếu có thêm 1 tháng mùa hè và 1 tháng mùa đông thì càng tốt). Em sẽ gửi lại bảng phân tích trong vòng 24 giờ, hoàn toàn miễn phí ạ. Cảm ơn anh/chị!</div>
   <button class="btn blue" data-copy="zmsg">📋 Sao chép tin nhắn</button>
  </section>

  <section class="card"><h2>🎬 Clip: xem lịch sử tiêu thụ 12 tháng trên app</h2>${media('c1-app-cskh',SB_APP)}</section>
  `},
  init:el=>{
   const H={1:['Khách hàng / Mã khách hàng','Dùng để đối chiếu và tra cứu. Mã khách hàng ở Thanh Hoá thường bắt đầu bằng “PA”. <b>Không đăng ảnh hoá đơn có mã khách hàng lên mạng</b> khi chưa xin phép và che thông tin.'],
    2:['Mục đích sử dụng','<b>Rất quan trọng!</b> “Sinh hoạt” thì tính giá bậc thang; “Kinh doanh” hoặc “Sản xuất” dùng biểu giá khác (Bài 4). 1 pha hay 3 pha quyết định loại inverter.'],
    3:['Chỉ số công tơ','Tiêu thụ = Chỉ số mới − Chỉ số cũ = 12.840 − 12.340 = 500 kWh. Khi có điện mặt trời tự dùng, <b>công tơ quay chậm lại</b>, đó chính là phần tiết kiệm.'],
    4:['Điện năng tiêu thụ (kWh)','<b>Con số quan trọng nhất.</b> Mọi tính toán đều bắt đầu từ đây, không phải từ số tiền. 1 kWh = 1 “số điện”.'],
    5:['Chi tiết theo bậc','Điện sinh hoạt tính theo <b>6 bậc thang</b>, càng dùng nhiều thì những số điện sau càng đắt. Bài 2 sẽ học kỹ.'],
    6:['Thuế GTGT','Thuế giá trị gia tăng tính trên tiền điện. Hiện đang áp dụng mức giảm 8% (có thể thay đổi, chỉnh trong Cài đặt số liệu). Khi tính tiết kiệm, nhớ <b>cộng cả VAT</b>.'],
    7:['Tổng thanh toán','Con số khách nhớ nhất. Nếu khách chỉ nhớ “tháng nào cũng khoảng 1,5 triệu”, dùng máy tính ở Bài 2 để <b>quy ngược ra kWh</b>.']};
   const seen=new Set();
   $$('.hs',el).forEach(b=>b.onclick=()=>{const h=H[b.dataset.h];seen.add(b.dataset.h);b.classList.add('seen');
     $('#hsp',el).innerHTML=`<b>${b.dataset.h}. ${h[0]}</b><div style="margin-top:4px">${h[1]}</div><div class="muted" style="margin-top:6px;font-size:.85rem">Đã xem ${seen.size}/7 ${seen.size===7?'🎉 Bạn đã đọc hết hoá đơn!':''}</div>`});
  },
  quiz:[
   {q:'Con số quan trọng nhất trên hoá đơn để bắt đầu tính toán là gì?',o:['Tổng tiền thanh toán','Điện năng tiêu thụ (kWh)','Mã khách hàng','Thuế GTGT'],a:1,e:'Mọi tính toán (công suất, tiết kiệm) đều bắt đầu từ số kWh. Số tiền phụ thuộc biểu giá nên có thể gây nhầm.'},
   {q:'Vì sao phải xin hoá đơn cả tháng mùa hè và tháng mùa đông?',o:['Để làm hồ sơ cho đẹp','Vì cả lượng điện dùng và sản lượng mặt trời đều thay đổi theo mùa','Vì luật yêu cầu','Không cần thiết'],a:1,e:'Mùa hè dùng nhiều điều hoà và nắng nhiều; mùa đông ngược lại. Đề xuất chính xác phải tính cả hai mùa.'},
   {q:'Chỉ số cũ 8.215, chỉ số mới 8.635. Điện năng tiêu thụ là bao nhiêu?',o:['8.635 kWh','420 kWh','215 kWh','635 kWh'],a:1,e:'8.635 − 8.215 = 420 kWh.'}
  ]},

 {id:'c1l2',title:'Biểu giá bậc thang hoạt động thế nào?',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu cách tính tiền điện theo 6 bậc</li><li>Phân biệt <b>giá trung bình</b> và <b>giá của số điện cuối cùng</b></li><li>Quy đổi được từ số tiền ra số kWh khi khách chỉ nhớ tiền</li></ul></section>

  <section class="card"><h2>🪜 Hình dung: cầu thang giá điện</h2>
   <p class="lead">Giống leo cầu thang: <b>càng dùng nhiều, những số điện sau càng đắt</b>. 50 số đầu rẻ nhất, từ số thứ 401 trở đi đắt nhất.</p>
   ${svgStairs()}
   <small class="src">Đơn giá chưa gồm VAT, theo bảng số liệu gốc trong khoá học (cập nhật ${S.settings.updated}). Luôn kiểm tra biểu giá EVN hiện hành.</small>
  </section>

  ${toolCard('','t-bill')}

  <section class="card"><h2>✍️ Ví dụ tính tay: anh Tuấn, 500 kWh</h2>
   <details class="worked" open><summary>Xem từng bước</summary><div class="tbl-wrap"><table class="tbl"><tr><th>Bậc</th><th class="num">Số kWh</th><th class="num">Đơn giá</th><th class="num">Thành tiền</th></tr>
   ${(()=>{const b=calcBill(500);return b.rows.filter(r=>r.q).map(r=>`<tr><td>${TIER_NAMES[r.i]} (${TIER_RANGES[r.i]})</td><td class="num">${fmt(r.q)}</td><td class="num">${fmt(r.price)}</td><td class="num">${fmt(r.amt)}</td></tr>`).join('')+`<tr><td colspan="3">Cộng (chưa thuế)</td><td class="num">${fmt(b.sub)}</td></tr><tr><td colspan="3">Thuế GTGT ${S.settings.vat}%</td><td class="num">${fmt(b.vat)}</td></tr><tr class="tot"><td colspan="3">Tổng thanh toán</td><td class="num">${money(b.total)}</td></tr>`})()}
   </table></div>
   <p>👉 Giá trung bình: ${money(calcBill(500).total)} ÷ 500 ≈ <b>${money(calcBill(500).total/500)}/kWh</b>.<br>👉 Nhưng <b>số điện thứ 500</b> có giá ${fmt(S.settings.tiers[5])}đ + VAT ≈ <b>${money(marginal(500))}</b>, đắt hơn trung bình khá nhiều.</p></details>
  </section>

  <section class="card insight"><h2>💡 Điều cần nhớ</h2>
   <p style="margin:0">Khi khách hỏi “mỗi số điện bao nhiêu tiền?”, <b>đừng lấy tổng tiền chia cho số kWh</b>. Phần điện mặt trời thay thế là <b>những số điện cuối, đắt nhất</b>. Bài 3 sẽ cho thấy vì sao điều này làm điện mặt trời có lợi hơn bạn nghĩ.</p>
  </section>
  `,
  init:el=>billTool($('#t-bill',el),{kwh:500}),
  quiz:[
   {q:'Nhà dùng 350 kWh/tháng. Số điện thứ 350 thuộc bậc nào?',o:['Bậc 3','Bậc 4','Bậc 5','Bậc 6'],a:2,e:'Bậc 5 gồm các số điện từ 301 đến 400.'},
   {q:'Vì sao giá của số điện cuối cùng thường cao hơn giá trung bình?',o:['Vì cuối tháng giá tăng','Vì giá bậc thang tăng dần; số điện cuối rơi vào bậc đắt nhất','Vì thuế VAT','Vì công tơ sai'],a:1,e:'Giá trung bình bị kéo xuống bởi các bậc rẻ ở đầu; số điện cuối luôn nằm ở bậc cao nhất mà nhà đó dùng tới.'},
   {q:'Khách nói “tháng nào nhà chị cũng khoảng 2 triệu”. Bạn làm gì đầu tiên?',o:['Đề xuất ngay 10 kWp','Dùng chế độ “Khách chỉ nhớ số tiền” để quy ra số kWh, rồi xin hoá đơn để kiểm tra','Bảo chị tự tính','Nhân 2 triệu với 12'],a:1,e:'Quy ra kWh để có cơ sở tính toán ngay, sau đó xin hoá đơn thật để xác nhận.'}
  ]},

 {id:'c1l3',title:'Vì sao điện mặt trời “cắt” bậc cao nhất trước?',min:12,
  html:()=>{const b=calcBill(500),a=calcBill(300),sv=b.total-a.total;return `
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu vì sao mỗi kWh mặt trời tự dùng có giá trị cao</li><li>Tính được tiền tiết kiệm thật</li><li>Hiểu vì sao <b>lắp quá to</b> lại không có lợi</li></ul></section>

  <section class="card"><h2>🧠 Nguyên lý đơn giản</h2>
   <p class="lead">Điện mặt trời khách <b>tự dùng</b> làm công tơ quay chậm lại, nên số kWh mua của điện lực giảm đi. Phần bị bớt đi luôn là <b>những số điện cuối cùng, ở bậc đắt nhất</b>.</p>
   <div class="grid2"><div class="mini"><h4>Trước: 500 kWh</h4><p>Dùng đến bậc 6 (đắt nhất)</p></div><div class="mini"><h4>Sau: mặt trời tự dùng 200 kWh</h4><p>Chỉ còn mua 300 kWh, dừng ở bậc 4. Bậc 5 và 6 biến mất!</p></div></div>
  </section>

  ${toolCard('','t-cut')}

  <section class="card"><h2>✍️ Ví dụ tính tay: anh Tuấn</h2>
   <details class="worked" open><summary>Xem từng bước</summary>
   <ol class="clean"><li>Hoá đơn hiện tại (500 kWh): <b>${money(b.total)}</b></li><li>Điện mặt trời tự dùng 200 kWh, chỉ còn mua 300 kWh: <b>${money(a.total)}</b></li><li>Tiết kiệm: ${money(b.total)} − ${money(a.total)} = <b style="color:var(--leaf)">${money(sv)}/tháng</b></li><li>Giá trị mỗi kWh mặt trời: ${money(sv)} ÷ 200 ≈ <b>${money(sv/200)}</b>, cao hơn giá trung bình ${money(b.total/500)}!</li></ol></details>
  </section>

  <section class="card warn"><h2>⚠️ Đừng lắp quá to</h2>
   <p>Kéo thanh “điện mặt trời tự dùng” lên cao trong công cụ và nhìn biểu đồ: <b>càng về sau, mỗi kWh thêm vào càng rẻ</b> vì chỉ cắt các bậc rẻ.</p>
   <p style="margin-bottom:0">Thêm nữa, phần điện <b>dư phát lên lưới</b> bị giới hạn (tối đa 50% sản lượng theo quy định năm 2026) và được mua với giá thấp hơn nhiều so với giá điện khách phải mua (học ở Chương 4 và 7). Vì vậy, nguyên tắc của Thanh Hoá Solar là <b>thiết kế để tự dùng là chính</b>.</p>
  </section>
  `},
  init:el=>cutTool($('#t-cut',el),{use:500,solar:200}),
  quiz:[
   {q:'Nhà dùng 500 kWh, điện mặt trời tự dùng 100 kWh. Phần bị “cắt” nằm ở bậc nào?',o:['Bậc 1','Bậc 3','Bậc 6 (các số điện 401–500)','Đều các bậc'],a:2,e:'Còn mua 400 kWh nên các số điện 401–500 (bậc 6, đắt nhất) biến mất.'},
   {q:'Vì sao lắp quá to so với nhu cầu không có lợi?',o:['Vì tấm pin dễ hỏng','Vì phần thêm chỉ cắt các bậc rẻ, còn điện dư phát lên lưới bị giới hạn và giá thấp','Vì mái bị nặng','Vì điện lực phạt'],a:1,e:'Lợi ích mỗi kWh giảm dần; phần dư bán lên lưới không đáng kể. Thiết kế vừa đủ để tự dùng là tối ưu.'},
   {q:'Khi tính giá trị mỗi kWh mặt trời cho khách, nên dùng giá nào?',o:['Bậc 1','Giá trung bình hoá đơn','Giá của các bậc bị cắt (đã gồm VAT)','Giá bán điện dư'],a:2,e:'Phần tiết kiệm đến từ các bậc bị cắt, tức là những bậc cao nhất mà nhà khách đang dùng.'}
  ]},

 {id:'c1l4',title:'Đọc nhịp dùng điện: mùa, ngày–đêm, giá kinh doanh',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Đọc nhịp dùng điện theo mùa từ hoá đơn 12 tháng</li><li>Ước tính tỉ lệ dùng điện ban ngày</li><li>Biết hộ kinh doanh dùng biểu giá khác và vì sao họ là nhóm khách rất hợp</li></ul></section>

  <section class="card"><h2>🌦️ Nhịp mùa: khi nào dùng nhiều, khi nào có nắng?</h2>
   <p class="lead">Ở Thanh Hoá, <b>mùa hè</b> vừa nắng nhiều vừa dùng nhiều điều hoà, nên nhu cầu và sản lượng gặp nhau. <b>Mùa đông</b> (mưa phùn, nồm) sản lượng có thể giảm còn khoảng một nửa.</p>
  </section>
  ${toolCard('','t-season')}
  <section class="card insight" style="margin-top:-6px"><b>💡 Đọc biểu đồ:</b> chọn <b>chị Hoa</b> và thấy cột tiêu thụ tăng vọt đúng mùa du lịch, trùng với đỉnh sản lượng mặt trời. Đây là lý do <b>nhà nghỉ, homestay ven biển</b> (Sầm Sơn, Hải Tiến, Hải Hoà) là nhóm khách rất phù hợp.<br><span class="muted" style="font-size:.85rem">Lưu ý: chỉ phần điện dùng <b>đúng lúc có nắng</b> (hoặc qua pin lưu trữ) mới thành tiền tiết kiệm. Vì vậy cần biết thêm tỉ lệ dùng ban ngày.</span></section>

  ${toolCard('','t-day')}

  <section class="card"><h2>🏪 Hộ kinh doanh: biểu giá khác</h2>
   <p>Khách có mục đích sử dụng <b>“Kinh doanh”</b> trả giá cao hơn sinh hoạt và có thể được tính theo <b>3 khung giờ</b> nếu dùng công tơ nhiều giá:</p>
   <div class="tbl-wrap"><table class="tbl"><tr><th>Kinh doanh, cấp điện áp dưới 6 kV</th><th class="num">Giá tham khảo (đ/kWh, chưa VAT)</th></tr>
   <tr><td>Giờ bình thường</td><td class="num">≈ 3.000</td></tr><tr><td>Giờ thấp điểm</td><td class="num">≈ 1.800</td></tr><tr><td>Giờ cao điểm</td><td class="num">≈ 5.200</td></tr></table></div>
   <small class="src">Số liệu làm tròn, chỉ để minh hoạ mức chênh lệch. Thông tư 60/2025/TT-BCT quy định khung giờ mới: cao điểm 17h30–22h30 (thứ Hai đến thứ Bảy), thấp điểm 0h–6h; thời điểm áp dụng gắn với lần điều chỉnh giá bán lẻ. Kiểm tra EVN để biết khung giờ đang áp dụng. Khi cao điểm chuyển sang buổi tối, điện mặt trời không cắt được giờ cao điểm, nên pin lưu trữ trở nên đáng giá hơn với hộ kinh doanh.</small>
   <div class="card insight" style="margin-bottom:0">💡 Giá kinh doanh cao, lại dùng nhiều điện ban ngày, nên <b>mỗi kWh mặt trời đáng giá hơn</b> và hộ kinh doanh thường <b>hoàn vốn nhanh hơn</b> hộ gia đình. Đó là lý do nên ưu tiên quán ăn, nhà nghỉ, xưởng nhỏ khi tìm hợp đồng đầu tiên.</div>
  </section>

  <section class="card"><h2>🎯 Thực hành: phân tích 3 hồ sơ</h2><div id="prac"></div><button class="btn primary" id="pracBtn" style="margin-top:12px">Kiểm tra đáp án</button><div id="pracOut"></div></section>
  `,
  init:el=>{
   seasonTool($('#t-season',el),{who:'hoa'});dayTool($('#t-day',el));
   const P=[{k:'tuan',d:'Hai vợ chồng đi làm, con đi học. Nhà chủ yếu dùng điện buổi tối (điều hoà ngủ, bình nóng lạnh).',ans:['Hè','Thấp','Nên cân nhắc hệ có lưu trữ'],why:'Ban ngày nhà vắng nên phần lớn điện dùng buổi tối. Hệ bám lưới đơn thuần sẽ lãng phí, cần lưu trữ hoặc lắp nhỏ.'},
     {k:'hoa',d:'Nhà nghỉ 12 phòng: giặt là, bơm nước, nấu ăn, điều hoà sảnh chạy suốt ban ngày mùa hè.',ans:['Hè','Cao','Bám lưới là đủ'],why:'Dùng nhiều điện đúng lúc nắng nhất, giá kinh doanh cao. Rất hợp với hệ bám lưới.'},
     {k:'lam',d:'Trang trại gà: quạt thông gió chạy cả ngày lẫn đêm, mùa đông bật đèn sưởi ban đêm. Mất điện 30 phút giữa trưa hè là gà có thể chết hàng loạt.',ans:['Đều quanh năm','Trung bình','Nên cân nhắc hệ có lưu trữ'],why:'Tải khá đều quanh năm. Rủi ro mất điện cực lớn nên lưu trữ dự phòng là giá trị chính.'}];
   const OPT=[['Mùa dùng điện nhiều nhất',['Hè','Đông','Đều quanh năm']],['Tỉ lệ dùng ban ngày',['Cao','Trung bình','Thấp']],['Hướng đề xuất sơ bộ',['Bám lưới là đủ','Nên cân nhắc hệ có lưu trữ','Chưa nên lắp']]];
   $('#prac',el).innerHTML=P.map((p,i)=>{const pr=PROFILES[p.k];return `<div class="mini" style="margin:10px 0">${persona(pr.ic,pr.name,'Số liệu 12 tháng: xem công cụ phía trên')}<p style="margin-bottom:10px">${p.d}</p><div class="grid3">${OPT.map((o,j)=>`<div class="field" style="margin:0"><label style="font-size:.82rem">${o[0]}</label><select data-p="${i}" data-j="${j}" style="width:100%"><option value="">– chọn –</option>${o[1].map(x=>`<option>${x}</option>`).join('')}</select></div>`).join('')}</div><div class="pfb" data-p="${i}"></div></div>`}).join('');
   $('#pracBtn',el).onclick=()=>{let ok=0;P.forEach((p,i)=>{let r=0;$$(`select[data-p="${i}"]`,el).forEach(s=>{const good=s.value===p.ans[+s.dataset.j];s.style.borderColor=good?'var(--leaf)':'var(--red)';s.style.background=good?'var(--leaf-soft)':'var(--red-soft)';if(good)r++});ok+=r;
     $(`.pfb[data-p="${i}"]`,el).innerHTML=`<div style="margin-top:8px;font-size:.9rem;padding:8px 10px;border-radius:8px;background:${r===3?'var(--leaf-soft)':'var(--sun-soft)'}">${r===3?'✅':'💡'} <b>Đáp án:</b> ${p.ans.join(' · ')}. ${p.why}</div>`});
     $('#pracOut',el).innerHTML=`<p style="font-weight:700">Bạn đúng ${ok}/9 lựa chọn ${ok===9?'🎉 Xuất sắc!':''}</p>`};
  },
  quiz:[
   {q:'Vì sao nhà nghỉ ven biển Sầm Sơn rất hợp với điện mặt trời?',o:['Vì mái nhà nghỉ to','Vì nhu cầu điện cao nhất trùng mùa nắng nhất, và giá kinh doanh cao','Vì gần biển nhiều gió','Vì khách du lịch thích'],a:1,e:'Nhu cầu và sản lượng gặp nhau vào mùa hè, mỗi kWh lại đáng giá hơn do giá kinh doanh.'},
   {q:'Tỉ lệ dùng điện ban ngày của khách thấp. Nên đề xuất theo hướng nào?',o:['Lắp hệ bám lưới thật to','Cân nhắc hệ có lưu trữ, hoặc lắp nhỏ vừa đủ','Từ chối ngay','Không ảnh hưởng gì'],a:1,e:'Nếu phần lớn điện dùng buổi tối, điện mặt trời ban ngày sẽ dư. Lưu trữ giúp dịch chuyển điện sang buổi tối.'},
   {q:'Theo số liệu giả định của khoá học, sản lượng 1 kWp tháng 2 so với tháng 7 ở Thanh Hoá khoảng bao nhiêu?',o:['Bằng nhau','Khoảng một nửa','Gấp đôi','Khoảng 1/10'],a:1,e:'Khoảng 60 so với 135 kWh, tức là chưa tới một nửa. Phải nói rõ điều này với khách (nhớ “câu có số” ở Chương 0).'}
  ]}
 ],
 cards:[
  ['Điện sinh hoạt có mấy bậc giá? Giới hạn từng bậc?','6 bậc: 0–50 · 51–100 · 101–200 · 201–300 · 301–400 · từ 401 kWh. Càng lên cao càng đắt.'],
  ['Hai thông tin phải ghi lại đầu tiên khi đọc hoá đơn?','① Điện năng tiêu thụ (kWh) ② Mục đích sử dụng (sinh hoạt/kinh doanh, 1 pha/3 pha).'],
  ['Vì sao điện mặt trời “cắt” bậc cao nhất trước?','Điện tự dùng làm công tơ quay chậm lại; phần bị bớt đi là những số điện cuối cùng, ở bậc đắt nhất.'],
  ['Hộ dùng 500 kWh, mỗi kWh mặt trời tự dùng đáng giá khoảng bao nhiêu?','Khoảng 3.600–3.700đ (bậc 5–6, đã gồm VAT), cao hơn giá trung bình hoá đơn.'],
  ['Vì sao không nên lắp quá to?','Phần thêm chỉ cắt bậc rẻ hơn; điện dư phát lên lưới bị giới hạn và giá thấp. Thiết kế để tự dùng là chính.'],
  ['Sản lượng 1 kWp ở Thanh Hoá (giả định của khoá học)?','Khoảng 1.200 kWh/năm (≈100 kWh/tháng); tháng 2 khoảng 60, tháng 7 khoảng 135.'],
  ['Khách chỉ nhớ số tiền, làm gì?','Quy ngược ra kWh bằng máy tính hoá đơn, sau đó xin hoá đơn thật để kiểm tra.'],
  ['Nhóm khách nào rất hợp để làm hợp đồng đầu tiên?','Hộ kinh doanh dùng nhiều điện ban ngày, nhất là mùa hè: nhà nghỉ, quán ăn, xưởng nhỏ.']
 ],
 field:{title:'Thực hành với hoá đơn thật',tasks:['Xin 3 hoá đơn thật (người thân, hàng xóm). Với mỗi hoá đơn ghi: kWh, mục đích sử dụng, bậc cao nhất, giá trị 1 kWh mặt trời','Hướng dẫn 1 người cài app chăm sóc khách hàng của điện lực và xem lịch sử tiêu thụ 12 tháng','Với 1 hồ sơ: ước tính tỉ lệ dùng ban ngày bằng công cụ và ghi đề xuất sơ bộ (bám lưới hay cân nhắc lưu trữ)']}
},

{id:'c2',num:2,icon:'⚡',title:'Khái niệm điện cơ bản',ctv:false,ready:true,
 desc:'kW và kWh, kWp, điện 1 pha và 3 pha, tải ban ngày và ban đêm. Nắm chắc để không bao giờ bị khách hỏi “bí”.',
 badge:{ic:'⚡',name:'Hiểu kWh'},
 lessons:[
 {id:'c2l1',title:'kW và kWh: vòi nước và cái xô',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Phân biệt <b>công suất (kW)</b> và <b>điện năng (kWh)</b></li><li>Tính được điện năng của một thiết bị và tiền điện tương ứng</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2>${persona('👩','Chị Lan – Hoằng Hoá','Đang tìm hiểu lắp điện mặt trời')}<p style="margin:0"><i>“Em ơi, hệ 5 kW là mỗi ngày được 5 số điện à? Thế thì ít quá!”</i> Câu hỏi này cho thấy chị Lan đang nhầm <b>kW</b> với <b>kWh</b>. Rất nhiều khách nhầm như vậy.</p></section>
  <section class="card"><h2>🚰 Hình dung bằng vòi nước</h2>
   <div class="grid2"><div class="mini" style="border-top:4px solid var(--sky2)"><h4>kW – công suất</h4><p>Giống <b>độ mạnh của vòi nước</b>: mỗi lúc chảy ra nhanh hay chậm. Điều hoà 1,2 kW “mạnh” hơn quạt 0,05 kW.</p></div>
   <div class="mini" style="border-top:4px solid var(--sun)"><h4>kWh – điện năng (“số điện”)</h4><p>Giống <b>lượng nước trong xô</b>: vòi mạnh bao nhiêu × mở trong bao lâu. Hoá đơn tính tiền theo kWh.</p></div></div>
   <div class="card insight" style="margin-bottom:0"><b>Công thức vàng:</b> kWh = kW × số giờ. Ví dụ điều hoà 1,2 kW chạy 8 giờ = <b>9,6 kWh</b>; ấm siêu tốc 1,8 kW đun 10 phút (1/6 giờ) = <b>0,3 kWh</b>.</div>
  </section>
  ${toolCard('','t-kw')}
  <section class="card"><h2>🎮 Đúng hay sai?</h2>${tfGame([
   ['Ấm siêu tốc 1,8 kW tốn điện hơn điều hoà 1,2 kW trong một ngày.',false,'Sai. Ấm chỉ đun vài phút (~0,3 kWh), điều hoà chạy nhiều giờ (~9,6 kWh). Phải nhân với thời gian.'],
   ['1 kWh chính là “1 số điện” trên hoá đơn.',true,'Đúng.'],
   ['Hệ điện mặt trời 5 kWp mỗi ngày phát được 5 kWh.',false,'Sai. Mỗi ngày phát trung bình khoảng 15–17 kWh ở Thanh Hoá (Bài 2).'],
   ['Muốn giảm tiền điện, cần biết thiết bị nào chạy lâu, không chỉ thiết bị nào công suất lớn.',true,'Đúng. Bình nóng lạnh 2,5 kW chạy 30 phút = 1,25 kWh, ít hơn tủ lạnh chạy cả ngày.']])}</section>
  `,init:el=>kwTool($('#t-kw',el)),
  quiz:[{q:'Điều hoà 0,9 kW chạy 10 giờ tiêu thụ bao nhiêu điện?',o:['0,9 kWh','9 kWh','90 kWh','10 kWh'],a:1,e:'0,9 × 10 = 9 kWh.'},
   {q:'Hoá đơn tiền điện tính tiền theo đơn vị nào?',o:['kW','kWh','kWp','Volt'],a:1,e:'Tiền điện tính theo điện năng tiêu thụ (kWh, “số điện”).'},
   {q:'Ví dụ “vòi nước – cái xô”: kWh tương ứng với gì?',o:['Độ mạnh của vòi','Lượng nước trong xô','Màu của nước','Kích thước vòi'],a:1,e:'kW là độ mạnh dòng chảy; kWh là lượng tích luỹ theo thời gian.'}]},
 {id:'c2l2',title:'kWp, giờ nắng và điện 1 pha – 3 pha',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu kWp và ước tính nhanh sản lượng mỗi ngày</li><li>Trả lời đúng câu hỏi của chị Lan</li><li>Biết khi nào là điện 1 pha, khi nào 3 pha</li></ul></section>
  <section class="card"><h2>☀️ kWp là gì?</h2><p class="lead">kWp (kilowatt-peak) là <b>công suất đỉnh của dàn tấm pin</b> trong điều kiện thử nghiệm chuẩn (nắng 1.000 W/m², 25°C). Thực tế ngoài trời hiếm khi đạt mức này cả ngày.</p>
   <div class="card insight"><b>Ước tính nhanh tại Thanh Hoá (theo giả định của khoá học):</b><br>Sản lượng/ngày ≈ <b>kWp × 3,3</b> (trung bình năm) · mùa hè ≈ kWp × 4,4 · mùa đông ≈ kWp × 2,1<br><span class="muted" style="font-size:.88rem">3,3 là “số giờ nắng tương đương” đã trừ hao hụt hệ thống. Chương 3 dạy cách tra số thật cho từng địa chỉ.</span></div>
   <button class="btn ghost" data-reveal="r221">💬 Vậy trả lời chị Lan thế nào?</button>
   <div class="reveal" id="r221">“Dạ, 5 kW là <b>công suất</b> của dàn pin chị ạ, còn số điện tính theo kWh. Ở Thanh Hoá, hệ 5 kWp trung bình mỗi ngày phát khoảng <b>16 số điện</b>; mùa hè được khoảng 22 số, mùa đông khoảng 10 số. Tính ra mỗi tháng khoảng 500 số điện.”</div></section>
  <section class="card"><h2>🔌 Tấm pin (kWp) và inverter (kW)</h2><p>Công suất inverter thường <b>nhỏ hơn một chút</b> so với tổng công suất tấm pin. Tỉ lệ tấm pin/inverter khoảng <b>1,1–1,3</b> là phổ biến, vì tấm pin hiếm khi đạt công suất đỉnh. Ví dụ: 6 kWp tấm pin đi với inverter 5 kW là bình thường, không phải “lắp thiếu”.</p></section>
  <section class="card"><h2>⚡ Điện 1 pha hay 3 pha?</h2><div class="tbl-wrap"><table class="tbl"><tr><th></th><th>1 pha</th><th>3 pha</th></tr><tr><td>Thường gặp ở</td><td>Hầu hết nhà dân</td><td>Xưởng, nhà có máy móc lớn, khách sạn, trang trại lớn</td></tr><tr><td>Nhận biết</td><td>Công tơ 1 pha, 2 dây vào (pha + trung tính)</td><td>Công tơ 3 pha, 4 dây (3 pha + trung tính)</td></tr><tr><td>Inverter</td><td>Inverter 1 pha</td><td>Inverter 3 pha (hệ lớn)</td></tr></table></div>
   <div class="card warn" style="margin-bottom:0">⚠️ Lắp inverter 1 pha cho nhà điện 3 pha (hoặc ngược lại) là sai kỹ thuật. Luôn <b>chụp ảnh công tơ và tủ điện</b> khi khảo sát, để kỹ sư xác nhận.</div></section>
  <section class="card"><h2>🎮 Thử thách tính nhanh</h2>${tfGame([
   ['Hệ 4 kWp trung bình mỗi ngày phát khoảng 13 kWh.',true,'Đúng: 4 × 3,3 ≈ 13 kWh.'],
   ['Hệ 10 kWp, một ngày mùa đông âm u chắc chắn phát được 44 kWh.',false,'Sai: mùa đông chỉ khoảng 10 × 2,1 ≈ 21 kWh, ngày mưa phùn còn thấp hơn.'],
   ['Hệ 3 kWp mỗi tháng phát trung bình khoảng 300 kWh.',true,'Đúng: 3 × 100 ≈ 300 kWh/tháng.'],
   ['Inverter 5 kW đi với 6 kWp tấm pin là lắp thiếu, sai kỹ thuật.',false,'Sai: tỉ lệ 1,2 là phổ biến và hợp lý.']])}</section>
  `,
  quiz:[{q:'kWp là gì?',o:['Số điện phát mỗi ngày','Công suất đỉnh của dàn tấm pin trong điều kiện chuẩn','Dung lượng pin lưu trữ','Giá điện mỗi kWh'],a:1,e:'kWp đo công suất đỉnh, không phải điện năng.'},
   {q:'Hệ 5 kWp ở Thanh Hoá trung bình mỗi ngày phát khoảng?',o:['5 kWh','16 kWh','50 kWh','1,5 kWh'],a:1,e:'5 × 3,3 ≈ 16 kWh (theo giả định khoá học).'},
   {q:'Nhà có công tơ 3 pha, 4 dây vào. Cần lưu ý gì?',o:['Không cần lưu ý','Dùng inverter phù hợp điện 3 pha, kỹ sư xác nhận','Bỏ bớt 2 pha','Chỉ lắp được hệ độc lập'],a:1,e:'Loại inverter phải phù hợp số pha của công trình.'}]},
 {id:'c2l3',title:'Tải ban ngày – ban đêm',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Lập bảng tải điện của một ngôi nhà</li><li>Thấy rõ vì sao <b>giờ dùng điện</b> quyết định hiệu quả của điện mặt trời</li></ul></section>
  <section class="card"><h2>🧠 Điều cốt lõi</h2><p class="lead">Điện mặt trời chỉ có từ khoảng 6h đến 18h, mạnh nhất giữa trưa. Điện nào dùng <b>đúng lúc đó</b> mới được thay bằng điện mặt trời (nếu không có pin lưu trữ).</p></section>
  ${toolCard('','t-load')}
  ${toolCard('','t-prof')}
  <section class="card insight"><h2>💡 Đọc kết quả</h2><ul class="clean" style="margin:0"><li><b>Gia đình đi làm:</b> điện mặt trời phát lúc nhà vắng, tỉ lệ tự dùng thấp. Lắp nhỏ, hoặc cần pin lưu trữ.</li><li><b>Có người ở nhà:</b> khá hợp với hệ bám lưới cỡ vừa.</li><li><b>Quán cơm:</b> đường tải gần như “ôm” trọn đường mặt trời. Rất hợp!</li></ul></section>
  `,init:el=>{loadTool($('#t-load',el));profileTool($('#t-prof',el))},
  quiz:[{q:'Thiết bị nào sau đây dùng chủ yếu vào thời điểm có điện mặt trời?',o:['Điều hoà phòng ngủ ban đêm','Máy bơm nước buổi trưa','Sạc xe máy điện qua đêm','Đèn chiếu sáng'],a:1,e:'Bơm nước buổi trưa trùng giờ nắng nên dùng được điện mặt trời trực tiếp.'},
   {q:'“Tỉ lệ tự dùng” cao nghĩa là gì?',o:['Phần lớn điện mặt trời được dùng ngay trong nhà','Nhà dùng ít điện','Tấm pin hiệu suất cao','Bán được nhiều điện'],a:0,e:'Tỉ lệ tự dùng = phần điện mặt trời dùng tại chỗ / tổng điện mặt trời phát ra.'},
   {q:'Gia đình đi làm cả ngày, muốn dùng điện mặt trời buổi tối thì cần gì?',o:['Lắp thêm tấm pin','Pin lưu trữ (hệ hybrid)','Inverter to hơn','Không làm được'],a:1,e:'Pin lưu trữ giữ điện ban ngày để dùng buổi tối.'}]}
 ],

  ['Ước tính nhanh sản lượng/ngày ở Thanh Hoá?','≈ kWp × 3,3 (TB năm); hè ≈ × 4,4; đông ≈ × 2,1 (giả định khoá học).'],
  ['Hệ 5 kWp mỗi ngày phát bao nhiêu?','Trung bình ≈ 16 kWh; hè ≈ 22; đông ≈ 10. Khoảng 500 kWh/tháng.'],

{id:'c3',num:3,icon:'☀️',title:'Nắng và sản lượng ở Thanh Hoá',ctv:false,ready:true,
 desc:'Vì sao mùa đông phát ít; hướng mái, góc nghiêng, bóng che ảnh hưởng ra sao; tra số liệu thật bằng công cụ miễn phí.',
 badge:{ic:'☀️',name:'Người đọc nắng'},
 lessons:[
 {id:'c3l1',title:'Vì sao mùa đông sản lượng giảm?',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Giải thích được 3 lý do sản lượng mùa đông thấp</li><li>Nói thật, nói đúng với khách về mùa đông</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Khách đã lắp ở Nga Sơn gọi điện tháng 2: <i>“Sao tháng này app báo phát có một nửa tháng 7? Hệ hỏng rồi à?”</i> Hệ không hỏng. Nếu khi tư vấn đã nói rõ điều này, khách sẽ không lo lắng.</p></section>
  ${toolCard('','t-sun')}
  <section class="card"><h2>❄️ 3 lý do mùa đông phát ít</h2><div class="grid3">
   <div class="mini"><h4>1. Mặt trời thấp, ngày ngắn</h4><p>Giữa trưa tháng 12 mặt trời chỉ cao khoảng 47°, ngày ngắn hơn mùa hè khoảng 2 giờ 20 phút.</p></div>
   <div class="mini"><h4>2. Mây, mưa phùn, nồm</h4><p>Ở miền Bắc đây là <b>yếu tố lớn nhất</b>: nhiều ngày liên tục trời âm u.</p></div>
   <div class="mini"><h4>3. Bù lại: trời mát</h4><p>Tấm pin chạy hiệu quả hơn khi mát; mùa hè nóng làm hiệu suất giảm nhẹ. Nhưng không bù được hai yếu tố trên.</p></div></div></section>
  <section class="card insight"><h2>💬 Câu nói mẫu</h2><p style="margin:0">“Ở Thanh Hoá, tháng 2 hệ phát chỉ khoảng một nửa tháng 7 là bình thường anh ạ. Em đã tính cả mùa đông vào bảng hoàn vốn rồi, và anh có thể xem sản lượng từng ngày trên app.”</p></section>
  `,init:el=>sunPathTool($('#t-sun',el)),
  quiz:[{q:'Ở miền Bắc, yếu tố nào làm sản lượng mùa đông giảm nhiều nhất?',o:['Nhiệt độ thấp','Mây, mưa phùn, trời âm u kéo dài','Gió mùa','Tấm pin bị lạnh hỏng'],a:1,e:'Mây và mưa phùn làm giảm mạnh bức xạ tới tấm pin.'},
   {q:'Nhiệt độ thấp ảnh hưởng tấm pin thế nào?',o:['Làm hỏng tấm pin','Giúp hiệu suất tốt hơn một chút','Không phát điện được','Làm tăng tiền điện'],a:1,e:'Tấm pin có hệ số nhiệt âm: trời mát hiệu suất cao hơn một chút.'},
   {q:'Khách thấy sản lượng tháng 2 chỉ bằng nửa tháng 7. Bạn nói gì?',o:['Hệ hỏng rồi','Đó là bình thường ở Thanh Hoá; đã tính vào hoàn vốn; xem số liệu trên app','Do khách dùng sai','Lắp thêm tấm pin'],a:1,e:'Giải thích đúng và đã nói trước từ khi tư vấn thì khách sẽ yên tâm.'}]},
 {id:'c3l2',title:'Hướng mái, góc nghiêng, bóng che',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Biết hướng và góc tốt nhất ở Thanh Hoá</li><li>Đánh giá được mức ảnh hưởng của bóng che</li></ul></section>
  <section class="card"><h2>🧭 Quy tắc nhanh ở Thanh Hoá</h2><ul class="clean"><li><b>Hướng Nam</b> tốt nhất; Đông Nam, Tây Nam gần như tương đương.</li><li><b>Đông, Tây</b> giảm khoảng 10%; vẫn đáng lắp, nhất là khi mái chỉ có hướng đó.</li><li><b>Hướng Bắc</b> giảm nhiều; tránh nếu có lựa chọn khác.</li><li>Góc nghiêng khoảng <b>10–20°</b> là tốt; mái bằng thì nghiêng tối thiểu 5–10° để mưa tự rửa bụi.</li></ul></section>
  ${toolCard('','t-roof')}
  <section class="card"><h2>🌳 Bóng che: kẻ thù thầm lặng</h2>
   <svg viewBox="0 0 600 170" style="width:100%;height:auto;display:block"><rect width="600" height="170" rx="12" fill="#f4f7fb"/>${[0,1,2,3,4,5].map(i=>`<rect x="${40+i*70}" y="40" width="60" height="80" fill="${i===2?'#4a5a6a':'#174a80'}" stroke="#9cc3ee"/>`).join('')}<path d="M70 125 v15 h${5*70} v-15" stroke="#d14343" stroke-width="3" fill="none"/>${T(225,160,'1 chuỗi (string) 6 tấm nối tiếp',{s:12})}<ellipse cx="210" cy="80" rx="40" ry="50" fill="#2e3b48" opacity=".35"/>${T(210,30,'1 tấm bị che',{s:12,c:'#d14343'})}${T(500,70,'➜ Cả chuỗi',{s:15,c:'#d14343',w:800})}${T(500,95,'có thể giảm mạnh',{s:13,c:'#d14343'})}</svg>
   <p>Các tấm pin trong một chuỗi được nối <b>tiếp</b> như dây đèn nháy cũ: một tấm bị che có thể kéo cả chuỗi giảm sản lượng (tấm pin hiện đại có diode bypass nên giảm bớt, nhưng vẫn mất). Vì vậy:</p>
   <ul class="clean"><li>Ghi rõ vật che bóng, phía nào, che vào khoảng giờ nào.</li><li>Bố trí tấm tránh vùng bóng; chia chuỗi hợp lý (kỹ sư xử lý).</li><li>Che bóng nặng: cân nhắc bộ tối ưu hoá, micro inverter, hoặc khuyên chưa lắp.</li></ul></section>
  <section class="card"><h2>🎮 Mái nào đáng lắp?</h2>${choiceGame([
   {t:'Mái tôn hướng Tây, nghiêng 10°, không bị che.',a:0,fb:'Giảm khoảng 10% so với lý tưởng, vẫn tốt.'},
   {t:'Mái hướng Nam nhưng nhà 6 tầng bên cạnh che từ 11 giờ trưa.',a:1,fb:'Mất phần nắng tốt nhất. Nhiều khả năng không đáng; khảo sát kỹ.'},
   {t:'Mái bằng bê tông, có thể làm khung nghiêng hướng Nam 10°.',a:0,fb:'Rất tốt: chủ động được hướng và góc.'},
   {t:'Mái hướng Bắc dốc 35°, mặt Nam đã có bồn nước và giàn phơi.',a:1,fb:'Hướng Bắc dốc giảm rất nhiều. Cân nhắc dời bồn nước để dùng mặt Nam.'}],['👍 Đáng lắp','🤔 Cần cân nhắc'])}</section>
  `,init:el=>roofTool($('#t-roof',el)),
  quiz:[{q:'Hướng mái tốt nhất ở Thanh Hoá?',o:['Bắc','Nam','Đông','Không quan trọng'],a:1,e:'Hướng Nam (Đông Nam, Tây Nam gần tương đương).'},
   {q:'Vì sao mái bằng vẫn nên làm khung nghiêng ít nhất 5–10°?',o:['Cho đẹp','Để mưa tự rửa bụi và thoát nước','Để tăng công suất đỉnh','Theo quy định PCCC'],a:1,e:'Tấm nằm phẳng đọng bụi, đọng nước, làm giảm sản lượng.'},
   {q:'Một tấm trong chuỗi bị che bóng thì sao?',o:['Chỉ tấm đó giảm','Có thể kéo cả chuỗi giảm sản lượng','Không ảnh hưởng','Tấm đó hỏng'],a:1,e:'Các tấm nối tiếp nên ảnh hưởng lan ra cả chuỗi.'}]},
 {id:'c3l3',title:'Tra số liệu thật bằng công cụ miễn phí',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Tự tra sản lượng cho từng địa chỉ khách bằng Global Solar Atlas</li><li>Biết thêm công cụ PVGIS để tính theo tháng</li></ul></section>
  <section class="card"><h2>🎬 Clip hướng dẫn: Global Solar Atlas</h2>${media('c3-atlas',SB_ATLAS,'hướng dẫn sử dụng Global Solar Atlas')}</section>
  <section class="card"><h2>🔗 Hai công cụ miễn phí</h2><div class="grid2">
   <div class="mini"><h4>🌍 Global Solar Atlas</h4><p>Nhanh, dễ dùng. Đọc chỉ số <b>PVOUT</b> (kWh/kWp/năm) và biểu đồ theo tháng.<br><a href="https://globalsolaratlas.info" target="_blank" rel="noopener">globalsolaratlas.info ↗</a></p></div>
   <div class="mini"><h4>📈 PVGIS</h4><p>Của Uỷ ban châu Âu. Chọn được hướng, góc nghiêng, hao hụt; xuất bảng theo tháng.<br><a href="https://re.jrc.ec.europa.eu/pvg_tools/en/" target="_blank" rel="noopener">re.jrc.ec.europa.eu/pvg_tools ↗</a></p></div></div>
   <div class="card note" style="margin-bottom:0">📝 <b>Quy trình chuẩn:</b> tra PVOUT tại vị trí nhà khách → nhân hệ số mái (hướng, góc, bóng che) từ Bài 2 → nhân với kWp → ra sản lượng năm và tháng → đưa vào bảng tính hoàn vốn (Chương 8). Ghi rõ nguồn số liệu trong đề xuất.</div></section>
  <section class="card warn"><h2>⚠️ Lưu ý khi dùng số liệu</h2><p style="margin:0">Đây là số trung bình nhiều năm; năm thực tế có thể cao hoặc thấp hơn. Khi nói với khách, dùng khoảng (“khoảng 1.100–1.250 kWh/kWp/năm”) thay vì một con số tuyệt đối. Sau khi có công trình thật, dùng số liệu app giám sát để đối chiếu.</p></section>
  `,
  quiz:[{q:'Chỉ số PVOUT trên Global Solar Atlas cho biết gì?',o:['Giá điện','Sản lượng dự kiến cho 1 kWp mỗi năm','Nhiệt độ trung bình','Công suất inverter'],a:1,e:'PVOUT là sản lượng điện riêng, đơn vị kWh/kWp/năm.'},
   {q:'Muốn tính có hướng, góc nghiêng cụ thể và xuất bảng theo tháng, nên dùng?',o:['PVGIS','Bản đồ giấy','Hỏi hàng xóm','Không cần'],a:0,e:'PVGIS cho phép chọn hướng, góc và xuất số liệu theo tháng.'},

{id:'c4',num:4,icon:'🔀',title:'Chọn loại hệ thống',ctv:true,ready:true,

 lessons:[
 {id:'c4l1',title:'Ba loại hệ: điện chạy thế nào?',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu đường đi của điện trong 3 loại hệ ở 3 tình huống</li><li>Gỡ được hiểu lầm phổ biến nhất: <b>“có điện mặt trời thì mất điện vẫn có điện”</b></li></ul></section>
  ${toolCard('','t-flow')}
  <section class="card"><h2>📋 So sánh nhanh</h2><div class="tbl-wrap"><table class="tbl"><tr><th></th><th>Bám lưới</th><th>Hybrid có lưu trữ</th><th>Độc lập</th></tr>
   <tr><td>Chi phí</td><td>Thấp nhất</td><td>Cao hơn (thêm pin, inverter hybrid)</td><td>Cao (pin lớn)</td></tr>
   <tr><td>Dùng điện buổi tối</td><td>❌ Dùng điện lưới</td><td>✅ Từ pin</td><td>✅ Chỉ từ pin</td></tr>
   <tr><td>Khi lưới mất điện</td><td>❌ Cũng mất điện</td><td>✅ Vẫn có điện cho tải ưu tiên</td><td>✅ Không phụ thuộc lưới</td></tr>
   <tr><td>Hợp với</td><td>Hộ kinh doanh, nhà dùng nhiều điện ban ngày</td><td>Gia đình dùng điện tối, nơi hay mất điện, trang trại</td><td>Nơi chưa có điện lưới</td></tr></table></div></section>
  <section class="card warn"><h2>⚠️ Hiểu lầm số 1</h2><p style="margin:0">Hệ <b>bám lưới</b> sẽ <b>tự ngắt khi lưới mất điện</b>, kể cả giữa trưa nắng, để bảo vệ thợ sửa đường dây (chống “đảo điện”). Nếu khách mua vì muốn có điện khi mất điện mà bạn bán hệ bám lưới, khách sẽ thất vọng ngay lần mất điện đầu tiên.</p></section>
  `,init:el=>flowTool($('#t-flow',el)),
  quiz:[{q:'Lưới mất điện giữa trưa nắng, nhà dùng hệ bám lưới thì sao?',o:['Vẫn có điện từ tấm pin','Mất điện vì inverter tự ngắt','Điện mạnh hơn','Pin tự xả'],a:1,e:'Inverter bám lưới tự ngắt khi mất lưới để đảm bảo an toàn.'},
   {q:'Hệ nào cho phép dùng điện mặt trời vào buổi tối?',o:['Bám lưới','Hybrid có lưu trữ','Cả hai','Không hệ nào'],a:1,e:'Cần pin lưu trữ để tích điện ban ngày.'},
   {q:'Hệ độc lập phù hợp nhất với?',o:['Nhà phố trung tâm','Chòi canh, trang trại xa chưa có điện lưới','Khách sạn lớn','Nhà máy'],a:1,e:'Hệ độc lập dành cho nơi không có lưới điện.'}]},
 {id:'c4l2',title:'Chống phát ngược và bán điện dư',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu “chống phát ngược” (zero export) là gì</li><li>Nắm quy định bán điện dư năm 2026 ở mức tư vấn</li><li>Vì sao vẫn thiết kế <b>để tự dùng là chính</b></li></ul></section>
  <section class="card"><h2>🔁 Điện dư đi đâu?</h2><p>Khi điện mặt trời phát nhiều hơn nhà đang dùng, phần dư có 3 hướng:</p>
   <div class="grid3"><div class="mini"><h4>🔋 Sạc pin</h4><p>Nếu là hệ hybrid. Tốt nhất vì dùng lại buổi tối.</p></div><div class="mini"><h4>⛔ Chặn lại</h4><p><b>Chống phát ngược</b>: inverter đo dòng tại điểm đấu nối và tự giảm công suất để không phát lên lưới. Phần dư bị bỏ phí.</p></div><div class="mini"><h4>💸 Bán lên lưới</h4><p>Theo quy định hiện hành, cần thủ tục và hợp đồng mua bán điện dư với điện lực.</p></div></div></section>
  <section class="card note"><h2>📜 Quy định bán điện dư (cập nhật 2026)</h2><ul class="clean"><li>Nghị định 58/2025/NĐ-CP (3/3/2025) cho phép bán điện dư tối đa <b>20%</b> sản lượng.</li><li>Nghị định <b>243/2026/NĐ-CP</b> (26/6/2026) nâng lên tối đa <b>50% sản lượng điện phát ra</b>, áp dụng cho nhiều đối tượng, trong đó có hộ gia đình nhà ở riêng lẻ.</li><li>Giá mua điện dư gắn với <b>giá điện năng thị trường bình quân năm trước</b>, không vượt mức trần quy định, nên <b>thấp hơn nhiều</b> so với giá điện bạn phải mua ở bậc cao.</li><li>Người bán điện dư phải làm thủ tục giấy phép hoạt động điện lực, <b>trừ trường hợp được miễn</b> theo quy định.</li></ul>
   <small class="src">Tóm tắt theo báo chí đưa tin về Nghị định 243/2026/NĐ-CP. Luôn đối chiếu văn bản gốc và hỏi Điện lực địa phương trước khi tư vấn chi tiết (Chương 7).</small></section>
  <section class="card insight"><h2>💡 Vì sao vẫn thiết kế để tự dùng?</h2><p style="margin:0">Mỗi kWh <b>tự dùng</b> giúp khách tiết kiệm khoảng 3.400–3.700đ (bậc cao, đã VAT). Mỗi kWh <b>bán đi</b> chỉ được giá thấp hơn nhiều. Vì vậy: chọn công suất vừa với nhu cầu, bán điện dư chỉ là <b>phần thưởng thêm</b>, không đưa vào lời hứa hoàn vốn.</p></section>
  <section class="card">${scenario('Khách hỏi: “Lắp thật to rồi bán điện cho EVN kiếm lời được không em?”',[
   {k:'bad',t:'A. “Được anh, lắp càng to càng lãi!”',fb:'❌ Sai: giá mua điện dư thấp, có giới hạn tỷ lệ và cần thủ tục. Hứa thế này là hứa sai.'},
   {k:'good',t:'B. “Bán được nhưng giá thấp và có giới hạn, anh ạ. Lời nhất là dùng tại chỗ, vì mỗi số điện tự dùng giúp anh bớt khoảng 3.500đ. Em tính công suất vừa với nhà mình, phần dư bán thêm coi như thưởng.”',fb:'✅ Chính xác, có số, đúng quy định.'},
   {k:'mid',t:'C. “Chính sách hay thay đổi lắm, anh đừng bán.”',fb:'⚠️ Né tránh. Khách cần thông tin rõ ràng, không phải lời khuyên chung chung.'}])}</section>
  `,
  quiz:[{q:'“Chống phát ngược” là gì?',o:['Chống sét','Inverter tự giảm công suất để không phát điện lên lưới','Chống trộm tấm pin','Công tơ hai chiều'],a:1,e:'Zero export giữ cho điện không chạy ngược lên lưới.'},
   {q:'Theo Nghị định 243/2026, tỷ lệ điện dư tối đa được bán là bao nhiêu?',o:['20% công suất','50% sản lượng điện phát ra','100%','Không được bán'],a:1,e:'Nâng từ 20% lên 50% sản lượng (theo báo chí đưa tin; đối chiếu văn bản gốc).'},
   {q:'Vì sao không nên đưa tiền bán điện dư vào lời hứa hoàn vốn?',o:['Vì bị cấm','Vì giá thấp, có giới hạn, cần thủ tục và có thể thay đổi','Vì khách không thích','Vì không tính được'],a:1,e:'Chỉ coi là phần thưởng thêm; lời hứa dựa trên phần tự dùng.'}]},

 {id:'c5l2',title:'Inverter: “bộ não” của hệ thống',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Phân biệt inverter string, hybrid, micro</li><li>Hiểu MPPT và vì sao mái 2 hướng cần lưu ý</li></ul></section>
  <section class="card"><h2>🧠 Inverter làm gì?</h2><p class="lead">Biến điện <b>một chiều (DC)</b> từ tấm pin thành điện <b>xoay chiều (AC)</b> dùng trong nhà, đồng thời điều khiển, bảo vệ và giám sát cả hệ.</p>
   <div class="tbl-wrap"><table class="tbl"><tr><th>Loại</th><th>Đặc điểm</th><th>Hợp với</th></tr><tr><td>String bám lưới</td><td>Một inverter cho một hoặc vài chuỗi tấm; rẻ, bền</td><td>Hệ bám lưới phổ biến</td></tr><tr><td>Hybrid</td><td>Quản lý cả tấm pin, pin lưu trữ và lưới; có chế độ dự phòng mất điện</td><td>Hệ có lưu trữ</td></tr><tr><td>Micro inverter</td><td>Mỗi 1–4 tấm một bộ nhỏ; giảm ảnh hưởng bóng che, mái nhiều hướng</td><td>Mái phức tạp, bị che bóng; chi phí cao hơn</td></tr></table></div></section>
  <section class="card"><h2>🎯 MPPT: vì sao mái 2 hướng cần 2 MPPT?</h2><p>MPPT là bộ “dò điểm công suất tối ưu”. Hai mặt mái khác hướng (ví dụ Đông và Tây) nhận nắng khác nhau, nên phải đi vào <b>2 MPPT riêng</b>; nếu gộp chung một MPPT, cả hai chuỗi bị kéo xuống. Khi khảo sát mái nhiều hướng, ghi rõ để kỹ sư chọn inverter phù hợp.</p></section>
  <section class="card"><h2>✅ 5 điều cần ghi rõ về inverter trong báo giá</h2><ol class="clean"><li>Hãng, mã sản phẩm, công suất (kW), 1 pha hay 3 pha</li><li>Loại: bám lưới hay hybrid; dải điện áp pin (nếu hybrid)</li><li>Số MPPT</li><li>Thời hạn bảo hành (thường 5–10 năm) và nơi bảo hành tại Việt Nam</li><li>Vị trí lắp: khô, thoáng, tránh nắng chiếu trực tiếp và mưa hắt</li></ol>
   <div class="card insight" style="margin-bottom:0">💡 Inverter là thiết bị <b>nhiều khả năng phải thay một lần</b> trong vòng đời 25 năm. Nói trước với khách và đưa chi phí này vào bảng hoàn vốn (Chương 8).</div></section>
  `,
  quiz:[{q:'Inverter chuyển đổi điện thế nào?',o:['AC sang DC','DC từ tấm pin sang AC dùng trong nhà','Tăng giá điện','Lưu điện'],a:1,e:'Tấm pin tạo DC; thiết bị trong nhà dùng AC.'},
   {q:'Mái có 2 mặt hướng Đông và Tây cần lưu ý gì?',o:['Chỉ lắp 1 mặt','Đi vào 2 MPPT riêng','Dùng tấm to hơn','Không lắp được'],a:1,e:'Hai hướng nắng khác nhau cần dò điểm tối ưu riêng.'},
   {q:'Loại inverter nào giúp giảm ảnh hưởng bóng che tốt nhất?',o:['String','Micro inverter','Hybrid','Không loại nào'],a:1,e:'Micro inverter xử lý từng tấm riêng nên một tấm bị che ít ảnh hưởng tấm khác.'}]},
 {id:'c5l3',title:'Pin lưu trữ',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu dung lượng, độ xả sâu (DoD), số chu kỳ</li><li>Tính được dung lượng pin phù hợp</li></ul></section>
  <section class="card"><h2>🔋 3 con số quan trọng</h2><div class="grid3"><div class="mini"><h4>kWh danh định</h4><p>Lượng điện pin chứa được, ví dụ 10 kWh.</p></div><div class="mini"><h4>DoD – độ xả sâu</h4><p>Phần được phép dùng. Pin 10 kWh, DoD 90% thì dùng được khoảng 9 kWh.</p></div><div class="mini"><h4>Số chu kỳ, bảo hành</h4><p>Một chu kỳ = sạc đầy rồi xả. Pin LiFePO4 thường công bố hàng nghìn chu kỳ; bảo hành thường 5–10 năm.</p></div></div></section>
  <section class="card"><h2>⚖️ LiFePO4 và ắc quy chì</h2><div class="tbl-wrap"><table class="tbl"><tr><th></th><th>LiFePO4 (lithium sắt phốt phát)</th><th>Ắc quy axit chì</th></tr><tr><td>Tuổi thọ</td><td>Dài, nhiều chu kỳ</td><td>Ngắn, ít chu kỳ</td></tr><tr><td>Độ xả sâu</td><td>Cao (~90%)</td><td>Thấp (~50%)</td></tr><tr><td>An toàn nhiệt</td><td>Tốt, phổ biến cho nhà ở</td><td>Có khí, cần thông gió</td></tr><tr><td>Giá ban đầu</td><td>Cao hơn</td><td>Rẻ hơn</td></tr></table></div><p class="muted" style="font-size:.88rem">Hiện nay hệ hybrid gia đình chủ yếu dùng LiFePO4. Luôn kiểm tra pin có <b>tương thích</b> (giao tiếp) với inverter đã chọn.</p></section>
  ${toolCard('','t-bat')}
  `,init:el=>batTool($('#t-bat',el)),
  quiz:[{q:'Pin 10 kWh, DoD 90%, dùng được khoảng?',o:['10 kWh','9 kWh','1 kWh','90 kWh'],a:1,e:'10 × 90% = 9 kWh.'},
   {q:'Vì sao hệ gia đình hiện nay chủ yếu dùng LiFePO4?',o:['Rẻ nhất','Tuổi thọ dài, xả sâu, an toàn nhiệt tốt','Nhẹ nhất','Không cần inverter'],a:1,e:'LiFePO4 cân bằng tốt giữa tuổi thọ, an toàn và hiệu quả.'},
   {q:'Nhà cần 6 kWh buổi tối và 1 kW tải ưu tiên trong 3 giờ khi mất điện. Dung lượng cần ít nhất (DoD 90%)?',o:['3,3 kWh','6,7 kWh','20 kWh','1 kWh'],a:1,e:'Lấy nhu cầu lớn hơn (6 kWh) ÷ 0,9 ≈ 6,7 kWh, làm tròn mô-đun lên 10 kWh.'}]},

  `,init:el=>quoteGame($('#t-quote',el)),

 {id:'c6l1',title:'Ba loại mái và cách lắp',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Biết cách lắp trên mái tôn, mái ngói, mái bê tông</li><li>Nhận ra mái nguy hiểm: <b>fibro xi măng</b></li></ul></section>
  <section class="card"><h2>🏗️ Mặt cắt minh hoạ</h2><div class="grid3">
   <div class="mini"><h4>Mái tôn</h4><svg viewBox="0 0 200 120" style="width:100%"><rect x="20" y="20" width="160" height="12" rx="3" fill="#174a80"/><rect x="40" y="36" width="120" height="6" fill="#c0c8d2"/><path d="M10 62 q10 -14 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" stroke="#7a8794" stroke-width="4" fill="none"/><rect x="60" y="42" width="6" height="40" fill="#d14343"/><rect x="134" y="42" width="6" height="40" fill="#d14343"/><rect x="20" y="82" width="160" height="14" fill="#a0784f"/>${T(100,112,'Vít/kẹp vào xà gồ + gioăng',{s:10})}</svg><p>Phổ biến nhất. Kẹp chuyên dụng hoặc vít bắt vào <b>xà gồ</b>, có gioăng cao su và keo chống dột.</p></div>
   <div class="mini"><h4>Mái ngói</h4><svg viewBox="0 0 200 120" style="width:100%"><rect x="20" y="16" width="160" height="12" rx="3" fill="#174a80"/><rect x="40" y="32" width="120" height="6" fill="#c0c8d2"/>${[0,1,2,3,4,5].map(i=>`<path d="M${14+i*30} 60 q15 -16 30 0" fill="#c8643b" stroke="#9a4a2a"/>`).join('')}<path d="M66 38 v14 q0 10 10 10 h4 v20" stroke="#d14343" stroke-width="4" fill="none"/><rect x="20" y="82" width="160" height="14" fill="#a0784f"/>${T(100,112,'Móc ngói luồn dưới viên ngói',{s:10})}</svg><p>Dùng <b>móc ngói</b> bắt vào kết cấu đỡ. Ngói dễ vỡ khi đi lại: chuẩn bị ngói thay thế.</p></div>
   <div class="mini"><h4>Mái bê tông</h4><svg viewBox="0 0 200 120" style="width:100%"><path d="M30 40 L170 20" stroke="#174a80" stroke-width="12"/><path d="M50 42 V80 M150 28 V80 M50 42 L150 80" stroke="#c0c8d2" stroke-width="5"/><rect x="40" y="76" width="22" height="10" fill="#9aa7b4"/><rect x="140" y="76" width="22" height="10" fill="#9aa7b4"/><rect x="10" y="86" width="180" height="14" fill="#b8c0c8"/>${T(100,114,'Khung nghiêng + chân đế',{s:10})}</svg><p>Làm <b>khung nghiêng</b> chủ động hướng và góc; chân đế bắt nở hoặc đổ bê tông, xử lý chống thấm vị trí khoan. Kiêm che nắng tầng thượng.</p></div></div></section>
  <section class="card warn"><h2>⛔ Mái fibro xi măng: nguy hiểm</h2><p style="margin:0">Mái fibro xi măng (tấm lợp xi măng sóng, hay gặp ở chuồng trại, nhà kho cũ) <b>giòn, dễ vỡ</b>; người bước lên có thể rơi xuyên mái. <b>Không bước trực tiếp lên mái fibro</b>, và thường không nên lắp tấm pin lên đó. Đề xuất lắp trên mái khác hoặc thay mái trước.</p></section>
  <section class="card"><h2>⚖️ Mái có chịu được không?</h2><p>Tấm pin cộng khung nặng khoảng <b>12–15 kg/m²</b> (tấm 27,5 kg trên 2,58 m² ≈ 10,6 kg/m², cộng thêm khung). Mái nhà dân thông thường thường chịu được, nhưng với <b>xà gồ yếu, mục, gỉ</b> hoặc <b>mái xưởng khẩu độ lớn</b>, cần kỹ sư kết cấu đánh giá.</p></section>
  <section class="card"><h2>🎮 Lắp được không?</h2>${choiceGame([
   {t:'Mái tôn 5 năm, xà gồ thép hộp còn tốt.',a:0,fb:'Tốt: lắp bình thường.'},
   {t:'Mái chuồng gà lợp fibro xi măng đã 15 năm.',a:1,fb:'Nguy hiểm: không bước lên, không lắp. Chọn mái khác.'},
   {t:'Mái bằng bê tông có dấu hiệu thấm ở góc.',a:2,fb:'Xử lý chống thấm trước, sau đó làm khung nghiêng.'},
   {t:'Mái ngói cũ, nhiều viên đã vỡ, li tô mục.',a:2,fb:'Phải sửa mái, thay li tô trước khi lắp.'}],['✅ Lắp được','⛔ Không lắp','🛠️ Sửa trước rồi lắp'])}</section>
  `,
  quiz:[{q:'Trên mái tôn, khung phải bắt vào đâu?',o:['Tôn trơn','Xà gồ, có gioăng chống dột','Máng nước','Dây buộc'],a:1,e:'Xà gồ là kết cấu chịu lực.'},
   {q:'Vì sao không bước lên mái fibro xi măng?',o:['Vì trơn','Vì giòn, dễ vỡ, người có thể rơi xuyên mái','Vì nóng','Vì dơ'],a:1,e:'Đây là nguyên nhân tai nạn ngã cao nghiêm trọng.'},
   {q:'Tải trọng thêm của tấm pin và khung khoảng?',o:['1–2 kg/m²','12–15 kg/m²','100 kg/m²','Không đáng kể'],a:1,e:'Khoảng 12–15 kg/m²; mái yếu cần đánh giá kết cấu.'}]},
 {id:'c6l2',title:'Chống bão và an toàn trên mái',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu gió bão tác động lên dàn pin thế nào</li><li>Thuộc quy tắc an toàn khi làm việc trên mái</li></ul></section>
  <section class="card"><h2>🌪️ Gió hút ngược ở mép mái</h2>
   <svg viewBox="0 0 600 190" style="width:100%;height:auto;display:block"><rect width="600" height="190" rx="12" fill="#eaf4ff"/><polygon points="80,170 160,80 440,80 520,170" fill="#9aa7b4"/><rect x="190" y="70" width="220" height="10" fill="#174a80"/>${[0,1,2].map(i=>`<path class="flow" d="M${20} ${60+i*14} C120 ${60+i*14} 160 ${40+i*10} 220 ${48+i*6} S380 ${40+i*8} 580 ${50+i*10}" stroke="#1e74c4" stroke-width="2.5" fill="none"/>`).join('')}<path class="a-pulse" d="M200 66 V30 M196 36 L200 30 L204 36" stroke="#d14343" stroke-width="3" fill="none"/><path class="a-pulse" d="M400 66 V30 M396 36 L400 30 L404 36" stroke="#d14343" stroke-width="3" fill="none"/>${T(300,24,'Lực hút ngược mạnh nhất ở mép và góc mái',{s:13,c:'#d14343'})}</svg>
   <ul class="clean"><li>Thanh Hoá thường xuyên chịu ảnh hưởng của bão và gió mạnh. Mép và góc mái chịu <b>lực hút ngược</b> lớn nhất.</li><li>Giữ khoảng cách an toàn từ dàn pin tới mép mái; tăng điểm kẹp ở vùng mép.</li><li>Bắt vào xà gồ, không bắt vào tôn trơn; siết đúng lực.</li><li><b>Kiểm tra lại bulông, kẹp sau mỗi mùa bão</b>, ghi vào lịch bảo trì.</li></ul></section>
