 field:{title:'Bảng tải điện nhà mình',tasks:['Lập bảng tải điện cho chính nhà bạn bằng công cụ ở Bài 3, ghi lại kWh/tháng và tỉ lệ ban ngày','So sánh kết quả với hoá đơn thật; giải thích chênh lệch','Giải thích cho 1 người thân sự khác nhau giữa kW và kWh bằng ví dụ vòi nước']}
},

/* ------------------------------------------------------------------ CHƯƠNG 3 */
{id:'c3',num:3,icon:'☀️',title:'Nắng và sản lượng ở Thanh Hoá',ctv:false,ready:true,
 desc:'Vì sao mùa đông phát ít; hướng mái, góc nghiêng, bóng che ảnh hưởng ra sao; tra số liệu thật bằng công cụ miễn phí.',
 badge:{ic:'☀️',name:'Người đọc nắng'},
 lessons:[
 {id:'c3l1',title:'Vì sao mùa đông sản lượng giảm?',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Giải thích được 3 lý do sản lượng mùa đông thấp</li><li>Nói thật, nói đúng với khách về mùa đông</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Khách đã lắp ở Nga Sơn gọi điện tháng 2: <i>“Sao tháng này app báo phát có một nửa tháng 7? Hệ hỏng rồi à?”</i> Hệ không hỏng. Nếu khi tư vấn đã nói rõ điều này, khách sẽ không lo lắng.</p></section>
  ${toolCard('','t-sun')}
  <section class="card"><h2>❄️ 3 lý do mùa đông phát ít</h2><div class="grid3">
   <div class="mini"><h4>1. Mặt trời thấp, ngày ngắn</h4><p>Giữa trưa tháng 12 mặt trời chỉ cao khoảng 47°, ngày ngắn hơn mùa hè khoảng 2 giờ 20 phút.</p></div>
   <div class="mini"><h4>2. Mây, mưa phùn, nồm</h4><p>Ở miền Bắc đây là <b>yếu tố lớn nhất</b>: nhiều ngày liên tục trời âm u.</p></div>
   <div class="mini"><h4>3. Bù lại: trời mát</h4><p>Tấm pin chạy hiệu quả hơn khi mát; mùa hè nóng làm hiệu suất giảm nhẹ. Nhưng không bù được hai yếu tố trên.</p></div></div></section>
  <section class="card insight"><h2>💬 Câu nói mẫu</h2><p style="margin:0">“Ở Thanh Hoá, tháng 2 hệ phát chỉ khoảng một nửa tháng 7 là bình thường anh ạ. Em đã tính cả mùa đông vào bảng hoàn vốn rồi, và anh có thể xem sản lượng từng ngày trên app.”</p></section>
  `,init:el=>sunPathTool($('#t-sun',el)),
  quiz:[{q:'Ở miền Bắc, yếu tố nào làm sản lượng mùa đông giảm nhiều nhất?',o:['Nhiệt độ thấp','Mây, mưa phùn, trời âm u kéo dài','Gió mùa','Tấm pin bị lạnh hỏng'],a:1,e:'Mây và mưa phùn làm giảm mạnh bức xạ tới tấm pin.'},
   {q:'Nhiệt độ thấp ảnh hưởng tấm pin thế nào?',o:['Làm hỏng tấm pin','Giúp hiệu suất tốt hơn một chút','Không phát điện được','Làm tăng tiền điện'],a:1,e:'Tấm pin có hệ số nhiệt âm: trời mát hiệu suất cao hơn một chút.'},
   {q:'Khách thấy sản lượng tháng 2 chỉ bằng nửa tháng 7. Bạn nói gì?',o:['Hệ hỏng rồi','Đó là bình thường ở Thanh Hoá; đã tính vào hoàn vốn; xem số liệu trên app','Do khách dùng sai','Lắp thêm tấm pin'],a:1,e:'Giải thích đúng và đã nói trước từ khi tư vấn thì khách sẽ yên tâm.'}]},
 {id:'c3l2',title:'Hướng mái, góc nghiêng, bóng che',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Biết hướng và góc tốt nhất ở Thanh Hoá</li><li>Đánh giá được mức ảnh hưởng của bóng che</li></ul></section>
  <section class="card"><h2>🧭 Quy tắc nhanh ở Thanh Hoá</h2><ul class="clean"><li><b>Hướng Nam</b> tốt nhất; Đông Nam, Tây Nam gần như tương đương.</li><li><b>Đông, Tây</b> giảm khoảng 10%; vẫn đáng lắp, nhất là khi mái chỉ có hướng đó.</li><li><b>Hướng Bắc</b> giảm nhiều; tránh nếu có lựa chọn khác.</li><li>Góc nghiêng khoảng <b>10–20°</b> là tốt; mái bằng thì nghiêng tối thiểu 5–10° để mưa tự rửa bụi.</li></ul></section>
  ${toolCard('','t-roof')}
  <section class="card"><h2>🌳 Bóng che: kẻ thù thầm lặng</h2>
   <svg viewBox="0 0 600 170" style="width:100%;height:auto;display:block"><rect width="600" height="170" rx="12" fill="#f4f7fb"/>${[0,1,2,3,4,5].map(i=>`<rect x="${40+i*70}" y="40" width="60" height="80" fill="${i===2?'#4a5a6a':'#174a80'}" stroke="#9cc3ee"/>`).join('')}<path d="M70 125 v15 h${5*70} v-15" stroke="#d14343" stroke-width="3" fill="none"/>${T(225,160,'1 chuỗi (string) 6 tấm nối tiếp',{s:12})}<ellipse cx="210" cy="80" rx="40" ry="50" fill="#2e3b48" opacity=".35"/>${T(210,30,'1 tấm bị che',{s:12,c:'#d14343'})}${T(500,70,'➜ Cả chuỗi',{s:15,c:'#d14343',w:800})}${T(500,95,'có thể giảm mạnh',{s:13,c:'#d14343'})}</svg>
   <p>Các tấm pin trong một chuỗi được nối <b>tiếp</b> như dây đèn nháy cũ: một tấm bị che có thể kéo cả chuỗi giảm sản lượng (tấm pin hiện đại có diode bypass nên giảm bớt, nhưng vẫn mất). Vì vậy:</p>
   <ul class="clean"><li>Ghi rõ vật che bóng, phía nào, che vào khoảng giờ nào.</li><li>Bố trí tấm tránh vùng bóng; chia chuỗi hợp lý (kỹ sư xử lý).</li><li>Che bóng nặng: cân nhắc bộ tối ưu hoá, micro inverter, hoặc khuyên chưa lắp.</li></ul></section>
  <section class="card"><h2>🎮 Mái nào đáng lắp?</h2>${choiceGame([
   {t:'Mái tôn hướng Tây, nghiêng 10°, không bị che.',a:0,fb:'Giảm khoảng 10% so với lý tưởng, vẫn tốt.'},
   {t:'Mái hướng Nam nhưng nhà 6 tầng bên cạnh che từ 11 giờ trưa.',a:1,fb:'Mất phần nắng tốt nhất. Nhiều khả năng không đáng; khảo sát kỹ.'},
   {t:'Mái bằng bê tông, có thể làm khung nghiêng hướng Nam 10°.',a:0,fb:'Rất tốt: chủ động được hướng và góc.'},
   {t:'Mái hướng Bắc dốc 35°, mặt Nam đã có bồn nước và giàn phơi.',a:1,fb:'Hướng Bắc dốc giảm rất nhiều. Cân nhắc dời bồn nước để dùng mặt Nam.'}],['👍 Đáng lắp','🤔 Cần cân nhắc'])}</section>
  `,init:el=>roofTool($('#t-roof',el)),
  quiz:[{q:'Hướng mái tốt nhất ở Thanh Hoá?',o:['Bắc','Nam','Đông','Không quan trọng'],a:1,e:'Hướng Nam (Đông Nam, Tây Nam gần tương đương).'},
   {q:'Vì sao mái bằng vẫn nên làm khung nghiêng ít nhất 5–10°?',o:['Cho đẹp','Để mưa tự rửa bụi và thoát nước','Để tăng công suất đỉnh','Theo quy định PCCC'],a:1,e:'Tấm nằm phẳng đọng bụi, đọng nước, làm giảm sản lượng.'},
   {q:'Một tấm trong chuỗi bị che bóng thì sao?',o:['Chỉ tấm đó giảm','Có thể kéo cả chuỗi giảm sản lượng','Không ảnh hưởng','Tấm đó hỏng'],a:1,e:'Các tấm nối tiếp nên ảnh hưởng lan ra cả chuỗi.'}]},
 {id:'c3l3',title:'Tra số liệu thật bằng công cụ miễn phí',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Tự tra sản lượng cho từng địa chỉ khách bằng Global Solar Atlas</li><li>Biết thêm công cụ PVGIS để tính theo tháng</li></ul></section>
  <section class="card"><h2>🎬 Clip hướng dẫn: Global Solar Atlas</h2>${media('c3-atlas',SB_ATLAS,'hướng dẫn sử dụng Global Solar Atlas')}</section>
  <section class="card"><h2>🔗 Hai công cụ miễn phí</h2><div class="grid2">
   <div class="mini"><h4>🌍 Global Solar Atlas</h4><p>Nhanh, dễ dùng. Đọc chỉ số <b>PVOUT</b> (kWh/kWp/năm) và biểu đồ theo tháng.<br><a href="https://globalsolaratlas.info" target="_blank" rel="noopener">globalsolaratlas.info ↗</a></p></div>
   <div class="mini"><h4>📈 PVGIS</h4><p>Của Uỷ ban châu Âu. Chọn được hướng, góc nghiêng, hao hụt; xuất bảng theo tháng.<br><a href="https://re.jrc.ec.europa.eu/pvg_tools/en/" target="_blank" rel="noopener">re.jrc.ec.europa.eu/pvg_tools ↗</a></p></div></div>
   <div class="card note" style="margin-bottom:0">📝 <b>Quy trình chuẩn:</b> tra PVOUT tại vị trí nhà khách → nhân hệ số mái (hướng, góc, bóng che) từ Bài 2 → nhân với kWp → ra sản lượng năm và tháng → đưa vào bảng tính hoàn vốn (Chương 8). Ghi rõ nguồn số liệu trong đề xuất.</div></section>
  <section class="card warn"><h2>⚠️ Lưu ý khi dùng số liệu</h2><p style="margin:0">Đây là số trung bình nhiều năm; năm thực tế có thể cao hoặc thấp hơn. Khi nói với khách, dùng khoảng (“khoảng 1.100–1.250 kWh/kWp/năm”) thay vì một con số tuyệt đối. Sau khi có công trình thật, dùng số liệu app giám sát để đối chiếu.</p></section>
  `,
  quiz:[{q:'Chỉ số PVOUT trên Global Solar Atlas cho biết gì?',o:['Giá điện','Sản lượng dự kiến cho 1 kWp mỗi năm','Nhiệt độ trung bình','Công suất inverter'],a:1,e:'PVOUT là sản lượng điện riêng, đơn vị kWh/kWp/năm.'},
   {q:'Muốn tính có hướng, góc nghiêng cụ thể và xuất bảng theo tháng, nên dùng?',o:['PVGIS','Bản đồ giấy','Hỏi hàng xóm','Không cần'],a:0,e:'PVGIS cho phép chọn hướng, góc và xuất số liệu theo tháng.'},
   {q:'Khi nói với khách về sản lượng, cách nào đúng?',o:['Cam kết một con số tuyệt đối','Dùng khoảng ước tính và ghi nguồn số liệu','Không nói','Lấy số cao nhất'],a:1,e:'Dùng khoảng ước tính, có nguồn: thật thà và chuyên nghiệp.'}]}
 ],
 cards:[['3 lý do mùa đông phát ít?','Mặt trời thấp, ngày ngắn · Mây, mưa phùn, nồm (lớn nhất) · (Trời mát giúp hiệu suất tăng nhẹ nhưng không bù được).'],
  ['Hướng và góc tốt ở Thanh Hoá?','Hướng Nam (ĐN, TN gần tương đương); nghiêng khoảng 10–20°. Đông/Tây giảm ≈10%.'],
  ['Vì sao bóng che nguy hiểm?','Tấm nối tiếp trong chuỗi: một tấm bị che có thể kéo cả chuỗi giảm sản lượng.'],
  ['PVOUT là gì, tra ở đâu?','Sản lượng kWh/kWp/năm; tra trên globalsolaratlas.info (hoặc PVGIS).'],
  ['Độ cao mặt trời giữa trưa ở Thanh Hoá?','Hạ chí ≈ 86° (gần đỉnh đầu); đông chí ≈ 47° (phía Nam).']],
 field:{title:'Tra số liệu thật',tasks:['Tra PVOUT trên Global Solar Atlas cho 2 địa chỉ (ví dụ nhà bạn và 1 khách tiềm năng); ghi lại số liệu','Với 1 mái thật: ghi hướng, góc nghiêng, vật che bóng; dùng mô phỏng ở Bài 2 ước tính % so với mái lý tưởng','Chụp ảnh 1 mái có bóng che và ghi chú vùng nên tránh đặt tấm']}
},

{id:'c4',num:4,icon:'🔀',title:'Chọn loại hệ thống',ctv:true,ready:true,
 desc:'Bám lưới, hybrid có lưu trữ hay độc lập? Điện chạy thế nào, khi nào khuyên loại nào, và quy trình lắp đặt diễn ra ra sao.',
 badge:{ic:'🔀',name:'Kiến trúc sư hệ'},
 lessons:[
 {id:'c4l1',title:'Ba loại hệ: điện chạy thế nào?',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu đường đi của điện trong 3 loại hệ ở 3 tình huống</li><li>Gỡ được hiểu lầm phổ biến nhất: <b>“có điện mặt trời thì mất điện vẫn có điện”</b></li></ul></section>
  ${toolCard('','t-flow')}
  <section class="card"><h2>📋 So sánh nhanh</h2><div class="tbl-wrap"><table class="tbl"><tr><th></th><th>Bám lưới</th><th>Hybrid có lưu trữ</th><th>Độc lập</th></tr>
   <tr><td>Chi phí</td><td>Thấp nhất</td><td>Cao hơn (thêm pin, inverter hybrid)</td><td>Cao (pin lớn)</td></tr>
   <tr><td>Dùng điện buổi tối</td><td>❌ Dùng điện lưới</td><td>✅ Từ pin</td><td>✅ Chỉ từ pin</td></tr>
   <tr><td>Khi lưới mất điện</td><td>❌ Cũng mất điện</td><td>✅ Vẫn có điện cho tải ưu tiên</td><td>✅ Không phụ thuộc lưới</td></tr>
   <tr><td>Hợp với</td><td>Hộ kinh doanh, nhà dùng nhiều điện ban ngày</td><td>Gia đình dùng điện tối, nơi hay mất điện, trang trại</td><td>Nơi chưa có điện lưới</td></tr></table></div></section>
  <section class="card warn"><h2>⚠️ Hiểu lầm số 1</h2><p style="margin:0">Hệ <b>bám lưới</b> sẽ <b>tự ngắt khi lưới mất điện</b>, kể cả giữa trưa nắng, để bảo vệ thợ sửa đường dây (chống “đảo điện”). Nếu khách mua vì muốn có điện khi mất điện mà bạn bán hệ bám lưới, khách sẽ thất vọng ngay lần mất điện đầu tiên.</p></section>
  `,init:el=>flowTool($('#t-flow',el)),
  quiz:[{q:'Lưới mất điện giữa trưa nắng, nhà dùng hệ bám lưới thì sao?',o:['Vẫn có điện từ tấm pin','Mất điện vì inverter tự ngắt','Điện mạnh hơn','Pin tự xả'],a:1,e:'Inverter bám lưới tự ngắt khi mất lưới để đảm bảo an toàn.'},
   {q:'Hệ nào cho phép dùng điện mặt trời vào buổi tối?',o:['Bám lưới','Hybrid có lưu trữ','Cả hai','Không hệ nào'],a:1,e:'Cần pin lưu trữ để tích điện ban ngày.'},
   {q:'Hệ độc lập phù hợp nhất với?',o:['Nhà phố trung tâm','Chòi canh, trang trại xa chưa có điện lưới','Khách sạn lớn','Nhà máy'],a:1,e:'Hệ độc lập dành cho nơi không có lưới điện.'}]},
 {id:'c4l2',title:'Chống phát ngược và bán điện dư',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu “chống phát ngược” (zero export) là gì</li><li>Nắm quy định bán điện dư năm 2026 ở mức tư vấn</li><li>Vì sao vẫn thiết kế <b>để tự dùng là chính</b></li></ul></section>
  <section class="card"><h2>🔁 Điện dư đi đâu?</h2><p>Khi điện mặt trời phát nhiều hơn nhà đang dùng, phần dư có 3 hướng:</p>
   <div class="grid3"><div class="mini"><h4>🔋 Sạc pin</h4><p>Nếu là hệ hybrid. Tốt nhất vì dùng lại buổi tối.</p></div><div class="mini"><h4>⛔ Chặn lại</h4><p><b>Chống phát ngược</b>: inverter đo dòng tại điểm đấu nối và tự giảm công suất để không phát lên lưới. Phần dư bị bỏ phí.</p></div><div class="mini"><h4>💸 Bán lên lưới</h4><p>Theo quy định hiện hành, cần thủ tục và hợp đồng mua bán điện dư với điện lực.</p></div></div></section>
  <section class="card note"><h2>📜 Quy định bán điện dư (cập nhật 2026)</h2><ul class="clean"><li>Nghị định 58/2025/NĐ-CP (3/3/2025) cho phép bán điện dư tối đa <b>20%</b> sản lượng.</li><li>Nghị định <b>243/2026/NĐ-CP</b> (26/6/2026) nâng lên tối đa <b>50% sản lượng điện phát ra</b>, áp dụng cho nhiều đối tượng, trong đó có hộ gia đình nhà ở riêng lẻ.</li><li>Giá mua điện dư gắn với <b>giá điện năng thị trường bình quân năm trước</b>, không vượt mức trần quy định, nên <b>thấp hơn nhiều</b> so với giá điện bạn phải mua ở bậc cao.</li><li>Người bán điện dư phải làm thủ tục giấy phép hoạt động điện lực, <b>trừ trường hợp được miễn</b> theo quy định.</li></ul>
   <small class="src">Tóm tắt theo báo chí đưa tin về Nghị định 243/2026/NĐ-CP. Luôn đối chiếu văn bản gốc và hỏi Điện lực địa phương trước khi tư vấn chi tiết (Chương 7).</small></section>
  <section class="card insight"><h2>💡 Vì sao vẫn thiết kế để tự dùng?</h2><p style="margin:0">Mỗi kWh <b>tự dùng</b> giúp khách tiết kiệm khoảng 3.400–3.700đ (bậc cao, đã VAT). Mỗi kWh <b>bán đi</b> chỉ được giá thấp hơn nhiều. Vì vậy: chọn công suất vừa với nhu cầu, bán điện dư chỉ là <b>phần thưởng thêm</b>, không đưa vào lời hứa hoàn vốn.</p></section>
  <section class="card">${scenario('Khách hỏi: “Lắp thật to rồi bán điện cho EVN kiếm lời được không em?”',[
   {k:'bad',t:'A. “Được anh, lắp càng to càng lãi!”',fb:'❌ Sai: giá mua điện dư thấp, có giới hạn tỷ lệ và cần thủ tục. Hứa thế này là hứa sai.'},
   {k:'good',t:'B. “Bán được nhưng giá thấp và có giới hạn, anh ạ. Lời nhất là dùng tại chỗ, vì mỗi số điện tự dùng giúp anh bớt khoảng 3.500đ. Em tính công suất vừa với nhà mình, phần dư bán thêm coi như thưởng.”',fb:'✅ Chính xác, có số, đúng quy định.'},
   {k:'mid',t:'C. “Chính sách hay thay đổi lắm, anh đừng bán.”',fb:'⚠️ Né tránh. Khách cần thông tin rõ ràng, không phải lời khuyên chung chung.'}])}</section>
  `,
  quiz:[{q:'“Chống phát ngược” là gì?',o:['Chống sét','Inverter tự giảm công suất để không phát điện lên lưới','Chống trộm tấm pin','Công tơ hai chiều'],a:1,e:'Zero export giữ cho điện không chạy ngược lên lưới.'},

 {id:'c5l1',title:'Tấm pin: đọc thông số kỹ thuật',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Đọc được 8 thông số quan trọng trên datasheet tấm pin</li><li>Phân biệt bảo hành sản phẩm và bảo hành hiệu suất</li></ul></section>
  <section class="card"><h2>🔍 Bấm vào các nút số trên datasheet</h2>
   <div class="bill"><div class="bill-top"><div><b>DATASHEET TẤM PIN</b><div class="muted" style="font-size:.8rem">N-type TOPCon, 2 mặt kính</div></div><div class="watermark">THÔNG SỐ MINH HOẠ</div></div>
   ${[['1','Công suất đỉnh (Pmax)','590 W'],['2','Hiệu suất tấm','22,8%'],['3','Điện áp hở mạch Voc / Dòng ngắn mạch Isc','52,0 V / 14,3 A'],['4','Hệ số nhiệt của Pmax','−0,29%/°C'],['5','Kích thước / Trọng lượng','2278 × 1134 × 30 mm / 27,5 kg'],['6','Bảo hành sản phẩm','15 năm'],['7','Bảo hành hiệu suất','30 năm: năm đầu ≤1%, sau đó ≤0,4%/năm'],['8','Dung sai công suất','0 ~ +5 W']].map(r=>`<div class="bill-row"><button class="hs" data-g="ds" data-h="${r[0]}">${r[0]}</button><span class="k">${r[1]}</span><span class="v">${r[2]}</span></div>`).join('')}</div>
   ${hsPanel('ds')}</section>
  <section class="card"><h2>🧪 Các công nghệ tấm pin hay gặp</h2><div class="tbl-wrap"><table class="tbl"><tr><th>Công nghệ</th><th>Đặc điểm</th></tr><tr><td>Mono PERC (P-type)</td><td>Phổ biến những năm trước, giá rẻ, đang dần được thay thế</td></tr><tr><td>TOPCon (N-type)</td><td>Hiệu suất cao hơn, suy giảm chậm hơn, hiện rất phổ biến</td></tr><tr><td>HJT (N-type)</td><td>Hiệu suất cao, hệ số nhiệt tốt, giá cao hơn</td></tr><tr><td>Hai mặt (bifacial)</td><td>Thu thêm ánh sáng phản xạ ở mặt sau; có lợi khi lắp trên khung cao, mái sáng màu</td></tr></table></div></section>
  <section class="card warn"><h2>⚠️ “Tier 1” không phải là chứng nhận chất lượng</h2><p style="margin:0">“Tier 1” là danh sách xếp hạng các hãng theo <b>khả năng được ngân hàng tài trợ</b> cho dự án lớn, không phải chứng nhận chất lượng từng tấm. Khi khách hỏi, hãy chỉ ra <b>hãng, mã sản phẩm, bảo hành ghi trên giấy và đại lý bảo hành ở Việt Nam</b>.</p></section>
  `,
  quiz:[{q:'Tấm 590 W, kích thước 2,58 m². Hiệu suất khoảng?',o:['5,9%','22,8%','59%','2,28%'],a:1,e:'590 W ÷ (2,58 m² × 1.000 W/m²) ≈ 22,8%.'},
   {q:'Bảo hành hiệu suất 30 năm nghĩa là gì?',o:['Tấm pin không bao giờ hỏng','Hãng cam kết công suất không giảm quá mức đã ghi trong 30 năm','Được đổi mới sau 30 năm','Bảo hành lắp đặt 30 năm'],a:1,e:'Cam kết mức suy giảm công suất tối đa theo thời gian.'},
   {q:'Hệ số nhiệt −0,29%/°C cho biết?',o:['Nhiệt độ tăng thì công suất giảm khoảng 0,29% mỗi độ','Tấm chịu được −0,29°C','Tấm tự làm mát','Không quan trọng'],a:0,e:'Số càng gần 0 thì tấm càng ít bị ảnh hưởng bởi nắng nóng.'}]},
 {id:'c5l2',title:'Inverter: “bộ não” của hệ thống',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Phân biệt inverter string, hybrid, micro</li><li>Hiểu MPPT và vì sao mái 2 hướng cần lưu ý</li></ul></section>
  <section class="card"><h2>🧠 Inverter làm gì?</h2><p class="lead">Biến điện <b>một chiều (DC)</b> từ tấm pin thành điện <b>xoay chiều (AC)</b> dùng trong nhà, đồng thời điều khiển, bảo vệ và giám sát cả hệ.</p>
   <div class="tbl-wrap"><table class="tbl"><tr><th>Loại</th><th>Đặc điểm</th><th>Hợp với</th></tr><tr><td>String bám lưới</td><td>Một inverter cho một hoặc vài chuỗi tấm; rẻ, bền</td><td>Hệ bám lưới phổ biến</td></tr><tr><td>Hybrid</td><td>Quản lý cả tấm pin, pin lưu trữ và lưới; có chế độ dự phòng mất điện</td><td>Hệ có lưu trữ</td></tr><tr><td>Micro inverter</td><td>Mỗi 1–4 tấm một bộ nhỏ; giảm ảnh hưởng bóng che, mái nhiều hướng</td><td>Mái phức tạp, bị che bóng; chi phí cao hơn</td></tr></table></div></section>
  <section class="card"><h2>🎯 MPPT: vì sao mái 2 hướng cần 2 MPPT?</h2><p>MPPT là bộ “dò điểm công suất tối ưu”. Hai mặt mái khác hướng (ví dụ Đông và Tây) nhận nắng khác nhau, nên phải đi vào <b>2 MPPT riêng</b>; nếu gộp chung một MPPT, cả hai chuỗi bị kéo xuống. Khi khảo sát mái nhiều hướng, ghi rõ để kỹ sư chọn inverter phù hợp.</p></section>
  <section class="card"><h2>✅ 5 điều cần ghi rõ về inverter trong báo giá</h2><ol class="clean"><li>Hãng, mã sản phẩm, công suất (kW), 1 pha hay 3 pha</li><li>Loại: bám lưới hay hybrid; dải điện áp pin (nếu hybrid)</li><li>Số MPPT</li><li>Thời hạn bảo hành (thường 5–10 năm) và nơi bảo hành tại Việt Nam</li><li>Vị trí lắp: khô, thoáng, tránh nắng chiếu trực tiếp và mưa hắt</li></ol>
   <div class="card insight" style="margin-bottom:0">💡 Inverter là thiết bị <b>nhiều khả năng phải thay một lần</b> trong vòng đời 25 năm. Nói trước với khách và đưa chi phí này vào bảng hoàn vốn (Chương 8).</div></section>
  `,
  quiz:[{q:'Inverter chuyển đổi điện thế nào?',o:['AC sang DC','DC từ tấm pin sang AC dùng trong nhà','Tăng giá điện','Lưu điện'],a:1,e:'Tấm pin tạo DC; thiết bị trong nhà dùng AC.'},
   {q:'Mái có 2 mặt hướng Đông và Tây cần lưu ý gì?',o:['Chỉ lắp 1 mặt','Đi vào 2 MPPT riêng','Dùng tấm to hơn','Không lắp được'],a:1,e:'Hai hướng nắng khác nhau cần dò điểm tối ưu riêng.'},
   {q:'Loại inverter nào giúp giảm ảnh hưởng bóng che tốt nhất?',o:['String','Micro inverter','Hybrid','Không loại nào'],a:1,e:'Micro inverter xử lý từng tấm riêng nên một tấm bị che ít ảnh hưởng tấm khác.'}]},
 {id:'c5l3',title:'Pin lưu trữ',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu dung lượng, độ xả sâu (DoD), số chu kỳ</li><li>Tính được dung lượng pin phù hợp</li></ul></section>
  <section class="card"><h2>🔋 3 con số quan trọng</h2><div class="grid3"><div class="mini"><h4>kWh danh định</h4><p>Lượng điện pin chứa được, ví dụ 10 kWh.</p></div><div class="mini"><h4>DoD – độ xả sâu</h4><p>Phần được phép dùng. Pin 10 kWh, DoD 90% thì dùng được khoảng 9 kWh.</p></div><div class="mini"><h4>Số chu kỳ, bảo hành</h4><p>Một chu kỳ = sạc đầy rồi xả. Pin LiFePO4 thường công bố hàng nghìn chu kỳ; bảo hành thường 5–10 năm.</p></div></div></section>
  <section class="card"><h2>⚖️ LiFePO4 và ắc quy chì</h2><div class="tbl-wrap"><table class="tbl"><tr><th></th><th>LiFePO4 (lithium sắt phốt phát)</th><th>Ắc quy axit chì</th></tr><tr><td>Tuổi thọ</td><td>Dài, nhiều chu kỳ</td><td>Ngắn, ít chu kỳ</td></tr><tr><td>Độ xả sâu</td><td>Cao (~90%)</td><td>Thấp (~50%)</td></tr><tr><td>An toàn nhiệt</td><td>Tốt, phổ biến cho nhà ở</td><td>Có khí, cần thông gió</td></tr><tr><td>Giá ban đầu</td><td>Cao hơn</td><td>Rẻ hơn</td></tr></table></div><p class="muted" style="font-size:.88rem">Hiện nay hệ hybrid gia đình chủ yếu dùng LiFePO4. Luôn kiểm tra pin có <b>tương thích</b> (giao tiếp) với inverter đã chọn.</p></section>
  ${toolCard('','t-bat')}
  `,init:el=>batTool($('#t-bat',el)),
  quiz:[{q:'Pin 10 kWh, DoD 90%, dùng được khoảng?',o:['10 kWh','9 kWh','1 kWh','90 kWh'],a:1,e:'10 × 90% = 9 kWh.'},
   {q:'Vì sao hệ gia đình hiện nay chủ yếu dùng LiFePO4?',o:['Rẻ nhất','Tuổi thọ dài, xả sâu, an toàn nhiệt tốt','Nhẹ nhất','Không cần inverter'],a:1,e:'LiFePO4 cân bằng tốt giữa tuổi thọ, an toàn và hiệu quả.'},
   {q:'Nhà cần 6 kWh buổi tối và 1 kW tải ưu tiên trong 3 giờ khi mất điện. Dung lượng cần ít nhất (DoD 90%)?',o:['3,3 kWh','6,7 kWh','20 kWh','1 kWh'],a:1,e:'Lấy nhu cầu lớn hơn (6 kWh) ÷ 0,9 ≈ 6,7 kWh, làm tròn mô-đun lên 10 kWh.'}]},
 {id:'c5l4',title:'Phụ kiện và “mổ xẻ” báo giá',min:15,

{id:'c6',num:6,icon:'🏠',title:'Mái nhà và khảo sát',ctv:false,ready:true,
 desc:'Mái tôn, ngói, bê tông; chống dột, chống bão; khảo sát an toàn và đúng quy trình.',

 lessons:[
 {id:'c6l1',title:'Ba loại mái và cách lắp',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Biết cách lắp trên mái tôn, mái ngói, mái bê tông</li><li>Nhận ra mái nguy hiểm: <b>fibro xi măng</b></li></ul></section>
  <section class="card"><h2>🏗️ Mặt cắt minh hoạ</h2><div class="grid3">
   <div class="mini"><h4>Mái tôn</h4><svg viewBox="0 0 200 120" style="width:100%"><rect x="20" y="20" width="160" height="12" rx="3" fill="#174a80"/><rect x="40" y="36" width="120" height="6" fill="#c0c8d2"/><path d="M10 62 q10 -14 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" stroke="#7a8794" stroke-width="4" fill="none"/><rect x="60" y="42" width="6" height="40" fill="#d14343"/><rect x="134" y="42" width="6" height="40" fill="#d14343"/><rect x="20" y="82" width="160" height="14" fill="#a0784f"/>${T(100,112,'Vít/kẹp vào xà gồ + gioăng',{s:10})}</svg><p>Phổ biến nhất. Kẹp chuyên dụng hoặc vít bắt vào <b>xà gồ</b>, có gioăng cao su và keo chống dột.</p></div>
   <div class="mini"><h4>Mái ngói</h4><svg viewBox="0 0 200 120" style="width:100%"><rect x="20" y="16" width="160" height="12" rx="3" fill="#174a80"/><rect x="40" y="32" width="120" height="6" fill="#c0c8d2"/>${[0,1,2,3,4,5].map(i=>`<path d="M${14+i*30} 60 q15 -16 30 0" fill="#c8643b" stroke="#9a4a2a"/>`).join('')}<path d="M66 38 v14 q0 10 10 10 h4 v20" stroke="#d14343" stroke-width="4" fill="none"/><rect x="20" y="82" width="160" height="14" fill="#a0784f"/>${T(100,112,'Móc ngói luồn dưới viên ngói',{s:10})}</svg><p>Dùng <b>móc ngói</b> bắt vào kết cấu đỡ. Ngói dễ vỡ khi đi lại: chuẩn bị ngói thay thế.</p></div>
   <div class="mini"><h4>Mái bê tông</h4><svg viewBox="0 0 200 120" style="width:100%"><path d="M30 40 L170 20" stroke="#174a80" stroke-width="12"/><path d="M50 42 V80 M150 28 V80 M50 42 L150 80" stroke="#c0c8d2" stroke-width="5"/><rect x="40" y="76" width="22" height="10" fill="#9aa7b4"/><rect x="140" y="76" width="22" height="10" fill="#9aa7b4"/><rect x="10" y="86" width="180" height="14" fill="#b8c0c8"/>${T(100,114,'Khung nghiêng + chân đế',{s:10})}</svg><p>Làm <b>khung nghiêng</b> chủ động hướng và góc; chân đế bắt nở hoặc đổ bê tông, xử lý chống thấm vị trí khoan. Kiêm che nắng tầng thượng.</p></div></div></section>
  <section class="card warn"><h2>⛔ Mái fibro xi măng: nguy hiểm</h2><p style="margin:0">Mái fibro xi măng (tấm lợp xi măng sóng, hay gặp ở chuồng trại, nhà kho cũ) <b>giòn, dễ vỡ</b>; người bước lên có thể rơi xuyên mái. <b>Không bước trực tiếp lên mái fibro</b>, và thường không nên lắp tấm pin lên đó. Đề xuất lắp trên mái khác hoặc thay mái trước.</p></section>
  <section class="card"><h2>⚖️ Mái có chịu được không?</h2><p>Tấm pin cộng khung nặng khoảng <b>12–15 kg/m²</b> (tấm 27,5 kg trên 2,58 m² ≈ 10,6 kg/m², cộng thêm khung). Mái nhà dân thông thường thường chịu được, nhưng với <b>xà gồ yếu, mục, gỉ</b> hoặc <b>mái xưởng khẩu độ lớn</b>, cần kỹ sư kết cấu đánh giá.</p></section>
  <section class="card"><h2>🎮 Lắp được không?</h2>${choiceGame([
   {t:'Mái tôn 5 năm, xà gồ thép hộp còn tốt.',a:0,fb:'Tốt: lắp bình thường.'},
   {t:'Mái chuồng gà lợp fibro xi măng đã 15 năm.',a:1,fb:'Nguy hiểm: không bước lên, không lắp. Chọn mái khác.'},
   {t:'Mái bằng bê tông có dấu hiệu thấm ở góc.',a:2,fb:'Xử lý chống thấm trước, sau đó làm khung nghiêng.'},
   {t:'Mái ngói cũ, nhiều viên đã vỡ, li tô mục.',a:2,fb:'Phải sửa mái, thay li tô trước khi lắp.'}],['✅ Lắp được','⛔ Không lắp','🛠️ Sửa trước rồi lắp'])}</section>
  `,
  quiz:[{q:'Trên mái tôn, khung phải bắt vào đâu?',o:['Tôn trơn','Xà gồ, có gioăng chống dột','Máng nước','Dây buộc'],a:1,e:'Xà gồ là kết cấu chịu lực.'},
   {q:'Vì sao không bước lên mái fibro xi măng?',o:['Vì trơn','Vì giòn, dễ vỡ, người có thể rơi xuyên mái','Vì nóng','Vì dơ'],a:1,e:'Đây là nguyên nhân tai nạn ngã cao nghiêm trọng.'},
   {q:'Tải trọng thêm của tấm pin và khung khoảng?',o:['1–2 kg/m²','12–15 kg/m²','100 kg/m²','Không đáng kể'],a:1,e:'Khoảng 12–15 kg/m²; mái yếu cần đánh giá kết cấu.'}]},
 {id:'c6l2',title:'Chống bão và an toàn trên mái',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu gió bão tác động lên dàn pin thế nào</li><li>Thuộc quy tắc an toàn khi làm việc trên mái</li></ul></section>

   <ul class="clean"><li>Thanh Hoá thường xuyên chịu ảnh hưởng của bão và gió mạnh. Mép và góc mái chịu <b>lực hút ngược</b> lớn nhất.</li><li>Giữ khoảng cách an toàn từ dàn pin tới mép mái; tăng điểm kẹp ở vùng mép.</li><li>Bắt vào xà gồ, không bắt vào tôn trơn; siết đúng lực.</li><li><b>Kiểm tra lại bulông, kẹp sau mỗi mùa bão</b>, ghi vào lịch bảo trì.</li></ul></section>
  <section class="card warn"><h2>🦺 6 quy tắc an toàn trên mái</h2><ol class="clean" style="margin:0"><li>Luôn đeo <b>dây đai an toàn toàn thân</b>, móc vào điểm neo chắc chắn.</li><li>Không lên mái khi mưa, gió to, sấm sét, mái ướt hoặc trưa nắng gắt.</li><li>Không bước lên mái fibro, tấm lấy sáng, ngói vỡ; chỉ bước trên vị trí xà gồ.</li><li>Thang chắc chắn, cao hơn mép mái, có người giữ.</li><li>Ít nhất 2 người; không ai làm một mình trên mái.</li><li>Tư vấn viên, cộng tác viên chưa được huấn luyện: <b>khảo sát từ dưới đất, bằng flycam</b>, để kỹ thuật lên mái.</li></ol></section>
  <section class="card"><h2>🎬 Clip: quy trình khảo sát an toàn</h2>${media('c6-khao-sat',SB_SURVEY,'khảo sát mái nhà lắp điện mặt trời')}</section>
  `,
  quiz:[{q:'Vùng nào trên mái chịu lực gió hút ngược lớn nhất?',o:['Giữa mái','Mép và góc mái','Nóc mái','Như nhau'],a:1,e:'Mép và góc mái; giữ khoảng cách và tăng điểm kẹp ở đó.'},
   {q:'Cộng tác viên chưa được huấn luyện an toàn nên khảo sát thế nào?',o:['Trèo lên mái','Quan sát từ dưới đất, flycam; để kỹ thuật lên mái','Không khảo sát','Nhờ khách lên mái'],a:1,e:'An toàn là trên hết.'},
   {q:'Khi nào cần kiểm tra lại kẹp, bulông?',o:['Không bao giờ','Sau mỗi mùa bão và trong bảo trì định kỳ','Mỗi ngày','Khi khách nhắc'],a:1,e:'Đưa vào lịch bảo trì định kỳ.'}]},

{id:'c7',num:7,icon:'📜',title:'Pháp lý và thủ tục',ctv:false,ready:true,
 desc:'Lịch sử chính sách, quy định hiện hành (cập nhật 2026), thủ tục, giấy tờ bàn giao và an toàn PCCC.',
 badge:{ic:'📜',name:'Nắm luật'},
 lessons:[
 {id:'c7l1',title:'Lịch sử chính sách và quy định hiện hành',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu vì sao khách sợ “chính sách thay đổi”</li><li>Nắm các điểm chính của quy định năm 2026 ở mức tư vấn</li></ul></section>
  <section class="card"><h2>🕰️ Dòng thời gian</h2><div class="tl">
   <div class="tl-item"><b>2017–2019</b>: cơ chế giá ưu đãi (FIT) mua toàn bộ điện mặt trời mái nhà, khoảng 9,35 US cent/kWh.</div>
   <div class="tl-item"><b>2020</b>: giá FIT mới khoảng 8,38 US cent/kWh cho công trình vận hành trước 31/12/2020 → “bùng nổ” lắp đặt, rồi dừng đột ngột. Nhiều người còn nhớ, nên hay lo “chính sách thay đổi”.</div>
   <div class="tl-item"><b>10/2024</b>: Nghị định 135/2024 khuyến khích điện mặt trời mái nhà <b>tự sản xuất, tự tiêu thụ</b>.</div>
   <div class="tl-item"><b>2/2025</b>: Luật Điện lực 2024 có hiệu lực.</div>
   <div class="tl-item"><b>3/3/2025</b>: Nghị định 58/2025/NĐ-CP thay thế; điện dư bán lên lưới tối đa 20%.</div>
   <div class="tl-item"><b>26/6/2026</b>: Nghị định 243/2026/NĐ-CP sửa Điều 14 Nghị định 58: điện dư bán tối đa <b>50% sản lượng điện phát ra</b>.</div></div></section>
  <section class="card note"><h2>📌 Điểm chính tư vấn viên cần nắm (2026)</h2><ul class="clean">
   <li>Mô hình hiện nay là <b>tự sản xuất, tự tiêu thụ</b>: lợi ích chính đến từ việc giảm mua điện.</li>
   <li>Được bán điện dư tối đa <b>50% sản lượng điện phát ra</b> (đo tại đầu ra inverter); đến hết 31/12/2030, hai bên có thể thoả thuận vượt mức này nếu lưới khu vực đáp ứng.</li>
   <li>Giá mua điện dư theo <b>giá điện năng thị trường bình quân năm trước</b>, không vượt mức trần quy định → thấp hơn nhiều giá điện bán lẻ bậc cao.</li>
   <li>Người bán điện dư phải làm thủ tục giấy phép hoạt động điện lực, <b>trừ trường hợp được miễn</b>.</li>
   <li>Thủ tục thông báo, đăng ký đang được đơn giản hoá; năm 2025 có dự thảo chỉ cần thông báo UBND cấp xã. <b>Luôn hỏi Điện lực, UBND xã nơi lắp đặt để biết quy trình đang áp dụng.</b></li></ul>
   <small class="src">Tóm tắt từ báo chí đưa tin (VietnamPlus 27/6/2026, CafeLand 1/8/2026, LSVN 23/10/2025). Đây không phải tư vấn pháp lý. Đối chiếu văn bản gốc trên Cổng thông tin Chính phủ trước khi áp dụng.</small></section>
  <section class="card">${scenario('Khách hỏi: “Nhà nước lại đổi chính sách như năm 2020 thì sao?”',[
   {k:'good',t:'A. “Năm 2020 là cơ chế bán toàn bộ điện giá cao nên khi dừng, nhiều người bị ảnh hưởng. Hệ của nhà mình thiết kế để dùng tại chỗ là chính, tiết kiệm đến từ việc bớt mua điện, không phụ thuộc giá bán cho điện lực.”',fb:'✅ Giải thích đúng bản chất, khách yên tâm.'},
   {k:'bad',t:'B. “Không bao giờ đổi đâu, em đảm bảo.”',fb:'❌ Không ai đảm bảo được chính sách. Hứa sai.'},
   {k:'mid',t:'C. “Cái đó em không rõ ạ.”',fb:'⚠️ Thật thà nhưng thiếu chuyên môn. Hãy học kỹ bài này.'}])}</section>
  `,
  quiz:[{q:'Vì sao nhiều người sợ “chính sách thay đổi”?',o:['Vì tin đồn','Vì cơ chế giá FIT dừng đột ngột sau năm 2020','Vì giá điện giảm','Vì luật cấm lắp'],a:1,e:'Nhiều người còn nhớ đợt bùng nổ rồi dừng năm 2020.'},
   {q:'Theo NĐ 243/2026, điện dư bán tối đa?',o:['20% công suất','50% sản lượng điện phát ra','Toàn bộ','Không được bán'],a:1,e:'Nâng từ 20% (NĐ 58/2025) lên 50% sản lượng.'},
   {q:'Muốn biết thủ tục cụ thể đang áp dụng ở xã của khách, làm gì?',o:['Đoán','Hỏi Điện lực và UBND xã nơi lắp đặt','Hỏi trên mạng xã hội','Bỏ qua'],a:1,e:'Thủ tục đang được đơn giản hoá; hỏi trực tiếp nơi tiếp nhận.'}]},
 {id:'c7l2',title:'Thủ tục, hợp đồng và giấy tờ bàn giao',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Nắm các bước thủ tục ở mức tổng quát</li><li>Biết bộ hồ sơ phải giao cho khách</li><li>Hiểu trách nhiệm khi đang dùng pháp nhân đối tác</li></ul></section>
  <section class="card"><h2>🪜 Các bước tổng quát</h2><div class="tl">
   <div class="tl-item"><b>1. Ký hợp đồng</b> sau khi khảo sát và khách đồng ý đề xuất.</div>
   <div class="tl-item"><b>2. Thông báo / đăng ký</b> theo quy định đang áp dụng (hỏi Điện lực, UBND xã). Hồ sơ thường gồm thông tin chủ đầu tư, công suất, địa điểm, sơ đồ đấu nối, thông số thiết bị.</div>
   <div class="tl-item"><b>3. Thi công, nghiệm thu</b> theo 8 bước (Chương 4).</div>
   <div class="tl-item"><b>4. Nếu bán điện dư</b>: hợp đồng mua bán điện dư với điện lực, công tơ đo đếm phù hợp, giấy phép hoạt động điện lực (trừ trường hợp được miễn).</div>
   <div class="tl-item"><b>5. Bàn giao hồ sơ</b> và đưa vào lịch chăm sóc.</div></div></section>
  <section class="card"><h2>📁 Bộ hồ sơ bàn giao cho khách</h2><div class="check-list">${['Hợp đồng (ghi rõ hãng, mã, số lượng từng thiết bị)','Phiếu bảo hành từng thiết bị + bảo hành thi công (ghi thời hạn, phạm vi)','Sơ đồ nguyên lý và bố trí tấm pin','Biên bản nghiệm thu, chạy thử (có thông số đo)','Ảnh số serial thiết bị','Hướng dẫn sử dụng app giám sát, quy trình tắt hệ khẩn cấp','Số điện thoại hỗ trợ, lịch bảo trì'].map(x=>`<label><input type="checkbox"> ${x}</label>`).join('')}</div></section>
  <section class="card warn"><h2>🤝 Khi đang dùng pháp nhân của công ty đối tác</h2><ul class="clean" style="margin:0"><li>Hợp đồng với khách do <b>công ty đối tác ký</b>; trách nhiệm bảo hành pháp lý thuộc bên ký.</li><li>Thoả thuận rõ bằng văn bản: ai bảo hành, ai chăm sóc, chia lợi nhuận, <b>khách hàng thuộc về ai khi tách ra lập công ty riêng</b>.</li><li>Không hứa với khách điều mà hợp đồng của đối tác không ghi.</li></ul></section>
  `,
  quiz:[{q:'Hợp đồng nên ghi thiết bị thế nào?',o:['“Tấm pin loại 1”','Hãng, mã, số lượng từng thiết bị','Chỉ ghi tổng tiền','Không cần ghi'],a:1,e:'Ghi cụ thể là bảo vệ cả khách lẫn công ty.'},
   {q:'Khi đang dùng pháp nhân đối tác, ai chịu trách nhiệm bảo hành pháp lý?',o:['Tư vấn viên cá nhân','Công ty đối tác ký hợp đồng','Khách hàng','Không ai'],a:1,e:'Bên ký hợp đồng chịu trách nhiệm pháp lý; cần thoả thuận rõ nội bộ.'},
   {q:'Hướng dẫn nào bắt buộc phải có khi bàn giao?',o:['Cách tắt hệ khẩn cấp','Cách tháo tấm pin','Cách tăng công suất','Không cần'],a:0,e:'Khách cần biết tắt hệ an toàn khi có sự cố.'}]},
 {id:'c7l3',title:'An toàn PCCC và kiểm tra kiến thức pháp lý',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Biết các nguyên tắc an toàn cháy nổ cho điện mặt trời mái nhà</li><li>Tự kiểm tra kiến thức pháp lý</li></ul></section>
  <section class="card"><h2>🔥 Nguyên tắc an toàn cháy nổ</h2><div class="grid2">
   <div class="mini"><h4>Thiết bị</h4><p>Có chứng nhận, đúng hãng; cáp DC và MC4 chuyên dụng, đồng bộ.</p></div>
   <div class="mini"><h4>Bảo vệ</h4><p>Aptomat, cầu chì, chống sét phía DC và AC; tiếp địa đạt chuẩn; có thiết bị ngắt khẩn cấp dễ tiếp cận.</p></div>
   <div class="mini"><h4>Bố trí</h4><p>Chừa lối đi trên mái cho kiểm tra, cứu hoả; inverter, pin đặt nơi thoáng, khô, xa vật dễ cháy.</p></div>
   <div class="mini"><h4>Ghi nhãn, bảo trì</h4><p>Dán nhãn cảnh báo điện DC; kiểm tra định kỳ đầu nối, phát hiện điểm nóng.</p></div></div>
   <p class="muted" style="font-size:.88rem;margin-bottom:0">Với nhà xưởng, công trình đông người: hỏi cơ quan Cảnh sát PCCC địa phương về yêu cầu cụ thể trước khi thi công.</p></section>
  <section class="card"><h2>🎮 Đúng hay sai?</h2>${tfGame([
   ['Theo quy định năm 2026, hộ gia đình được bán toàn bộ điện dư lên lưới, không giới hạn.',false,'Sai: tối đa 50% sản lượng phát ra (trừ trường hợp đặc biệt).'],
   ['Giá mua điện dư cao hơn giá điện sinh hoạt bậc cao, nên càng bán nhiều càng lời.',false,'Sai: giá mua điện dư thấp hơn nhiều.'],
   ['Tỷ lệ bán điện dư tính theo sản lượng điện phát ra.',true,'Đúng (theo NĐ 243/2026, báo chí đưa tin).'],
   ['Tư vấn viên nên xin mật khẩu app điện lực của khách để tra cứu giúp.',false,'Sai: khách tự đăng nhập; không bao giờ xin mật khẩu.'],
   ['Hệ thiết kế để tự dùng là chính ít bị ảnh hưởng khi chính sách giá mua điện dư thay đổi.',true,'Đúng.'],
   ['Nhà xưởng không cần quan tâm PCCC vì tấm pin không cháy.',false,'Sai: sự cố đầu nối, cáp DC có thể gây cháy; phải tuân thủ an toàn PCCC.']])}</section>
  `,
  quiz:[{q:'Vì sao phải dán nhãn cảnh báo điện DC?',o:['Cho đẹp','Để thợ và lực lượng cứu hoả biết có điện DC nguy hiểm kể cả khi đã cắt điện lưới','Theo yêu cầu khách','Không cần'],a:1,e:'Tấm pin vẫn tạo điện áp DC khi có nắng, kể cả khi đã ngắt lưới.'},
   {q:'Vì sao cần chừa lối đi trên mái?',o:['Để phơi đồ','Để kiểm tra, bảo trì và cứu hoả khi cần','Để giảm chi phí','Không cần'],a:1,e:'An toàn khi vận hành và khi có sự cố.'},
   {q:'Công trình nhà xưởng nên làm gì trước khi thi công?',o:['Không cần gì','Hỏi cơ quan PCCC địa phương về yêu cầu cụ thể','Chỉ hỏi chủ xưởng','Lắp xong mới hỏi'],a:1,e:'Yêu cầu PCCC với nhà xưởng chặt chẽ hơn nhà dân.'}]}
 ],
 cards:[['Mốc chính sách cần nhớ?','2017–2020 giá FIT (dừng sau 2020) · 10/2024 NĐ 135 tự sản tự tiêu · 3/2025 NĐ 58 (bán dư 20%) · 6/2026 NĐ 243 (bán dư 50% sản lượng).'],
  ['Giá mua điện dư xác định thế nào?','Theo giá điện năng thị trường bình quân năm trước, không vượt mức trần → thấp hơn nhiều giá bán lẻ bậc cao.'],
  ['Bộ hồ sơ bàn giao gồm?','Hợp đồng · phiếu bảo hành · sơ đồ · biên bản nghiệm thu · ảnh serial · hướng dẫn app và tắt khẩn cấp · lịch bảo trì, số hỗ trợ.'],
  ['4 nhóm nguyên tắc an toàn cháy nổ?','Thiết bị chuẩn · bảo vệ (aptomat, chống sét, tiếp địa, ngắt khẩn cấp) · bố trí (lối đi, vị trí inverter/pin) · nhãn cảnh báo và bảo trì.'],
  ['Thủ tục đang áp dụng ở xã của khách?','Hỏi trực tiếp Điện lực và UBND xã nơi lắp đặt; quy định đang được đơn giản hoá.']],
 field:{title:'Thủ tục thật',tasks:['Đến hoặc gọi Điện lực khu vực (thuộc PC Thanh Hoá): hỏi quy trình thông báo/đăng ký điện mặt trời mái nhà tự dùng và khi có bán điện dư; ghi lại','Đọc văn bản gốc Nghị định 243/2026/NĐ-CP (phần sửa Điều 14 Nghị định 58) và ghi 3 điểm chính','Cùng đối tác soạn danh mục hồ sơ bàn giao chuẩn của nhóm']}
},

{id:'c8',num:8,icon:'💬',title:'Tài chính và kỹ năng tư vấn',ctv:true,ready:true,
 desc:'Tính hoàn vốn, trả góp, so với gửi tiết kiệm; xử lý 6 băn khoăn thường gặp; trình bày đề xuất 1 trang.',
 badge:{ic:'💬',name:'Tư vấn viên vững vàng'},
 lessons:[
 {id:'c8l1',title:'Tính hoàn vốn 25 năm',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Tính được tiết kiệm, thời gian hoàn vốn, lãi ròng 25 năm</li><li>So sánh trung thực với gửi tiết kiệm</li></ul></section>
  <section class="card"><h2>🧮 Công thức hoàn vốn (bản đơn giản)</h2><p class="lead">Hoàn vốn = năm mà <b>tổng tiền tiết kiệm cộng dồn</b> bằng <b>tổng chi phí đầu tư</b>.</p>
   <div class="grid3"><div class="mini"><h4>Đưa vào</h4><p>Sản lượng theo tháng (Chương 3) × tỉ lệ tự dùng (Chương 2) → kWh tự dùng → tiền tiết kiệm (Chương 1).</p></div><div class="mini"><h4>Tính cả</h4><p>Suy giảm tấm pin ≈ 0,5%/năm; chi phí thay inverter khoảng năm 11; giá điện có thể tăng.</p></div><div class="mini"><h4>Không tính</h4><p>Tiền bán điện dư (chỉ là phần thưởng thêm), trừ khi khách đã làm thủ tục.</p></div></div></section>
  ${toolCard('','t-pb')}
  <section class="card warn"><h2>⚠️ Giả định cần nói rõ với khách</h2><p style="margin:0">Giá hệ (8 triệu/kWp bám lưới, 10 triệu/kWp hybrid, 5 triệu/kWh pin) và giá điện tăng 3%/năm chỉ là <b>giả định của khoá học</b>. Khi tư vấn thật: dùng báo giá của đối tác, ghi rõ giả định trong đề xuất, và tính thêm kịch bản giá điện <b>không tăng</b> để khách thấy mức thấp nhất.</p></section>
  `,init:el=>paybackTool($('#t-pb',el)),
  quiz:[{q:'Thời gian hoàn vốn là gì?',o:['Thời gian lắp đặt','Số năm để tiền tiết kiệm cộng dồn bằng chi phí đầu tư','Thời hạn bảo hành','Tuổi thọ tấm pin'],a:1,e:'Sau mốc này, tiết kiệm là lãi ròng.'},
   {q:'Vì sao phải trừ chi phí thay inverter khoảng năm 11?',o:['Vì luật yêu cầu','Vì inverter nhiều khả năng phải thay một lần trong 25 năm','Cho đẹp số','Không cần trừ'],a:1,e:'Tính đủ chi phí để lời hứa hoàn vốn trung thực.'},
   {q:'Cách so sánh trung thực với gửi tiết kiệm?',o:['Nói ngân hàng lãi thấp','Tính tiền lãi gửi cùng số tiền và đặt cạnh lãi ròng điện mặt trời','Không so sánh','Nói ngân hàng rủi ro'],a:1,e:'Đưa con số hai bên cạnh nhau, để khách tự thấy.'}]},
 {id:'c8l2',title:'Trả góp: “tiền điện trả thay tiền góp”',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Tính tiền góp hằng tháng</li><li>Trình bày phương án để <b>tiền điện tiết kiệm gần đủ trả góp</b></li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2>${persona('👨','Anh Tuấn – Quảng Xương','Thích hệ hybrid 90 triệu nhưng chỉ có sẵn 30 triệu')}<p style="margin:0">Anh trả trước 30 triệu, vay 60 triệu. Tiền góp mỗi tháng có vượt tiền điện tiết kiệm được không?</p></section>
  ${toolCard('','t-loan')}
  <section class="card note"><h2>🏦 Các hình thức hỗ trợ tài chính</h2><ul class="clean" style="margin:0"><li><b>Vay tiêu dùng / vay xanh</b> tại ngân hàng (Agribank, quỹ tín dụng nhân dân… rất phổ biến ở nông thôn Thanh Hoá). Hỏi trực tiếp chi nhánh về gói đang có.</li><li><b>Trả góp qua thẻ tín dụng</b> nếu đối tác có hỗ trợ.</li><li><b>Chia đợt thanh toán</b> theo tiến độ: 50% khi ký, 40% khi nghiệm thu, 10% sau 1 tháng vận hành.</li><li><b>Lắp nhỏ trước, mở rộng sau</b>: chọn inverter hybrid “sẵn sàng gắn pin”, năm sau mua thêm pin.</li></ul></section>
  `,init:el=>loanTool($('#t-loan',el)),
  quiz:[{q:'Câu chốt mạnh nhất khi tư vấn trả góp?',o:['“Lãi suất thấp lắm”','“Tiền điện tiết kiệm gần đủ trả tiền góp hằng tháng”','“Vay đi, sợ gì”','“Ngân hàng nào cũng cho vay”'],a:1,e:'Khách gần như không phải bỏ thêm tiền hằng tháng.'},
   {q:'Tiền góp cao hơn tiền tiết kiệm. Có thể điều chỉnh gì?',o:['Bỏ cuộc','Kéo dài thời hạn, tăng trả trước, hoặc giảm quy mô hệ','Tăng lãi suất','Bỏ bảo hành'],a:1,e:'Có nhiều cách cân đối dòng tiền.'},
   {q:'Ai cung cấp lãi suất, cách tính chính xác?',o:['Tư vấn viên tự đặt','Ngân hàng cho vay','Khách tự đoán','Điện lực'],a:1,e:'Dùng bảng tính của ngân hàng khi tư vấn thật.'}]},
 {id:'c8l3',title:'Xử lý 6 băn khoăn thường gặp',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Luyện trả lời 6 băn khoăn phổ biến nhất</li><li>Áp dụng công thức: <b>đồng cảm → sự thật có số → cam kết → bước tiếp theo</b></li></ul></section>

/* index */
const LESSONS={};COURSE.forEach(c=>(c.lessons||[]).forEach((l,i)=>LESSONS[l.id]={l,c,i}));
const allCards=()=>COURSE.flatMap(c=>(c.cards||[]).map((x,i)=>({id:c.id+'k'+i,cid:c.id,f:x[0],b:x[1]})));
const inTrack=c=>S.role!=='ctv'||c.ctv;
const track=()=>COURSE.filter(inTrack);
const chapStarted=c=>(c.lessons||[]).some(l=>S.done[l.id]);
const chapDone=c=>c.ready&&c.lessons.every(l=>S.done[l.id]);
function progress(){let tot=0,d=0;track().forEach(c=>{if(c.ready){tot+=c.lessons.length;d+=c.lessons.filter(l=>S.done[l.id]).length}else tot+=c.planned||4});return{tot,d,pct:tot?Math.round(d/tot*100):0}}
function nextLesson(){for(const c of track()){if(!c.ready)continue;for(const l of c.lessons)if(!S.done[l.id])return l}return null}
function dueCards(){const now=Date.now();return allCards().filter(k=>{const c=COURSE.find(x=>x.id===k.cid);if(!chapStarted(c))return false;const st=S.cards[k.id];return !st||st.due<=now})}
function fieldPending(){return COURSE.filter(c=>c.ready&&chapStarted(c)&&c.field.tasks.some((t,i)=>!(S.field[c.id]&&S.field[c.id].t&&S.field[c.id].t[i]))).length}

/* =====================================================================
   GIAO DIỆN & CẤP ĐỘ (XP)
   ===================================================================== */
const LVN=['Tân binh','Học việc','Thợ săn nắng','Kỹ sư mái nhà','Chiến binh kWh','Cao thủ tư vấn','Huyền thoại Thanh Hoá Solar'],XP_PER=600;
function xpTotal(){let x=0;Object.keys(S.done).forEach(id=>{if(LESSONS[id])x+=100});
  Object.entries(S.quiz).forEach(([id,q])=>{const L=LESSONS[id];if(L)Object.entries(q.ans||{}).forEach(([qi,a])=>{if(L.l.quiz[qi]&&L.l.quiz[qi].a===a)x+=20})});
  Object.values(S.field).forEach(f=>Object.values(f.t||{}).forEach(v=>{if(v)x+=50}));COURSE.forEach(c=>{if(chapDone(c))x+=300});return x}
function levelInfo(){const X=xpTotal(),lv=Math.min(LVN.length,Math.floor(X/XP_PER)+1);return{X,lv,cur:lv===LVN.length?XP_PER:X%XP_PER}}
function renderHud(){const h=$('#hud');if(!h)return;const L=levelInfo();
  h.title=`Cấp ${L.lv}: ${LVN[L.lv-1]} · ${fmt(L.X)} XP\nMỗi bài +100 · câu đúng +20 · việc ngoài đời +50 · xong chương +300`;
  h.innerHTML=`<div class="lv">${L.lv}</div><div class="xpbox"><div class="xpt"><span>${LVN[L.lv-1]}</span><b>${fmt(L.X)} XP</b></div><div class="xpbar"><i style="width:${L.cur/XP_PER*100}%"></i></div></div>`;
  if(S.lastLv&&L.lv>S.lastLv&&S.theme==='game')setTimeout(()=>toast(`⬆️ Lên cấp ${L.lv}: ${LVN[L.lv-1]}!`),1700);
  if(S.lastLv!==L.lv){S.lastLv=L.lv;save()}}
function applyTheme(){document.body.classList.toggle('game',S.theme==='game');const b=$('#themeBtn');if(b){b.textContent=S.theme==='game'?'☀️':'🎮';b.title=S.theme==='game'?'Chuyển sang giao diện Sáng':'Chuyển sang giao diện Gaming'}}
function setTheme(t){S.theme=t;save();applyTheme();renderHud()}

/* =====================================================================
   RENDER
   ===================================================================== */
function renderSidebar(cur){
  const due=dueCards().length,fp=fieldPending();
  const nl=(r,ic,t,extra='')=>`<a class="nav-link ${cur.page===r?'active':''}" href="#${r==='settings'?'cai-dat':r}">${ic} ${t}${extra}</a>`;
  let h=`<div class="nav-sec">Tổng quan</div>${nl('home','🏠','Trang chủ')}${nl('review','🃏','Ôn thẻ ghi nhớ',due?`<span class="badge">${due}</span>`:'')}${nl('field','📋','Bài tập ngoài đời',fp?`<span class="badge">${fp}</span>`:'')}${nl('tools','🧰','Hộp công cụ')}${nl('cert','🏆','Chứng nhận')}${nl('settings','⚙️','Cài đặt số liệu')}
  <div class="nav-sec">Lộ trình ${S.role==='ctv'?'Cộng tác viên':'Tư vấn viên'}</div>`;
  COURSE.forEach(c=>{
    const active=cur.chap===c.id;
    h+=`<div class="chap ${chapDone(c)?'done':''} ${c.ready?'':'locked'} ${inTrack(c)?'':'optional'}"><a class="chap-head ${active&&cur.page==='chap'?'active':''}" href="#chap-${c.id}"><span class="chap-num">${chapDone(c)?'✓':c.num}</span><span>${c.title}</span>${c.ctv?'<span class="tag-ctv">CTV</span>':''}${c.ready?'':'<span class="lock">🔒</span>'}</a>`;
    if(c.ready)h+=`<ul class="lesson-list">${c.lessons.map((l,i)=>`<li><a href="#lesson-${l.id}" class="${cur.lesson===l.id?'active':''}">${S.done[l.id]?'✅':'○'} ${c.num}.${i+1} ${l.title}</a></li>`).join('')}</ul>`;
    h+='</div>';
  });
  $('#sidebar').innerHTML=h;
}
function updateTop(){const p=progress();$('#pfill').style.width=p.pct+'%';$('#ptxt').textContent=`Tiến độ ${p.pct}%`;renderHud()}
const footer=()=>`<div class="footer-note">Số liệu giá điện: biểu giá sinh hoạt ước tính (cập nhật ${S.settings.updated}), VAT ${S.settings.vat}%. Có thể sửa trong <a href="#cai-dat">Cài đặt số liệu</a>. Sản lượng điện mặt trời và giá thiết bị trong khoá học là số liệu giả định để minh hoạ. Quy định pháp lý cập nhật theo báo chí đến 11/2026 (Nghị định 243/2026/NĐ-CP). Luôn kiểm tra văn bản gốc, biểu giá hiện hành trước khi tư vấn. © Thanh Hoá Solar – tài liệu đào tạo nội bộ.</div>`;

function pageOnboard(){
  return `<div class="onb"><div class="card" style="text-align:center">${SVG_HERO}
  <h1 style="margin-top:14px">Chào mừng đến Học viện Tư vấn<br><span style="color:var(--sky2)">Thanh Hoá Solar</span></h1>
  <p class="lead">Sau khoá học, bạn sẽ tự tư vấn trọn vẹn cho một khách hàng: từ ảnh hoá đơn đến bản đề xuất có số liệu.</p>
  <div class="field" style="text-align:left"><label>Tên của bạn</label><input type="text" id="ob-name" style="width:100%" placeholder="Ví dụ: Đạt"></div>
  <div style="text-align:left;font-weight:600;font-size:.9rem;margin-top:14px">Vai trò của bạn</div>

   <div class="role on" data-r="tvv"><b>🎓 Tư vấn viên</b><small>Học đủ 10 chương, khoảng 4 tuần. Tự tư vấn, khảo sát, lập đề xuất.</small></div>
   <div class="role" data-r="ctv"><b>🤝 Cộng tác viên</b><small>Lộ trình rút gọn 4 chương (0, 1, 4, 8), khoảng 1–2 tuần. Biết giới thiệu đúng và chuyển khách cho tư vấn viên.</small></div>

  <button class="btn primary" id="ob-go" style="font-size:1.05rem;padding:12px 26px">Bắt đầu học ☀️</button></div></div>`;
}
function bindOnboard(){
  let role='tvv';$$('.role').forEach(r=>r.onclick=()=>{role=r.dataset.r;$$('.role').forEach(x=>x.classList.toggle('on',x===r))});
  $('#ob-go').onclick=()=>{const n=$('#ob-name').value.trim();if(!n){toast('Bạn nhập tên giúp mình nhé');$('#ob-name').focus();return}S.name=n;S.role=role;save();location.hash='#home';route()};
}

   <div class="card story"><h2>📖 Tình huống mở đầu</h2><p style="margin:0">${c.story}</p></div>
   <div class="card"><h2>🧮 Công cụ tương tác dự kiến</h2><ul class="clean">${c.tools.map(t=>`<li>${t}</li>`).join('')}</ul></div>
   <div class="card"><h2>📋 Bài tập ngoài đời</h2><p style="margin:0">${c.fieldPlan}</p></div>

}

function pageLesson(id){
  const L=LESSONS[id];if(!L)return pageHome();const {l,c,i}=L;
  const prev=c.lessons[i-1],next=c.lessons[i+1]||(()=>{const ci=COURSE.indexOf(c);const nc=COURSE.slice(ci+1).find(x=>x.ready);return nc?nc.lessons[0]:null})();
  S.last=id;save();
  return `<div class="crumbs"><a href="#home">Trang chủ</a> › <a href="#chap-${c.id}">Chương ${c.num}: ${c.title}</a> › Bài ${i+1}/${c.lessons.length} <span class="pill">⏱ ${l.min} phút</span>${S.done[id]?'<span class="pill" style="color:var(--leaf)">✅ Đã hoàn thành</span>':''}</div>
  <h1>${l.title}</h1>
  <div id="lbody">${l.html()}</div>
  <section class="card quiz" data-lid="${id}"><h2>❓ Câu hỏi nhanh</h2>${l.quiz.map((q,qi)=>`<div class="q" data-q="${qi}"><p class="q-t"><b>Câu ${qi+1}.</b> ${q.q}</p>${q.o.map((o,oi)=>`<button class="opt" data-o="${oi}">${String.fromCharCode(65+oi)}. ${o}</button>`).join('')}<div class="explain hidden"></div></div>`).join('')}<div class="qsum"></div></section>
  <div class="lesson-foot">
   ${prev?`<a class="btn ghost" href="#lesson-${prev.id}">← Bài trước</a>`:`<a class="btn ghost" href="#chap-${c.id}">← Chương ${c.num}</a>`}
   <button class="btn ${S.done[id]?'green':'primary'}" id="doneBtn">${S.done[id]?'✅ Đã hoàn thành':'✓ Hoàn thành bài học'}</button>
   ${next?`<a class="btn ghost" href="#lesson-${next.id}">Bài tiếp →</a>`:`<a class="btn ghost" href="#home">Về trang chủ →</a>`}
  </div>`+footer();
}
function bindLesson(id){
  const {l,c}=LESSONS[id];if(l.init)l.init($('#lbody'));
  const qz=$('.quiz');const st=S.quiz[id]=S.quiz[id]||{ans:{}};
  const paint=()=>{l.quiz.forEach((q,qi)=>{const box=$(`.q[data-q="${qi}"]`,qz),a=st.ans[qi];const ex=$('.explain',box);
    $$('.opt',box).forEach(b=>{b.className='opt';b.disabled=a!=null;if(a!=null){if(+b.dataset.o===q.a)b.classList.add('correct');else if(+b.dataset.o===a)b.classList.add('wrong')}});
    if(a!=null){ex.classList.remove('hidden');ex.innerHTML=(a===q.a?'✅ <b>Chính xác!</b> ':'❌ <b>Chưa đúng.</b> ')+q.e}else ex.classList.add('hidden')});
    const n=Object.keys(st.ans).length;
    if(n===l.quiz.length){st.score=l.quiz.filter((q,qi)=>st.ans[qi]===q.a).length;$('.qsum',qz).innerHTML=`<div class="quiz-sum"><span>Kết quả: ${st.score}/${l.quiz.length} ${st.score===l.quiz.length?'🎉 Tuyệt vời!':'– đọc kỹ giải thích ở trên nhé'}</span><button class="btn ghost" id="qReset">↻ Làm lại</button></div>`;$('#qReset').onclick=()=>{st.ans={};st.score=null;save();paint()}}else $('.qsum',qz).innerHTML='';
  };
  $$('.opt',qz).forEach(b=>b.onclick=()=>{const qi=+b.closest('.q').dataset.q;if(st.ans[qi]!=null)return;st.ans[qi]=+b.dataset.o;save();paint()});
  paint();
  $('#doneBtn').onclick=()=>{
    if(Object.keys(st.ans).length<l.quiz.length){toast('Hãy trả lời hết câu hỏi nhanh trước nhé 🙂');qz.scrollIntoView({behavior:'smooth'});return}
    if(S.done[id])return;const wasDone=chapDone(c);S.done[id]=Date.now();save();
    if(!wasDone&&chapDone(c))toast(`🏅 Chúc mừng! Bạn nhận huy hiệu “${c.badge.name}”`);else toast('✅ Đã hoàn thành bài học!');
    const nx=nextLesson();setTimeout(()=>{location.hash=nx?'#lesson-'+nx.id:'#chap-'+c.id},900);
  };
}

function pageReview(){return `<div class="crumbs"><a href="#home">Trang chủ</a> › Ôn thẻ ghi nhớ</div><h1>🃏 Ôn thẻ ghi nhớ</h1><p class="lead">Đọc câu hỏi, <b>tự trả lời trong đầu</b>, rồi bấm vào thẻ để lật. Thẻ bạn nhớ sẽ quay lại sau 1, 3, 7, 14, 30 ngày; thẻ chưa nhớ sẽ quay lại ngay.</p><div id="rv"></div>`+footer()}
function bindReview(){
  let q=shuffle(dueCards()),n=q.length,seen=0;
  const draw=()=>{
    if(!q.length){$('#rv').innerHTML=`<div class="card insight" style="text-align:center"><div style="font-size:2.4rem">🎉</div><h2 style="justify-content:center">${n?'Xong lượt ôn hôm nay!':'Chưa có thẻ nào đến hạn'}</h2><p>${n?`Bạn đã ôn ${n} thẻ.`:'Thẻ của mỗi chương sẽ mở khi bạn hoàn thành bài đầu tiên của chương đó.'}</p><a class="btn primary" href="#home">Về trang chủ</a></div>`;renderSidebar({page:'review'});return}
    const k=q[0];
    $('#rv').innerHTML=`<p class="fc-meta">Còn ${q.length} thẻ · Chương ${COURSE.find(c=>c.id===k.cid).num}</p><div class="fc" id="fc"><div class="flip-inner"><div class="flip-face flip-front"><div><div style="font-size:2rem">🤔</div><b>${k.f}</b><div class="muted" style="font-size:.8rem;margin-top:10px">Bấm để lật</div></div></div><div class="flip-face flip-back"><div>${k.b}</div></div></div></div>
    <div class="btn-row hidden" id="fcb" style="justify-content:center;margin-top:16px"><button class="btn ghost" id="fcNo">😅 Chưa nhớ</button><button class="btn green" id="fcYes">😎 Đã nhớ</button></div>`;
    $('#fc').onclick=()=>{$('#fc').classList.toggle('flipped');$('#fcb').classList.remove('hidden')};
    $('#fcYes').onclick=()=>{const st=S.cards[k.id]||{box:0};st.box=Math.min(st.box+1,5);st.due=Date.now()+INTERVALS[st.box]*DAY;S.cards[k.id]=st;save();q.shift();draw()};
    $('#fcNo').onclick=()=>{S.cards[k.id]={box:0,due:Date.now()};save();q.push(q.shift());draw()};
  };draw();
}

function route(){
  const _h=location.hash.replace(/^#\/?/,'')||'home',_m=_h.match(/^(lesson|chap)[-\/](.+)$/);let page=_m?_m[1]:_h.split('/')[0];const arg=_m?_m[2]:undefined;if(page==='cai-dat')page='settings';
  const main=$('#main');SB_TIMERS.forEach(clearInterval);SB_TIMERS=[];
  if(!S.name){main.innerHTML=pageOnboard();bindOnboard();$('#sidebar').innerHTML='';updateTop();return}
  let cur={page};
  if(page==='lesson'&&LESSONS[arg]){cur.lesson=arg;cur.chap=LESSONS[arg].c.id;main.innerHTML=pageLesson(arg);bindLesson(arg)}
  else if(page==='chap'){cur.chap=arg;main.innerHTML=pageChap(arg)}
  else if(page==='review'){main.innerHTML=pageReview();bindReview()}
  else if(page==='field'){main.innerHTML=pageField();bindField()}
  else if(page==='tools'){main.innerHTML=pageTools();bindTools()}
  else if(page==='settings'){main.innerHTML=pageSettings();bindSettings()}
  else if(page==='cert'){main.innerHTML=pageCert();bindCert()}
  else{cur.page='home';main.innerHTML=pageHome()}
  initSB(main);renderSidebar(cur);updateTop();window.scrollTo(0,0);closeMenu();
}
function closeMenu(){$('#sidebar').classList.remove('open');$('#backdrop').classList.remove('show')}
$('#menuBtn').onclick=()=>{$('#sidebar').classList.toggle('open');$('#backdrop').classList.toggle('show')};
$('#backdrop').onclick=closeMenu;
document.addEventListener('click',e=>{
  const hz=e.target.closest('[data-g][data-h]');
  if(hz&&HS[hz.dataset.g]){const g=hz.dataset.g,h=HS[g][hz.dataset.h],p=document.querySelector(`[data-hsp="${g}"]`);hz.classList.add('seen');const n=new Set($$(`[data-g="${g}"].seen`).map(x=>x.dataset.h)).size,tot=Object.keys(HS[g]).length;if(p)p.innerHTML=`<b>${hz.dataset.h}. ${h[0]}</b><div style="margin-top:4px">${h[1]}</div><div class="muted" style="margin-top:6px;font-size:.85rem">Đã xem ${n}/${tot} ${n===tot?'🎉':''}</div>`;return}
  const cb=e.target.closest('.cg-btn');
  if(cb){const c=cb.closest('.cg-case');if(c.dataset.done)return;c.dataset.done=1;const ok=+cb.dataset.v===+c.dataset.a;c.classList.add(ok?'ok':'no');$$('.cg-btn',c).forEach(b=>b.disabled=true);c.insertAdjacentHTML('beforeend',`<div class="fb">${ok?'✅ Đúng!':'❌ Chưa đúng. Đáp án: <b>'+c.dataset.al+'</b>.'} ${c.dataset.fb}</div>`);const g=c.closest('.cg'),n=+g.dataset.n,d=$$('.cg-case[data-done]',g).length,r=$$('.cg-case.ok',g).length;if(d===n)$('.cg-score',g).textContent=`Kết quả: ${r}/${n} ${r===n?'🎉':''}`;return}
  const rv=e.target.closest('[data-reveal]');
  if(rv){const el=document.getElementById(rv.dataset.reveal);if(!rv.dataset.label)rv.dataset.label=rv.innerHTML;el.classList.toggle('show');rv.innerHTML=el.classList.contains('show')?'🙈 Ẩn':rv.dataset.label;return}
  const fc=e.target.closest('.flipcard');if(fc){fc.classList.toggle('flipped');return}
  const so=e.target.closest('.sc-opt');
  if(so){const sc=so.closest('.scenario');$$('.sc-opt',sc).forEach(x=>x.classList.remove('good','bad','mid'));so.classList.add(so.dataset.k);$('.sc-fb',sc).textContent=so.dataset.fb;return}
  const cp=e.target.closest('[data-copy]');
  if(cp){const txt=document.getElementById(cp.dataset.copy).innerText;
    const ok=()=>toast('📋 Đã sao chép');
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,()=>fallbackCopy(txt,ok));else fallbackCopy(txt,ok)}
});
function fallbackCopy(t,cb){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');cb()}catch(e){toast('Không sao chép được, hãy bôi đen và sao chép thủ công')}a.remove()}
window.addEventListener('hashchange',route);
$('#themeBtn').onclick=()=>setTheme(S.theme==='game'?'light':'game');
applyTheme();route();
</script>
</body>
</html>
