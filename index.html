 lessons:[
 {id:'c7l1',title:'Lịch sử chính sách và quy định hiện hành',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu vì sao khách sợ “chính sách thay đổi”</li><li>Nắm các điểm chính của quy định năm 2026 ở mức tư vấn</li></ul></section>
  <section class="card"><h2>🕰️ Dòng thời gian</h2><div class="tl">
   <div class="tl-item"><b>2017–2019</b>: cơ chế giá ưu đãi (FIT) mua toàn bộ điện mặt trời mái nhà, khoảng 9,35 US cent/kWh.</div>
   <div class="tl-item"><b>2020</b>: giá FIT mới khoảng 8,38 US cent/kWh cho công trình vận hành trước 31/12/2020 → “bùng nổ” lắp đặt, rồi dừng đột ngột. Nhiều người còn nhớ, nên hay lo “chính sách thay đổi”.</div>
   <div class="tl-item"><b>10/2024</b>: Nghị định 135/2024 khuyến khích điện mặt trời mái nhà <b>tự sản xuất, tự tiêu thụ</b>.</div>
   <div class="tl-item"><b>2/2025</b>: Luật Điện lực 2024 có hiệu lực.</div>
   <div class="tl-item"><b>3/3/2025</b>: Nghị định 58/2025/NĐ-CP thay thế; điện dư bán lên lưới tối đa 20%.</div>
   <div class="tl-item"><b>26/6/2026</b>: Nghị định 243/2026/NĐ-CP sửa Điều 14 Nghị định 58: điện dư bán tối đa <b>50% sản lượng điện phát ra</b>.</div></div></section>
  <section class="card note"><h2>📌 Điểm chính tư vấn viên cần nắm (2026)</h2><ul class="clean">
   <li>Mô hình hiện nay là <b>tự sản xuất, tự tiêu thụ</b>: lợi ích chính đến từ việc giảm mua điện.</li>
   <li>Được bán điện dư tối đa <b>50% sản lượng điện phát ra</b> (đo tại đầu ra inverter); đến hết 31/12/2030, hai bên có thể thoả thuận vượt mức này nếu lưới khu vực đáp ứng.</li>
   <li>Giá mua điện dư theo <b>giá điện năng thị trường bình quân năm trước</b>, không vượt mức trần quy định → thấp hơn nhiều giá điện bán lẻ bậc cao.</li>
   <li>Người bán điện dư phải làm thủ tục giấy phép hoạt động điện lực, <b>trừ trường hợp được miễn</b>.</li>
   <li>Thủ tục thông báo, đăng ký đang được đơn giản hoá; năm 2025 có dự thảo chỉ cần thông báo UBND cấp xã. <b>Luôn hỏi Điện lực, UBND xã nơi lắp đặt để biết quy trình đang áp dụng.</b></li></ul>
   <small class="src">Tóm tắt từ báo chí đưa tin (VietnamPlus 27/6/2026, CafeLand 1/8/2026, LSVN 23/10/2025). Đây không phải tư vấn pháp lý. Đối chiếu văn bản gốc trên Cổng thông tin Chính phủ trước khi áp dụng.</small></section>
  <section class="card">${scenario('Khách hỏi: “Nhà nước lại đổi chính sách như năm 2020 thì sao?”',[
   {k:'good',t:'A. “Năm 2020 là cơ chế bán toàn bộ điện giá cao nên khi dừng, nhiều người bị ảnh hưởng. Hệ của nhà mình thiết kế để dùng tại chỗ là chính, tiết kiệm đến từ việc bớt mua điện, không phụ thuộc giá bán cho điện lực.”',fb:'✅ Giải thích đúng bản chất, khách yên tâm.'},
   {k:'bad',t:'B. “Không bao giờ đổi đâu, em đảm bảo.”',fb:'❌ Không ai đảm bảo được chính sách. Hứa sai.'},
   {k:'mid',t:'C. “Cái đó em không rõ ạ.”',fb:'⚠️ Thật thà nhưng thiếu chuyên môn. Hãy học kỹ bài này.'}])}</section>
  `,
  quiz:[{q:'Vì sao nhiều người sợ “chính sách thay đổi”?',o:['Vì tin đồn','Vì cơ chế giá FIT dừng đột ngột sau năm 2020','Vì giá điện giảm','Vì luật cấm lắp'],a:1,e:'Nhiều người còn nhớ đợt bùng nổ rồi dừng năm 2020.'},
   {q:'Theo NĐ 243/2026, điện dư bán tối đa?',o:['20% công suất','50% sản lượng điện phát ra','Toàn bộ','Không được bán'],a:1,e:'Nâng từ 20% (NĐ 58/2025) lên 50% sản lượng.'},
   {q:'Muốn biết thủ tục cụ thể đang áp dụng ở xã của khách, làm gì?',o:['Đoán','Hỏi Điện lực và UBND xã nơi lắp đặt','Hỏi trên mạng xã hội','Bỏ qua'],a:1,e:'Thủ tục đang được đơn giản hoá; hỏi trực tiếp nơi tiếp nhận.'}]},
 {id:'c7l2',title:'Thủ tục, hợp đồng và giấy tờ bàn giao',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Nắm các bước thủ tục ở mức tổng quát</li><li>Biết bộ hồ sơ phải giao cho khách</li><li>Hiểu trách nhiệm khi đang dùng pháp nhân đối tác</li></ul></section>
  <section class="card"><h2>🪜 Các bước tổng quát</h2><div class="tl">
   <div class="tl-item"><b>1. Ký hợp đồng</b> sau khi khảo sát và khách đồng ý đề xuất.</div>
   <div class="tl-item"><b>2. Thông báo / đăng ký</b> theo quy định đang áp dụng (hỏi Điện lực, UBND xã). Hồ sơ thường gồm thông tin chủ đầu tư, công suất, địa điểm, sơ đồ đấu nối, thông số thiết bị.</div>
   <div class="tl-item"><b>3. Thi công, nghiệm thu</b> theo 8 bước (Chương 4).</div>
   <div class="tl-item"><b>4. Nếu bán điện dư</b>: hợp đồng mua bán điện dư với điện lực, công tơ đo đếm phù hợp, giấy phép hoạt động điện lực (trừ trường hợp được miễn).</div>
   <div class="tl-item"><b>5. Bàn giao hồ sơ</b> và đưa vào lịch chăm sóc.</div></div></section>
  <section class="card"><h2>📁 Bộ hồ sơ bàn giao cho khách</h2><div class="check-list">${['Hợp đồng (ghi rõ hãng, mã, số lượng từng thiết bị)','Phiếu bảo hành từng thiết bị + bảo hành thi công (ghi thời hạn, phạm vi)','Sơ đồ nguyên lý và bố trí tấm pin','Biên bản nghiệm thu, chạy thử (có thông số đo)','Ảnh số serial thiết bị','Hướng dẫn sử dụng app giám sát, quy trình tắt hệ khẩn cấp','Số điện thoại hỗ trợ, lịch bảo trì'].map(x=>`<label><input type="checkbox"> ${x}</label>`).join('')}</div></section>
  <section class="card warn"><h2>🤝 Khi đang dùng pháp nhân của công ty đối tác</h2><ul class="clean" style="margin:0"><li>Hợp đồng với khách do <b>công ty đối tác ký</b>; trách nhiệm bảo hành pháp lý thuộc bên ký.</li><li>Thoả thuận rõ bằng văn bản: ai bảo hành, ai chăm sóc, chia lợi nhuận, <b>khách hàng thuộc về ai khi tách ra lập công ty riêng</b>.</li><li>Không hứa với khách điều mà hợp đồng của đối tác không ghi.</li></ul></section>
  `,
  quiz:[{q:'Hợp đồng nên ghi thiết bị thế nào?',o:['“Tấm pin loại 1”','Hãng, mã, số lượng từng thiết bị','Chỉ ghi tổng tiền','Không cần ghi'],a:1,e:'Ghi cụ thể là bảo vệ cả khách lẫn công ty.'},
   {q:'Khi đang dùng pháp nhân đối tác, ai chịu trách nhiệm bảo hành pháp lý?',o:['Tư vấn viên cá nhân','Công ty đối tác ký hợp đồng','Khách hàng','Không ai'],a:1,e:'Bên ký hợp đồng chịu trách nhiệm pháp lý; cần thoả thuận rõ nội bộ.'},
   {q:'Hướng dẫn nào bắt buộc phải có khi bàn giao?',o:['Cách tắt hệ khẩn cấp','Cách tháo tấm pin','Cách tăng công suất','Không cần'],a:0,e:'Khách cần biết tắt hệ an toàn khi có sự cố.'}]},
 {id:'c7l3',title:'An toàn PCCC và kiểm tra kiến thức pháp lý',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Biết các nguyên tắc an toàn cháy nổ cho điện mặt trời mái nhà</li><li>Tự kiểm tra kiến thức pháp lý</li></ul></section>
  <section class="card"><h2>🔥 Nguyên tắc an toàn cháy nổ</h2><div class="grid2">
   <div class="mini"><h4>Thiết bị</h4><p>Có chứng nhận, đúng hãng; cáp DC và MC4 chuyên dụng, đồng bộ.</p></div>
   <div class="mini"><h4>Bảo vệ</h4><p>Aptomat, cầu chì, chống sét phía DC và AC; tiếp địa đạt chuẩn; có thiết bị ngắt khẩn cấp dễ tiếp cận.</p></div>
   <div class="mini"><h4>Bố trí</h4><p>Chừa lối đi trên mái cho kiểm tra, cứu hoả; inverter, pin đặt nơi thoáng, khô, xa vật dễ cháy.</p></div>
   <div class="mini"><h4>Ghi nhãn, bảo trì</h4><p>Dán nhãn cảnh báo điện DC; kiểm tra định kỳ đầu nối, phát hiện điểm nóng.</p></div></div>
   <p class="muted" style="font-size:.88rem;margin-bottom:0">Với nhà xưởng, công trình đông người: hỏi cơ quan Cảnh sát PCCC địa phương về yêu cầu cụ thể trước khi thi công.</p></section>
  <section class="card"><h2>🎮 Đúng hay sai?</h2>${tfGame([
   ['Theo quy định năm 2026, hộ gia đình được bán toàn bộ điện dư lên lưới, không giới hạn.',false,'Sai: tối đa 50% sản lượng phát ra (trừ trường hợp đặc biệt).'],
   ['Giá mua điện dư cao hơn giá điện sinh hoạt bậc cao, nên càng bán nhiều càng lời.',false,'Sai: giá mua điện dư thấp hơn nhiều.'],
   ['Tỷ lệ bán điện dư tính theo sản lượng điện phát ra.',true,'Đúng (theo NĐ 243/2026, báo chí đưa tin).'],
   ['Tư vấn viên nên xin mật khẩu app điện lực của khách để tra cứu giúp.',false,'Sai: khách tự đăng nhập; không bao giờ xin mật khẩu.'],
   ['Hệ thiết kế để tự dùng là chính ít bị ảnh hưởng khi chính sách giá mua điện dư thay đổi.',true,'Đúng.'],
   ['Nhà xưởng không cần quan tâm PCCC vì tấm pin không cháy.',false,'Sai: sự cố đầu nối, cáp DC có thể gây cháy; phải tuân thủ an toàn PCCC.']])}</section>
  `,
  quiz:[{q:'Vì sao phải dán nhãn cảnh báo điện DC?',o:['Cho đẹp','Để thợ và lực lượng cứu hoả biết có điện DC nguy hiểm kể cả khi đã cắt điện lưới','Theo yêu cầu khách','Không cần'],a:1,e:'Tấm pin vẫn tạo điện áp DC khi có nắng, kể cả khi đã ngắt lưới.'},
   {q:'Vì sao cần chừa lối đi trên mái?',o:['Để phơi đồ','Để kiểm tra, bảo trì và cứu hoả khi cần','Để giảm chi phí','Không cần'],a:1,e:'An toàn khi vận hành và khi có sự cố.'},
   {q:'Công trình nhà xưởng nên làm gì trước khi thi công?',o:['Không cần gì','Hỏi cơ quan PCCC địa phương về yêu cầu cụ thể','Chỉ hỏi chủ xưởng','Lắp xong mới hỏi'],a:1,e:'Yêu cầu PCCC với nhà xưởng chặt chẽ hơn nhà dân.'}]}
 ],
 cards:[['Mốc chính sách cần nhớ?','2017–2020 giá FIT (dừng sau 2020) · 10/2024 NĐ 135 tự sản tự tiêu · 3/2025 NĐ 58 (bán dư 20%) · 6/2026 NĐ 243 (bán dư 50% sản lượng).'],
  ['Giá mua điện dư xác định thế nào?','Theo giá điện năng thị trường bình quân năm trước, không vượt mức trần → thấp hơn nhiều giá bán lẻ bậc cao.'],
  ['Bộ hồ sơ bàn giao gồm?','Hợp đồng · phiếu bảo hành · sơ đồ · biên bản nghiệm thu · ảnh serial · hướng dẫn app và tắt khẩn cấp · lịch bảo trì, số hỗ trợ.'],
  ['4 nhóm nguyên tắc an toàn cháy nổ?','Thiết bị chuẩn · bảo vệ (aptomat, chống sét, tiếp địa, ngắt khẩn cấp) · bố trí (lối đi, vị trí inverter/pin) · nhãn cảnh báo và bảo trì.'],
  ['Thủ tục đang áp dụng ở xã của khách?','Hỏi trực tiếp Điện lực và UBND xã nơi lắp đặt; quy định đang được đơn giản hoá.']],
 field:{title:'Thủ tục thật',tasks:['Đến hoặc gọi Điện lực khu vực (thuộc PC Thanh Hoá): hỏi quy trình thông báo/đăng ký điện mặt trời mái nhà tự dùng và khi có bán điện dư; ghi lại','Đọc văn bản gốc Nghị định 243/2026/NĐ-CP (phần sửa Điều 14 Nghị định 58) và ghi 3 điểm chính','Cùng đối tác soạn danh mục hồ sơ bàn giao chuẩn của nhóm']}

/* ------------------------------------------------------------------ CHƯƠNG 8 */
{id:'c8',num:8,icon:'💬',title:'Tài chính và kỹ năng tư vấn',ctv:true,ready:true,
 desc:'Tính hoàn vốn, trả góp, so với gửi tiết kiệm; xử lý 6 băn khoăn thường gặp; trình bày đề xuất 1 trang.',
 badge:{ic:'💬',name:'Tư vấn viên vững vàng'},
 lessons:[
 {id:'c8l1',title:'Tính hoàn vốn 25 năm',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Tính được tiết kiệm, thời gian hoàn vốn, lãi ròng 25 năm</li><li>So sánh trung thực với gửi tiết kiệm</li></ul></section>
  <section class="card"><h2>🧮 Công thức hoàn vốn (bản đơn giản)</h2><p class="lead">Hoàn vốn = năm mà <b>tổng tiền tiết kiệm cộng dồn</b> bằng <b>tổng chi phí đầu tư</b>.</p>
   <div class="grid3"><div class="mini"><h4>Đưa vào</h4><p>Sản lượng theo tháng (Chương 3) × tỉ lệ tự dùng (Chương 2) → kWh tự dùng → tiền tiết kiệm (Chương 1).</p></div><div class="mini"><h4>Tính cả</h4><p>Suy giảm tấm pin ≈ 0,5%/năm; chi phí thay inverter khoảng năm 11; giá điện có thể tăng.</p></div><div class="mini"><h4>Không tính</h4><p>Tiền bán điện dư (chỉ là phần thưởng thêm), trừ khi khách đã làm thủ tục.</p></div></div></section>
  ${toolCard('','t-pb')}
  <section class="card warn"><h2>⚠️ Giả định cần nói rõ với khách</h2><p style="margin:0">Giá hệ (8 triệu/kWp bám lưới, 10 triệu/kWp hybrid, 5 triệu/kWh pin) và giá điện tăng 3%/năm chỉ là <b>giả định của khoá học</b>. Khi tư vấn thật: dùng báo giá của đối tác, ghi rõ giả định trong đề xuất, và tính thêm kịch bản giá điện <b>không tăng</b> để khách thấy mức thấp nhất.</p></section>
  `,init:el=>paybackTool($('#t-pb',el)),
  quiz:[{q:'Thời gian hoàn vốn là gì?',o:['Thời gian lắp đặt','Số năm để tiền tiết kiệm cộng dồn bằng chi phí đầu tư','Thời hạn bảo hành','Tuổi thọ tấm pin'],a:1,e:'Sau mốc này, tiết kiệm là lãi ròng.'},
   {q:'Vì sao phải trừ chi phí thay inverter khoảng năm 11?',o:['Vì luật yêu cầu','Vì inverter nhiều khả năng phải thay một lần trong 25 năm','Cho đẹp số','Không cần trừ'],a:1,e:'Tính đủ chi phí để lời hứa hoàn vốn trung thực.'},
   {q:'Cách so sánh trung thực với gửi tiết kiệm?',o:['Nói ngân hàng lãi thấp','Tính tiền lãi gửi cùng số tiền và đặt cạnh lãi ròng điện mặt trời','Không so sánh','Nói ngân hàng rủi ro'],a:1,e:'Đưa con số hai bên cạnh nhau, để khách tự thấy.'}]},
 {id:'c8l2',title:'Trả góp: “tiền điện trả thay tiền góp”',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Tính tiền góp hằng tháng</li><li>Trình bày phương án để <b>tiền điện tiết kiệm gần đủ trả góp</b></li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2>${persona('👨','Anh Tuấn – Quảng Xương','Thích hệ hybrid 90 triệu nhưng chỉ có sẵn 30 triệu')}<p style="margin:0">Anh trả trước 30 triệu, vay 60 triệu. Tiền góp mỗi tháng có vượt tiền điện tiết kiệm được không?</p></section>
  ${toolCard('','t-loan')}
  <section class="card note"><h2>🏦 Các hình thức hỗ trợ tài chính</h2><ul class="clean" style="margin:0"><li><b>Vay tiêu dùng / vay xanh</b> tại ngân hàng (Agribank, quỹ tín dụng nhân dân… rất phổ biến ở nông thôn Thanh Hoá). Hỏi trực tiếp chi nhánh về gói đang có.</li><li><b>Trả góp qua thẻ tín dụng</b> nếu đối tác có hỗ trợ.</li><li><b>Chia đợt thanh toán</b> theo tiến độ: 50% khi ký, 40% khi nghiệm thu, 10% sau 1 tháng vận hành.</li><li><b>Lắp nhỏ trước, mở rộng sau</b>: chọn inverter hybrid “sẵn sàng gắn pin”, năm sau mua thêm pin.</li></ul></section>
  `,init:el=>loanTool($('#t-loan',el)),
  quiz:[{q:'Câu chốt mạnh nhất khi tư vấn trả góp?',o:['“Lãi suất thấp lắm”','“Tiền điện tiết kiệm gần đủ trả tiền góp hằng tháng”','“Vay đi, sợ gì”','“Ngân hàng nào cũng cho vay”'],a:1,e:'Khách gần như không phải bỏ thêm tiền hằng tháng.'},
   {q:'Tiền góp cao hơn tiền tiết kiệm. Có thể điều chỉnh gì?',o:['Bỏ cuộc','Kéo dài thời hạn, tăng trả trước, hoặc giảm quy mô hệ','Tăng lãi suất','Bỏ bảo hành'],a:1,e:'Có nhiều cách cân đối dòng tiền.'},
   {q:'Ai cung cấp lãi suất, cách tính chính xác?',o:['Tư vấn viên tự đặt','Ngân hàng cho vay','Khách tự đoán','Điện lực'],a:1,e:'Dùng bảng tính của ngân hàng khi tư vấn thật.'}]},
 {id:'c8l3',title:'Xử lý 6 băn khoăn thường gặp',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Luyện trả lời 6 băn khoăn phổ biến nhất</li><li>Áp dụng công thức: <b>đồng cảm → sự thật có số → cam kết → bước tiếp theo</b></li></ul></section>
  <section class="card"><h2>🧩 Công thức trả lời băn khoăn</h2><div class="grid2"><div class="mini" style="border-top:4px solid var(--sky2)"><h4>① Đồng cảm</h4><p>“Bác lo vậy là đúng ạ…”</p></div><div class="mini" style="border-top:4px solid var(--sun)"><h4>② Sự thật có số</h4><p>Số liệu, ví dụ, ảnh công trình thật</p></div><div class="mini" style="border-top:4px solid var(--leaf)"><h4>③ Cam kết</h4><p>Ghi trong hợp đồng, bảo hành</p></div><div class="mini" style="border-top:4px solid var(--red)"><h4>④ Bước tiếp theo</h4><p>Hẹn gửi bảng tính, hẹn gặp cả nhà</p></div></div></section>
  <section class="card tool" id="t-dlg"></section>
  `,init:el=>dialogueTool($('#t-dlg',el)),
  quiz:[{q:'Bước đầu tiên khi khách nêu băn khoăn?',o:['Phản bác ngay','Đồng cảm, thừa nhận nỗi lo','Giảm giá','Chuyển chủ đề'],a:1,e:'Đồng cảm giúp khách sẵn sàng nghe tiếp.'},
   {q:'Khách nói “để bàn với vợ”. Cách xử lý tốt?',o:['Ép ký ngay','Hẹn buổi trình bày ngắn cho cả hai vợ chồng','Chờ khách gọi lại','Bỏ qua khách'],a:1,e:'Tạo bước tiếp theo cụ thể, có mặt người cùng quyết định.'},
   {q:'Khách hỏi về chập cháy. Câu trả lời nào thuyết phục nhất?',o:['“Ít khi cháy lắm”','Giải thích nguyên nhân thường gặp và biện pháp cụ thể bên mình áp dụng','“Do xui thôi”','“Không bao giờ cháy”'],a:1,e:'Sự thật + biện pháp cụ thể + cam kết.'}]},
 {id:'c8l4',title:'Trình bày đề xuất 1 trang',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Biết cấu trúc 5 phần của một đề xuất</li><li>Tự tạo và in đề xuất cho khách</li></ul></section>
  <section class="card"><h2>📄 Cấu trúc 5 phần</h2><ol class="clean"><li><b>Hiện trạng</b>: hoá đơn, thói quen dùng điện (cho khách thấy bạn đã lắng nghe)</li><li><b>Giải pháp</b>: loại hệ, công suất, pin, thiết bị (hãng, mã)</li><li><b>Hiệu quả</b>: chi phí, tiết kiệm mùa hè và mùa đông, hoàn vốn</li><li><b>Bảo hành và chăm sóc</b>: từng thiết bị, thi công, lịch chăm sóc</li><li><b>Thanh toán</b>: các đợt, hỗ trợ trả góp</li></ol>
   <div class="card insight" style="margin-bottom:0">💡 <b>Mẹo trình bày:</b> đặt tờ đề xuất cạnh hoá đơn của khách; chỉ vào con số tiết kiệm mùa đông trước (số nhỏ), rồi mới đến mùa hè. Nói thật trước, khách sẽ tin phần còn lại.</div></section>
  ${toolCard('','t-prop')}
  `,init:el=>proposalTool($('#t-prop',el)),
  quiz:[{q:'Vì sao phần đầu đề xuất là “Hiện trạng”?',o:['Cho dài','Cho khách thấy tư vấn viên đã lắng nghe và hiểu nhà mình','Theo quy định','Không cần'],a:1,e:'Tạo niềm tin trước khi đưa giải pháp.'},
   {q:'Vì sao nên nói số tiết kiệm mùa đông trước?',o:['Vì nhỏ hơn','Nói thật phần kém trước giúp khách tin phần còn lại','Vì khách thích mùa đông','Ngẫu nhiên'],a:1,e:'Tư duy “mọi lời hứa đều có số”, thật thà trước.'},
   {q:'Đề xuất cần ghi thiết bị thế nào?',o:['“Hàng tốt”','Hãng, mã từng thiết bị','Chỉ công suất','Không ghi'],a:1,e:'Cụ thể, kiểm chứng được.'}]}
 ],
 cards:[['Thành phần tính hoàn vốn?','Sản lượng tháng × tỉ lệ tự dùng → kWh tự dùng → tiền tiết kiệm; trừ thay inverter năm ≈11; suy giảm 0,5%/năm; không tính tiền bán điện dư.'],
  ['Câu chốt khi tư vấn trả góp?','“Tiền điện tiết kiệm gần đủ trả tiền góp hằng tháng.”'],
  ['Công thức trả lời băn khoăn?','Đồng cảm → sự thật có số → cam kết → bước tiếp theo.'],
  ['6 băn khoăn thường gặp?','Đắt/gửi tiết kiệm · nắng ít · dột mái · chập cháy · chính sách thay đổi · để bàn với gia đình.'],
  ['5 phần của đề xuất 1 trang?','Hiện trạng · Giải pháp · Hiệu quả · Bảo hành và chăm sóc · Thanh toán.']],
 field:{title:'Đóng vai và đề xuất thật',tasks:['Đóng vai với đồng đội: một người làm khách nêu đủ 6 băn khoăn, một người trả lời theo công thức 4 bước','Hỏi 1 chi nhánh ngân hàng hoặc quỹ tín dụng ở địa phương về gói vay cho điện mặt trời; ghi lãi suất, thời hạn, điều kiện','Lập 1 đề xuất 1 trang cho khách tiềm năng thật và nhờ đồng đội góp ý']}
},

/* ------------------------------------------------------------------ CHƯƠNG 9 */
{id:'c9',num:9,icon:'🏆',title:'Bài cuối: tư vấn trọn vẹn',ctv:false,ready:true,
 desc:'Tự lập đề xuất cho 3 hồ sơ thực tế, chấm điểm và so với đáp án mẫu. Hoàn thành để nhận chứng nhận.',
 badge:{ic:'🏆',name:'Tư vấn viên Thanh Hoá Solar'},
 lessons:[
 {id:'c9l1',title:'Hồ sơ 1: hộ gia đình anh Tuấn',min:20,
  html:()=>`
  <section class="card goal"><h2>🎯 Nhiệm vụ</h2><p style="margin:0">Dùng công cụ bên dưới (đã điền sẵn số liệu gợi ý, bạn có thể thay đổi) để lập đề xuất, rồi bấm <b>Chấm điểm</b>.</p></section>
  <section class="card" id="cap"></section>${toolCard('','t-pb')}`,
  init:el=>{capstoneTool($('#cap',el),'tuan');paybackTool($('#t-pb',el),CAPS.tuan.pb)},
  quiz:[{q:'Yếu tố quyết định chọn hybrid cho anh Tuấn?',o:['Mái tôn','Dùng điện chủ yếu buổi tối','Ở Quảng Xương','Ngân sách 100 triệu'],a:1,e:'Không có pin thì phần lớn điện mặt trời phát lúc nhà vắng.'},
   {q:'Phương án thay thế khi ngân sách hạn chế?',o:['Không lắp','Bám lưới nhỏ phủ tải ban ngày, dùng inverter sẵn sàng gắn pin','Hệ độc lập','Lắp thật to'],a:1,e:'Cho khách lựa chọn, nói rõ ưu nhược.'},
   {q:'Khi trình bày, nên nói mùa nào trước?',o:['Mùa hè','Mùa đông','Không nói mùa','Tuỳ hứng'],a:1,e:'Nói thật phần thấp trước.'}]},
 {id:'c9l2',title:'Hồ sơ 2: nhà nghỉ chị Hoa',min:20,
  html:()=>`
  <section class="card goal"><h2>🎯 Nhiệm vụ</h2><p style="margin:0">Hồ sơ hộ kinh doanh: chú ý biểu giá, mùa vụ và nguy cơ lắp quá to.</p></section>
  <section class="card" id="cap"></section>${toolCard('','t-season')}${toolCard('','t-pb')}`,
  init:el=>{capstoneTool($('#cap',el),'hoa');seasonTool($('#t-season',el),{who:'hoa'});paybackTool($('#t-pb',el),CAPS.hoa.pb)},
  quiz:[{q:'Vì sao không nên lắp quá to cho nhà nghỉ chị Hoa?',o:['Mái không đủ','Mùa đông tiêu thụ thấp, hệ quá to sẽ dư nhiều, giá bán điện dư thấp','Vì đắt','Vì luật cấm'],a:1,e:'Thiết kế cân bằng giữa mùa cao điểm và mùa thấp điểm.'},
   {q:'Vì sao hồ sơ này hoàn vốn nhanh?',o:['Giá kinh doanh cao và dùng điện ban ngày nhiều','Vì ở biển','Vì mái bê tông','Vì có pin'],a:0,e:'Mỗi kWh tự dùng đáng giá cao, tỉ lệ tự dùng cao.'},
   {q:'Mái bê tông của nhà nghỉ có lợi gì thêm?',o:['Không có','Khung nghiêng kiêm che nắng, giảm nóng tầng thượng','Rẻ hơn','Không cần khung'],a:1,e:'Lợi ích phụ có thể nhắc khi tư vấn.'}]},
 {id:'c9l3',title:'Hồ sơ 3: trang trại gà bác Lâm',min:20,
  html:()=>`
  <section class="card goal"><h2>🎯 Nhiệm vụ</h2><p style="margin:0">Hồ sơ khó nhất: rủi ro mất điện, mái nguy hiểm, giá trị không chỉ nằm ở tiền điện.</p></section>
  <section class="card" id="cap"></section>${toolCard('','t-bat')}${toolCard('','t-pb')}
  <section class="card insight" id="certBox"></section>`,
  init:el=>{capstoneTool($('#cap',el),'lam');batTool($('#t-bat',el));paybackTool($('#t-pb',el),CAPS.lam.pb);$('#certBox',el).innerHTML=`<h2>🏆 Sau bài này</h2><p>Khi hoàn thành mọi bài trong lộ trình, bạn nhận <b>Chứng nhận hoàn thành khoá học</b>.</p><a class="btn primary" href="#cert">Xem chứng nhận</a>`},
  quiz:[{q:'Giá trị lớn nhất của hệ cho bác Lâm là gì?',o:['Tiết kiệm tiền điện','Dự phòng mất điện cho quạt thông gió, bảo vệ đàn gà','Bán điện dư','Làm đẹp trang trại'],a:1,e:'“Bảo hiểm cho đàn gà”, đây là thông điệp chính.'},
   {q:'Nên lắp trên mái nào?',o:['Mái chuồng fibro xi măng','Mái nhà kho lợp tôn mới','Mái nào cũng được','Dưới đất'],a:1,e:'Fibro xi măng nguy hiểm, không lắp, không bước lên.'},
   {q:'Thời gian hoàn vốn dài hơn hai hồ sơ kia. Bạn nói gì?',o:['Giấu đi','Nói rõ, kèm giá trị dự phòng mất điện (một lần mất điện có thể thiệt hại lớn)','Bảo khách đừng lắp','Hứa hoàn vốn nhanh'],a:1,e:'Thật thà và chỉ ra giá trị thật.'}]}

{id:'c10',num:10,part:2,icon:'🔬',title:'Tấm pin và hệ thống: hiểu sâu',ctv:false,ready:true,
 desc:'Từ hạt ánh sáng đến dòng điện, đường cong I-V, ảnh hưởng của nắng và nhiệt độ, hiệu suất hệ thống PR, tính công suất từ hoá đơn và hệ bám tải. Mở đầu Phần 2 dành cho người muốn hiểu kỹ thuật.',
 badge:{ic:'🔬',name:'Kỹ thuật viên tấm pin'},
 lessons:[
 {id:'c10l1',title:'Từ hạt ánh sáng đến dòng điện',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Giải thích bằng lời đơn giản tấm pin tạo ra điện thế nào</li><li>Gọi đúng tên 8 bộ phận của một tấm pin và biết bộ phận nào hay hỏng</li><li>Phân biệt các công nghệ PERC, TOPCon, HJT, half-cut, hai mặt để trả lời khách</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p>Anh Quân ở Hoằng Hoá cầm hai báo giá: một bên ghi “tấm N-type TOPCon, half-cut, hai mặt kính”, bên kia ghi “Mono PERC”. Anh hỏi: <i>“Toàn chữ tiếng Anh, khác nhau thật hay chỉ để quảng cáo hả em?”</i></p><p style="margin:0">Cùng ngày, chị Mai ở Sầm Sơn gửi ảnh một tấm pin nhà chị có <b>một ô cell bị cháy xém màu nâu</b>. Học xong bài này, bạn trả lời được cả hai người.</p></section>
  <section class="card"><h2>🎬 Tấm pin tạo điện thế nào?</h2>${media('c10_cell',SB_CELL,'nguyên lý hoạt động pin năng lượng mặt trời')}</section>
  <section class="card"><h2>🧱 Từ cell đến dàn pin</h2><div class="grid2">
   <div class="mini"><h4>① Cell</h4><p>Lát silic mỏng, mỗi cell cho khoảng 0,6–0,7 V. Dòng điện phụ thuộc diện tích cell và độ nắng.</p></div>
   <div class="mini"><h4>② Tấm (module)</h4><p>66–72 cell (hoặc 132–144 nửa cell) nối tiếp, ép giữa kính và tấm nền. Voc khoảng 45–53 V, công suất 450–720 Wp.</p></div>
   <div class="mini"><h4>③ Chuỗi (string)</h4><p>Các tấm nối tiếp: <b>điện áp cộng dồn</b>, dòng giữ nguyên. 10 tấm 590 Wp cho khoảng 436 V khi làm việc.</p></div>
   <div class="mini"><h4>④ Dàn (array)</h4><p>Nhiều chuỗi nối song song: <b>dòng cộng dồn</b>, điện áp giữ nguyên. Mỗi hướng mái nên vào một MPPT riêng.</p></div></div>
   <div class="card insight" style="margin-bottom:0">💡 Câu thần chú: <b>nối tiếp cộng vôn, song song cộng ampe</b>. Công suất bằng vôn nhân ampe, nên đổi cách nối không làm tăng công suất, chỉ đổi điện áp và dòng điện cho hợp với inverter.</div></section>
  <section class="card"><h2>🔍 Bóc từng lớp tấm pin <span class="pill">Bấm vào các số</span></h2>${panelLayersSvg()}${hsPanel('lay')}</section>
  <section class="card"><h2>🧪 Ba “dòng họ” cell</h2><div class="tbl-wrap"><table class="tbl"><tr><th>Loại</th><th>Nhận biết</th><th>Ưu điểm</th><th>Hạn chế</th></tr>
   <tr><td><b>Đơn tinh thể (Mono)</b></td><td>Màu đen đồng đều</td><td>Hiệu suất cao nhất, chiếm gần hết thị trường hiện nay</td><td>Giá cao hơn Poly trước đây (nay chênh lệch rất ít)</td></tr>
   <tr><td><b>Đa tinh thể (Poly)</b></td><td>Xanh lam, lốm đốm như vân đá</td><td>Từng rẻ, phổ biến ở các hệ lắp trước 2020</td><td>Hiệu suất thấp hơn; nay hiếm gặp trong báo giá mới, hay gặp ở tấm cũ, tấm tháo dỡ</td></tr>
   <tr><td><b>Màng mỏng (Thin-film)</b></td><td>Mỏng, có loại uốn cong được</td><td>Nhẹ, chịu bóng mờ khá</td><td>Hiệu suất thấp nhất, cần nhiều diện tích; dùng cho mái yếu, ứng dụng đặc biệt</td></tr></table></div></section>
  <section class="card"><h2>🃏 Giải mã chữ tiếng Anh trong báo giá <span class="pill">Bấm để lật</span></h2><div class="grid3">
   ${[['🟦','PERC','Cell loại P có lớp phản xạ mặt sau. Từng là chuẩn của thị trường, nay đang được thay bằng TOPCon. Không xấu, nhưng là công nghệ đời trước.'],
     ['🟪','TOPCon (N-type)','Cell loại N: hiệu suất cao hơn PERC khoảng 1–2 điểm %, suy giảm chậm hơn, hệ số nhiệt tốt hơn. Phổ biến nhất hiện nay.'],
     ['🟩','HJT','Cell dị thể loại N: ít mất công suất khi nóng nhất, giá cao hơn. Hợp mái tôn nóng nếu ngân sách cho phép.'],
     ['✂️','Half-cut','Cell cắt đôi: dòng mỗi nửa nhỏ hơn nên ít nóng, ít tổn hao; một nửa tấm bị che thì nửa kia vẫn chạy.'],
     ['🪞','Hai mặt kính / bifacial','Hai mặt kính: bền hơn với nóng ẩm. Bifacial: mặt sau thu thêm ánh sáng phản xạ; lắp sát mái tôn thì phần thêm này nhỏ.'],
     ['〰️','Nhiều busbar (10BB–16BB)','Nhiều đường gom dòng mảnh hơn: giảm tổn hao và giảm ảnh hưởng khi cell có vết nứt nhỏ.']]
     .map(c=>`<div class="flipcard"><div class="flip-inner"><div class="flip-face flip-front"><span class="ic">${c[0]}</span><b>${c[1]}</b><small>bấm để xem</small></div><div class="flip-face flip-back">${c[2]}</div></div></div>`).join('')}</div>
   <button class="btn ghost" data-reveal="r1011" style="margin-top:12px">💬 Trả lời anh Quân thế nào?</button>
   <div class="reveal" id="r1011">“Dạ khác thật anh ạ. PERC là công nghệ đời trước, TOPCon là đời mới hơn: cùng diện tích thì phát nhiều hơn một chút, mất công suất chậm hơn qua các năm. Half-cut giúp tấm mát hơn, đỡ bị ảnh hưởng khi bị che một phần. Hai mặt kính thì bền hơn với khí hậu nồm ẩm ở mình. Nhưng anh nên so thêm <b>hãng, mã sản phẩm, bảo hành hiệu suất bao nhiêu năm</b>, chứ không chỉ nhìn tên công nghệ.”</div></section>
  <section class="card"><h2>📐 Hiệu suất tấm pin</h2><div class="fx">η = P<sub>max</sub> / (A × 1.000 W/m²)</div>
   <p>Tấm 590 Wp kích thước 2.278 × 1.134 mm có diện tích A ≈ 2,583 m², nên hiệu suất ≈ 590 ÷ 2.583 ≈ <b>22,8%</b>: cứ 100 phần năng lượng ánh sáng chiếu tới (ở điều kiện chuẩn STC) thì tấm biến được gần 23 phần thành điện.</p>
   <div class="grid3"><div class="mini"><h4>20–23%</h4><p>Tấm phổ thông hiện nay</p></div><div class="mini"><h4>23–25%</h4><p>TOPCon, HJT cao cấp</p></div><div class="mini"><h4>Trên 26%</h4><p>Kỷ lục trong phòng thí nghiệm, chưa bán đại trà</p></div></div>
   <div class="card insight" style="margin-bottom:0">💡 Hiệu suất tấm cao giúp <b>cần ít diện tích mái hơn cho cùng số kWp</b>. Nó không làm 1 kWp phát nhiều điện hơn bao nhiêu: sản lượng mỗi kWp chủ yếu phụ thuộc nắng, nhiệt độ, bóng che và chất lượng lắp đặt (Bài 10.3). Vì vậy hiệu suất tấm đáng tiền nhất khi <b>mái nhỏ</b>.</div></section>
  <section class="card warn"><h2>🔥 Vết cháy nhà chị Mai: điểm nóng</h2><p>Khi một cell bị che lâu (lá cây, phân chim, vật đè) hoặc bị nứt, nó không phát điện mà lại <b>cản dòng điện</b> của các cell khác, biến thành chỗ tiêu thụ điện và nóng lên rất cao. Đó là <b>hot spot</b>. Điốt bypass trong hộp nối giúp dòng điện đi vòng để hạn chế việc này, nhưng nếu kéo dài, cell vẫn có thể cháy xém tấm nền.</p>
   <p style="margin:0"><b>Việc cần làm:</b> chụp ảnh, ghi mã và số serial tấm, báo kỹ sư kiểm tra bằng camera nhiệt và đo chuỗi; vết cháy là lỗi phải thay tấm theo bảo hành (nếu không do tác động bên ngoài). Tìm và xử lý nguyên nhân che bóng, rồi hẹn lịch vệ sinh định kỳ.</p></section>
  <section class="card"><h2>🎮 Đúng hay sai?</h2>${tfGame([
   ['Nối 10 tấm nối tiếp thì điện áp tăng khoảng 10 lần, dòng điện giữ nguyên.',true,'Nối tiếp cộng vôn, dòng giữ nguyên.'],
   ['Tấm hiệu suất 23% luôn cho nhiều kWh trên mỗi kWp hơn hẳn tấm 21%.',false,'Hiệu suất cao chủ yếu giúp tiết kiệm diện tích. kWh trên mỗi kWp phụ thuộc nắng, nhiệt, bóng che, lắp đặt.'],
   ['Giẫm lên tấm pin khi vệ sinh không sao vì mặt kính rất cứng.',false,'Kính không vỡ nhưng cell bên dưới có thể nứt vi mô, mất công suất dần và gây điểm nóng.'],
   ['Một chiếc lá che lâu ngày trên một cell có thể làm cell đó nóng lên và cháy xém.',true,'Đó là hiện tượng hot spot. Điốt bypass hạn chế nhưng không loại bỏ hoàn toàn.']])}</section>
  `,init:()=>{},
  quiz:[{q:'Nối 2 chuỗi giống nhau song song vào cùng một đầu vào thì?',o:['Điện áp tăng gấp đôi','Dòng điện tăng gấp đôi, điện áp giữ nguyên','Cả hai tăng gấp đôi','Không thay đổi gì'],a:1,e:'Song song cộng ampe, điện áp giữ nguyên.'},
   {q:'Bộ phận nào giúp dòng điện “đi vòng” qua nhóm cell bị che?',o:['Khung nhôm','Lớp EVA','Điốt bypass trong hộp nối','Đầu nối MC4'],a:2,e:'Thường có 3 điốt bypass, mỗi điốt phụ trách một nhóm cell.'},
   {q:'Mái nhà khách nhỏ, muốn đủ công suất. Nên ưu tiên gì?',o:['Tấm hiệu suất cao (cần ít diện tích hơn cho cùng kWp)','Tấm Poly giá rẻ','Tấm màng mỏng','Lắp chồng hai lớp tấm'],a:0,e:'Hiệu suất cao đáng tiền nhất khi diện tích mái là giới hạn.'}]},
 {id:'c10l2',title:'Đường cong I-V và đọc datasheet chuyên sâu',min:20,
  html:()=>{const s=ivModel(1000,25),n=ivModel(800,43),h=ivModel(950,68);return `
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu điều kiện STC và NOCT/NMOT ghi trên datasheet</li><li>Đọc được đường cong I-V: Voc, Isc, Vmp, Imp, điểm công suất cực đại</li><li>Tự tính điện áp chuỗi lúc lạnh nhất và lúc nóng nhất, hai phép kiểm tra bắt buộc trước khi chốt số tấm</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Trưa tháng 6, anh Dũng ở TP Thanh Hoá gọi: <i>“Hệ nhà anh 10 tấm 590 W là 5,9 kW, sao app chỉ báo khoảng ${nf(h.mpp.P*10*0.96/1000,1)} kW? Có phải tấm dỏm không em?”</i> Cuối bài bạn sẽ trả lời anh Dũng bằng số.</p></section>
  <section class="card"><h2>📋 STC và NMOT: hai cột số trên datasheet</h2><p>Datasheet thường ghi hai bộ thông số. <b>STC</b> là điều kiện phòng thử nghiệm: nắng 1.000 W/m², cell 25°C. <b>NMOT</b> (hoặc NOCT) gần thực tế hơn: nắng 800 W/m², không khí 20°C, gió nhẹ, khi đó cell nóng khoảng 43–45°C.</p>
   <div class="tbl-wrap"><table class="tbl"><tr><th>Thông số (tấm mẫu 590 Wp)</th><th class="num">STC</th><th class="num">NMOT</th></tr>
    <tr><td>Công suất cực đại Pmax</td><td class="num">${Math.round(s.mpp.P)} W</td><td class="num">${Math.round(n.mpp.P)} W</td></tr>
    <tr><td>Điện áp Vmp / Dòng Imp</td><td class="num">${nf(s.mpp.V,1)} V / ${nf(s.mpp.I,2)} A</td><td class="num">${nf(n.mpp.V,1)} V / ${nf(n.mpp.I,2)} A</td></tr>
    <tr><td>Điện áp hở mạch Voc</td><td class="num">${nf(s.Voc,1)} V</td><td class="num">${nf(n.Voc,1)} V</td></tr>
    <tr><td>Dòng ngắn mạch Isc</td><td class="num">${nf(s.Isc,2)} A</td><td class="num">${nf(n.Isc,2)} A</td></tr>
    <tr><td>Hệ số nhiệt Pmax / Voc / Isc</td><td class="num" colspan="2">−0,29 / −0,25 / +0,045 %/°C</td></tr></table></div>
   <small class="src">Thông số minh hoạ do khoá học dựng từ một mô hình tấm pin, gần với tấm TOPCon 590 Wp phổ biến. Khi thiết kế thật, dùng đúng datasheet của tấm đã chọn.</small></section>
  ${toolCard('','t-iv')}
  <section class="card"><h2>🧭 Ba quy luật rút ra từ đường cong</h2><div class="grid3">
   <div class="mini"><h4>☀️ Nắng → dòng điện</h4><p>Nắng giảm một nửa thì dòng điện giảm gần một nửa; điện áp chỉ giảm chút ít.</p></div>
   <div class="mini"><h4>🔥 Nóng → điện áp</h4><p>Cell nóng thêm 1°C, công suất giảm khoảng 0,3%. Mái tôn trưa hè, cell có thể gần 70°C.</p></div>
   <div class="mini"><h4>❄️ Lạnh → điện áp cao nhất năm</h4><p>Sáng mùa đông trời lạnh, nắng vừa lên: Voc vượt số trên datasheet. Đây là lúc dễ vượt giới hạn inverter nhất.</p></div></div></section>
  ${toolCard('','t-voc')}
  ${toolCard('','t-vmp')}
  <section class="card warn"><h2>⚠️ Vì sao phải tính cả hai đầu?</h2><p style="margin:0">Chuỗi <b>quá dài</b>: sáng đông lạnh, điện áp vượt mức tối đa, inverter có thể hỏng và hãng từ chối bảo hành. Chuỗi <b>quá ngắn</b>: trưa hè nóng, điện áp tụt dưới dải MPPT, inverter không bám được điểm công suất cực đại hoặc không khởi động. Số tấm mỗi chuỗi phải nằm giữa hai giới hạn này. Kỹ sư thiết kế sẽ làm phép tính chi tiết (Chương sau về inverter); tư vấn viên cần hiểu để không hứa “thêm 1–2 tấm vào chuỗi cho đủ” một cách tuỳ tiện.</p></section>
  <section class="card">${scenario('Trả lời anh Dũng thế nào?',[
   {k:'bad',t:'A. “Chắc tấm có vấn đề, em cho thợ thay ngay.”',fb:'❌ Kết luận vội, tốn kém và làm khách mất lòng tin vào chính sản phẩm mình bán.'},
   {k:'good',t:`B. “Dạ 590 W là công suất đo trong phòng thí nghiệm ở 25°C. Trưa nay tấm trên mái tôn nóng gần 70°C nên mất khoảng 12–13% công suất, cộng hao hụt dây và inverter, nên khoảng ${nf(h.mpp.P*10*0.96/1000,1)} kW là đúng. Mình xem tổng số điện cả tháng trên app để đánh giá, em gửi anh bảng so sánh với dự kiến ạ.”`,fb:'✅ Giải thích bằng số, có hành động kiểm chứng tiếp theo. Khách yên tâm và tin hơn.'},
   {k:'mid',t:'C. “Tấm pin nào cũng vậy anh ạ, không sao đâu.”',fb:'⚠️ Đúng một phần nhưng thiếu lý do và thiếu kiểm chứng; khách vẫn còn nghi ngờ.'}])}</section>
  `},init:el=>{ivTool($('#t-iv',el));vocColdTool($('#t-voc',el));vmpHotTool($('#t-vmp',el))},
  quiz:[{q:'Điều kiện STC là gì?',o:['Nắng 800 W/m², không khí 20°C','Nắng 1.000 W/m², cell 25°C','Nắng trưa hè thực tế','Nhiệt độ 0°C'],a:1,e:'STC: 1.000 W/m², nhiệt độ cell 25°C, phổ AM1.5.'},
   {q:'Vì sao tính điện áp chuỗi tối đa phải dùng nhiệt độ thấp nhất trong năm?',o:['Vì hệ số nhiệt của Voc là số âm: trời càng lạnh, Voc càng cao','Vì mùa đông nắng to nhất','Vì inverter yếu hơn khi lạnh','Không cần, dùng 25°C là đủ'],a:0,e:'Ví dụ tấm mẫu: 52,0 V ở 25°C nhưng khoảng 54,6 V ở 5°C. 11 tấm ở 5°C là 600,6 V, vượt giới hạn 600 V.'},
   {q:'Không khí 38°C, nắng 1.000 W/m², NOCT 45°C. Nhiệt độ cell khoảng?',o:['38°C','45°C','69°C','100°C'],a:2,e:'38 + (45 − 20) / 800 × 1.000 = 38 + 31,25 ≈ 69°C.'}]},
 {id:'c10l3',title:'Hiệu suất hệ thống PR và sản lượng thật',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Tính sản lượng đúng bằng công thức E = P × PSH × PR</li><li>Nhận ra hai lỗi hay gặp: sai đơn vị và quên PR</li><li>Biết 6 khoản tổn hao và cách giảm từng khoản</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Khách ở Nông Cống nhận hai báo giá cho cùng hệ 5 kWp. Báo giá A hứa <b>25 kWh/ngày</b>, báo giá B ghi <b>16 kWh/ngày</b>. Khách nghiêng về A vì “phát nhiều hơn”. Ai đang nói thật?</p></section>
  <section class="card"><h2>📐 Công thức sản lượng</h2><div class="fx">E<sub>ngày</sub> (kWh) = P (kWp) × PSH (giờ) × PR</div>
   <ul class="clean"><li><b>P</b>: tổng công suất tấm pin, kWp.</li><li><b>PSH</b>: giờ nắng đỉnh, bằng bức xạ ngày tính theo kWh/m². Giả định của khoá học cho Thanh Hoá: khoảng <b>4,1</b> giờ trung bình năm trên mặt mái hướng Nam; mùa hè cao hơn, mùa đông thấp hơn nhiều.</li><li><b>PR</b>: phần còn lại sau mọi tổn hao, thường 0,75–0,85.</li></ul>
   <p style="margin:0">Hệ 5 kWp: 5 × 4,1 × 0,8 ≈ <b>16,4 kWh/ngày</b>, khớp với con số “kWp × 3,3” ở Chương 2 (vì 4,1 × 0,8 ≈ 3,3). Báo giá A lấy 5 × 5 giờ và <b>bỏ quên PR</b>, lại dùng số giờ nắng cao hơn thực tế ở Thanh Hoá.</p></section>
  <section class="card"><h2>🔎 Bắt lỗi trong một slide hay gặp</h2><div class="rw"><div class="bad-t">“Tấm 700 W × 4,5 giờ nắng = 3.150 Wp/ngày”</div><div class="good-t">Tấm 700 Wp × 4,1 giờ × 0,8 ≈ 2.300 Wh/ngày ≈ 2,3 kWh/ngày (Thanh Hoá, giả định)</div></div>
   <p style="margin:0">Sai 3 chỗ: <b>(1)</b> Wp là công suất, kết quả phải là <b>Wh</b> (điện năng); <b>(2)</b> 4,5 là số của vùng nắng hơn, không phải Thanh Hoá; <b>(3)</b> quên nhân PR nên cao hơn thực tế khoảng 20%.</p></section>
  <section class="card"><h2>🎮 Đúng hay sai?</h2>${tfGame([
   ['Hệ 5 kWp ở Thanh Hoá phát trung bình khoảng 25 kWh/ngày quanh năm.',false,'5 × 4,1 × 0,8 ≈ 16 kWh/ngày (giả định). 25 kWh là quên PR và dùng giờ nắng quá cao.'],
   ['“kWh” là đơn vị điện năng, “kWp” là đơn vị công suất.',true,'Công suất nhân thời gian mới ra điện năng.'],
   ['PR 0,8 nghĩa là hệ mất khoảng 20% so với lý thuyết vì nhiệt, bụi, dây, inverter…',true,'Đúng. PR là phần còn lại sau tổn hao.'],
   ['Dùng tấm hiệu suất cao là cách chính để tăng PR.',false,'PR phụ thuộc lắp đặt và vận hành: khe thoáng, bóng che, dây, vệ sinh, inverter. Hệ số nhiệt tốt giúp một chút.']])}</section>
  ${toolCard('','t-pr')}
  <section class="card"><h2>🧰 Sáu khoản tổn hao và cách giảm</h2><div class="tbl-wrap"><table class="tbl"><tr><th>Khoản</th><th>Thường gặp</th><th>Cách giảm</th></tr>
   <tr><td>🌡️ Nhiệt độ</td><td>6–10%</td><td>Để khe thoáng dưới tấm (không ốp sát mái), chọn tấm hệ số nhiệt tốt</td></tr>
   <tr><td>🧹 Bụi bẩn, phân chim</td><td>2–6%</td><td>Vệ sinh 3–6 tháng/lần, nhất là sau mùa khô, gió Lào hoặc gần đường bụi</td></tr>
   <tr><td>🌳 Bóng che</td><td>0–10% hoặc hơn</td><td>Bố trí tránh bóng, tách MPPT theo hướng, cân nhắc tối ưu hoá theo tấm</td></tr>
   <tr><td>🔌 Dây DC và AC</td><td>1–3%</td><td>Tiết diện đủ lớn, đường dây ngắn, đầu nối chắc</td></tr>
   <tr><td>🔄 Inverter</td><td>2–4%</td><td>Chọn inverter hiệu suất cao, đặt nơi thoáng mát để không bị giảm công suất do nóng</td></tr>
   <tr><td>⚖️ Lệch tấm, khác</td><td>1–3%</td><td>Tấm cùng lô, cùng hướng trong một chuỗi; đi dây gọn</td></tr></table></div>
   <p class="muted" style="font-size:.88rem;margin-bottom:0">Ngoài ra tấm suy giảm theo năm (thường 0,4–0,5%/năm với tấm N-type) nên sản lượng năm thứ 10 thấp hơn năm đầu vài phần trăm. Đưa vào bảng hoàn vốn 25 năm (Chương 8).</p></section>
  <section class="card insight"><h2>💡 Mùa đông: nói thật trước</h2><p style="margin:0">Mùa đông tấm mát nên PR cao hơn, nhưng nắng ít hơn nhiều. Theo giả định của khoá học, sản lượng tháng 2 chỉ bằng khoảng <b>${Math.round(PV_MONTH[1]/PV_MONTH[6]*100)}%</b> tháng 7. Công thức trung bình năm dùng để chọn công suất; khi trình bày tiết kiệm, luôn đưa cả số mùa hè và mùa đông.</p></section>
  `,init:el=>prTool($('#t-pr',el)),
  quiz:[{q:'Hệ 6 kWp, giờ nắng đỉnh 4,1, PR 0,8. Sản lượng trung bình mỗi ngày khoảng?',o:['24,6 kWh','19,7 kWh','4,9 kWh','30 kWh'],a:1,e:'6 × 4,1 × 0,8 ≈ 19,7 kWh/ngày.'},
   {q:'“700 W × 4,5 = 3.150 Wp/ngày” sai ở đâu?',o:['Không sai','Sai đơn vị (phải là Wh) và quên nhân PR; 4,5 cũng không phải số của Thanh Hoá','Chỉ sai phép nhân','Phải chia chứ không nhân'],a:1,e:'Công suất × giờ = điện năng (Wh), và phải trừ tổn hao bằng PR.'},
   {q:'Cách nào giảm tổn hao do nhiệt trên mái tôn?',o:['Ốp tấm sát mái cho chắc','Để khe thoáng dưới tấm và chọn tấm có hệ số nhiệt tốt','Sơn đen mái tôn','Không làm gì được'],a:1,e:'Không khí lưu thông dưới tấm giúp tấm mát hơn vài độ.'}]},
 {id:'c10l4',title:'Tính công suất hệ từ hoá đơn 12 tháng',min:20,
  html:()=>{const k=kwhFromMoney(2e6);return `
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Làm đủ 9 bước từ hoá đơn đến số tấm, inverter, diện tích mái</li><li>Chọn tỷ lệ bù theo thói quen dùng điện thật của khách</li><li>Giải trọn bài tập nhà phố mái tôn với hai phương án</li></ul></section>
  <section class="card story"><h2>📖 Bài tập tình huống</h2>${persona('👨‍💼','Anh Hùng, phường Đông Hương, TP Thanh Hoá','Nhà phố, mái tôn khoảng 100 m², điện 1 pha')}<p style="margin:0">Tiền điện trung bình khoảng <b>2 triệu đồng/tháng</b>, tương đương khoảng <b>${fmt(k)} kWh/tháng</b> (≈ ${nf(k*12/365,1)} kWh/ngày, theo biểu giá sinh hoạt đã gồm VAT). Hai vợ chồng đi làm từ 7 giờ sáng đến 5 rưỡi chiều; buổi tối bật 2 điều hoà và bình nóng lạnh. Ban ngày nhà chỉ còn tủ lạnh, camera, wifi. Anh muốn “lắp sao cho tiền điện giảm nhiều nhất”.</p></section>
  <section class="card"><h2>🧩 Sắp xếp 9 bước tính hệ từ hoá đơn</h2>${seqGame('c10size',[
   ['Thu thập điện năng 12 tháng','Lấy số kWh, không chỉ số tiền; đủ 12 tháng để thấy cả mùa hè và mùa đông.'],
   ['Quy tiền ra kWh nếu khách chỉ nhớ số tiền','Dùng máy tính hoá đơn ở Chương 1; nhớ số tiền đã gồm VAT.'],
   ['Tính điện trung bình mỗi ngày','Tổng kWh 12 tháng chia 365.'],
   ['Chọn tỷ lệ bù theo thói quen dùng điện','Không có pin thì không vượt phần điện dùng ban ngày.'],
   ['Chọn giờ nắng đỉnh và PR cho địa điểm','Tra số đúng địa chỉ (Chương 3); PR 0,75–0,85.'],
   ['Tính kWp và số tấm','Số tấm làm tròn lên.'],
   ['Kiểm tra mái: diện tích, hướng, tải trọng','Mái không đủ thì giảm công suất hoặc dùng tấm hiệu suất cao hơn.'],
   ['Chọn inverter theo tỷ số DC/AC và số pha','DC/AC 1,0–1,3; đúng 1 pha hay 3 pha; hybrid nếu có pin.'],
   ['Ước sản lượng từng tháng và hoàn vốn','Đưa cả số mùa đông (Chương 8).']],{done:'Thuộc 9 bước này, bạn tự lập được phần kỹ thuật của mọi đề xuất.'})}</section>
  <section class="card"><h2>🎚️ Chọn tỷ lệ bù thế nào?</h2><div class="grid3">
   <div class="mini"><h4>Đi làm cả ngày, không pin</h4><p>Khoảng 25–35%: chỉ phủ tải nền ban ngày (tủ lạnh, camera, máy bơm…).</p></div>
   <div class="mini"><h4>Có người ở nhà, kinh doanh ban ngày</h4><p>Khoảng 50–80%, tuỳ phần điện dùng từ 8 giờ sáng đến 4 giờ chiều.</p></div>
   <div class="mini"><h4>Có pin lưu trữ</h4><p>Có thể 70–90%, nhưng dung lượng pin phải đủ cho buổi tối (Chương 5).</p></div></div>
   <p class="muted" style="font-size:.88rem;margin-bottom:0">Kể cả khi số kWh ban ngày khớp, nắng dồn vào buổi trưa nên vẫn có lúc dư điện. Xem biểu đồ 24 giờ ở Chương 2 để thấy rõ.</p></section>
  ${toolCard('','t-size')}
  <section class="card"><h2>✅ Lời giải mẫu cho anh Hùng</h2><button class="btn ghost" data-reveal="r1041">👀 Xem lời giải</button>
   <div class="reveal" id="r1041"><div class="grid2">
    <div class="mini"><h4>Phương án 1: bám lưới nhỏ</h4><p>Tỷ lệ bù 30% → khoảng <b>4 tấm 590 Wp ≈ 2,4 kWp</b>, inverter 2 kW, chiếm khoảng 13 m² mái. Rẻ, nhưng chỉ giảm phần điện ban ngày; tiền điện buổi tối gần như giữ nguyên. Nên chọn inverter có thể gắn thêm pin sau này.</p></div>
    <div class="mini"><h4>Phương án 2: hybrid có pin</h4><p>Tỷ lệ bù 70% → khoảng <b>8 tấm ≈ 4,7 kWp</b>, inverter hybrid 4–5 kW, pin khoảng 10 kWh cho điều hoà buổi tối. Chiếm khoảng 25 m² mái, mái 100 m² thừa chỗ. Giảm được nhiều nhất, đầu tư cao hơn.</p></div></div>
    <p style="margin:10px 0 0">Trình bày cả hai, kèm tiết kiệm mùa hè và mùa đông, để anh Hùng tự chọn theo ngân sách. Chi phí tham khảo (giả định đầu năm 2026, chưa phải báo giá): hệ bám lưới khoảng 11–15 triệu/kWp; hệ hybrid có pin khoảng 15–25 triệu/kWp tuỳ dung lượng pin. Luôn dùng bảng giá hiện hành của nhóm.</p></div></section>
  `},init:el=>sizeTool($('#t-size',el)),
  quiz:[{q:'Khách dùng 600 kWh/tháng, muốn bù 50%, giờ nắng đỉnh 4,1, PR 0,8. Cần khoảng bao nhiêu kWp?',o:['3 kWp','6 kWp','1,5 kWp','12 kWp'],a:0,e:'600 × 12 / 365 ≈ 19,7 kWh/ngày; × 50% ≈ 9,9; ÷ (4,1 × 0,8) ≈ 3,0 kWp.'},
   {q:'Tính được 3,3 kWp, tấm 590 Wp. Lắp mấy tấm?',o:['5 tấm','6 tấm','5,6 tấm','7 tấm'],a:1,e:'3.300 ÷ 590 ≈ 5,6 → làm tròn lên 6 tấm (3,54 kWp).'},
   {q:'Gia đình đi làm cả ngày, không lắp pin. Tỷ lệ bù hợp lý?',o:['90–100%','25–35%, phủ tải nền ban ngày','Càng cao càng tốt','0%'],a:1,e:'Không có pin thì điện mặt trời chỉ dùng được ban ngày; phần dư bán bị giới hạn và giá thấp.'}]},
 {id:'c10l5',title:'Hệ bám tải: CT, đồng hồ thông minh và RS485',min:18,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Đọc được sơ đồ một sợi của hệ bám tải</li><li>Biết đặt CT đúng chỗ, đúng chiều và hiểu hậu quả khi đặt sai</li><li>Nắm trình tự kiểm tra chức năng bám tải khi nghiệm thu</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Xưởng mộc của anh Tiến ở Quảng Xương lắp hệ 15 kWp, cài chế độ bám tải vì chưa làm thủ tục bán điện dư. Tuần đầu có hai chuyện lạ: hôm thì công tơ điện lực vẫn ghi nhận <b>chiều phát ngược</b>, hôm khác thì giữa trưa nắng app báo inverter chỉ phát <b>vài chục W</b>. Hai lỗi có hai nguyên nhân khác nhau, đều liên quan đến một chiếc kẹp nhỏ gọi là CT.</p></section>
  <section class="card"><h2>⚙️ Bám tải hoạt động thế nào?</h2><div class="grid2">
   <div class="mini"><h4>① CT đo</h4><p>Kẹp quanh dây tổng, đo dòng điện và chiều chạy: nhà đang lấy điện từ lưới hay đẩy ra.</p></div>
   <div class="mini"><h4>② Đồng hồ thông minh tính</h4><p>Kết hợp dòng và điện áp để ra công suất mua/bán theo từng thời điểm.</p></div>
   <div class="mini"><h4>③ RS485 truyền</h4><p>Gửi số liệu cho inverter qua 2 dây A/B bằng giao thức Modbus, nhiều lần mỗi giây.</p></div>
   <div class="mini"><h4>④ Inverter điều chỉnh</h4><p>Thấy sắp đẩy ra lưới thì giảm công suất; thấy đang mua điện thì tăng lên, tối đa bằng khả năng của nắng.</p></div></div>
   <p class="muted" style="font-size:.88rem;margin-bottom:0">Mỗi hãng inverter có loại đồng hồ tương thích riêng; điện 3 pha phải dùng đồng hồ 3 pha, đủ 3 CT và đúng thứ tự pha.</p></section>
  <section class="card"><h2>🗺️ Sơ đồ một sợi hệ bám tải <span class="pill">Bấm vào các số</span></h2>${sldSvg()}${hsPanel('sld')}</section>
  ${toolCard('','t-zero')}
  <section class="card"><h2>🎮 Quy tắc lắp CT: đúng hay sai?</h2>${tfGame([
   ['CT kẹp ở dây tổng ngay sau công tơ, trước mọi nhánh tải và trước điểm nối inverter.',true,'Chỉ ở vị trí này đồng hồ mới thấy toàn bộ điện mua và bán của cả nhà.'],
   ['Kẹp CT vào dây ra của inverter cho gần, đỡ đi dây.',false,'Đồng hồ chỉ thấy điện của inverter và coi đó là điện đẩy ra lưới, nên ép inverter về gần 0. Đây là lỗi “trưa nắng mà phát vài chục W” của xưởng anh Tiến.'],
   ['Mũi tên trên CT quay chiều nào cũng được, đồng hồ tự hiểu.',false,'Ngược chiều thì đồng hồ hiểu đẩy ra thành lấy vào, inverter phát tối đa và vẫn phát ngược: lỗi thứ nhất của xưởng anh Tiến. Làm đúng hướng dẫn của hãng.'],
   ['Hệ 3 pha: CT pha A phải đi cùng dây đo điện áp pha A của đồng hồ.',true,'Lệch pha thì công suất tính sai, có pha vẫn phát ngược trong khi pha khác bị cắt oan.'],
   ['Đấu đảo dây A và B của RS485 thì inverter vẫn nhận lệnh bình thường.',false,'Inverter sẽ báo mất kết nối đồng hồ. Tuỳ hãng và cài đặt, inverter dừng phát hoặc không còn bám tải. Luôn kiểm tra trạng thái kết nối sau khi đấu.']])}</section>
  <section class="card"><h2>🧩 Trình tự kiểm tra chức năng bám tải khi nghiệm thu</h2>${seqGame('c10zero',[
   ['Cắt điện, treo biển, kiểm tra không còn điện','An toàn trước tiên: kẹp CT ở tủ tổng là việc của thợ điện có chuyên môn.'],
   ['Lắp đồng hồ thông minh, kẹp CT ở dây tổng đúng chiều','Sau công tơ, trước mọi nhánh tải và điểm nối inverter.'],
   ['Đi dây RS485: A nối A, B nối B','Dùng cáp xoắn đôi có chống nhiễu, đúng địa chỉ thiết bị.'],
   ['Đóng điện, cài inverter: đúng loại đồng hồ, giới hạn phát lưới 0 W','Cài đúng mẫu đồng hồ hãng yêu cầu; bật chức năng giới hạn công suất phát lên lưới.'],
   ['Bật tải lớn, kiểm tra đồng hồ báo chiều “mua” từ lưới','Nếu báo “bán” khi đang bật tải: CT ngược chiều hoặc sai pha.'],
   ['Giữa trưa tắt bớt tải: inverter phải tự giảm công suất','Công suất inverter phải “bám” theo tải, không có chiều phát ngược.'],
   ['Theo dõi công tơ và app vài ngày, ghi biên bản nghiệm thu','Lưu ảnh vị trí CT, màn hình cài đặt để bàn giao.']],{done:'Đây cũng là danh sách để bạn hỏi đội thi công khi bàn giao công trình bám tải.'})}</section>
  <section class="card warn"><h2>⚠️ Ranh giới công việc</h2><p style="margin:0">Tư vấn viên cần <b>hiểu</b> để giải thích và nhận ra lỗi khi xem app, nhưng <b>không tự mở tủ điện tổng hay kẹp CT</b>. Việc đấu nối do thợ điện có chuyên môn thực hiện, có cắt điện và đồ bảo hộ.</p></section>
  `,init:el=>zeroTool($('#t-zero',el)),

   {q:'Đã cài bám tải mà công tơ vẫn ghi phát ngược. Nghi ngờ đầu tiên?',o:['Tấm pin quá tốt','CT lắp ngược chiều hoặc sai pha','Trời quá nắng','Công tơ hỏng'],a:1,e:'CT ngược làm đồng hồ hiểu sai chiều, inverter phát tối đa.'},
   {q:'Giữa trưa nắng, app báo inverter chỉ phát vài chục W dù nhà đang dùng điện. Kiểm tra gì trước?',o:['Vị trí CT có bị kẹp nhầm vào dây ra của inverter không','Thay tấm pin','Tăng số tấm','Vệ sinh tấm'],a:0,e:'CT kẹp trên dây inverter khiến đồng hồ ép inverter về gần 0.'}]}

  ['Nối tiếp và song song?','Nối tiếp (chuỗi): cộng điện áp, dòng giữ nguyên. Song song: cộng dòng, điện áp giữ nguyên.'],
  ['STC là gì?','Nắng 1.000 W/m², nhiệt độ cell 25°C, phổ AM1.5. Ngoài trời hiếm khi đạt cả ba cùng lúc.'],
  ['Trời lạnh ảnh hưởng tấm pin thế nào?','Voc tăng (tấm mẫu: 52,0 V ở 25°C → 54,6 V ở 5°C). Kiểm tra điện áp chuỗi không vượt điện áp DC tối đa của inverter.'],
  ['Tấm nóng ảnh hưởng thế nào?','Điện áp và công suất giảm khoảng 0,3%/°C trên 25°C. Mái tôn trưa hè, cell gần 70°C → mất khoảng 12–13%.'],

  ['Tính kWp từ hoá đơn?','kWp = (kWh/ngày × tỷ lệ bù) / (PSH × PR); số tấm làm tròn lên; inverter ≈ kWp / (1,0–1,3).'],

{id:'c11',num:11,part:2,icon:'🔄',title:'Inverter: đọc, phân loại và ghép chuỗi',ctv:false,ready:true,
 desc:'Đọc từng dòng datasheet inverter, phân biệt hòa lưới, hybrid, độc lập ở mức kỹ thuật, ghép chuỗi tấm pin vừa “cửa sổ” điện áp và dòng điện, rồi chọn inverter cho một công trình thật.',
 badge:{ic:'🔄',name:'Thợ cả inverter'},
 lessons:[
 {id:'c11l1',title:'Đọc datasheet inverter hòa lưới',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Phân biệt nhóm thông số đầu vào DC, đầu ra AC và bảo vệ</li><li>Hiểu 12 con số quan trọng trên datasheet inverter</li><li>So sánh hai inverter bằng hiệu suất Euro thay vì con số quảng cáo</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Chủ một xưởng in ở Đông Sơn đưa hai báo giá inverter 6 kW. Bên A quảng cáo “hiệu suất 98,4%”, bên B ghi “hiệu suất Euro 97,6%”. Anh hỏi: <i>“Bên A cao hơn, chọn A cho chắc phải không em?”</i> Muốn trả lời đúng, phải đọc được datasheet.</p></section>
  <section class="card"><h2>🧠 Inverter hòa lưới làm 4 việc</h2><div class="grid2">
   <div class="mini"><h4>① Dò điểm công suất cực đại</h4><p>Bộ MPPT liên tục chỉnh điện áp chuỗi để lấy nhiều công suất nhất.</p></div>
   <div class="mini"><h4>② Đổi DC thành AC</h4><p>Tạo dòng xoay chiều hình sin, cùng pha, cùng tần số, cùng điện áp với lưới.</p></div>
   <div class="mini"><h4>③ Bảo vệ</h4><p>Mất lưới là tự ngắt (chống đảo lưới), giám sát cách điện, chống ngược cực, chống sét.</p></div>
   <div class="mini"><h4>④ Giao tiếp</h4><p>Gửi số liệu lên app qua Wi-Fi, LAN hoặc 4G; nhận lệnh giới hạn công suất qua RS485.</p></div></div></section>
  <section class="card"><h2>🔍 Bấm vào từng dòng datasheet</h2>${invDatasheet()}${hsPanel('inv')}</section>
  <section class="card"><h2>📐 Hiệu suất tối đa và hiệu suất Euro</h2><div class="fx">η<sub>Euro</sub> = 0,03·η<sub>5%</sub> + 0,06·η<sub>10%</sub> + 0,13·η<sub>20%</sub> + 0,10·η<sub>30%</sub> + 0,48·η<sub>50%</sub> + 0,20·η<sub>100%</sub></div>
   <p>Inverter không chạy hết công suất cả ngày: sáng sớm, chiều muộn, ngày mây chỉ chạy 5–50% tải. Hiệu suất Euro lấy trung bình có trọng số ở các mức tải đó (nặng nhất ở mức 50%), nên <b>sát thực tế hơn</b> con số “tối đa”. Một số hãng ghi hiệu suất CEC, cách tính tương tự.</p>
   <div class="card insight" style="margin-bottom:0">💡 Trả lời chủ xưởng: “Anh so <b>hiệu suất Euro</b> của cả hai bên. Nếu bên A chỉ ghi hiệu suất tối đa, mình xin thêm datasheet. Chênh nhau 0,5% hiệu suất thì một năm hệ 6 kW mất khoảng 40 số điện, không lớn bằng chênh lệch về bảo hành và dịch vụ sau bán hàng.”</div></section>
  <section class="card warn"><h2>🌡️ Giảm công suất do nóng</h2><p style="margin:0">Inverter tự <b>giảm công suất</b> khi bên trong quá nóng để bảo vệ linh kiện. Datasheet thường ghi “làm việc đến 60°C” nhưng chỉ phát đủ công suất tới khoảng 45°C. Treo inverter dưới mái tôn hướng Tây, nắng chiếu trực tiếp, là cách chắc chắn nhất để mất sản lượng giữa trưa hè.</p></section>
  <section class="card"><h2>🎮 Đúng hay sai?</h2>${tfGame([
   ['Điện áp DC tối đa là giới hạn tuyệt đối, vượt dù chỉ một lúc cũng có thể làm hỏng inverter.',true,'Đây là thông số phải kiểm tra với Voc lúc lạnh nhất.'],
   ['Dòng AC ra tối đa dùng để chọn aptomat và tiết diện dây phía AC.',true,'Aptomat ≥ 1,25 × dòng AC ra tối đa.'],
   ['Hiệu suất tối đa 98,4% nghĩa là cả năm inverter luôn chạy ở 98,4%.',false,'Đó chỉ là điểm tốt nhất. Hiệu suất Euro mới phản ánh trung bình thực tế.'],
   ['Chống đảo lưới (anti-islanding) giúp nhà vẫn có điện khi lưới mất.',false,'Ngược lại: inverter hòa lưới phải TỰ NGẮT khi mất lưới, để thợ điện lực sửa đường dây an toàn.']])}</section>
  `,init:()=>{},
  quiz:[{q:'Thông số nào dùng để kiểm tra Voc lúc lạnh nhất của chuỗi?',o:['Dòng AC ra tối đa','Điện áp DC tối đa','Hiệu suất Euro','Cấp IP'],a:1,e:'Voc cả chuỗi lúc lạnh phải nhỏ hơn điện áp DC tối đa của inverter.'},
   {q:'So sánh hiệu suất hai inverter nên dùng con số nào?',o:['Hiệu suất tối đa','Hiệu suất Euro hoặc CEC','Công suất AC','Cấp IP'],a:1,e:'Euro/CEC là trung bình có trọng số ở nhiều mức tải, sát thực tế.'},
   {q:'Inverter 6 kW, dòng AC ra tối đa 28,7 A. Aptomat AC tối thiểu?',o:['20 A','≈ 36 A → chọn 40 A','10 A','100 A'],a:1,e:'1,25 × 28,7 ≈ 36 A → chọn cỡ chuẩn 40 A.'}]},
 {id:'c11l2',title:'Hòa lưới, hybrid, độc lập: khác nhau ở đâu về kỹ thuật?',min:18,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>So sánh ba họ inverter theo thông số kỹ thuật, không chỉ theo tên gọi</li><li>Biết những điểm phải kiểm tra riêng ở inverter hybrid và độc lập</li><li>Tự tính công suất inverter cho tải dự phòng có động cơ</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Một trang trại gà ở Thọ Xuân lắp inverter hybrid 5 kW. Mỗi lần mất điện, khi máy bơm 1,5 kW tự bật lên là inverter báo quá tải và ngắt, cả dãy quạt thông gió tắt theo. Inverter “5 kW” mà không chạy nổi máy bơm 1,5 kW, vì sao?</p></section>
  <section class="card"><h2>⚖️ So sánh ba họ inverter</h2><div class="tbl-wrap"><table class="tbl"><tr><th></th><th>Hòa lưới</th><th>Hybrid</th><th>Độc lập (off-grid)</th></tr>
   <tr><td>Cần lưới để chạy</td><td>Có, mất lưới là ngắt</td><td>Không bắt buộc</td><td>Không</td></tr>
   <tr><td>Pin lưu trữ</td><td>Không</td><td>Có (tuỳ chọn mở rộng)</td><td>Bắt buộc</td></tr>
   <tr><td>Cấp điện khi mất lưới</td><td>Không</td><td>Có, qua cổng dự phòng cho tải ưu tiên</td><td>Có, toàn bộ tải</td></tr>
   <tr><td>Thời gian chuyển mạch</td><td>–</td><td>Thường dưới 10–20 ms</td><td>–</td></tr>
   <tr><td>Hiệu suất</td><td>Cao nhất (97–98,5%)</td><td>Thấp hơn chút khi qua pin</td><td>Thường 90–95%</td></tr>
   <tr><td>Bán điện dư</td><td>Được nếu có thủ tục</td><td>Tuỳ dòng, tuỳ cài đặt</td><td>Không</td></tr>
   <tr><td>Điểm phải kiểm tra thêm</td><td>Số MPPT, dòng vào, chống phát ngược</td><td>Pin tương thích, công suất cổng dự phòng, dòng sạc/xả</td><td>Điện áp ắc quy (24/48 V), khả năng quá tải, bộ sạc MPPT hay PWM</td></tr></table></div></section>
  <section class="card"><h2>🔋 Ba điểm “chết người” của inverter hybrid</h2><div class="grid3">
   <div class="mini"><h4>Pin có trong danh sách tương thích?</h4><p>Inverter và pin phải “nói chuyện” qua BMS (cổng CAN hoặc RS485). Pin không có trong danh sách tương thích của hãng inverter thì có thể sạc sai, báo lỗi, mất bảo hành.</p></div>
   <div class="mini"><h4>Pin điện áp thấp hay cao?</h4><p>Pin 48–51,2 V (điện áp thấp) phổ biến cho nhà ở; pin điện áp cao (vài trăm vôn) cần inverter loại tương ứng. Không lắp lẫn được.</p></div>
   <div class="mini"><h4>Cổng dự phòng chịu bao nhiêu?</h4><p>Công suất cổng dự phòng (backup/EPS) thường nhỏ hơn công suất hòa lưới. Tải ưu tiên phải tách thành tủ riêng nối vào cổng này.</p></div></div></section>
  <section class="card note"><h2>🔌 Inverter độc lập: chọn theo tải, không theo tấm pin</h2><p style="margin:0">Hệ độc lập phải gánh 100% tải, kể cả cú khởi động của động cơ. Chọn <b>sóng sin chuẩn</b> (không dùng loại sóng vuông, sin mô phỏng cho động cơ, thiết bị điện tử). Ắc quy hệ 48 V cho dòng nhỏ hơn hệ 24 V nên dây nhỏ hơn, ít tổn hao. Bộ sạc <b>MPPT</b> lấy được nhiều điện từ tấm pin hơn bộ sạc <b>PWM</b> (rẻ hơn nhưng phí phần điện áp dư của tấm).</p></section>
  ${toolCard('','t-bk')}
  <section class="card"><h2>🐔 Giải đáp: vì sao trang trại bị ngắt?</h2><button class="btn ghost" data-reveal="r1121">👀 Xem lời giải</button>
  <div class="reveal" id="r1121">Lúc mất điện, quạt khoảng 2,5 kW và máy bơm 1,5 kW cùng chạy: 4 kW. Máy bơm lúc khởi động kéo gấp khoảng 4 lần, tức thêm khoảng 4,5 kW trong vài giây: đỉnh khoảng <b>8,5 kW</b>. Inverter 5 kW quá tải 150% cũng chỉ chịu được 7,5 kW, chưa kể giới hạn của cổng dự phòng và dòng xả của pin. <b>Cách xử lý:</b> lắp khởi động mềm hoặc biến tần cho máy bơm; không cho máy bơm chạy khi mất lưới; hoặc chọn inverter từ 6 kW trở lên với cổng dự phòng và pin đủ dòng. Bấm bộ số “Trang trại” ở công cụ trên để kiểm tra.</div></section>
  <section class="card">${choiceGame([
   {t:'Nhà phố ở TP Thanh Hoá, điện lưới ổn định, dùng điện ban ngày nhiều, muốn hoàn vốn nhanh.',a:0,fb:'Hòa lưới (có thể kèm bám tải) là rẻ và hiệu quả nhất.'},
   {t:'Tiệm thuốc ở Như Thanh, khu hay mất điện, có tủ lạnh bảo quản vắc-xin.',a:1,fb:'Cần điện khi mất lưới cho tải quan trọng: hybrid có pin, tủ lạnh nối cổng dự phòng.'},
   {t:'Chòi canh rừng ở Bá Thước, không có lưới điện.',a:2,fb:'Không có lưới thì chỉ có độc lập, tính kỹ dung lượng ắc quy.'},
   {t:'Xưởng may trong khu công nghiệp, không được phép bán điện, tải ban ngày rất lớn.',a:0,fb:'Hòa lưới có bám tải (chống phát ngược). Không cần pin vì tải ban ngày đã dùng hết.'}],['Hòa lưới','Hybrid','Độc lập'])}</section>
  `,init:el=>backupTool($('#t-bk',el)),
  quiz:[{q:'Inverter hybrid 5 kW nhưng cổng dự phòng chỉ 3 kW. Khi mất lưới, tải ưu tiên tối đa khoảng?',o:['5 kW','3 kW (và phải tính cả đỉnh khởi động)','8 kW','Không giới hạn'],a:1,e:'Cổng dự phòng có giới hạn riêng, thường nhỏ hơn công suất hòa lưới.'},
   {q:'Vì sao pin lưu trữ phải nằm trong danh sách tương thích của hãng inverter?',o:['Cho đẹp','Để BMS và inverter giao tiếp, sạc xả đúng, giữ bảo hành','Vì pin rẻ hơn','Không cần'],a:1,e:'Không tương thích dễ báo lỗi, sạc sai, mất bảo hành.'},
   {q:'Hệ độc lập nên dùng inverter loại nào?',o:['Sóng vuông cho rẻ','Sóng sin chuẩn, đủ khả năng quá tải cho động cơ','Inverter hòa lưới','Loại nào cũng được'],a:1,e:'Động cơ và thiết bị điện tử cần sóng sin chuẩn.'}]},
 {id:'c11l3',title:'Ghép chuỗi tấm pin vừa “cửa sổ” của inverter',min:20,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Kiểm tra đủ 4 nhóm điều kiện khi ghép chuỗi: điện áp tối đa, dải MPPT, dòng điện, công suất</li><li>Hiểu vì sao tấm cỡ lớn cần inverter dòng vào lớn</li><li>Tự ghép chuỗi bằng công cụ “cửa sổ điện áp”</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2><p style="margin:0">Thợ mới của nhóm định “cho tròn” 11 tấm 590 Wp vào một chuỗi của inverter 5 kW vì “Voc mỗi tấm 52 V, 11 tấm là 572 V, vẫn dưới 600 V”. Kỹ sư gạch đi ngay. Bạn sẽ thấy lý do khi kéo công cụ bên dưới.</p></section>
  <section class="card"><h2>📋 Bốn nhóm điều kiện</h2><div class="tbl-wrap"><table class="tbl"><tr><th>Điều kiện</th><th>Công thức</th><th>Sai thì sao?</th></tr>
   <tr><td>① Điện áp tối đa</td><td>N × V<sub>oc</sub>(T<sub>min</sub>) ≤ V<sub>DC,max</sub></td><td>Hỏng inverter, mất bảo hành</td></tr>
   <tr><td>② Mức dưới MPPT</td><td>N × V<sub>mp</sub>(T<sub>cell,max</sub>) ≥ V<sub>MPPT,min</sub></td><td>Trưa hè tụt khỏi MPPT, mất sản lượng</td></tr>
   <tr><td>③ Mức trên MPPT</td><td>N × V<sub>mp</sub>(T<sub>min</sub>) ≤ V<sub>MPPT,max</sub></td><td>Sáng đông không bám được điểm tối ưu</td></tr>
   <tr><td>④ Dòng điện</td><td>Số chuỗi × I<sub>sc</sub> ≤ I<sub>sc,max</sub> mỗi MPPT</td><td>Inverter giới hạn dòng hoặc báo lỗi, nguy cơ quá nhiệt</td></tr>
   <tr><td>⑤ Công suất</td><td>Tổng kWp ≤ mức tối đa khuyến nghị; DC/AC 0,85–1,35</td><td>Cắt đỉnh nhiều hoặc inverter quá to, phí tiền</td></tr></table></div></section>
  ${toolCard('','t-str')}
  <section class="card insight"><h2>💡 Tấm cỡ lớn, dòng lớn</h2><p style="margin:0">Tấm 210 mm công suất 650–720 Wp có Isc khoảng 18–19 A. Nhiều inverter dân dụng đời cũ chỉ nhận 12,5–16 A mỗi MPPT. Khi báo giá tấm cỡ lớn, kiểm tra ngay dòng vào của inverter; đừng ghép hai chuỗi tấm dòng lớn chung một MPPT nếu inverter không cho phép.</p></section>
  <section class="card"><h2>🧩 Sắp xếp các bước ghép chuỗi</h2>${seqGame('c11str',[
   ['Lấy datasheet tấm pin và inverter','Voc, Vmp, Isc, các hệ số nhiệt; điện áp tối đa, dải MPPT, dòng vào.'],
   ['Xác định nhiệt độ thấp nhất và cao nhất tại công trình','Sáng đông lạnh nhất; cell nóng nhất trên mái trưa hè.'],
   ['Tính số tấm tối đa theo Voc lúc lạnh','Làm tròn xuống.'],
   ['Tính số tấm tối thiểu theo Vmp lúc nóng','Làm tròn lên.'],
   ['Chọn số tấm mỗi chuỗi nằm giữa hai giới hạn, ưu tiên gần điện áp định mức','Inverter đạt hiệu suất cao nhất quanh điện áp định mức.'],
   ['Chia chuỗi theo hướng mái và kiểm tra dòng mỗi MPPT','Mỗi hướng một MPPT; số chuỗi × Isc ≤ giới hạn.'],
   ['Kiểm tra tổng kWp và tỷ số DC/AC','Không vượt mức hãng cho phép.']],{done:'Đây là quy trình kỹ sư làm cho mọi công trình, dù 5 kWp hay 500 kWp.'})}</section>
  `,init:el=>stringTool($('#t-str',el)),
  quiz:[{q:'Inverter 600 V, tấm Voc 52 V, hệ số −0,25%/°C, nhiệt độ thấp nhất 5°C. Số tấm tối đa mỗi chuỗi?',o:['11','10','12','9'],a:1,e:'52 × 1,05 = 54,6 V; 600 ÷ 54,6 ≈ 10,99 → tối đa 10 tấm.'},
   {q:'Chuỗi 3 tấm 590 Wp vào inverter có MPPT từ 120 V. Vấn đề là gì?',o:['Vượt điện áp tối đa','Trưa hè Vmp tụt dưới 120 V, inverter không bám được MPPT','Dòng quá lớn','Không có vấn đề'],a:1,e:'3 × 38 V ≈ 114 V khi cell 70°C, thấp hơn mức dưới của MPPT.'},
   {q:'Tấm 700 Wp có Isc 18,4 A, inverter chỉ nhận Isc tối đa 20 A mỗi MPPT. Ghép mấy chuỗi vào một MPPT?',o:['1 chuỗi','2 chuỗi','3 chuỗi','Bao nhiêu cũng được'],a:0,e:'2 chuỗi là 36,8 A, vượt 20 A. Chỉ 1 chuỗi mỗi MPPT.'}]},
 {id:'c11l4',title:'Chọn inverter cho công trình: bài tập 10 tấm 700 Wp',min:18,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Chọn inverter theo 10 tiêu chí, không theo cảm tính thương hiệu</li><li>Biết chọn vị trí lắp inverter để không mất sản lượng</li><li>Giải bài tập: mái chỉ đặt được 10 tấm 700 Wp</li></ul></section>
  <section class="card story"><h2>📖 Bài tập tình huống</h2>${persona('👩‍🔧','Chị Thảo, nhà ống ở phường Ba Đình, TP Thanh Hoá','Mái bằng bê tông, đặt được 10 tấm 700 Wp = 7 kWp')}<p style="margin:0">Hãy chọn loại hệ và inverter phù hợp. Đề bài cố ý chưa nói nhà chị điện 1 pha hay 3 pha, dùng điện ban ngày hay buổi tối, có hay mất điện không: người tư vấn giỏi sẽ <b>hỏi trước khi chọn</b>.</p></section>
  <section class="card"><h2>✅ 10 tiêu chí chọn inverter</h2><div class="tbl-wrap"><table class="tbl"><tr><th>Tiêu chí</th><th>Cần kiểm tra</th></tr>
   <tr><td>1. Loại hệ</td><td>Hòa lưới, bám tải, hybrid hay độc lập: theo nhu cầu và tình trạng lưới</td></tr>
   <tr><td>2. Số pha</td><td>Đúng 1 pha hay 3 pha theo công tơ; nhà 3 pha lắp inverter 1 pha thì lệch pha</td></tr>
   <tr><td>3. Công suất, DC/AC</td><td>Tỷ số 1,0–1,3; không vượt công suất PV tối đa khuyến nghị</td></tr>
   <tr><td>4. Ghép chuỗi</td><td>Điện áp tối đa, dải MPPT, dòng vào mỗi MPPT (Bài 11.3)</td></tr>
   <tr><td>5. Số MPPT</td><td>Đủ cho số hướng mái</td></tr>
   <tr><td>6. Hiệu suất Euro</td><td>Từ khoảng 97% trở lên cho hòa lưới</td></tr>
   <tr><td>7. Bảo vệ</td><td>Chống đảo lưới, giám sát cách điện, chống sét DC/AC; AFCI là điểm cộng</td></tr>
   <tr><td>8. Môi trường</td><td>IP65 trở lên nếu lắp ngoài trời; nhiệt độ bắt đầu giảm công suất</td></tr>
   <tr><td>9. Giám sát, điều khiển</td><td>App ổn định, có cổng cho đồng hồ bám tải nếu cần</td></tr>
   <tr><td>10. Bảo hành, dịch vụ</td><td>Số năm bảo hành, trung tâm bảo hành gần Thanh Hoá, thời gian đổi máy</td></tr></table></div>
   <p class="muted" style="font-size:.88rem;margin-bottom:0">Đừng chọn theo “hãng A tốt, hãng B kém” nghe truyền miệng. Đặt datasheet các lựa chọn cạnh nhau, chấm theo 10 tiêu chí, và hỏi đối tác về tỷ lệ lỗi thực tế của dòng máy đó.</p></section>
  <section class="card note"><h2>📍 Chọn chỗ treo inverter</h2><ul class="clean"><li>Khô ráo, thoáng gió, <b>không bị nắng chiếu trực tiếp</b>; tránh gác xép kín dưới mái tôn.</li><li>Chừa khoảng trống xung quanh theo hướng dẫn của hãng để tản nhiệt; không đặt chồng hai inverter sát nhau.</li><li>Gần tủ điện chính để dây AC ngắn; cao vừa tầm để đọc màn hình, bảo trì; tránh nơi trẻ em với tới.</li><li>Có sóng Wi-Fi ổn định hoặc kéo dây mạng, để app không mất kết nối.</li></ul></section>
  <section class="card"><h2>🧩 Thứ tự chọn inverter</h2>${seqGame('c11pick',[
   ['Hỏi nhu cầu: dùng ngày hay đêm, có hay mất điện, có muốn bán điện','Quyết định loại hệ.'],
   ['Kiểm tra số pha và tủ điện nhà khách','Quyết định inverter 1 pha hay 3 pha.'],
   ['Xác định số tấm, hướng mái từ bản vẽ bố trí','Ra tổng kWp và số MPPT cần.'],
   ['Chọn công suất inverter theo tỷ số DC/AC','Thường 1,0–1,3.'],
   ['Ghép chuỗi, kiểm tra điện áp và dòng','Nếu không đạt, đổi model.'],
   ['So sánh các model đạt theo hiệu suất, bảo vệ, bảo hành','Chọn phương án cân bằng nhất.']],{done:''})}</section>
  ${toolCard('','t-str2')}
  <section class="card"><h2>✅ Lời giải gợi ý cho nhà chị Thảo</h2><button class="btn ghost" data-reveal="r1141">👀 Xem lời giải</button>
   <div class="reveal" id="r1141"><p><b>Ghép chuỗi:</b> 10 tấm 700 Wp một chuỗi: Voc lúc 5°C ≈ 507 V, Vmp lúc nóng ≈ 351 V, nằm gọn trong inverter 600 V, MPPT 120–550 V. Nhưng dòng làm việc 17,3 A, Isc 18,4 A: <b>loại inverter chỉ nhận 16 A mỗi MPPT là không hợp</b>; cần loại 20 A trở lên.</p>
    <div class="grid3"><div class="mini"><h4>Điện 1 pha, dùng ngày, lưới ổn định</h4><p>Hòa lưới 1 pha 6 kW (DC/AC ≈ 1,17), có bám tải nếu chưa làm thủ tục bán điện.</p></div>
    <div class="mini"><h4>Điện 1 pha, dùng tối, hay mất điện</h4><p>Hybrid 1 pha 6 kW + pin khoảng 10 kWh; kiểm tra cổng dự phòng và pin tương thích.</p></div>
    <div class="mini"><h4>Điện 3 pha</h4><p>Inverter 3 pha khoảng 6–8 kW; kiểm tra dải MPPT của dòng 3 pha (thường cao hơn) với chuỗi 10 tấm.</p></div></div>
    <p style="margin:10px 0 0">Bấm bộ số “10 × 700 → 5 kW” và “10 × 700 → 6 kW” ở công cụ trên để thấy khác biệt.</p></div></section>
  `,init:el=>stringTool($('#t-str2',el)),
  quiz:[{q:'Nhà điện 3 pha có nên lắp inverter 1 pha 7 kW không?',o:['Nên, cho rẻ','Không nên: dồn hết lên một pha gây lệch pha; dùng inverter 3 pha','Tuỳ màu sơn','Chỉ cần thêm aptomat'],a:1,e:'Công trình 3 pha nên dùng inverter 3 pha để chia đều công suất.'},
   {q:'Treo inverter ở đâu là tốt nhất?',o:['Ngoài trời, nắng chiếu trực tiếp cho khô','Nơi khô thoáng, có bóng râm, gần tủ điện chính','Trong gác xép kín dưới mái tôn','Trong nhà tắm'],a:1,e:'Nóng làm inverter tự giảm công suất và nhanh hỏng.'},
   {q:'Khi chọn inverter, việc nào nên làm đầu tiên?',o:['Chọn hãng nổi tiếng nhất','Hỏi nhu cầu và kiểm tra số pha của khách','Chọn loại rẻ nhất','Chọn loại có app đẹp'],a:1,e:'Nhu cầu và số pha quyết định loại hệ và loại inverter.'}]}
 ],
 cards:[['4 việc của inverter hòa lưới?','Dò MPPT · đổi DC sang AC đồng bộ lưới · bảo vệ (chống đảo lưới, cách điện, ngược cực, chống sét) · giao tiếp, giám sát.'],
  ['Hiệu suất Euro là gì?','Trung bình có trọng số hiệu suất ở nhiều mức tải (nặng nhất ở 50%); sát thực tế hơn hiệu suất tối đa.'],
  ['Chọn aptomat AC cho inverter?','≥ 1,25 × dòng AC ra tối đa, rồi chọn cỡ chuẩn lớn hơn gần nhất.'],

 field:{title:'Inverter ngoài thực tế',tasks:['Xin datasheet 2 model inverter đối tác hay dùng (1 hòa lưới, 1 hybrid); tìm đủ 12 thông số đã học và ghi hiệu suất Euro','Dùng công cụ ghép chuỗi kiểm tra cấu hình của một công trình thật đã lắp; ghi lại kết quả từng điều kiện','Đến một công trình: chụp vị trí treo inverter, đánh giá theo 4 tiêu chí (bóng râm, thông gió, gần tủ, sóng Wi-Fi)']}
