<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học viện Tư vấn – Thanh Hoá Solar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#0b4f8a;--sky2:#1e74c4;--sky-soft:#e8f1fb;
  --sun:#f5b301;--sun-deep:#d98a00;--sun-soft:#fff6db;
  --leaf:#16935f;--leaf-soft:#e3f6ee;
  --red:#d14343;--red-soft:#fdeceb;
  --ink:#17232f;--muted:#5d6b79;--bg:#f3f6fa;--card:#fff;--line:#e1e7ef;
  --radius:14px;--shadow:0 2px 12px rgba(15,40,70,.07);
}
*{box-sizing:border-box}
html{font-size:16.5px}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.62}
a{color:var(--sky2)}
code{background:var(--sky-soft);padding:1px 6px;border-radius:6px;font-size:.88em}
.hidden{display:none!important}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 18px;height:60px;background:linear-gradient(90deg,var(--sky),var(--sky2));color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none;color:#fff;line-height:1.15}
.brand small{display:block;font-weight:500;opacity:.85;font-size:.72rem;letter-spacing:.02em}
.top-progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.85rem;white-space:nowrap}
.pbar{width:150px;height:9px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--sun);width:0;transition:width .6s}
.menu-btn{display:none;background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer;padding:0 4px}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:292px minmax(0,1fr)}
aside{background:#fff;border-right:1px solid var(--line);padding:14px 12px 40px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
main{padding:28px clamp(14px,4vw,52px) 90px;max-width:940px;width:100%;min-width:0}
.backdrop{display:none}
@media(max-width:920px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;left:0;top:60px;width:292px;z-index:45;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow)}
  aside.open{transform:none}
  .backdrop.show{display:block;position:fixed;inset:60px 0 0 0;background:rgba(10,20,35,.35);z-index:44}
  .menu-btn{display:block}
  .pbar{width:70px}
  .top-progress .ptxt{display:none}
}


/* ---------- Sidebar ---------- */
.nav-sec{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 10px 6px;font-weight:700}
.nav-link{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:.92rem}
.nav-link:hover{background:var(--sky-soft)}
.nav-link.active{background:var(--sky-soft);color:var(--sky);font-weight:700}
.nav-link .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:.7rem;padding:1px 8px;font-weight:700}
.chap-head{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.9rem;line-height:1.3}
.chap-head:hover{background:var(--sky-soft)}
.chap-head.active{background:var(--sky-soft);color:var(--sky)}
.chap-num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sky-soft);color:var(--sky);font-weight:800;font-size:.82rem;flex:none}
.chap.done .chap-num{background:var(--leaf);color:#fff}
.chap.locked .chap-head{color:var(--muted)}
.chap.optional .chap-head{opacity:.6}
.tag-ctv{font-size:.62rem;background:var(--sun-soft);color:#8a5a00;padding:1px 6px;border-radius:99px;margin-left:auto;font-weight:700;flex:none}
.lock{margin-left:auto;font-size:.8rem;flex:none}
.tag-ctv+.lock{margin-left:4px}
.lesson-list{margin:2px 0 8px 36px;padding:0;list-style:none}
.lesson-list a{display:flex;gap:7px;padding:5px 8px;border-radius:8px;font-size:.84rem;color:var(--muted);text-decoration:none;line-height:1.35}
.lesson-list a:hover{background:var(--bg)}
.lesson-list a.active{color:var(--sky);font-weight:700;background:var(--sky-soft)}

/* ---------- Typography & blocks ---------- */
h1{font-size:1.85rem;line-height:1.25;margin:.15em 0 .35em;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:0 0 .6em;display:flex;gap:10px;align-items:center;line-height:1.3}
h3{font-size:1.05rem;margin:1.1em 0 .4em}
.crumbs{font-size:.84rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:.78rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin:18px 0}
.card>:last-child{margin-bottom:0}
.goal{border-left:5px solid var(--sky2)}
.story{background:var(--sun-soft);border-color:#f3dfa3;border-left:5px solid var(--sun)}
.insight{background:var(--leaf-soft);border-color:#bfe6d3;border-left:5px solid var(--leaf)}
.warn{background:var(--red-soft);border-color:#f4c7c4;border-left:5px solid var(--red)}
.note{background:var(--sky-soft);border-color:#c8ddf3}
.lead{font-size:1.06rem;color:#2b3a49}
ul.clean{padding-left:1.15em;margin:.4em 0}
ul.clean li{margin:.25em 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.mini{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.mini h4{margin:0 0 6px;font-size:.98rem}
.mini p{margin:0;font-size:.92rem;color:#334453}
.persona{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:#fff;border:2px solid var(--sun);flex:none}
.persona b{display:block}
.persona small{color:var(--muted)}
.quote-box{background:#fff;border:1px solid #efd99a;border-radius:12px;padding:12px 16px}
.quote-box b{display:block;margin-bottom:4px}
.big-num{font-size:1.9rem;font-weight:800;color:var(--sky);line-height:1.1}
.muted{color:var(--muted)}
small.src{display:block;color:var(--muted);font-size:.78rem;margin-top:8px}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--bg);font-weight:700;font-size:.85rem}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:800;background:var(--sun-soft)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:11px;padding:10px 18px;font:inherit;font-weight:700;font-size:.93rem;cursor:pointer;transition:transform .08s,box-shadow .15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--sun);color:#3a2700;box-shadow:0 2px 0 var(--sun-deep)}
.btn.primary:hover{background:#ffc21a}
.btn.blue{background:var(--sky2);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--sky2);color:var(--sky2)}
.btn.green{background:var(--leaf);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* reveal */
.reveal{display:none;margin-top:12px;padding:14px 16px;background:#fff;border-radius:12px;border:1px dashed var(--sky2)}
.reveal.show{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* details worked example */
details.worked{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 16px;margin:12px 0}
details.worked summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--sky)}
details.worked[open]{padding-bottom:12px}

/* flip cards */
.flipcard{perspective:900px;cursor:pointer;min-height:150px}
.flip-inner{position:relative;width:100%;height:100%;min-height:150px;transition:transform .5s;transform-style:preserve-3d}
.flipcard.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center}
.flip-front{background:#fff;border:1px solid var(--line);align-items:center;text-align:center}
.flip-front .ic{font-size:2rem}
.flip-front b{margin-top:4px}
.flip-front small{color:var(--muted);font-size:.75rem;margin-top:4px}
.flip-back{background:var(--sky);color:#fff;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}

/* scenario */
.scenario{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.sc-q{font-weight:700;margin-bottom:10px;background:var(--sun-soft);padding:10px 14px;border-radius:12px 12px 12px 2px;display:inline-block}
.sc-opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:10px;padding:10px 14px;margin:8px 0;font:inherit;cursor:pointer}
.sc-opt:hover{border-color:var(--sky2)}
.sc-opt.good{border-color:var(--leaf);background:var(--leaf-soft)}
.sc-opt.bad{border-color:var(--red);background:var(--red-soft)}
.sc-opt.mid{border-color:var(--sun);background:var(--sun-soft)}
.sc-fb{margin-top:8px;font-size:.93rem}

/* quiz */
.quiz .q{padding:14px 0;border-bottom:1px dashed var(--line)}
.quiz .q:last-of-type{border-bottom:0}
.q-t{margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:10px;padding:9px 14px;margin:6px 0;font:inherit;font-size:.94rem;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--sky2)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--leaf);background:var(--leaf-soft);font-weight:600}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.explain{margin-top:6px;font-size:.9rem;padding:10px 12px;border-radius:10px;background:var(--sky-soft)}
.quiz-sum{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--sun-soft);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* lesson nav */
.lesson-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}

/* tools */
.tool{border:2px solid var(--sky2);background:#fbfdff}
.tool-head{font-weight:800;color:var(--sky);font-size:1.05rem;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.tool-head .pill{margin-left:auto;font-weight:600}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:12px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font:inherit;font-size:.88rem;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:#fff;color:var(--sky);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.field{margin:10px 0}
.field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.range-row{display:flex;gap:12px;align-items:center}
.range-row input[type=range]{flex:1}
input[type=range]{accent-color:var(--sun-deep);height:6px}
input[type=number],input[type=text],select,textarea{font:inherit;padding:8px 10px;border:1px solid #c9d4e0;border-radius:9px;background:#fff;color:var(--ink)}
input[type=number]{width:110px}
textarea{width:100%;min-height:90px;resize:vertical}
.tier-row{display:grid;grid-template-columns:118px 1fr 160px;gap:10px;align-items:center;font-size:.85rem;margin:5px 0}
.tier-row .lbl{color:#344556;font-weight:600;line-height:1.2}
.tier-row .lbl small{display:block;font-weight:500;color:var(--muted);font-size:.74rem}
.track{height:20px;background:#eef2f7;border-radius:6px;overflow:hidden;display:flex}
.track i{display:block;height:100%;transition:width .35s}
.track i.cut{background:repeating-linear-gradient(45deg,#f6c2c0 0 6px,#fff 6px 10px);border-left:1px dashed var(--red)}
.tier-row .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tier-row .amt small{display:block;color:var(--red);font-weight:700}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:.76rem;line-height:1.3}
.stat b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat.hl{background:var(--sun-soft);border-color:#f0d58a}
.stat.ok{background:var(--leaf-soft);border-color:#bfe6d3}
.chart-box{overflow-x:auto;margin-top:12px}
.chart-box svg{display:block;min-width:520px;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.check-list label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:.93rem}
.check-list label:hover{background:var(--bg)}
.check-list input{margin-top:5px;accent-color:var(--leaf);width:17px;height:17px;flex:none}
.meter{height:16px;background:#eef2f7;border-radius:99px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--sun-deep));transition:width .4s}

/* bill mock */
.bill{background:#fff;border:1px solid #cfd8e3;border-radius:10px;font-size:.88rem;max-width:620px;box-shadow:0 6px 20px rgba(10,40,80,.08);overflow:hidden}
.bill-top{background:#eef4fa;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--sky2)}
.bill-top b{color:var(--sky);font-size:1rem}
.bill-row{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;border-bottom:1px solid #edf1f5}
.bill-row .k{color:var(--muted);min-width:150px}
.bill-row .v{font-weight:600;flex:1}
.hs{flex:none;width:26px;height:26px;border-radius:50%;border:0;background:var(--sun);color:#3a2700;font-weight:800;cursor:pointer;font-size:.8rem;animation:pulse 2s infinite}
.hs.seen{background:var(--leaf);color:#fff;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,179,1,.6)}70%{box-shadow:0 0 0 9px rgba(245,179,1,0)}100%{box-shadow:0 0 0 0 rgba(245,179,1,0)}}
.hs-panel{margin-top:12px;min-height:70px}
.watermark{font-size:.72rem;color:var(--red);font-weight:700;letter-spacing:.05em}

/* order game */
.order-pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.order-pool button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.order-pool button:hover{border-color:var(--sky2)}
.order-pool button:disabled{opacity:.25;cursor:default}
.order-ans{counter-reset:s;padding:0;margin:8px 0;list-style:none}
.order-ans li{counter-increment:s;display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--leaf-soft);border-radius:10px;margin:6px 0;animation:fade .3s;font-weight:600;font-size:.92rem}
.order-ans li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:.78rem;flex:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* sort game */
.case{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.case p{margin:0;flex:1;min-width:220px;font-size:.93rem}
.case .fb{flex-basis:100%;font-size:.88rem;padding:8px 10px;border-radius:8px;margin-top:4px}
.case.ok{border-color:var(--leaf)}
.case.ok .fb{background:var(--leaf-soft)}
.case.no{border-color:var(--red)}
.case.no .fb{background:var(--red-soft)}

/* rewrite rows */
.rw{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff}
.rw .bad-t{color:#9b2c2c;font-weight:600}
.rw .bad-t::before{content:"✗ ";}
.rw .good-t{color:#0f6e46;font-weight:600}
.rw .good-t::before{content:"✓ ";}

/* timeline */
.tl{position:relative;margin:10px 0 0 6px;padding-left:22px;border-left:3px solid var(--sun)}
.tl-item{position:relative;margin:0 0 14px}
.tl-item::before{content:"";position:absolute;left:-30px;top:4px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--sun-deep)}
.tl-item b{color:var(--sky)}

/* video */
.video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-ph{border:2px dashed #b9cbe0;border-radius:12px;padding:20px;text-align:center;background:repeating-linear-gradient(135deg,#f7fafd 0 12px,#f1f6fb 12px 24px)}
.video-ph .play{width:54px;height:54px;border-radius:50%;background:var(--sky2);color:#fff;display:grid;place-items:center;margin:0 auto 8px;font-size:1.3rem}
.video-ph p{margin:4px 0;color:#344556;font-size:.92rem}
.video-ph small{color:var(--muted);font-size:.78rem}

/* home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;background:linear-gradient(135deg,#fff,#f2f8ff);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow)}
.hero h1{font-size:1.6rem}
@media(max-width:700px){.hero{grid-template-columns:1fr}.hero svg{max-width:340px}}
.hero svg{width:100%;height:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:18px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--sky2)}
.kpi small{color:var(--muted);font-size:.8rem;display:block}
.kpi b{font-size:1.5rem}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.week{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.week h4{margin:0 0 6px;color:var(--sky);font-size:.95rem}
.week a{display:block;font-size:.86rem;text-decoration:none;color:var(--ink);padding:3px 0}
.week a.lk{color:var(--muted)}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.bdg{display:flex;flex-direction:column;align-items:center;width:100px;text-align:center;font-size:.74rem;color:var(--muted);line-height:1.25}
.bdg .ico{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:#eef2f7;filter:grayscale(1);opacity:.5;margin-bottom:5px}
.bdg.on .ico{background:radial-gradient(circle at 30% 30%,#fff3c4,var(--sun));filter:none;opacity:1;box-shadow:0 3px 10px rgba(217,138,0,.35)}
.bdg.on{color:var(--ink);font-weight:600}
.chap-cards{display:grid;gap:10px}
.lesson-card{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-decoration:none;color:var(--ink)}
.lesson-card:hover{border-color:var(--sky2)}
.lesson-card .st{font-size:1.2rem}
.lesson-card small{color:var(--muted);display:block}

/* onboarding */
.onb{max-width:640px;margin:20px auto}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
@media(max-width:560px){.role-pick{grid-template-columns:1fr}}
.role{border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff}
.role.on{border-color:var(--sun-deep);background:var(--sun-soft)}
.role b{display:block}
.role small{color:var(--muted)}

/* flashcard review */
.fc{max-width:560px;margin:10px auto;perspective:1200px;cursor:pointer}
.fc .flip-inner{min-height:260px}
.fc .flip-face{font-size:1.1rem;text-align:center;align-items:center;padding:26px;border-radius:18px}
.fc .flip-front{background:#fff;border:2px solid var(--sky2)}
.fc .flip-back{background:linear-gradient(135deg,var(--sky),var(--sky2));font-size:1rem;text-align:left;align-items:flex-start}
.fc-meta{text-align:center;color:var(--muted);font-size:.85rem}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.footer-note{margin-top:40px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

/* svg anim */
.sun-rot{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.flow{stroke-dasharray:6 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.cycle-spin{animation:spin 24s linear infinite;transform-box:view-box;transform-origin:300px 175px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* storyboard clips */
.sb{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sb-stage{background:#f4f7fb;aspect-ratio:16/9}
.sb-svg{display:block;width:100%;height:100%}
.sb-svg *{transform-box:fill-box;transform-origin:center}
.sb-cap{padding:12px 16px 2px;min-height:86px}
.sb-cap b{color:var(--sky)}
.sb-cap p{margin:4px 0 0;font-size:.93rem;color:#344556}
.sb-ctl{display:flex;align-items:center;gap:8px;padding:8px 14px 14px;flex-wrap:wrap}
.sb-ctl>button:not(.btn){border:1px solid var(--line);background:#fff;border-radius:9px;width:40px;height:36px;cursor:pointer}
.sb-ctl .btn{padding:7px 14px}
.sb-dots{display:flex;gap:5px;margin-left:auto;align-items:center}
.sb-dots i{width:9px;height:9px;border-radius:50%;background:#d5dee8;cursor:pointer;transition:all .3s}
.sb-dots i.on{background:var(--sun-deep);width:22px;border-radius:5px}
.yt-link{display:inline-block;margin-top:10px;font-weight:600;font-size:.9rem}
.a-drop{animation:aDrop .6s both}@keyframes aDrop{from{opacity:0;transform:translateY(-16px)}}
.a-pop{animation:aPop .5s both}@keyframes aPop{from{opacity:0;transform:scale(.6)}}
.a-grow{animation:aGrow .7s both;transform-origin:bottom}@keyframes aGrow{from{transform:scaleY(0)}}
.a-grow-x{animation:aGrowX .8s both;transform-origin:left}@keyframes aGrowX{from{transform:scaleX(0)}}
.a-float{animation:aFloat 2.4s ease-in-out infinite}@keyframes aFloat{50%{transform:translateY(-8px)}}
.a-pulse{animation:aPulse 1.8s ease-in-out infinite}@keyframes aPulse{50%{opacity:.5}}
/* games */
.cg-score{font-weight:700;margin-top:8px}
.case .btn-row .btn{padding:7px 12px;font-size:.85rem}
.svg-hs.seen circle{fill:#16935f}
.compass{position:relative;width:170px;height:170px;margin:14px auto;border-radius:50%;background:radial-gradient(circle,#fff 55%,#eef2f7 56%);border:2px solid var(--line)}
.compass span{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem}
.compass button{position:absolute;left:50%;top:50%;width:40px;height:30px;margin:-15px 0 0 -20px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.compass button.on{background:var(--sun);border-color:var(--sun-deep)}
.ql{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;background:#fff;font-size:.92rem}
.ql input{margin-right:8px;accent-color:var(--red)}
.ql.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.ql.no{border-color:var(--red);background:var(--red-soft)}
.ql .fb{font-size:.85rem;margin-top:4px;color:#344556}
.chat{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:.93rem;animation:fade .3s}
.msg.them{background:var(--sun-soft);align-self:flex-start;border-bottom-left-radius:3px}
.msg.me{background:var(--sky-soft);align-self:flex-end;border-bottom-right-radius:3px}
.hunt .hz{cursor:pointer}
.lt input,.lt select{padding:5px 6px;font-size:.85rem}
.cert{background:#fff;border:10px solid var(--sky);outline:3px solid var(--sun);outline-offset:-20px;border-radius:6px;padding:48px 30px;text-align:center;max-width:720px;margin:20px auto;box-shadow:var(--shadow)}
.tool-group{margin-top:28px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}

@media(max-width:560px){
  html{font-size:15.5px}
  .card{padding:16px 15px}
  h1{font-size:1.5rem}
  .tier-row{grid-template-columns:minmax(0,1fr) 112px;gap:4px 8px;font-size:.8rem;margin:8px 0}
  .tier-row .lbl{grid-column:1/-1}
  .tier-row .lbl small{display:inline;margin-left:6px}
  .bill-row .k{min-width:96px}
  .brand small{display:none}
  .tool-head,h2{flex-wrap:wrap}
  .lesson-foot .btn{flex:1;justify-content:center}
}

// Biểu giá điện sinh hoạt bậc thang (đ/kWh, chưa VAT) – ước tính theo biểu giá áp dụng từ 05/2025.
// Có thể sửa trong trang "Cài đặt số liệu" của khoá học.
const DEFAULT_SETTINGS = { tiers:[1984,2050,2380,2998,3350,3460], vat:8, updated:'05/2025' };
const TIER_LIMITS = [50,50,100,100,100,Infinity];
const TIER_NAMES  = ['Bậc 1','Bậc 2','Bậc 3','Bậc 4','Bậc 5','Bậc 6'];
const TIER_RANGES = ['0–50 kWh','51–100 kWh','101–200 kWh','201–300 kWh','301–400 kWh','từ 401 kWh'];

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- Tính tiền điện ---------- */
function calcBill(kwh){
  const p=S.settings.tiers;let rest=Math.max(0,kwh),sub=0;const rows=[];
  for(let i=0;i<6;i++){const q=Math.min(rest,TIER_LIMITS[i]);rows.push({i,q,price:p[i],amt:q*p[i]});sub+=q*p[i];rest-=q}
  const vat=sub*S.settings.vat/100;return{rows,sub,vat,total:sub+vat,kwh};
}
function kwhFromMoney(total){let lo=0,hi=20000;for(let k=0;k<60;k++){const m=(lo+hi)/2;if(calcBill(m).total<total)lo=m;else hi=m}return Math.round(lo)}
function tierOf(k){let acc=0;for(let i=0;i<6;i++){acc+=TIER_LIMITS[i];if(k<=acc)return i}return 5}
function marginal(k){return S.settings.tiers[tierOf(Math.max(1,k))]*(1+S.settings.vat/100)}

function tierRowsHtml(before,after){
  return before.rows.map((r,i)=>{
    const L=i<5?TIER_LIMITS[i]:Math.max(r.q,100), qa=after?after.rows[i].q:r.q, cut=r.q-qa;
    const cutAmt=cut*r.price*(1+S.settings.vat/100);
    return `<div class="tier-row"><div class="lbl">${TIER_NAMES[i]} · ${fmt(r.price)}đ<small>${TIER_RANGES[i]}</small></div>
    <div class="track"><i style="width:${qa/L*100}%;background:${TIER_COLORS[i]}"></i>${cut>0?`<i class="cut" style="width:${cut/L*100}%"></i>`:''}</div>
    <div class="amt">${fmt(qa)} kWh${cut>0?`<small>−${fmt(cut)} kWh · −${money(cutAmt)}</small>`:`<small style="color:var(--muted);font-weight:500">${money(after?after.rows[i].amt:r.amt)}</small>`}</div></div>`}).join('');
}

    $('.sum-grid',el).innerHTML=`<div class="stat"><small>Tiền điện chưa thuế</small><b>${money(b.sub)}</b></div><div class="stat"><small>Thuế GTGT ${S.settings.vat}%</small><b>${money(b.vat)}</b></div><div class="stat hl"><small>Tổng thanh toán</small><b>${money(b.total)}</b></div><div class="stat"><small>Giá trung bình mỗi kWh</small><b>${k?money(b.total/k):'–'}</b></div><div class="stat ok"><small>Giá của số điện cuối cùng (đã VAT)</small><b>${k?money(marginal(k)):'–'}</b></div>`;
  }
  r.oninput=()=>{n.value=r.value;draw(+r.value)};
  n.oninput=()=>{r.value=n.value;draw(+n.value||0)};
  const fromMoney=v=>{const k=kwhFromMoney(v);$('.conv',el).textContent=fmt(k)+' kWh/tháng';draw(k)};
  m.oninput=()=>{mr.value=m.value;fromMoney(+m.value||0)};
  mr.oninput=()=>{m.value=mr.value;fromMoney(+mr.value)};
  $$('.seg button',el).forEach(b=>b.onclick=()=>{$$('.seg button',el).forEach(x=>x.classList.toggle('on',x===b));const v=b.dataset.m==='vnd';$('.m-kwh',el).classList.toggle('hidden',v);$('.m-vnd',el).classList.toggle('hidden',!v);v?fromMoney(+m.value||0):draw(+n.value||0)});
  draw(kwh);
}

function cutTool(el,{use=500,solar=200}={}){
  el.innerHTML=`<div class="tool-head">✂️ Mô phỏng “điện mặt trời cắt bậc” <span class="pill">Giá sinh hoạt</span></div>
  <div class="field"><label>Điện nhà khách dùng mỗi tháng (kWh)</label><div class="range-row"><input type="range" min="100" max="1500" step="10" value="${use}" class="u"><b class="uv" style="min-width:80px"></b></div></div>
  <div class="field"><label>☀️ Điện mặt trời <u>tự dùng</u> mỗi tháng (kWh)</label><div class="range-row"><input type="range" min="0" max="${use}" step="10" value="${solar}" class="s"><b class="sv" style="min-width:80px"></b></div></div>
  <div class="tiers"></div><div class="legend"><span><i style="background:#f08c00"></i>Vẫn phải mua của điện lực</span><span><i style="background:repeating-linear-gradient(45deg,#f6c2c0 0 4px,#fff 4px 7px);border:1px dashed #d14343"></i>Phần bị điện mặt trời “cắt”</span></div>
  <div class="sum-grid"></div>
  <h3 style="margin-top:20px">📉 Mỗi kWh mặt trời đáng giá bao nhiêu? (theo từng nấc 50 kWh)</h3>
  <div class="chart-box dim"></div>`;
  const u=$('.u',el),s=$('.s',el);
  function draw(){
    const U=+u.value;s.max=U;if(+s.value>U)s.value=U;const So=+s.value;
    $('.uv',el).textContent=fmt(U)+' kWh';$('.sv',el).textContent=fmt(So)+' kWh';
    const b=calcBill(U),a=calcBill(U-So),save=b.total-a.total;
    $('.tiers',el).innerHTML=tierRowsHtml(b,a);
    $('.sum-grid',el).innerHTML=`<div class="stat"><small>Hoá đơn hiện tại</small><b>${money(b.total)}</b></div><div class="stat"><small>Hoá đơn sau khi có điện mặt trời</small><b>${money(a.total)}</b></div><div class="stat ok"><small>Tiết kiệm mỗi tháng</small><b>${money(save)}</b></div><div class="stat hl"><small>Giá trị trung bình mỗi kWh mặt trời</small><b>${So?money(save/So):'–'}</b></div>`;
    // biểu đồ lợi ích giảm dần
    const step=50,chunks=[];for(let k=0;k+step<=U&&chunks.length<30;k+=step){chunks.push({k,v:(calcBill(U-k).total-calcBill(U-k-step).total)/step})}
    const W=620,H=210,pad=44,bw=(W-pad-10)/Math.max(chunks.length,1),maxV=Math.max(...chunks.map(c=>c.v),1);
    let bars=chunks.map((c,i)=>{const h=(H-50)*c.v/maxV,x=pad+i*bw,y=H-28-h,on=c.k<So;
      return `<rect x="${x+2}" y="${y}" width="${bw-4}" height="${h}" rx="3" fill="${on?'#f5b301':'#d5dee8'}"/>${i%2===0||chunks.length<12?`<text x="${x+bw/2}" y="${H-12}" font-size="9.5" text-anchor="middle" fill="#5d6b79">${c.k+step}</text>`:''}`}).join('');
    $('.dim',el).innerHTML=`<svg viewBox="0 0 ${W} ${H}">${bars}<text x="4" y="16" font-size="10" fill="#5d6b79">đ/kWh</text><text x="4" y="30" font-size="10" fill="#5d6b79">${fmt(maxV)}</text><text x="${W-6}" y="${H-1}" font-size="10" text-anchor="end" fill="#5d6b79">kWh mặt trời thứ… →</text><line x1="${pad}" y1="${H-28}" x2="${W-6}" y2="${H-28}" stroke="#c9d4e0"/></svg><div class="legend"><span><i style="background:#f5b301"></i>Phần đang được điện mặt trời thay thế</span><span><i style="background:#d5dee8"></i>Phần còn lại</span></div>`;
  }
  u.oninput=draw;s.oninput=draw;draw();
}

    $('.who',el).innerHTML=`${P.ic} <b>${P.name}</b> · Loại giá: ${P.type}`;
    const W=640,H=250,pl=46,pb=30,mx=Math.max(...P.data,...pv)*1.1,bw=(W-pl-10)/12,Y=v=>H-pb-(H-pb-12)*v/mx;

    P.data.forEach((v,i)=>{s+=`<rect x="${pl+i*bw+5}" y="${Y(v)}" width="${bw-10}" height="${H-pb-Y(v)}" rx="4" fill="#9cc3ee"/><text x="${pl+i*bw+bw/2}" y="${H-10}" font-size="11" text-anchor="middle" fill="#5d6b79">T${i+1}</text>`});
    s+=`<polyline fill="none" stroke="#f5b301" stroke-width="3.5" stroke-linejoin="round" points="${pv.map((v,i)=>`${pl+i*bw+bw/2},${Y(v)}`).join(' ')}"/>`+pv.map((v,i)=>`<circle cx="${pl+i*bw+bw/2}" cy="${Y(v)}" r="4" fill="#fff" stroke="#d98a00" stroke-width="2"/>`).join('');

    const tc=P.data.reduce((a,b)=>a+b,0),tp=pv.reduce((a,b)=>a+b,0),pk=P.data.indexOf(Math.max(...P.data));
    $('.sum-grid',el).innerHTML=`<div class="stat"><small>Tiêu thụ cả năm</small><b>${fmt(tc)} kWh</b></div><div class="stat"><small>Tháng dùng nhiều nhất</small><b>T${pk+1} · ${fmt(P.data[pk])} kWh</b></div><div class="stat hl"><small>Sản lượng ${kw} kWp cả năm</small><b>${fmt(tp)} kWh</b></div><div class="stat ${tp/tc>0.8?'hl':'ok'}"><small>Sản lượng / tiêu thụ</small><b>${Math.round(tp/tc*100)}%</b></div>`+(tp/tc>0.8?`<div class="stat" style="grid-column:1/-1;background:var(--red-soft);border-color:#f4c7c4">⚠️ <b>Hệ có thể quá to:</b> sản lượng gần bằng hoặc vượt tổng điện tiêu thụ, trong khi chỉ phần dùng đúng lúc có nắng mới thành tiền tiết kiệm. Điện dư phát lên lưới bị giới hạn và giá thấp (xem Bài 3).</div>`:'');
  }
  function pick(w){cur=w;k.value=PROFILES[w].kwp;$$('.seg button',el).forEach(b=>b.classList.toggle('on',b.dataset.w===w));draw()}
  $$('.seg button',el).forEach(b=>b.onclick=()=>pick(b.dataset.w));k.oninput=draw;pick(who);
}

function dayTool(el){
  const Q=[['Ban ngày thường xuyên có người ở nhà',15],['Điều hoà / quạt chạy nhiều vào ban ngày',15],['Có kinh doanh, sản xuất, nấu ăn bán hàng… vào ban ngày',20],['Bơm nước, máy giặt, là ủi chủ yếu dùng ban ngày',10],['Dùng nhiều điện buổi tối (điều hoà ngủ, bình nóng lạnh, nấu ăn tối)',-12],['Có xe điện / xe máy điện sạc qua đêm',-8]];
  el.innerHTML=`<div class="tool-head">🌗 Ước tính tỉ lệ dùng điện ban ngày <span class="pill">Ước tính sơ bộ</span></div>
  <p class="muted" style="margin:0 0 6px;font-size:.9rem">Tích vào những ý đúng với nhà khách (hỏi trong 10 câu “khám”):</p>
  <div class="check-list">${Q.map((q,i)=>`<label><input type="checkbox" data-i="${i}"> ${q[0]}</label>`).join('')}</div>
  <div class="out" style="margin-top:8px"></div>`;
  function draw(){
    let v=22;$$('input',el).forEach(c=>{if(c.checked)v+=Q[+c.dataset.i][1]});v=Math.max(10,Math.min(80,v));
    const msg=v>=55?'<b style="color:var(--leaf)">Cao</b> – phần lớn điện dùng lúc có nắng. Hệ <b>bám lưới</b> thường đã hiệu quả.':v>=38?'<b style="color:var(--sun-deep)">Trung bình</b> – hệ bám lưới cỡ vừa, hoặc cân nhắc thêm lưu trữ nếu hay mất điện.':'<b style="color:var(--red)">Thấp</b> – phần lớn điện dùng buổi tối. Cân nhắc hệ <b>có lưu trữ</b>, hoặc lắp nhỏ để không lãng phí.';
    $('.out',el).innerHTML=`<div style="display:flex;justify-content:space-between"><span>Tỉ lệ dùng ban ngày ước tính</span><b>${v}%</b></div><div class="meter"><i style="width:${v}%"></i></div><div style="font-size:.92rem">${msg} <span class="muted">(Chương 4 sẽ học kỹ cách chọn loại hệ.)</span></div>`;
  }
  $$('input',el).forEach(c=>c.onchange=draw);draw();
}

let SB_TIMERS=[];
const SB={};let sbSeq=0;
function storyboard(slides){const id='sb'+(++sbSeq);SB[id]=slides;
  return `<div class="sb" data-sb="${id}"><div class="sb-stage"></div><div class="sb-cap"></div><div class="sb-ctl"><button class="sb-prev" aria-label="Cảnh trước">⏮</button><button class="sb-play btn blue">▶ Phát clip</button><button class="sb-next" aria-label="Cảnh sau">⏭</button><div class="sb-dots"></div><span class="sb-count"></span></div></div>`}
function initSB(root){
  $$('.sb',root).forEach(el=>{const slides=SB[el.dataset.sb];if(!slides)return;let i=0,t=null;
    const stage=$('.sb-stage',el),cap=$('.sb-cap',el),play=$('.sb-play',el);
    const show=k=>{i=(k+slides.length)%slides.length;const s=slides[i];stage.innerHTML=typeof s.svg==='function'?s.svg():s.svg;
      cap.innerHTML=`<b>Cảnh ${i+1}/${slides.length}: ${s.t}</b><p>${s.d}</p>`;
      $('.sb-dots',el).innerHTML=slides.map((x,j)=>`<i class="${j===i?'on':''}" data-j="${j}"></i>`).join('');
      $$('.sb-dots i',el).forEach(d=>d.onclick=()=>{stop();show(+d.dataset.j)})};
    const stop=()=>{clearInterval(t);t=null;play.textContent='▶ Phát clip'};
    play.onclick=()=>{if(t){stop();return}play.textContent='⏸ Tạm dừng';if(i===slides.length-1)show(0);t=setInterval(()=>{if(i===slides.length-1){stop();return}show(i+1)},6500);SB_TIMERS.push(t)};
    $('.sb-prev',el).onclick=()=>{stop();show(i-1)};$('.sb-next',el).onclick=()=>{stop();show(i+1)};
    show(0);
  });
}
function media(key,slides,ytq){
  const id=VIDEOS[key];
  let h=id?`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}" allowfullscreen loading="lazy"></iframe></div>`:storyboard(slides);
  if(ytq)h+=`<a class="yt-link" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ytq)}" target="_blank" rel="noopener">🔎 Xem thêm video thực tế trên YouTube: “${ytq}”</a>`;
  if(!id)h+=`<small class="src">Clip hoạt hình do Thanh Hoá Solar tự dựng. Khi có video công trình thật, dán mã YouTube vào mục <code>${key}</code> trong <code>VIDEOS</code> ở đầu file để thay thế.</small>`;
  return h;
}

  <div class="sum-grid"></div></div><div class="vis"></div></div>`;
  const p=$('.p',el),h=$('.h',el);
  const draw=()=>{const P=+p.value,H=+h.value,E=P*H;$('.pv',el).textContent=P.toFixed(2)+' kW';$('.hv',el).textContent=H+' giờ';
    const fill=Math.min(E/30,1),sw=2+P*6;
    $('.vis',el).innerHTML=`<svg viewBox="0 0 220 230" style="width:100%;max-width:260px;display:block;margin:auto"><rect x="20" y="20" width="90" height="16" rx="4" fill="#6b7785"/><rect x="100" y="20" width="16" height="34" rx="4" fill="#6b7785"/><line class="flow" x1="108" y1="54" x2="108" y2="${200-150*fill}" stroke="#1e74c4" stroke-width="${sw}"/><path d="M50 80 L60 210 L156 210 L166 80 Z" fill="#fff" stroke="#56687a" stroke-width="3"/><clipPath id="bk"><path d="M50 80 L60 210 L156 210 L166 80 Z"/></clipPath><rect clip-path="url(#bk)" x="40" y="${210-130*fill}" width="140" height="${130*fill}" fill="#9cc3ee" style="transition:all .4s"/><text x="108" y="150" text-anchor="middle" font-size="18" font-weight="800" fill="#0b4f8a">${E.toFixed(1)} kWh</text></svg>`;
    $('.sum-grid',el).innerHTML=`<div class="stat hl"><small>Điện năng tiêu thụ</small><b>${E.toFixed(2)} kWh</b></div><div class="stat"><small>Một tháng (30 ngày)</small><b>${fmt(E*30)} kWh</b></div><div class="stat ok"><small>Tiền/tháng nếu rơi vào bậc 6 (đã VAT)</small><b>${money(E*30*marginal(500))}</b></div>`};
  p.oninput=h.oninput=draw;draw();
}

    const W=640,H=230,pl=40,pb=26,mx=Math.max(...L,...pv)*1.15,bw=(W-pl-8)/24,Y=v=>H-pb-(H-pb-10)*v/mx;let s='';

  w.document.write(`<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>${title}</title><style>body{font-family:'Be Vietnam Pro',system-ui,Arial,sans-serif;color:#17232f;max-width:760px;margin:24px auto;padding:0 20px;line-height:1.5}h1{color:#0b4f8a;font-size:22px;margin:0}h2{font-size:15px;color:#0b4f8a;margin:16px 0 6px}.hd{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #f5b301;padding-bottom:8px;margin-bottom:12px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #c9d4e0;padding:7px 9px;text-align:left;vertical-align:top;font-size:13px}th{background:#eef4fa;width:38%}.line{height:26px}.small{font-size:11px;color:#5d6b79}@media print{button{display:none}}</style></head><body>${body}<p><button onclick="print()">🖨️ In / Lưu PDF</button></p></body></html>`);w.document.close()}catch(e){try{w.close()}catch(_){}showDocOverlay(title,body)}}
function showDocOverlay(title,body){let o=document.getElementById('docov');if(!o){o=document.createElement('div');o.id='docov';document.body.appendChild(o)}
  o.innerHTML=`<div class="dov-bg"></div><div class="dov"><div class="dov-bar"><b>${esc(title)}</b><span style="flex:1"></span><button class="btn ghost" id="dovCopy">📋 Sao chép</button><button class="btn primary" id="dovClose">✕ Đóng</button></div><div class="dov-doc" id="dovDoc">${body}</div><p class="muted" style="font-size:.8rem;margin:8px 0 0">Trang đang mở trên web nên không in trực tiếp được. Bạn có thể sao chép nội dung, chụp màn hình, hoặc mở file HTML trên máy tính để in, lưu PDF.</p></div>`;
  o.style.display='block';const close=()=>o.style.display='none';$('#dovClose').onclick=close;$('.dov-bg',o).onclick=close;
  $('#dovCopy').onclick=()=>{const t=$('#dovDoc').innerText,ok=()=>toast('📋 Đã sao chép');if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,()=>fallbackCopy(t,ok));else fallbackCopy(t,ok)}}

function calcPayback(o){
  const vat=1+S.settings.vat/100,cost=(o.kwp*o.cpk+o.bat*o.cbat)*1e6;let cum=0,py=null,y1=0,yrs=[];
  for(let y=1;y<=25;y++){const deg=Math.pow(1-o.deg/100,y-1),esc=Math.pow(1+o.esc/100,y-1);let a=0;
    for(let m=0;m<12;m++){const prod=PV_MONTH[m]*o.kwp*deg,self=Math.min(prod*o.s/100,o.C);
      let sav=o.mode==='sh'?calcBill(o.C).total-calcBill(o.C-self).total:self*o.price*vat;sav*=esc;
      if(o.sell){sav+=Math.min(prod-self,prod*0.5)*o.sellp}a+=sav}
    if(y===1)y1=a;if(y===11)a-=o.inv*1e6;const prev=cum;cum+=a;if(py===null&&cum>=cost)py=y-1+(cost-prev)/a;yrs.push(cum)}
  const bank=y=>cost*(Math.pow(1+o.rate/100,y)-1);
  return{cost,py,y1,yrs,net:cum-cost,bank25:bank(25),bank};
}

function dialogueTool(el){
  let i=0,trust=50,log=[];

    if(i>=DLG.length){const v=trust>=85?['🎉 Ông Hùng hẹn ký hợp đồng!','Bạn xử lý băn khoăn bằng sự thật, con số và cam kết rõ ràng.']:trust>=60?['🙂 Ông Hùng còn cân nhắc','Khá tốt, xem lại những câu chưa đạt bên dưới.']:['😕 Ông Hùng từ chối','Hãy làm lại và chú ý: thật thà, có số, có cam kết, hẹn bước tiếp theo.'];
      el.innerHTML=`<div class="tool-head">💬 Mô phỏng tư vấn: ông Hùng, Hậu Lộc</div>${m}<div class="card ${trust>=85?'insight':'note'}" style="margin:10px 0"><h2>${v[0]}</h2><p style="margin:0">${v[1]}</p></div>${log.map((l,j)=>`<div class="case ${l.p>0?'ok':'no'}" style="margin:6px 0"><p><b>${j+1}. ${DLG[j].o}</b><br>${l.p>0?'✅':'⚠️'} Câu tốt nhất: ${DLG[j].a.find(a=>a[0]===2)[1]}</p></div>`).join('')}<button class="btn primary rs">↻ Chơi lại</button>`;
      $('.rs',el).onclick=()=>{i=0;trust=50;log=[];draw()};return}
    const d=DLG[i];
    el.innerHTML=`<div class="tool-head">💬 Mô phỏng tư vấn: ông Hùng, Hậu Lộc <span class="pill">Lượt ${i+1}/${DLG.length}</span></div>${m}
    <div class="chat"><div class="msg them">👴 ${d.o}</div></div><div class="opts">${d.a.map((a,j)=>`<button class="sc-opt dl" data-j="${j}">${a[1]}</button>`).join('')}</div>`;
    $$('.dl',el).forEach(b=>b.onclick=()=>{const a=d.a[+b.dataset.j];trust=Math.max(0,Math.min(100,trust+a[0]*4));log.push({p:a[0]});
      $('.chat',el).insertAdjacentHTML('beforeend',`<div class="msg me">🧑 ${a[1]}</div><div class="msg them">👴 ${a[2]}</div>`);
      $('.opts',el).innerHTML=`<div class="sc-fb" style="margin:8px 0">${a[0]===2?'✅ Câu trả lời tốt nhất!':a[0]===0?'⚠️ Chưa đủ thuyết phục.':'❌ Làm mất niềm tin.'}</div><button class="btn blue nx">Tiếp →</button>`;
      $('.nx',el).onclick=()=>{i++;draw()}});
  };draw();
}

}

   <p><b>Bài học:</b> ở vùng quê, <b>một lời hứa sai làm hỏng cả một khu thị trường</b>. Ngược lại, một lời nói thật được kiểm chứng sẽ mở ra cả khu.</p>
  </section>

  <section class="card"><h2>🔢 Công thức “câu có số”</h2>
   <div class="grid3"><div class="mini" style="border-top:4px solid var(--sky2)"><h4>① Con số</h4><p>Bao nhiêu tiền, bao nhiêu năm, bao nhiêu kWh</p></div><div class="mini" style="border-top:4px solid var(--sun)"><h4>② Điều kiện</h4><p>Mùa nào, với cách dùng điện nào</p></div><div class="mini" style="border-top:4px solid var(--leaf)"><h4>③ Bước tiếp theo</h4><p>Em sẽ gửi bảng tính, hẹn khảo sát…</p></div></div>
   <h3>✍️ Luyện viết lại <span class="pill">Tự nghĩ trước, rồi bấm xem gợi ý</span></h3>
   ${[['“Lắp vào là tiết kiệm nhiều lắm anh ạ.”','“Với hoá đơn khoảng 1,5 triệu của nhà anh, hệ khoảng 4 kWp giúp giảm khoảng 700–800 nghìn/tháng mùa hè, mùa đông khoảng 400 nghìn. Em sẽ gửi anh bảng tính chi tiết từng tháng.”'],
      ['“Bền lắm, dùng cả đời luôn.”','“Tấm pin bảo hành hiệu suất 25–30 năm. Inverter bảo hành 5–10 năm, và nhiều khả năng phải thay một lần vào khoảng năm thứ 10–12. Em ghi rõ chi phí dự kiến vào bảng tính để anh chủ động.”'],
      ['“Hoàn vốn nhanh lắm chị ơi.”','“Với cách dùng điện hiện tại của nhà mình, thời gian hoàn vốn khoảng 5–7 năm. Nếu chị dùng thêm điều hoà ban ngày thì còn nhanh hơn.”'],
      ['“Không bao giờ dột đâu ạ.”','“Bên em dùng kẹp chuyên dụng cho mái tôn, không khoan xuyên mái. Nếu dột do thi công trong 2 năm đầu, bên em xử lý miễn phí, có ghi trong hợp đồng.”']]
     .map((r,i)=>`<div class="rw"><div class="bad-t">${r[0]}</div><button class="btn ghost" style="margin-top:8px;padding:6px 12px;font-size:.85rem" data-reveal="rw${i}">Xem cách nói có số</button><div class="reveal" id="rw${i}"><div class="good-t">${r[1]}</div></div></div>`).join('')}
   <small class="src">Các con số trong ví dụ mang tính minh hoạ. Khi tư vấn thật, luôn tính bằng số liệu của chính khách hàng.</small>
  </section>

  <section class="card"><h2>✋ Dám từ chối: 5 dấu hiệu khách <u>chưa nên</u> lắp</h2>
   <ul class="clean"><li>Hoá đơn quá thấp (khoảng dưới 500 nghìn/tháng), thời gian hoàn vốn quá dài</li><li>Mái yếu, mục, hoặc sắp thay/sửa trong 1–2 năm</li><li>Bị che bóng nặng (nhà cao tầng, cây lớn) phần lớn thời gian có nắng</li><li>Sắp chuyển nhà, phá dỡ, cho thuê lại trong 2–3 năm</li><li>Khách kỳ vọng sai (“hết tiền điện”) và không chịu nghe giải thích</li></ul>
   <div class="card insight" style="margin-bottom:0"><b>Cách nói khéo:</b> “Dạ, em nói thật là với mức dùng điện hiện tại thì nhà mình lắp chưa thật sự lợi. Khi nào nhà mình lắp thêm điều hoà hay mở kinh doanh, anh/chị gọi em tính lại nhé. Còn nếu có người quen dùng điện nhiều, anh/chị giới thiệu giúp em.”<br>→ Người được từ chối khéo thường trở thành <b>người giới thiệu đáng tin nhất</b>.</div>
  </section>

  <section class="card"><h2>🎮 Thử thách: nên tư vấn lắp hay khuyên chưa nên?</h2><div id="sortg"></div><div id="sortscore" style="margin-top:8px;font-weight:700"></div></section>
  `,
  init:el=>{
   const C=[['👴 Ông Sơn, hai ông bà già ở nhà, hoá đơn 350 nghìn/tháng.','no','Dùng quá ít điện, hoàn vốn rất lâu. Nói thật và nhờ ông giới thiệu người khác.'],
     ['🍲 Quán cơm bà Nga, hoá đơn 4 triệu/tháng, nấu nướng và điều hoà chạy cả ngày.','yes','Rất hợp: dùng nhiều điện đúng lúc có nắng.'],
     ['🏚️ Nhà anh Dũng, mái tôn 18 năm đã gỉ, định thay mái sang năm.','no','Nên thay mái trước. Có thể tư vấn kết hợp: thay mái và lắp điện mặt trời cùng lúc.'],
     ['🏖️ Homestay Hải Tiến, mùa hè 6 triệu/tháng, mùa đông 1,5 triệu.','yes','Rất hợp: nhu cầu cao nhất đúng vào mùa nắng nhất.'],
     ['🏢 Nhà chị Mai, mái bị toà nhà 5 tầng bên cạnh che bóng từ 12 giờ trưa.','no','Mất hơn nửa thời gian nắng tốt. Cần khảo sát kỹ; nhiều khả năng không đáng đầu tư.']];
   let right=0,done=0;
   $('#sortg',el).innerHTML=C.map((c,i)=>`<div class="case" data-i="${i}"><p>${c[0]}</p><div class="btn-row"><button class="btn ghost" data-v="yes">✅ Nên lắp</button><button class="btn ghost" data-v="no">✋ Chưa nên</button></div></div>`).join('');
   $$('.case',el).forEach(cs=>$$('button',cs).forEach(b=>b.onclick=()=>{
     const c=C[+cs.dataset.i],ok=b.dataset.v===c[1];cs.classList.add(ok?'ok':'no');$$('button',cs).forEach(x=>x.disabled=true);
     cs.insertAdjacentHTML('beforeend',`<div class="fb">${ok?'✅ Đúng!':'❌ Chưa đúng.'} ${c[2]}</div>`);done++;if(ok)right++;
     if(done===C.length)$('#sortscore',el).textContent=`Kết quả: ${right}/${C.length} tình huống đúng ${right===C.length?'🎉':''}`;
   }));
  },
  quiz:[
   {q:'Câu nào là “câu có số” tốt nhất?',o:['“Tiết kiệm nhiều lắm ạ.”','“Mùa hè giảm khoảng 800 nghìn/tháng, mùa đông khoảng 400 nghìn; em gửi bảng tính chi tiết.”','“Hoàn vốn cực nhanh.”','“Ai lắp cũng khen.”'],a:1,e:'Câu B có đủ 3 phần: con số, điều kiện (mùa) và bước tiếp theo (gửi bảng tính).'},
   {q:'Gặp khách hoá đơn rất thấp, bạn nên làm gì?',o:['Cố thuyết phục lắp hệ nhỏ nhất','Nói thật là chưa đáng đầu tư, và nhờ giới thiệu người quen dùng nhiều điện','Bỏ đi không nói gì','Báo giá thấp để chốt bằng được'],a:1,e:'Nói thật xây uy tín. Khách được tư vấn thật lòng thường trở thành người giới thiệu.'},
   {q:'Vì sao lời hứa quá đà đặc biệt nguy hiểm ở thị trường Thanh Hoá?',o:['Vì khách ở đây khó tính','Vì thông tin lan rất nhanh trong thôn xóm; một khách thất vọng ảnh hưởng tới rất nhiều khách khác','Vì luật cấm','Vì đối thủ sẽ kiện'],a:1,e:'Ở vùng quê, truyền miệng là kênh mạnh nhất, theo cả hai chiều tốt và xấu.'}
  ]},

 {id:'c0l4',title:'Một khách thành mười khách – và làm theo quy trình',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu vòng đời khách hàng và vì sao chăm sóc sau lắp đặt là marketing tốt nhất</li><li>Nắm lịch chăm sóc khách 12 tháng đầu</li><li>Có lời giới thiệu 30 giây của riêng mình</li></ul></section>

  <section class="card story"><h2>📖 Tình huống</h2>
   ${persona('👩','Chị Hoa – nhà nghỉ 12 phòng, Sầm Sơn','Khách hàng của Thanh Hoá Solar')}
   <p>3 tháng sau khi lắp, chị Hoa giới thiệu thêm <b>2 nhà nghỉ cùng phố</b>. Không phải vì được trả hoa hồng, mà vì:</p>
   <ul class="clean"><li>Tuần đầu, tư vấn viên gọi hỏi thăm và hướng dẫn chị xem app sản lượng</li><li>Mỗi tháng nhận một tin nhắn Zalo so sánh hoá đơn trước và sau</li><li>Trước mùa du lịch, đội đến vệ sinh tấm pin miễn phí</li></ul>
  </section>

  <section class="card"><h2>🔄 Vòng đời khách hàng</h2>${svgCycle()}
   <div class="tbl-wrap"><table class="tbl" style="margin-top:14px"><tr><th></th><th>Khách đến từ quảng cáo</th><th>Khách được giới thiệu</th></tr>
   <tr><td>Chi phí để có khách</td><td>Cao (tiền quảng cáo)</td><td>Thấp (quà cảm ơn)</td></tr>
   <tr><td>Mức độ tin ban đầu</td><td>Thấp, phải chứng minh từ đầu</td><td>Cao, đã có người bảo đảm</td></tr>
   <tr><td>Thời gian để chốt</td><td>Thường dài</td><td>Thường ngắn</td></tr></table></div>
   <small class="src">So sánh mang tính định tính, phổ biến trong bán hàng dịch vụ địa phương.</small>
  </section>

  <section class="card"><h2>📅 Lịch chăm sóc 12 tháng đầu</h2>
   <div class="tl">
    <div class="tl-item"><b>Ngày bàn giao</b>: hướng dẫn app giám sát, đặt biển “Nhà này dùng điện mặt trời – Thanh Hoá Solar”, chụp ảnh kỷ niệm (xin phép đăng).</div>
    <div class="tl-item"><b>Tuần 1</b>: gọi hỏi thăm, giải đáp thắc mắc.</div>
    <div class="tl-item"><b>Tháng 1</b>: gửi so sánh hoá đơn trước/sau qua Zalo.</div>
    <div class="tl-item"><b>Tháng 3</b>: kiểm tra, vệ sinh tấm pin; xin đánh giá và hỏi khéo về người quen có nhu cầu.</div>
    <div class="tl-item"><b>Tháng 6</b>: báo cáo sản lượng nửa năm.</div>
    <div class="tl-item"><b>Tháng 12</b>: bảo trì định kỳ năm, quà tri ân; mời tham gia nhóm Zalo khách hàng.</div>
   </div>
  </section>

  <section class="card"><h2>📋 Tư duy quy trình</h2>
   <p class="lead">Cùng một câu hỏi của khách, <b>3 thành viên và 20 cộng tác viên phải trả lời giống nhau</b>. Vì vậy Thanh Hoá Solar dùng chung một bộ công cụ:</p>
   <div class="grid2"><div class="mini"><h4>📝 Phiếu khám 10 câu</h4><p>Ai hỏi cũng đủ ý, không sót.</p></div><div class="mini"><h4>🧮 Bảng tính từ hoá đơn</h4><p>Cùng công thức, cùng số liệu gốc.</p></div><div class="mini"><h4>📄 Mẫu đề xuất 1 trang</h4><p>Khách nhận được bản trình bày giống nhau, chuyên nghiệp.</p></div><div class="mini"><h4>💬 Kịch bản xử lý băn khoăn</h4><p>Học ở Chương 8.</p></div></div>
  </section>

  <section class="card tool"><div class="tool-head">🎤 Tạo lời giới thiệu 30 giây của bạn</div>
   <div class="grid2"><div class="field"><label>Tên bạn</label><input type="text" id="pt-name" style="width:100%"></div>
   <div class="field"><label>Vai trò</label><select id="pt-role" style="width:100%"><option>tư vấn viên</option><option>cộng tác viên</option></select></div>
   <div class="field"><label>Khu vực phụ trách</label><input type="text" id="pt-area" value="Quảng Xương và Sầm Sơn" style="width:100%"></div>
   <div class="field"><label>Điểm khác biệt muốn nhấn mạnh</label><select id="pt-diff" style="width:100%"><option>Bên em không báo giá khi chưa xem hoá đơn và khảo sát mái</option><option>Bên em chăm sóc, vệ sinh tấm pin định kỳ, gọi là có mặt</option><option>Bên em có hỗ trợ trả góp qua ngân hàng</option></select></div></div>
   <div class="card note" id="pt-out" style="font-size:1.02rem;line-height:1.7;margin:10px 0"></div>
   <div class="btn-row"><button class="btn blue" data-copy="pt-out">📋 Sao chép</button><button class="btn ghost" id="pt-timer">⏱️ Bấm giờ đọc thử</button><span id="pt-time" class="muted"></span></div>
  </section>
  `,
  init:el=>{
   const n=$('#pt-name',el);n.value=S.name||'';
   const out=()=>{$('#pt-out',el).textContent=`Chào anh/chị, em là ${n.value||'[tên]'}, ${$('#pt-role',el).value} của Thanh Hoá Solar, phụ trách khu vực ${$('#pt-area',el).value||'[khu vực]'}. Bên em giúp các gia đình và hộ kinh doanh giảm tiền điện bằng điện mặt trời áp mái. ${$('#pt-diff',el).value}. Anh/chị chỉ cần gửi ảnh hoá đơn 3 tháng gần nhất, trong 24 giờ em gửi lại bảng tính cụ thể: nên lắp bao nhiêu, mùa hè và mùa đông tiết kiệm bao nhiêu, bao lâu thì hoàn vốn. Anh/chị có muốn em tính thử cho nhà mình không ạ?`};
   $$('input,select',el).forEach(x=>x.oninput=out);out();
   let t0=null,iv=null;$('#pt-timer',el).onclick=e=>{if(!t0){t0=Date.now();e.target.textContent='⏹️ Dừng';iv=setInterval(()=>{$('#pt-time',el).textContent=((Date.now()-t0)/1000).toFixed(0)+' giây'},200)}else{clearInterval(iv);const s=(Date.now()-t0)/1000;t0=null;e.target.textContent='⏱️ Bấm giờ đọc thử';$('#pt-time',el).innerHTML=`<b>${s.toFixed(0)} giây</b> – ${s<=35?'✅ Tốt!':'⚠️ Hơi dài, thử rút gọn hoặc nói gọn hơn.'}`}};
  },
  quiz:[
   {q:'Theo bài học, vì sao chị Hoa giới thiệu thêm khách?',o:['Vì được trả hoa hồng cao','Vì được chăm sóc chu đáo sau lắp đặt','Vì giá rẻ nhất thị trường','Vì là người quen'],a:1,e:'Chăm sóc sau lắp đặt (hỏi thăm, báo cáo, vệ sinh pin) tạo ra sự hài lòng và giới thiệu tự nhiên.'},
   {q:'Tháng thứ mấy là thời điểm tốt để vệ sinh pin và khéo hỏi về người quen có nhu cầu?',o:['Ngày bàn giao','Tháng 1','Tháng 3','Năm thứ 5'],a:2,e:'Sau khoảng 3 tháng, khách đã thấy rõ hiệu quả trên hoá đơn. Đây là lúc dễ xin đánh giá và giới thiệu nhất.'},
   {q:'Vì sao cả nhóm và cộng tác viên cần dùng chung phiếu khám, bảng tính, mẫu đề xuất?',o:['Để tiết kiệm giấy','Để mọi khách đều nhận tư vấn đúng và giống nhau, giữ uy tín thương hiệu','Vì luật yêu cầu','Không cần thiết'],a:1,e:'Quy trình chung giúp chất lượng ổn định khi đội ngũ mở rộng, và là nền tảng để đào tạo cộng tác viên.'}
  ]}

{id:'c1',num:1,icon:'🧾',title:'Đọc hoá đơn và biểu giá điện',ctv:true,ready:true,
 desc:'Hoá đơn tiền điện là “phiếu xét nghiệm” của khách. Đọc đúng hoá đơn là bước đầu của mọi đề xuất chính xác.',
 badge:{ic:'🔎',name:'Thám tử hoá đơn'},
 lessons:[
 {id:'c1l1',title:'Giải phẫu một hoá đơn tiền điện',min:10,
  html:()=>{const b=calcBill(500);return `
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Biết 7 thông tin quan trọng trên hoá đơn và ý nghĩa của từng thông tin</li><li>Biết xin hoá đơn khéo qua Zalo</li></ul></section>

  <section class="card story"><h2>📖 Tình huống</h2>
   ${persona('👨','Anh Tuấn – Quảng Xương','Gửi ảnh hoá đơn tháng 6 qua Zalo')}
   <p><i>“Em xem giúp anh, nhà anh nên lắp bao nhiêu thì vừa?”</i> Trước khi trả lời, bạn cần đọc được hoá đơn này.</p>
  </section>

  <section class="card"><h2>🔍 Bấm vào các nút <span style="background:var(--sun);border-radius:50%;padding:0 8px">số</span> để khám phá hoá đơn</h2>
   <div class="bill">
    <div class="bill-top"><div><b>HOÁ ĐƠN TIỀN ĐIỆN</b><div class="muted" style="font-size:.8rem">Kỳ: Tháng 6/2026 (01/06 – 30/06)</div></div><div class="watermark">MẪU MINH HOẠ – KHÔNG PHẢI MẪU CHÍNH THỨC</div></div>
    <div class="bill-row"><button class="hs" data-h="1">1</button><span class="k">Khách hàng / Mã KH</span><span class="v">Nguyễn Văn Tuấn · PA0XXXXXXXXX</span></div>
    <div class="bill-row"><button class="hs" data-h="2">2</button><span class="k">Mục đích sử dụng</span><span class="v">Sinh hoạt · Công tơ 1 pha</span></div>
    <div class="bill-row"><button class="hs" data-h="3">3</button><span class="k">Chỉ số mới / cũ</span><span class="v">12.840 / 12.340</span></div>
    <div class="bill-row"><button class="hs" data-h="4">4</button><span class="k">Điện năng tiêu thụ</span><span class="v" style="color:var(--sky);font-size:1.05rem">500 kWh</span></div>
    <div class="bill-row"><button class="hs" data-h="5">5</button><span class="k">Chi tiết theo bậc</span><span class="v" style="font-weight:500;font-size:.82rem">${b.rows.filter(r=>r.q).map(r=>`${TIER_NAMES[r.i]}: ${r.q} × ${fmt(r.price)} = ${fmt(r.amt)}`).join('<br>')}</span></div>
    <div class="bill-row"><button class="hs" data-h="6">6</button><span class="k">Thuế GTGT (${S.settings.vat}%)</span><span class="v">${money(b.vat)}</span></div>
    <div class="bill-row" style="background:var(--sun-soft)"><button class="hs" data-h="7">7</button><span class="k">Tổng thanh toán</span><span class="v" style="font-size:1.1rem">${money(b.total)}</span></div>
   </div>
   <div class="hs-panel card note" id="hsp"><b>👆 Bấm một nút số để xem giải thích.</b> <span class="muted" id="hsc">Đã xem 0/7</span></div>
  </section>

  <section class="card"><h2>✅ 3 việc cần làm khi nhận ảnh hoá đơn</h2>
   <ol class="clean"><li><b>Ghi lại số kWh tiêu thụ</b> (mục 4), không chỉ số tiền.</li><li><b>Ghi lại mục đích sử dụng</b> (mục 2): sinh hoạt hay kinh doanh, 1 pha hay 3 pha.</li><li><b>Xin thêm hoá đơn các tháng khác</b>, ít nhất 1 tháng hè và 1 tháng đông. Một tháng thì chưa đủ để đánh giá.</li></ol>
   <div class="card insight" style="margin-bottom:0">💡 <b>Mẹo:</b> Thanh Hoá thuộc Tổng công ty Điện lực miền Bắc (EVNNPC). Hướng dẫn khách mở app chăm sóc khách hàng của điện lực để xem <b>lịch sử tiêu thụ 12 tháng</b>. Nhanh hơn nhiều so với tìm hoá đơn giấy.</div>
  </section>

  <section class="card"><h2>💬 Mẫu tin nhắn xin hoá đơn qua Zalo</h2>
   <div class="card note" id="zmsg" style="margin:0 0 10px">Dạ chào anh/chị, em là ${S.name||'[tên]'} bên Thanh Hoá Solar ạ. Để tính chính xác cho nhà mình, anh/chị chụp giúp em ảnh hoá đơn tiền điện 3 tháng gần nhất (nếu có thêm 1 tháng mùa hè và 1 tháng mùa đông thì càng tốt). Em sẽ gửi lại bảng phân tích trong vòng 24 giờ, hoàn toàn miễn phí ạ. Cảm ơn anh/chị!</div>
   <button class="btn blue" data-copy="zmsg">📋 Sao chép tin nhắn</button>
  </section>

  <section class="card"><h2>🎬 Clip: xem lịch sử tiêu thụ 12 tháng trên app</h2>${media('c1-app-cskh',SB_APP)}</section>
  `},
  init:el=>{
   const H={1:['Khách hàng / Mã khách hàng','Dùng để đối chiếu và tra cứu. Mã khách hàng ở Thanh Hoá thường bắt đầu bằng “PA”. <b>Không đăng ảnh hoá đơn có mã khách hàng lên mạng</b> khi chưa xin phép và che thông tin.'],
    2:['Mục đích sử dụng','<b>Rất quan trọng!</b> “Sinh hoạt” thì tính giá bậc thang; “Kinh doanh” hoặc “Sản xuất” dùng biểu giá khác (Bài 4). 1 pha hay 3 pha quyết định loại inverter.'],
    3:['Chỉ số công tơ','Tiêu thụ = Chỉ số mới − Chỉ số cũ = 12.840 − 12.340 = 500 kWh. Khi có điện mặt trời tự dùng, <b>công tơ quay chậm lại</b>, đó chính là phần tiết kiệm.'],
    4:['Điện năng tiêu thụ (kWh)','<b>Con số quan trọng nhất.</b> Mọi tính toán đều bắt đầu từ đây, không phải từ số tiền. 1 kWh = 1 “số điện”.'],
    5:['Chi tiết theo bậc','Điện sinh hoạt tính theo <b>6 bậc thang</b>, càng dùng nhiều thì những số điện sau càng đắt. Bài 2 sẽ học kỹ.'],
    6:['Thuế GTGT','Thuế giá trị gia tăng tính trên tiền điện. Hiện đang áp dụng mức giảm 8% (có thể thay đổi, chỉnh trong Cài đặt số liệu). Khi tính tiết kiệm, nhớ <b>cộng cả VAT</b>.'],
    7:['Tổng thanh toán','Con số khách nhớ nhất. Nếu khách chỉ nhớ “tháng nào cũng khoảng 1,5 triệu”, dùng máy tính ở Bài 2 để <b>quy ngược ra kWh</b>.']};
   const seen=new Set();
   $$('.hs',el).forEach(b=>b.onclick=()=>{const h=H[b.dataset.h];seen.add(b.dataset.h);b.classList.add('seen');
     $('#hsp',el).innerHTML=`<b>${b.dataset.h}. ${h[0]}</b><div style="margin-top:4px">${h[1]}</div><div class="muted" style="margin-top:6px;font-size:.85rem">Đã xem ${seen.size}/7 ${seen.size===7?'🎉 Bạn đã đọc hết hoá đơn!':''}</div>`});
  },
  quiz:[
   {q:'Con số quan trọng nhất trên hoá đơn để bắt đầu tính toán là gì?',o:['Tổng tiền thanh toán','Điện năng tiêu thụ (kWh)','Mã khách hàng','Thuế GTGT'],a:1,e:'Mọi tính toán (công suất, tiết kiệm) đều bắt đầu từ số kWh. Số tiền phụ thuộc biểu giá nên có thể gây nhầm.'},
   {q:'Vì sao phải xin hoá đơn cả tháng mùa hè và tháng mùa đông?',o:['Để làm hồ sơ cho đẹp','Vì cả lượng điện dùng và sản lượng mặt trời đều thay đổi theo mùa','Vì luật yêu cầu','Không cần thiết'],a:1,e:'Mùa hè dùng nhiều điều hoà và nắng nhiều; mùa đông ngược lại. Đề xuất chính xác phải tính cả hai mùa.'},
   {q:'Chỉ số cũ 8.215, chỉ số mới 8.635. Điện năng tiêu thụ là bao nhiêu?',o:['8.635 kWh','420 kWh','215 kWh','635 kWh'],a:1,e:'8.635 − 8.215 = 420 kWh.'}
  ]},

 {id:'c1l2',title:'Biểu giá bậc thang hoạt động thế nào?',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu cách tính tiền điện theo 6 bậc</li><li>Phân biệt <b>giá trung bình</b> và <b>giá của số điện cuối cùng</b></li><li>Quy đổi được từ số tiền ra số kWh khi khách chỉ nhớ tiền</li></ul></section>

  <section class="card"><h2>🪜 Hình dung: cầu thang giá điện</h2>
   <p class="lead">Giống leo cầu thang: <b>càng dùng nhiều, những số điện sau càng đắt</b>. 50 số đầu rẻ nhất, từ số thứ 401 trở đi đắt nhất.</p>
   ${svgStairs()}
   <small class="src">Đơn giá chưa gồm VAT, theo bảng số liệu gốc trong khoá học (cập nhật ${S.settings.updated}). Luôn kiểm tra biểu giá EVN hiện hành.</small>
  </section>

  ${toolCard('','t-bill')}

  <section class="card"><h2>✍️ Ví dụ tính tay: anh Tuấn, 500 kWh</h2>
   <details class="worked" open><summary>Xem từng bước</summary><div class="tbl-wrap"><table class="tbl"><tr><th>Bậc</th><th class="num">Số kWh</th><th class="num">Đơn giá</th><th class="num">Thành tiền</th></tr>
   ${(()=>{const b=calcBill(500);return b.rows.filter(r=>r.q).map(r=>`<tr><td>${TIER_NAMES[r.i]} (${TIER_RANGES[r.i]})</td><td class="num">${fmt(r.q)}</td><td class="num">${fmt(r.price)}</td><td class="num">${fmt(r.amt)}</td></tr>`).join('')+`<tr><td colspan="3">Cộng (chưa thuế)</td><td class="num">${fmt(b.sub)}</td></tr><tr><td colspan="3">Thuế GTGT ${S.settings.vat}%</td><td class="num">${fmt(b.vat)}</td></tr><tr class="tot"><td colspan="3">Tổng thanh toán</td><td class="num">${money(b.total)}</td></tr>`})()}
   </table></div>
   <p>👉 Giá trung bình: ${money(calcBill(500).total)} ÷ 500 ≈ <b>${money(calcBill(500).total/500)}/kWh</b>.<br>👉 Nhưng <b>số điện thứ 500</b> có giá ${fmt(S.settings.tiers[5])}đ + VAT ≈ <b>${money(marginal(500))}</b>, đắt hơn trung bình khá nhiều.</p></details>
  </section>

  <section class="card insight"><h2>💡 Điều cần nhớ</h2>
   <p style="margin:0">Khi khách hỏi “mỗi số điện bao nhiêu tiền?”, <b>đừng lấy tổng tiền chia cho số kWh</b>. Phần điện mặt trời thay thế là <b>những số điện cuối, đắt nhất</b>. Bài 3 sẽ cho thấy vì sao điều này làm điện mặt trời có lợi hơn bạn nghĩ.</p>
  </section>
  `,
  init:el=>billTool($('#t-bill',el),{kwh:500}),
  quiz:[
   {q:'Nhà dùng 350 kWh/tháng. Số điện thứ 350 thuộc bậc nào?',o:['Bậc 3','Bậc 4','Bậc 5','Bậc 6'],a:2,e:'Bậc 5 gồm các số điện từ 301 đến 400.'},
   {q:'Vì sao giá của số điện cuối cùng thường cao hơn giá trung bình?',o:['Vì cuối tháng giá tăng','Vì giá bậc thang tăng dần; số điện cuối rơi vào bậc đắt nhất','Vì thuế VAT','Vì công tơ sai'],a:1,e:'Giá trung bình bị kéo xuống bởi các bậc rẻ ở đầu; số điện cuối luôn nằm ở bậc cao nhất mà nhà đó dùng tới.'},
   {q:'Khách nói “tháng nào nhà chị cũng khoảng 2 triệu”. Bạn làm gì đầu tiên?',o:['Đề xuất ngay 10 kWp','Dùng chế độ “Khách chỉ nhớ số tiền” để quy ra số kWh, rồi xin hoá đơn để kiểm tra','Bảo chị tự tính','Nhân 2 triệu với 12'],a:1,e:'Quy ra kWh để có cơ sở tính toán ngay, sau đó xin hoá đơn thật để xác nhận.'}
  ]},

 {id:'c1l3',title:'Vì sao điện mặt trời “cắt” bậc cao nhất trước?',min:12,
  html:()=>{const b=calcBill(500),a=calcBill(300),sv=b.total-a.total;return `
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu vì sao mỗi kWh mặt trời tự dùng có giá trị cao</li><li>Tính được tiền tiết kiệm thật</li><li>Hiểu vì sao <b>lắp quá to</b> lại không có lợi</li></ul></section>

  <section class="card"><h2>🧠 Nguyên lý đơn giản</h2>
   <p class="lead">Điện mặt trời khách <b>tự dùng</b> làm công tơ quay chậm lại, nên số kWh mua của điện lực giảm đi. Phần bị bớt đi luôn là <b>những số điện cuối cùng, ở bậc đắt nhất</b>.</p>
   <div class="grid2"><div class="mini"><h4>Trước: 500 kWh</h4><p>Dùng đến bậc 6 (đắt nhất)</p></div><div class="mini"><h4>Sau: mặt trời tự dùng 200 kWh</h4><p>Chỉ còn mua 300 kWh, dừng ở bậc 4. Bậc 5 và 6 biến mất!</p></div></div>
  </section>

  ${toolCard('','t-cut')}

  <section class="card"><h2>✍️ Ví dụ tính tay: anh Tuấn</h2>
   <details class="worked" open><summary>Xem từng bước</summary>
   <ol class="clean"><li>Hoá đơn hiện tại (500 kWh): <b>${money(b.total)}</b></li><li>Điện mặt trời tự dùng 200 kWh, chỉ còn mua 300 kWh: <b>${money(a.total)}</b></li><li>Tiết kiệm: ${money(b.total)} − ${money(a.total)} = <b style="color:var(--leaf)">${money(sv)}/tháng</b></li><li>Giá trị mỗi kWh mặt trời: ${money(sv)} ÷ 200 ≈ <b>${money(sv/200)}</b>, cao hơn giá trung bình ${money(b.total/500)}!</li></ol></details>
  </section>

  <section class="card warn"><h2>⚠️ Đừng lắp quá to</h2>
   <p>Kéo thanh “điện mặt trời tự dùng” lên cao trong công cụ và nhìn biểu đồ: <b>càng về sau, mỗi kWh thêm vào càng rẻ</b> vì chỉ cắt các bậc rẻ.</p>
   <p style="margin-bottom:0">Thêm nữa, phần điện <b>dư phát lên lưới</b> bị giới hạn (tối đa 50% sản lượng theo quy định năm 2026) và được mua với giá thấp hơn nhiều so với giá điện khách phải mua (học ở Chương 4 và 7). Vì vậy, nguyên tắc của Thanh Hoá Solar là <b>thiết kế để tự dùng là chính</b>.</p>
  </section>
  `},
  init:el=>cutTool($('#t-cut',el),{use:500,solar:200}),
  quiz:[
   {q:'Nhà dùng 500 kWh, điện mặt trời tự dùng 100 kWh. Phần bị “cắt” nằm ở bậc nào?',o:['Bậc 1','Bậc 3','Bậc 6 (các số điện 401–500)','Đều các bậc'],a:2,e:'Còn mua 400 kWh nên các số điện 401–500 (bậc 6, đắt nhất) biến mất.'},
   {q:'Vì sao lắp quá to so với nhu cầu không có lợi?',o:['Vì tấm pin dễ hỏng','Vì phần thêm chỉ cắt các bậc rẻ, còn điện dư phát lên lưới bị giới hạn và giá thấp','Vì mái bị nặng','Vì điện lực phạt'],a:1,e:'Lợi ích mỗi kWh giảm dần; phần dư bán lên lưới không đáng kể. Thiết kế vừa đủ để tự dùng là tối ưu.'},
   {q:'Khi tính giá trị mỗi kWh mặt trời cho khách, nên dùng giá nào?',o:['Bậc 1','Giá trung bình hoá đơn','Giá của các bậc bị cắt (đã gồm VAT)','Giá bán điện dư'],a:2,e:'Phần tiết kiệm đến từ các bậc bị cắt, tức là những bậc cao nhất mà nhà khách đang dùng.'}
  ]},

 {id:'c1l4',title:'Đọc nhịp dùng điện: mùa, ngày–đêm, giá kinh doanh',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Đọc nhịp dùng điện theo mùa từ hoá đơn 12 tháng</li><li>Ước tính tỉ lệ dùng điện ban ngày</li><li>Biết hộ kinh doanh dùng biểu giá khác và vì sao họ là nhóm khách rất hợp</li></ul></section>

  <section class="card"><h2>🌦️ Nhịp mùa: khi nào dùng nhiều, khi nào có nắng?</h2>
   <p class="lead">Ở Thanh Hoá, <b>mùa hè</b> vừa nắng nhiều vừa dùng nhiều điều hoà, nên nhu cầu và sản lượng gặp nhau. <b>Mùa đông</b> (mưa phùn, nồm) sản lượng có thể giảm còn khoảng một nửa.</p>
  </section>
  ${toolCard('','t-season')}
  <section class="card insight" style="margin-top:-6px"><b>💡 Đọc biểu đồ:</b> chọn <b>chị Hoa</b> và thấy cột tiêu thụ tăng vọt đúng mùa du lịch, trùng với đỉnh sản lượng mặt trời. Đây là lý do <b>nhà nghỉ, homestay ven biển</b> (Sầm Sơn, Hải Tiến, Hải Hoà) là nhóm khách rất phù hợp.<br><span class="muted" style="font-size:.85rem">Lưu ý: chỉ phần điện dùng <b>đúng lúc có nắng</b> (hoặc qua pin lưu trữ) mới thành tiền tiết kiệm. Vì vậy cần biết thêm tỉ lệ dùng ban ngày.</span></section>

  ${toolCard('','t-day')}

  <section class="card"><h2>🏪 Hộ kinh doanh: biểu giá khác</h2>
   <p>Khách có mục đích sử dụng <b>“Kinh doanh”</b> trả giá cao hơn sinh hoạt và có thể được tính theo <b>3 khung giờ</b> nếu dùng công tơ nhiều giá:</p>
   <div class="tbl-wrap"><table class="tbl"><tr><th>Kinh doanh, cấp điện áp dưới 6 kV</th><th class="num">Giá tham khảo (đ/kWh, chưa VAT)</th></tr>
   <tr><td>Giờ bình thường</td><td class="num">≈ 3.000</td></tr><tr><td>Giờ thấp điểm</td><td class="num">≈ 1.800</td></tr><tr><td>Giờ cao điểm</td><td class="num">≈ 5.200</td></tr></table></div>
   <small class="src">Số liệu làm tròn, chỉ để minh hoạ mức chênh lệch. Thông tư 60/2025/TT-BCT quy định khung giờ mới: cao điểm 17h30–22h30 (thứ Hai đến thứ Bảy), thấp điểm 0h–6h; thời điểm áp dụng gắn với lần điều chỉnh giá bán lẻ. Kiểm tra EVN để biết khung giờ đang áp dụng. Khi cao điểm chuyển sang buổi tối, điện mặt trời không cắt được giờ cao điểm, nên pin lưu trữ trở nên đáng giá hơn với hộ kinh doanh.</small>
   <div class="card insight" style="margin-bottom:0">💡 Giá kinh doanh cao, lại dùng nhiều điện ban ngày, nên <b>mỗi kWh mặt trời đáng giá hơn</b> và hộ kinh doanh thường <b>hoàn vốn nhanh hơn</b> hộ gia đình. Đó là lý do nên ưu tiên quán ăn, nhà nghỉ, xưởng nhỏ khi tìm hợp đồng đầu tiên.</div>
  </section>

  <section class="card"><h2>🎯 Thực hành: phân tích 3 hồ sơ</h2><div id="prac"></div><button class="btn primary" id="pracBtn" style="margin-top:12px">Kiểm tra đáp án</button><div id="pracOut"></div></section>
  `,
  init:el=>{

{id:'c2',num:2,icon:'⚡',title:'Khái niệm điện cơ bản',ctv:false,ready:true,
 desc:'kW và kWh, kWp, điện 1 pha và 3 pha, tải ban ngày và ban đêm. Nắm chắc để không bao giờ bị khách hỏi “bí”.',
 badge:{ic:'⚡',name:'Hiểu kWh'},
 lessons:[
 {id:'c2l1',title:'kW và kWh: vòi nước và cái xô',min:10,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Phân biệt <b>công suất (kW)</b> và <b>điện năng (kWh)</b></li><li>Tính được điện năng của một thiết bị và tiền điện tương ứng</li></ul></section>
  <section class="card story"><h2>📖 Tình huống</h2>${persona('👩','Chị Lan – Hoằng Hoá','Đang tìm hiểu lắp điện mặt trời')}<p style="margin:0"><i>“Em ơi, hệ 5 kW là mỗi ngày được 5 số điện à? Thế thì ít quá!”</i> Câu hỏi này cho thấy chị Lan đang nhầm <b>kW</b> với <b>kWh</b>. Rất nhiều khách nhầm như vậy.</p></section>
  <section class="card"><h2>🚰 Hình dung bằng vòi nước</h2>
   <div class="grid2"><div class="mini" style="border-top:4px solid var(--sky2)"><h4>kW – công suất</h4><p>Giống <b>độ mạnh của vòi nước</b>: mỗi lúc chảy ra nhanh hay chậm. Điều hoà 1,2 kW “mạnh” hơn quạt 0,05 kW.</p></div>
   <div class="mini" style="border-top:4px solid var(--sun)"><h4>kWh – điện năng (“số điện”)</h4><p>Giống <b>lượng nước trong xô</b>: vòi mạnh bao nhiêu × mở trong bao lâu. Hoá đơn tính tiền theo kWh.</p></div></div>
   <div class="card insight" style="margin-bottom:0"><b>Công thức vàng:</b> kWh = kW × số giờ. Ví dụ điều hoà 1,2 kW chạy 8 giờ = <b>9,6 kWh</b>; ấm siêu tốc 1,8 kW đun 10 phút (1/6 giờ) = <b>0,3 kWh</b>.</div>
  </section>
  ${toolCard('','t-kw')}
  <section class="card"><h2>🎮 Đúng hay sai?</h2>${tfGame([
   ['Ấm siêu tốc 1,8 kW tốn điện hơn điều hoà 1,2 kW trong một ngày.',false,'Sai. Ấm chỉ đun vài phút (~0,3 kWh), điều hoà chạy nhiều giờ (~9,6 kWh). Phải nhân với thời gian.'],
   ['1 kWh chính là “1 số điện” trên hoá đơn.',true,'Đúng.'],
   ['Hệ điện mặt trời 5 kWp mỗi ngày phát được 5 kWh.',false,'Sai. Mỗi ngày phát trung bình khoảng 15–17 kWh ở Thanh Hoá (Bài 2).'],
   ['Muốn giảm tiền điện, cần biết thiết bị nào chạy lâu, không chỉ thiết bị nào công suất lớn.',true,'Đúng. Bình nóng lạnh 2,5 kW chạy 30 phút = 1,25 kWh, ít hơn tủ lạnh chạy cả ngày.']])}</section>
  `,init:el=>kwTool($('#t-kw',el)),
  quiz:[{q:'Điều hoà 0,9 kW chạy 10 giờ tiêu thụ bao nhiêu điện?',o:['0,9 kWh','9 kWh','90 kWh','10 kWh'],a:1,e:'0,9 × 10 = 9 kWh.'},
   {q:'Hoá đơn tiền điện tính tiền theo đơn vị nào?',o:['kW','kWh','kWp','Volt'],a:1,e:'Tiền điện tính theo điện năng tiêu thụ (kWh, “số điện”).'},
   {q:'Ví dụ “vòi nước – cái xô”: kWh tương ứng với gì?',o:['Độ mạnh của vòi','Lượng nước trong xô','Màu của nước','Kích thước vòi'],a:1,e:'kW là độ mạnh dòng chảy; kWh là lượng tích luỹ theo thời gian.'}]},
 {id:'c2l2',title:'kWp, giờ nắng và điện 1 pha – 3 pha',min:12,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Hiểu kWp và ước tính nhanh sản lượng mỗi ngày</li><li>Trả lời đúng câu hỏi của chị Lan</li><li>Biết khi nào là điện 1 pha, khi nào 3 pha</li></ul></section>
  <section class="card"><h2>☀️ kWp là gì?</h2><p class="lead">kWp (kilowatt-peak) là <b>công suất đỉnh của dàn tấm pin</b> trong điều kiện thử nghiệm chuẩn (nắng 1.000 W/m², 25°C). Thực tế ngoài trời hiếm khi đạt mức này cả ngày.</p>
   <div class="card insight"><b>Ước tính nhanh tại Thanh Hoá (theo giả định của khoá học):</b><br>Sản lượng/ngày ≈ <b>kWp × 3,3</b> (trung bình năm) · mùa hè ≈ kWp × 4,4 · mùa đông ≈ kWp × 2,1<br><span class="muted" style="font-size:.88rem">3,3 là “số giờ nắng tương đương” đã trừ hao hụt hệ thống. Chương 3 dạy cách tra số thật cho từng địa chỉ.</span></div>
   <button class="btn ghost" data-reveal="r221">💬 Vậy trả lời chị Lan thế nào?</button>
   <div class="reveal" id="r221">“Dạ, 5 kW là <b>công suất</b> của dàn pin chị ạ, còn số điện tính theo kWh. Ở Thanh Hoá, hệ 5 kWp trung bình mỗi ngày phát khoảng <b>16 số điện</b>; mùa hè được khoảng 22 số, mùa đông khoảng 10 số. Tính ra mỗi tháng khoảng 500 số điện.”</div></section>
  <section class="card"><h2>🔌 Tấm pin (kWp) và inverter (kW)</h2><p>Công suất inverter thường <b>nhỏ hơn một chút</b> so với tổng công suất tấm pin. Tỉ lệ tấm pin/inverter khoảng <b>1,1–1,3</b> là phổ biến, vì tấm pin hiếm khi đạt công suất đỉnh. Ví dụ: 6 kWp tấm pin đi với inverter 5 kW là bình thường, không phải “lắp thiếu”.</p></section>
  <section class="card"><h2>⚡ Điện 1 pha hay 3 pha?</h2><div class="tbl-wrap"><table class="tbl"><tr><th></th><th>1 pha</th><th>3 pha</th></tr><tr><td>Thường gặp ở</td><td>Hầu hết nhà dân</td><td>Xưởng, nhà có máy móc lớn, khách sạn, trang trại lớn</td></tr><tr><td>Nhận biết</td><td>Công tơ 1 pha, 2 dây vào (pha + trung tính)</td><td>Công tơ 3 pha, 4 dây (3 pha + trung tính)</td></tr><tr><td>Inverter</td><td>Inverter 1 pha</td><td>Inverter 3 pha (hệ lớn)</td></tr></table></div>
   <div class="card warn" style="margin-bottom:0">⚠️ Lắp inverter 1 pha cho nhà điện 3 pha (hoặc ngược lại) là sai kỹ thuật. Luôn <b>chụp ảnh công tơ và tủ điện</b> khi khảo sát, để kỹ sư xác nhận.</div></section>
  <section class="card"><h2>🎮 Thử thách tính nhanh</h2>${tfGame([
   ['Hệ 4 kWp trung bình mỗi ngày phát khoảng 13 kWh.',true,'Đúng: 4 × 3,3 ≈ 13 kWh.'],
   ['Hệ 10 kWp, một ngày mùa đông âm u chắc chắn phát được 44 kWh.',false,'Sai: mùa đông chỉ khoảng 10 × 2,1 ≈ 21 kWh, ngày mưa phùn còn thấp hơn.'],
   ['Hệ 3 kWp mỗi tháng phát trung bình khoảng 300 kWh.',true,'Đúng: 3 × 100 ≈ 300 kWh/tháng.'],
   ['Inverter 5 kW đi với 6 kWp tấm pin là lắp thiếu, sai kỹ thuật.',false,'Sai: tỉ lệ 1,2 là phổ biến và hợp lý.']])}</section>
  `,
  quiz:[{q:'kWp là gì?',o:['Số điện phát mỗi ngày','Công suất đỉnh của dàn tấm pin trong điều kiện chuẩn','Dung lượng pin lưu trữ','Giá điện mỗi kWh'],a:1,e:'kWp đo công suất đỉnh, không phải điện năng.'},
   {q:'Hệ 5 kWp ở Thanh Hoá trung bình mỗi ngày phát khoảng?',o:['5 kWh','16 kWh','50 kWh','1,5 kWh'],a:1,e:'5 × 3,3 ≈ 16 kWh (theo giả định khoá học).'},
   {q:'Nhà có công tơ 3 pha, 4 dây vào. Cần lưu ý gì?',o:['Không cần lưu ý','Dùng inverter phù hợp điện 3 pha, kỹ sư xác nhận','Bỏ bớt 2 pha','Chỉ lắp được hệ độc lập'],a:1,e:'Loại inverter phải phù hợp số pha của công trình.'}]},
 {id:'c2l3',title:'Tải ban ngày – ban đêm',min:15,
  html:()=>`
  <section class="card goal"><h2>🎯 Mục tiêu</h2><ul class="clean"><li>Lập bảng tải điện của một ngôi nhà</li><li>Thấy rõ vì sao <b>giờ dùng điện</b> quyết định hiệu quả của điện mặt trời</li></ul></section>
  <section class="card"><h2>🧠 Điều cốt lõi</h2><p class="lead">Điện mặt trời chỉ có từ khoảng 6h đến 18h, mạnh nhất giữa trưa. Điện nào dùng <b>đúng lúc đó</b> mới được thay bằng điện mặt trời (nếu không có pin lưu trữ).</p></section>
  ${toolCard('','t-load')}
  ${toolCard('','t-prof')}
  <section class="card insight"><h2>💡 Đọc kết quả</h2><ul class="clean" style="margin:0"><li><b>Gia đình đi làm:</b> điện mặt trời phát lúc nhà vắng, tỉ lệ tự dùng thấp. Lắp nhỏ, hoặc cần pin lưu trữ.</li><li><b>Có người ở nhà:</b> khá hợp với hệ bám lưới cỡ vừa.</li><li><b>Quán cơm:</b> đường tải gần như “ôm” trọn đường mặt trời. Rất hợp!</li></ul></section>
  `,init:el=>{loadTool($('#t-load',el));profileTool($('#t-prof',el))},
  quiz:[{q:'Thiết bị nào sau đây dùng chủ yếu vào thời điểm có điện mặt trời?',o:['Điều hoà phòng ngủ ban đêm','Máy bơm nước buổi trưa','Sạc xe máy điện qua đêm','Đèn chiếu sáng'],a:1,e:'Bơm nước buổi trưa trùng giờ nắng nên dùng được điện mặt trời trực tiếp.'},
   {q:'“Tỉ lệ tự dùng” cao nghĩa là gì?',o:['Phần lớn điện mặt trời được dùng ngay trong nhà','Nhà dùng ít điện','Tấm pin hiệu suất cao','Bán được nhiều điện'],a:0,e:'Tỉ lệ tự dùng = phần điện mặt trời dùng tại chỗ / tổng điện mặt trời phát ra.'},
   {q:'Gia đình đi làm cả ngày, muốn dùng điện mặt trời buổi tối thì cần gì?',o:['Lắp thêm tấm pin','Pin lưu trữ (hệ hybrid)','Inverter to hơn','Không làm được'],a:1,e:'Pin lưu trữ giữ điện ban ngày để dùng buổi tối.'}]}
 ],

  ['Tỉ lệ tấm pin/inverter phổ biến?','Khoảng 1,1–1,3 (ví dụ 6 kWp tấm pin với inverter 5 kW).'],
